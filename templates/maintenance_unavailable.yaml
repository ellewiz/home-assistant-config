# ─────────────────────────────────────────────────────────────────────────────
# Unavailable / Unknown census (counts + handy attributes)
# Drop-in file for Home Assistant (Template integration)
#
# NOTE: Uses time_pattern trigger (every 5 min) instead of reactive state
# subscriptions to prevent template loops — these sensors include themselves
# in the `states.sensor` / `states` collections they count.
# ─────────────────────────────────────────────────────────────────────────────
- trigger:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  sensor:
    # ===== TOTAL =====
    - unique_id: maintenance_unavailable_total
      name: unavailable_count
      icon: >-
        {% set n = states | selectattr('state','in',['unavailable','unknown']) | list | count %}
        {{ 'mdi:check-circle-outline' if n == 0 else 'mdi:alert-circle-outline' }}
      state: >-
        {{ states | selectattr('state','in',['unavailable','unknown']) | list | count }}
      attributes:
        entities: >-
          {{ states | selectattr('state','in',['unavailable','unknown'])| map(attribute='entity_id') | list }}

