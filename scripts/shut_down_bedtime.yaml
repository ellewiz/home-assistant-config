shut_down_bedtime:
  alias: Shut down at bedtime
  icon: mdi:power-sleep
  mode: single
  description: >-
    Triggered from an iPhone shortcut when a specific pair of Bluetooth
    headphones connects. Late-night gate added 2026-06-12: only proceed when
    binary_sensor.late_night_together (tod, 21:00–05:30) is on, so connecting
    the headphones in bed during the day/morning no longer flips in_bed and
    shuts off the lights. A failing condition step halts the script cleanly.

    NOTE (2026-06-28): the RANDOM 10-25 min gap before the living room goes
    dark is INTENTIONAL. This is the cause of what was once chased as a
    living-room "phantom off"; it is by design. Lara wants the random gap
    between the bedroom and living room going dark so it looks human
    (occupancy realism), not a fixed timer. Do NOT remove it or convert it to
    a fixed delay.

    CHANGED 2026-07-29: the gap is no longer an in-script `delay`. A delay
    only exists in memory inside the running script, so an HA restart or a
    scripts reload during the 10-25 min window silently cancelled the
    living-room off and left the room lit with nothing in the logbook to say
    so. The script now draws the same random interval but WRITES A TARGET TIME
    to input_datetime.living_room_off_at and finishes in under a second;
    automation "Living Room — Scheduled Off (Bedtime Wind-Down) (v1)" fires on
    that datetime. The randomness is unchanged — only where it is stored. If
    HA restarts mid-window the helper still holds the target and the off still
    happens.

    Behind that sits a second layer: automation "Living Room — Lights Off
    While In Bed (v1)" sweeps every 10 min and turns the living room off if
    in_bed has been on >30 min and the room is lit and empty. It is
    deliberately later than this script's 25 min maximum, so it never cuts the
    intentional gap short.

    Note for future edits: the presence of steps below is not proof the living
    room actually went dark. The bedside blink only proves the script started
    and passed the late-night gate. Check the logbook for "LR Bedtime
    Wind-Down" (this path) or "LR In-Bed Safety Net" (the backstop) to confirm
    the off landed.
  sequence:
    # Gate: only run during the late-night window. If it's not late night
    # (e.g. a daytime in-bed listen), the script stops here and does nothing.
    - alias: Only run if it's late night
      condition: state
      entity_id: binary_sensor.late_night_together
      state: "on"

    # Always mark you as "in bed"
    - alias: Set in_bed
      action: input_boolean.turn_on
      target:
        entity_id: input_boolean.in_bed

    - alias: Blink bedside light
      action: light.turn_on
      target:
        entity_id: light.bedside_2
      data:
        brightness: 255
        flash: short

    # Fade out bedroom lights
    - alias: Bedroom lights off (30s fade)
      action: light.turn_off
      target:
        entity_id: light.bedroom_lights
      data:
        transition: 30

    # Schedule the living-room off 10-25 min from now (intentional random gap
    # — keeps the bedroom→living-room interval human-looking; see description).
    # Persisting the target time instead of sleeping means a restart or a
    # scripts reload can no longer cancel it.
    - alias: Schedule the living room off (random 10-25 min from now)
      action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.living_room_off_at
      data:
        datetime: >-
          {{ (now() + timedelta(minutes = range(10, 25) | random | int)).strftime('%Y-%m-%d %H:%M:%S') }}
