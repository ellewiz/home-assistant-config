tv_nightly_automations_reenable:
  alias: "TV — Re-enable Nightly Automations"
  description: >-
    Single owner for the "4 nightly automations" re-enable list. TV Event Reminder
    disables these four when a movie starts (stop_actions): living_room_ambient_manager,
    tv_off_regular_night, tv_off_weekends_and_time_off, living_room_lights_on_morning.
    This script re-enables the same four and is called by TV Event Over, TV Event —
    Nightly Reconcile, and TV off weekends and time off, so the list is owned in one
    place instead of hand-copied three times.

    Consolidated 2026-08-30 (automation duplication audit follow-up). Before this,
    "TV off weekends and time off" had its own drifted copy of this list: it was
    missing living_room_lights_on_morning (the exact gap the 2026-08-23 clash audit
    had already flagged as open) and instead re-enabled automation.tv_event_reminder,
    which nothing in this config ever actually disables (confirmed via search —
    dead, harmless, but pointless). Calling this script from all three sites fixes
    both: the missing morning-lights re-enable is restored, the dead tv_event_reminder
    call is gone.
  mode: single
  sequence:
    - alias: "Re-enable the nightly automation set (no-op if already on)"
      action: automation.turn_on
      target:
        entity_id:
          - automation.living_room_ambient_manager
          - automation.tv_off_regular_night
          - automation.tv_off_weekends_and_time_off
          - automation.living_room_lights_on_morning
