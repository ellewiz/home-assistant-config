notify_lara:
  alias: Notify Lara (fan-out)
  icon: mdi:bell-ring-outline
  description: >
    Single fan-out point for personal push notifications. Sends the same
    title/message to every device listed in the sequence below. Created
    2026-08-10 when Lara wanted laundry alerts on her MacBook as well as her
    iPhone.

    TO ADD OR REMOVE A DEVICE: add or delete a step in the sequence. That is the
    whole point of this script - one edit here instead of hunting through every
    automation. Check the live service list with the notify.* services in
    Developer Tools before adding a step. Current targets: iPhone
    (notify.mobile_app_iphone) and MacBook Air (notify.mobile_app_macbook_air).
    The MacBook was re-registered in Oct 2026, so its service name changed; the
    earlier registration is gone, so do not target the old name.

    The iPhone step is sent as an iOS critical alert (sound past the silent
    switch and Focus), set Nov 20 2026 for every caller. Needs Critical Alerts
    allowed for the Home Assistant app in iOS Settings > Notifications.

    Carries no gating of its own, so callers keep their own vacation / in_bed
    conditions. mode parallel so two alerts firing close together (washer and
    dryer finishing near each other) do not queue behind one another.

    NOTE FOR FUTURE EDITS: this config loads scripts via
    "script: !include_dir_merge_named scripts", so scripts live as one file per
    script in scripts/. The HA scripts API writes to scripts.yaml, which nothing
    includes - creating a script through the API silently does nothing here.
  mode: parallel
  max: 10
  fields:
    title:
      description: Notification title
      required: true
      example: Dryer finished
      selector:
        text:
    message:
      description: Notification body
      required: true
      example: Cycle ran 52 min.
      selector:
        text:
  sequence:
    - alias: iPhone (critical alert, plays sound past the silent switch and Focus)
      action: notify.mobile_app_iphone
      data:
        title: "{{ title }}"
        message: "{{ message }}"
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
    - alias: MacBook Air
      action: notify.mobile_app_macbook_air
      data:
        title: "{{ title }}"
        message: "{{ message }}"
