blueprint:
  name: Auto Pause Media when No Motion
  description: Pause Sonos/TV if no motion in room for X minutes.
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    media_player:
      name: Media Player
      selector:
        entity:
          domain: media_player
    delay:
      name: Idle Time (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 120

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input delay

action:
  - service: media_player.media_pause
    target:
      entity_id: !input media_player