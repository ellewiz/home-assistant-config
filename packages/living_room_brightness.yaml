# Living Room — Brightness Mirror
#
# Mirrors the three living room bulbs' brightness into RECORDED sensors.
#
# WHY: the light integration tells the recorder to drop the high-churn light
# attributes (brightness, color_temp, hs_color, rgb_color, xy_color, effect_list,
# supported_color_modes), so light history carries only mode / dynamics /
# friendly_name and there is no way to ask after the fact what level a bulb was
# actually at. This is NOT fixable from a recorder: block - recorder's include /
# exclude options filter ENTITIES and DOMAINS, not attributes, and the exclusion is
# declared by the integration itself. Confirmed 2026-08-03: this config has no
# recorder: block at all (running defaults), history for light.torchiere carries only
# mode/dynamics/friendly_name, while state_attr('light.torchiere','brightness')
# returns 255 live. The attribute exists, it just is not recorded. A template sensor
# is the supported workaround.
#
# MOTIVATING CASE: automation.living_room_ambient_manager (v2) sets brightness_pct 20
# on its away branch and normal Adaptive Lighting brightness when home. As of the Jul
# 2026 review that 20% had never once been verified from the record - the automation
# trace buffer holds only 5 runs and the 12:00 UTC away run had always rolled off by
# the time anyone looked. These sensors make the away-dim claim checkable after the
# fact. See project memory "LR away-dim (presence-aware brightness)".
#
# DESIGN NOTES:
#   - state_class: measurement so these land in long-term statistics and survive past
#     the recorder's ~10-day raw window. Same reasoning as the Oura duration sensors.
#   - Reports 0 when the bulb is off rather than going unknown, so the series stays
#     continuous and an away-window average is meaningful.
#   - availability drops the sensor while the bulb is unavailable, so the End table's
#     chronic Zigbee dropouts (~143/week as of 2026-08-02) are not recorded as genuine
#     0% readings. See project memory "Hue LR reachability flapping".
#   - Values are only captured at the moments a bulb reports a change. If Adaptive
#     Lighting is nudging levels continuously the series is dense; if not, sparse.
#     Either is enough to answer "was it at 20% while she was out".
#
# LOADING: this is a package file, so it needs a FULL RESTART to load, not a reload.
# Same constraint as packages/air_quality.yaml.

template:
  - sensor:
      - name: "Living Room Corner Brightness"
        unique_id: living_room_corner_brightness
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set b = state_attr('light.living_room_corner', 'brightness') %}
          {{ 0 if b is none else (b | float / 255 * 100) | round(0) }}
        availability: >-
          {{ states('light.living_room_corner') not in ['unknown', 'unavailable'] }}

      - name: "Torchiere Brightness"
        unique_id: torchiere_brightness
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set b = state_attr('light.torchiere', 'brightness') %}
          {{ 0 if b is none else (b | float / 255 * 100) | round(0) }}
        availability: >-
          {{ states('light.torchiere') not in ['unknown', 'unavailable'] }}

      - name: "End Table Brightness"
        unique_id: next_to_couch_brightness
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set b = state_attr('light.next_to_couch', 'brightness') %}
          {{ 0 if b is none else (b | float / 255 * 100) | round(0) }}
        availability: >-
          {{ states('light.next_to_couch') not in ['unknown', 'unavailable'] }}

# ===========================================================================
# COLOUR TEMPERATURE MIRRORS (added 2026-08-17)
#
# Same reasoning as the brightness mirrors above: the light integration tells
# the recorder to drop the high-churn colour attributes, so there is no way to
# ask after the fact what colour a bulb was actually at.
#
# MOTIVATING CASE: measured 2026-08-17 06:35, the living room ran 100 percent
# brightness at 2,409K, warmer than a household incandescent. Brightness was
# never the problem and was already measurable here. Colour was the problem
# and was not. Adaptive Lighting's colour curve peaks at SOLAR NOON, so it does
# not cross 4,000K until roughly 08:30.
#
# NOTE ON availability: unlike the brightness mirrors, which report 0 when the
# bulb is off so an away-window average stays meaningful, these report only
# while the bulb is ON. Colour has no meaningful "off" value and a fabricated
# one would corrupt the long-term statistics mean. Gaps overnight are intended.
#
# No device_class: HA's temperature device class means thermal degrees, not
# colour temperature, and setting it would trigger unit conversion.
# ===========================================================================

      # Living Room Corner colour temperature.
      #
      # Reads color_temp_kelvin when the bulb reports in color_temp mode. When it
      # reports in xy mode instead, color_temp_kelvin is null, so this converts the
      # xy chromaticity coordinates back to a colour temperature using McCamy's
      # 1992 approximation:
      #     n   = (x - 0.3320) / (0.1858 - y)
      #     CCT = 449n^3 + 3525n^2 + 6823.3n + 5520.33
      # Without the fallback the series would go blank at exactly the moments a
      # scene is active, which is when the reading matters most. All three lamps
      # flip modes intermittently; the Innr corner does it most.
      #
      # Validated against real readings on 2026-08-17 before being trusted:
      #   torchiere xy (0.3472, 0.3480) -> 4,912K  (Golden hours, 06:39)
      #   corner    xy (0.4809, 0.4141) -> 2,445K  (while the other two lamps
      #                                             natively reported 2,409-2,457K)
      # Accuracy degrades far from the Planckian locus, e.g. Hue's Rest preset.
      - name: "Living Room Corner Color Temp"
        unique_id: living_room_corner_color_temp
        unit_of_measurement: "K"
        state_class: measurement
        state: >-
          {% set k = state_attr('light.living_room_corner', 'color_temp_kelvin') %}
          {% if k is not none %}
            {{ k | int }}
          {% else %}
            {% set xy = state_attr('light.living_room_corner', 'xy_color') %}
            {% if xy is not none and xy | length == 2 and (0.1858 - xy[1]) != 0 %}
              {% set n = (xy[0] - 0.3320) / (0.1858 - xy[1]) %}
              {% set cct = 449 * n ** 3 + 3525 * n ** 2 + 6823.3 * n + 5520.33 %}
              {{ [[cct, 1000] | max, 10000] | min | round(0) | int }}
            {% else %}
              {{ None }}
            {% endif %}
          {% endif %}
        availability: >-
          {{ is_state('light.living_room_corner', 'on') }}

      # Torchiere colour temperature.
      #
      # Reads color_temp_kelvin when the bulb reports in color_temp mode. When it
      # reports in xy mode instead, color_temp_kelvin is null, so this converts the
      # xy chromaticity coordinates back to a colour temperature using McCamy's
      # 1992 approximation:
      #     n   = (x - 0.3320) / (0.1858 - y)
      #     CCT = 449n^3 + 3525n^2 + 6823.3n + 5520.33
      # Without the fallback the series would go blank at exactly the moments a
      # scene is active, which is when the reading matters most. All three lamps
      # flip modes intermittently; the Innr corner does it most.
      #
      # Validated against real readings on 2026-08-17 before being trusted:
      #   torchiere xy (0.3472, 0.3480) -> 4,912K  (Golden hours, 06:39)
      #   corner    xy (0.4809, 0.4141) -> 2,445K  (while the other two lamps
      #                                             natively reported 2,409-2,457K)
      # Accuracy degrades far from the Planckian locus, e.g. Hue's Rest preset.
