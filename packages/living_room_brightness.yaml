        unique_id: torchiere_color_temp
        unit_of_measurement: "K"
        state_class: measurement
        state: >-
          {% set k = state_attr('light.torchiere', 'color_temp_kelvin') %}
          {% if k is not none %}
            {{ k | int }}
          {% else %}
            {% set xy = state_attr('light.torchiere', 'xy_color') %}
            {% if xy is not none and xy | length == 2 and (0.1858 - xy[1]) != 0 %}
              {% set n = (xy[0] - 0.3320) / (0.1858 - xy[1]) %}
              {% set cct = 449 * n ** 3 + 3525 * n ** 2 + 6823.3 * n + 5520.33 %}
              {{ [[cct, 1000] | max, 10000] | min | round(0) | int }}
            {% else %}
