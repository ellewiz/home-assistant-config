- id: '1635902622080'
  alias: Turn off the lights when I leave home (v2)
  description: 'Turns off lights in bedroom, kitchen, living room and office when
    Lara leaves zone.home. Gated on group.morning being on OR living room lux above
    input_number.living_room_lux_on, so it only fires on a bright/morning departure.


    2026-07-30: the media_player.media_stop branch (bedroom_frame + bedroom) was REMOVED
    from this automation and moved to ''Speakers - Stop All When I Leave Home''. Reason:
    speaker shutoff was sitting behind this automation''s lighting condition, so a
    dark-morning departure would leave audio running. Speaker shutoff now owns its
    own automation with no lux gate. Do not re-add media actions here.


    2026-08-17 (v2): lux source switched from the RAW Hue sensor (sensor.hue_motion_sensor_4_illuminance)
    to sensor.living_room_illuminance_smoothed, the 10-min median from package living_room_lux_smoothing.yaml.
    The Ambient Manager was rebuilt in June 2026 specifically to stop reading the
    raw value - its own note records the raw sensor swinging 19-43 every few minutes
    and causing a confirmed flapping loop - but this automation was never given the
    same treatment, so a departure timed into a raw-lux dip left the whole house lit.
    No missed departure was observed in the 12 days to 2026-08-17 (the Aug 17 07:31
    departure worked correctly); this is a design-consistency fix, not a response
    to an observed failure.


    OPEN QUESTION - THRESHOLD SEMANTICS: this still compares against input_number.living_room_lux_on
    (30), which is the DARK side of the hysteresis band; input_number.living_room_lux_off
    (57) is the bright side and is arguably the semantically correct end for an ''is
    it bright enough to bother turning these off'' gate. Moving it to lux_off would
    leave the lamps on for departures in the 30-57 lx dead zone - more energy, but
    she comes home to a lit house on a dull day. Deliberately NOT changed on 2026-08-17
    because it shifts real energy behaviour and needs a decision, not a sweep. Decide
    and either move it or delete this paragraph.'
  triggers:
  - entity_id: person.lara_wiz
    zone: zone.home
    event: leave
    trigger: zone
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: group.morning
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.living_room_illuminance_smoothed
      above: input_number.living_room_lux_on
      alias: Bright enough that the occupied look is not needed - 10-min median, not
        the jittery raw Hue lux
  actions:
  - target:
      area_id:
      - bedroom
      - kitchen
      - living_room
      - office
    action: light.turn_off
  mode: single
