- id: garbage_night_before_reminder
  alias: Garbage — Night-Before Reminder
  description: 'v3: Converted to the ellewiz/trash_reminder blueprint (Jun 2026).
    Garbage and Recycling both live in calendar.garbage (Garbage = weekly Wednesdays);
    the blueprint''s keyword filter restricts this instance to Garbage events only,
    leaving Recycling to its sibling instance to avoid double notifications. Logic,
    -4h offset, and calendar.vacation gate are unchanged from v2 — only the implementation
    moved into the shared blueprint.'
  use_blueprint:
    path: ellewiz/trash_reminder.yaml
    input:
      bin_calendar: calendar.garbage
      match_keyword: garbage
      lead_offset: '-4:00:00'
      alert_title: "\U0001F5D1️ Bins out tonight"
      action_phrase: put the cans out tonight
- id: garbage_recycling_night_before_reminder
  alias: Recycling — Night-Before Reminder
  description: 'v2: Converted to the ellewiz/trash_reminder blueprint (Jun 2026).
    Recycling is an every-other-Tuesday all-day event living in calendar.garbage (first
    occurrence 2026-06-09); the calendar''s rrule handles the biweekly cadence. The
    blueprint''s keyword filter restricts this instance to Recycling events only —
    its sibling (garbage_night_before_reminder) handles Garbage. Logic and gating
    unchanged from v1.'
  use_blueprint:
    path: ellewiz/trash_reminder.yaml
    input:
      bin_calendar: calendar.garbage
      match_keyword: recycling
      lead_offset: '-4:00:00'
      alert_title: ♻️ Recycling out tonight
      action_phrase: put the recycling out tonight
- id: '1780365192484'
  alias: 'Alert: Core Heartbeat (dead-man''s switch)'
  description: 'Dead-man''s switch for HA Core. Pings Healthchecks.io every 5 min
    via rest_command.core_heartbeat (defined in packages/core_heartbeat.yaml, URL
    in secrets.yaml as healthchecks_core_heartbeat_url). When Core or the whole box
    dies, the pings stop and Healthchecks alerts Lara from outside the box after ~15
    min (check Period 10m + Grace 5m). This exists because HA cannot notify about
    its own death (the 2026-06-01 SIGBUS outage sent no alert). Ungated on purpose:
    must run even during calendar.vacation, like security/fridge automations. Also
    fires once on HA start so a fresh boot pings immediately. max_exceeded:silent
    keeps the log quiet on the high-frequency time trigger.'
  triggers:
  - trigger: time_pattern
    minutes: /5
    id: heartbeat_tick
  - trigger: homeassistant
    event: start
    id: ha_started
  conditions: []
  actions:
  - action: rest_command.core_heartbeat
    alias: Ping Healthchecks.io dead-man's switch
  mode: single
  max_exceeded: silent
- id: '1780396731256'
  alias: Log - Good Night Johnny button press
  description: Durable press log for the office Lumi button. Fires on every short-press
    (same trigger as Good night Johnny), independent of the music condition. Increments
    a lifetime counter, a vacation-only counter, stamps the last-press time, and writes
    a logbook entry tagged with vacation state. Created to make 'was it pressed during
    vacation' answerable beyond recorder retention.
  triggers:
  - platform: device
    device_id: c8bb0b9a688e58d28beaf2e26ee12b21
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
  actions:
  - action: counter.increment
    target:
      entity_id: counter.good_night_johnny_presses
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.good_night_johnny_last_press
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: calendar.vacation
        state: 'on'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.good_night_johnny_presses_vacation
      - action: logbook.log
        data:
          name: Good night Johnny button
          message: pressed while vacation was ON
          entity_id: automation.good_night_johnny
    default:
    - action: logbook.log
      data:
        name: Good night Johnny button
        message: pressed (vacation off)
        entity_id: automation.good_night_johnny
  mode: queued
  max: 10
- id: '1780656091166'
  alias: 'Oura: Flag sleep note pending on data sync'
  description: 'Raises input_boolean.oura_note_pending when the Oura Ring nightly
    data syncs each morning, so the Cowork scheduled task ''oura-daily-sleep-note''
    (polls the flag every 30 min from 6am) can gate cheaply: flag off = exit in one
    call; flag on = write the iCloud Markdown sleep report then turn the flag off.
    Triggers on EITHER sleep_score OR bedtime_end changing to a valid value. 2026-07-10
    fix: bedtime_end was added because the original sleep_score-only trigger silently
    missed mornings where last night''s score equaled the prior night''s (90 == 90
    on Jul 10); an identical value is not a state change in HA, so the flag never
    rose and no report was written. bedtime_end (the wake timestamp) differs every
    night, so it fires reliably on each sync. Either trigger raising the flag is safe
    (idempotent turn_on, mode single); the task''s own file-exists and freshness guards
    prevent duplicate reports. Not gated on calendar.vacation: the note is harmless
    while away and sleep data still syncs.'
  triggers:
  - entity_id: sensor.oura_ring_sleep_score
    not_to:
    - unknown
    - unavailable
    platform: state
  - platform: state
    entity_id: sensor.oura_ring_bedtime_end
    not_to:
    - unknown
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''unknown'', ''unavailable'',
      ''none'', ''''] }}'
  actions:
  - alias: Raise the pending flag for the Cowork sleep-note task
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.oura_note_pending
  mode: single
- id: bedroom_lights_off_manager
  alias: Bedroom — Lights Off (Motion Clear / Bright / In Bed / Retry)
  description: 'Companion to ''Bedroom — Motion Lights (v2)''. Standalone turn-off
    so bedroom lights go off no matter how they were turned on (motion automation,
    in_bed wake automation''s Energize scene, Hue button/app). Created after 2026-06-04
    incident: lights came on at 06:26 via the wake automation, the motion automation''s
    lux condition failed (room already bright), and its in-run wait never armed —
    lights stayed on 16h. Branches: (1) motion clear 3 min — primary off path; (2)
    lux above bedroom_lux_off_threshold for 2 min, gated on sun above_horizon so the
    lights'' own output can''t self-trigger an off at night; (3) in_bed turns on —
    lights out for sleep. Stateless triggers survive reloads/restarts, unlike the
    old wait_for_trigger design. Note: wake-alarm light fade-in is safe — motion_clear
    needs a fresh off-transition and the bright path needs a daylight lux crossing.
    2026-06-07 retry branch added after incident #3: bedside_2 dropped off the Hue
    bridge 2s before the 07:26 turn_off, missed the command, rejoined reporting ''on''
    and stayed lit ~2.7h (motion_clear needs a fresh transition, bright needs a lux
    crossing — no recovery path). New trigger ''rejoined'': a bedside bulb returns
    from unavailable to ''on''; if motion has been clear >=3 min, re-send turn_off.
    Top-level on-condition relaxed to OR trigger.id==''rejoined'' because the group
    state can lag the member rejoin by milliseconds. Root cause is Zigbee interference
    (see ''Alert: Zigbee Flapping Watchdog''); this branch is resilience, keep it
    after the channel fix.'
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    to: 'off'
    for: 00:03:00
    id: motion_clear
    platform: state
  - entity_id: sensor.hue_motion_sensor_2_light_level
    above: input_number.bedroom_lux_off_threshold
    for: 00:02:00
    id: bright
    platform: numeric_state
  - entity_id: input_boolean.in_bed
    from: 'off'
    to: 'on'
    id: in_bed
    platform: state
  - platform: state
    entity_id:
    - light.bedside_1
    - light.bedside_2
    from: unavailable
    to: 'on'
    id: rejoined
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.bedroom_lights
      state: 'on'
    - condition: template
      value_template: '{{ trigger.id == ''rejoined'' }}'
  actions:
  - choose:
    - alias: No motion for 3 min — turn off
      conditions:
      - condition: trigger
        id: motion_clear
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Room bright in daylight — turn off
      conditions:
      - condition: trigger
        id: bright
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Got in bed — turn off
      conditions:
      - condition: trigger
        id: in_bed
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Bulb rejoined bridge reporting on, no motion — retry off
      conditions:
      - condition: trigger
        id: rejoined
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        state: 'off'
        for: 00:03:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
  mode: single
  max_exceeded: silent
- id: '1780845090681'
  alias: 'Alert: Zigbee Flapping Watchdog'
  description: 'Counts Hue bulb unavailable-dropouts across the five individual bulbs
    (bedside_1, bedside_2, corner, end table, torchiere) into counter.zigbee_flap_events,
    reset hourly by ''Zigbee Flap Watchdog — Resets''. Pushes ONE iPhone alert per
    day (guard: input_boolean.zigbee_flap_alerted_today, reset 4am) when drops reach
    6 in an hour. Created 2026-06-07 after interference flapping (started ~Jun 5,
    bedside_2 + corner ~65 drops each/48h) made bedside_2 miss a turn_off command
    and stay lit 2.7h. Purpose: confirm whether the Hue Zigbee channel change works,
    and catch recurrence. Healthy baseline is ~0 drops/hour, so threshold 6 is generous.
    Known caveat: an HA restart can briefly mark all bulbs unavailable and add up
    to 5 counts in that hour — below threshold by design. Not gated on calendar.vacation
    (infrastructure alert). v1: if too chatty or not granular enough, v2 could track
    per-bulb counters.'
  triggers:
  - trigger: state
    entity_id:
    - light.bedside_1
    - light.bedside_2
    - light.living_room_corner
    - light.next_to_couch
    - light.torchiere
    to: unavailable
    not_from: unknown
  actions:
  - alias: Count the dropout
    action: counter.increment
    target:
      entity_id: counter.zigbee_flap_events
  - alias: Alert once per day when threshold crossed
    choose:
    - conditions:
      - condition: numeric_state
        entity_id: counter.zigbee_flap_events
        above: 5
      - condition: state
        entity_id: input_boolean.zigbee_flap_alerted_today
        state: 'off'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Zigbee Flapping
          message: '{{ states(''counter.zigbee_flap_events'') }} Hue bulb dropouts
            in the past hour (latest: {{ trigger.to_state.attributes.friendly_name
            | default(trigger.entity_id) }}). Interference is still active — bulbs
            may miss commands.'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zigbee_flap_alerted_today
  mode: queued
  max: 10
  max_exceeded: silent
- id: '1780845094126'
  alias: Zigbee Flap Watchdog — Resets
  description: 'Housekeeping for ''Alert: Zigbee Flapping Watchdog''. Hourly: resets
    counter.zigbee_flap_events so the threshold means drops-per-hour. At the 04:00
    run, also clears input_boolean.zigbee_flap_alerted_today so the watchdog can alert
    again the next day (matches the Health Tags 4am reset convention).'
  triggers:
  - minutes: 0
    platform: time_pattern
  actions:
  - alias: Hourly counter reset
    action: counter.reset
    target:
      entity_id: counter.zigbee_flap_events
  - alias: 4am — re-arm the daily alert guard
    choose:
    - conditions:
      - condition: time
        after: 03:59:30
        before: 04:59:30
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.zigbee_flap_alerted_today
  mode: single
- id: movie_lamp_observer_snapshot_log
  alias: Living Room — Movie Lamp Observer
  description: 'Diagnostic logging for the Movie Lamp Dimmer/Restore v2 automations
    (Frndly blind-spot validation, added 2026-06-07). Whenever either automation fires,
    write a logbook entry snapshotting the decision inputs at trigger time: ATV state
    + app_id, TCL TV plug watts, Roku source, Arc state, and lamp state/brightness.
    Lamp brightness reflects the state BEFORE the fired automation''s action completes
    — that''s intentional (we want the inputs, not the outcome). Added 2026-06-08:
    a /5-minute periodic_sample trigger that logs lamp brightness only while the lamp
    is on, after sunset, and under AL manual_control (proxy for movie-dim active)
    — this fills the gap where brightness isn''t recorded and the snapshot only samples
    on automation fires, so we can confirm the 20% dim holds steady across a Frndly
    evening. Same durable-logging pattern as the Good Night Johnny button. Remove
    once the v2 logic is proven out.'
  triggers:
  - event_type: automation_triggered
    event_data:
      entity_id: automation.living_room_movie_lamp_dimmer
    id: dimmer_fired
    platform: event
  - event_type: automation_triggered
    event_data:
      entity_id: automation.living_room_movie_lamp_restore
    id: restore_fired
    platform: event
  - platform: time_pattern
    minutes: /5
    id: periodic_sample
  conditions: []
  actions:
  - choose:
    - alias: Automation-fired snapshot of decision inputs
      conditions:
      - condition: template
        value_template: '{{ trigger.id in [''dimmer_fired'', ''restore_fired''] }}'
      sequence:
      - alias: Write snapshot of decision inputs to logbook
        action: logbook.log
        data:
          name: Movie Lamp Observer
          entity_id: light.next_to_couch
          message: '{{ trigger.event.data.name }} fired | ATV: {{ states(''media_player.living_room_4k_2'')
            }} (app: {{ state_attr(''media_player.living_room_4k_2'', ''app_id'')
            or ''none'' }}) | TV plug: {{ states(''sensor.tcl_tv_current_consumption'')
            }} W | Roku: {{ states(''media_player.55_tcl_roku_tv'') }}/{{ state_attr(''media_player.55_tcl_roku_tv'',
            ''source'') or ''n/a'' }} | Arc: {{ states(''media_player.living_room_arc'')
            }} | Lamp before: {{ states(''light.next_to_couch'') }}{% if is_state(''light.next_to_couch'',
            ''on'') %} @ {{ ((state_attr(''light.next_to_couch'', ''brightness'')
            or 0) / 2.55) | round }}%{% endif %}'
    - alias: Periodic brightness sample during movie-dim window
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''periodic_sample'' }}'
      - condition: state
        entity_id: light.next_to_couch
        state: 'on'
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: template
        value_template: '{{ ''light.next_to_couch'' in (state_attr(''switch.adaptive_lighting_living_room_lights'',
          ''manual_control'') or []) }}'
      sequence:
      - alias: Write periodic brightness sample to logbook
        action: logbook.log
        data:
          name: Movie Lamp Observer
          entity_id: light.next_to_couch
          message: 'Periodic dim sample | Lamp: {{ states(''light.next_to_couch'')
            }}{% if is_state(''light.next_to_couch'', ''on'') %} @ {{ ((state_attr(''light.next_to_couch'',
            ''brightness'') or 0) / 2.55) | round }}%{% endif %} | ATV: {{ states(''media_player.living_room_4k_2'')
            }} (app: {{ state_attr(''media_player.living_room_4k_2'', ''app_id'')
            or ''none'' }}) | TV plug: {{ states(''sensor.tcl_tv_current_consumption'')
            }} W | Roku: {{ states(''media_player.55_tcl_roku_tv'') }}/{{ state_attr(''media_player.55_tcl_roku_tv'',
            ''source'') or ''n/a'' }} | Arc: {{ states(''media_player.living_room_arc'')
            }}'
  mode: queued
  max: 10
- id: '1781031863269'
  alias: Living Room — Corner Lamp Dropout Logger
  description: 'Logs every time light.living_room_corner drops off the Hue bridge
    and when it recovers, to build a dropout count for deciding whether to replace
    the bulb. Context: after the ch.25 change on 2026-06-07 fixed bedside_2 / end-table
    / etc., the corner lamp is the lone remaining flapper (suspected bulb-specific
    or local interferer). Increments counter.corner_lamp_unavailable_count on each
    drop, stamps input_datetime.corner_lamp_last_unavailable / _last_recovered, and
    writes logbook entries including downtime on recovery. not_from: unknown filters
    HA-restart init noise so restarts aren''t miscounted as dropouts. TODO: if the
    count climbs over ~a week, replace the bulb and retire this logger.'
  triggers:
  - trigger: state
    entity_id: light.living_room_corner
    to: unavailable
    not_from:
    - unknown
    id: went_unavailable
  - trigger: state
    entity_id: light.living_room_corner
    from: unavailable
    not_to:
    - unknown
    - unavailable
    id: recovered
  actions:
  - choose:
    - alias: Drop — count it, stamp the time, log it
      conditions:
      - condition: trigger
        id: went_unavailable
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.corner_lamp_unavailable_count
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.corner_lamp_last_unavailable
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: logbook.log
        data:
          name: Corner Lamp
          message: 'dropped off the Hue bridge (unavailable). Drop #{{ states(''counter.corner_lamp_unavailable_count'')
            }} since logging began.'
          entity_id: light.living_room_corner
    - alias: Recovery — stamp the time, log downtime
      conditions:
      - condition: trigger
        id: recovered
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.corner_lamp_last_recovered
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: logbook.log
        data:
          name: Corner Lamp
          message: recovered to '{{ trigger.to_state.state }}' after {% set ts = state_attr('input_datetime.corner_lamp_last_unavailable','timestamp')
            %}{% if ts %}{{ ((as_timestamp(now()) - ts) / 60) | round(1) }} min{%
            else %}unknown{% endif %} of downtime.
          entity_id: light.living_room_corner
  mode: queued
  max: 10
- id: '1781291786499'
  alias: Living Room — Ambient Logger (Flap Metrics)
  description: 'Durable measurement logger for the Living Room Ambient Manager''s
    anti-flap rework (2026-06-12). On every light.living_room_lights on/off transition
    it writes a logbook entry capturing dwell time in the prior state plus the decision
    inputs at that moment: smoothed lux (sensor.living_room_illuminance_smoothed),
    raw Hue lux, living-room motion, and whether the change was auto or manual (context.user_id).
    A ''flap'' = lights going on->off after fewer than 25 min on (the behavior the
    25-min guard + smoothing + widened band are meant to kill); each flap increments
    counter.living_room_light_flaps and stamps input_datetime.living_room_light_last_flap.
    At 04:00 it logs the 24h flap tally and resets the counter, building a day-by-day
    series. not_from/not_to unknown+unavailable filters HA-restart and Zigbee-dropout
    noise. Same durable-logging pattern as the Corner Lamp Dropout Logger; retire
    once the fix is proven steady.'
  triggers:
  - id: transition
    entity_id: light.living_room_lights
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    platform: state
  - id: daily_reset
    at: 04:00:00
    platform: time
  actions:
  - choose:
    - alias: Log every transition with dwell + decision inputs
      conditions:
      - condition: trigger
        id: transition
      sequence:
      - action: logbook.log
        data:
          name: LR Ambient Logger
          entity_id: light.living_room_lights
          message: now {{ trigger.to_state.state }} (was {{ trigger.from_state.state
            }} for {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()/60)|round(1)
            }} min) | smoothed {{ states('sensor.living_room_illuminance_smoothed')
            }} lx / raw {{ states('sensor.hue_motion_sensor_4_illuminance') }} lx
            | motion {{ states('binary_sensor.hue_motion_sensor_4_motion') }} | presence
            {{ states('binary_sensor.living_room_presence') }} | {{ 'manual' if trigger.to_state.context.user_id
            else 'auto' }}
      - alias: Count it as a flap if lights were on under 25 min
        choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.from_state.state == ''on'' and trigger.to_state.state
              == ''off'' and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
              < 1500 }}'
          sequence:
          - action: counter.increment
            target:
              entity_id: counter.living_room_light_flaps
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.living_room_light_last_flap
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          - action: logbook.log
            data:
              name: LR Ambient Logger
              entity_id: light.living_room_lights
              message: 'FLAP #{{ states(''counter.living_room_light_flaps'') }}: lights
                went off after only {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()/60)|round(1)
                }} min on.'
    - alias: Daily 4am — log the 24h tally, then reset
      conditions:
      - condition: trigger
        id: daily_reset
      sequence:
      - action: logbook.log
        data:
          name: LR Ambient Logger
          entity_id: counter.living_room_light_flaps
          message: 'Daily summary: {{ states(''counter.living_room_light_flaps'')
            }} short on/off flaps (under 25 min) in the last 24h.'
      - action: counter.reset
        target:
          entity_id: counter.living_room_light_flaps
  mode: queued
  max: 10
  max_exceeded: silent
- id: meds_log_dose_from_button
  alias: 'Meds: Log dose from Orb button'
  description: 'Logs a medication dose when a button on the SONOFF SNZB-01M Orb (ieee
    a4:c1:38:10:9e:56:ff:ff) is pressed. Per press it: (1) increments counter.med_*_doses
    (durable -> mirrored to sensor.med_*_doses_recorded for long-term statistics,
    read by the monthly crossfactor report as a per-med factor); (2) calls the existing
    Health Tags script.log_* which checks the input_boolean.*_taken dashboard flag
    AND writes the canonical ''Health Log'' logbook entry (so a button press behaves
    identically to tapping the Oura dashboard); (3) pushes an iPhone notification
    that opens Apple Health. Button->endpoint->med map (single press): ep1=Adderall
    (1 dot, upper-left), ep2=Lexapro (2 dots, upper-right), ep3=Guanfacine (3 dots,
    lower-left), ep4=Zepbound (4 dots, lower-right). DOUBLE-press ep1 = log Adderall
    AND Lexapro together. NOTE: Adderall/Lexapro/Guanfacine no longer set an input_datetime
    (consolidated away Jun 15 2026 as redundant with the daily flag + counter). Zepbound
    has NO Health Tags boolean/script (weekly med; daily-reset model doesn''t fit),
    so its branch logs inline and keeps input_datetime.med_zepbound_last_taken for
    a ''last taken / days since'' readout, plus the counter. WHY zha_event: ZHA has
    no quirk for this new model, no per-button entity; presses fire raw zha_event
    on SONOFF cluster 64530 (0xFC52) with clean command names; filter cluster_id 64530
    to drop on_off(6)/level(8) noise. NOT vacation-gated (meds taken while traveling;
    report drops away nights). Iron not on a button. Never reset the counters (breaks
    report deltas).'
  triggers:
  - trigger: event
    event_type: zha_event
    id: adderall
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 1
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: lexapro
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 2
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: guanfacine
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 3
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: zepbound
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 4
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: adderall_lexapro_combo
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 1
      cluster_id: 64530
      command: double
  actions:
  - alias: Increment durable counter, then check dashboard flag via Health Tags script
    choose:
    - alias: Adderall + Lexapro combo (Button 1 double-press)
      conditions:
      - condition: trigger
        id: adderall_lexapro_combo
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_adderall_doses
      - action: counter.increment
        target:
          entity_id: counter.med_lexapro_doses
      - action: script.log_adderall
      - action: script.log_lexapro
    - alias: Adderall (Button 1)
      conditions:
      - condition: trigger
        id: adderall
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_adderall_doses
      - action: script.log_adderall
    - alias: Lexapro (Button 2)
      conditions:
      - condition: trigger
        id: lexapro
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_lexapro_doses
      - action: script.log_lexapro
    - alias: Guanfacine (Button 3)
      conditions:
      - condition: trigger
        id: guanfacine
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_guanfacine_doses
      - action: script.log_guanfacine
    - alias: Zepbound (Button 4) — no Health Tags flag (weekly med), keeps last-taken
        + counter
      conditions:
      - condition: trigger
        id: zepbound
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_zepbound_doses
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.med_zepbound_last_taken
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: logbook.log
        data:
          name: Health Log
          message: Zepbound taken
          entity_id: input_datetime.med_zepbound_last_taken
  - alias: Push iPhone notification that opens Apple Health
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F48A Med logged"
      message: '{{ med_label }} logged at {{ now().strftime(''%-I:%M %p'') }}. Tap
        to open Health.'
      data:
        url: x-apple-health://
        push:
          interruption-level: active
  mode: queued
  max: 10
  variables:
    med_label: '{% set m = {''adderall'':''Adderall'',''lexapro'':''Lexapro'',''guanfacine'':''Guanfacine'',''zepbound'':''Zepbound'',''adderall_lexapro_combo'':''Adderall
      + Lexapro''} %}{{ m.get(trigger.id, ''Medication'') }}'
- id: commute_airplay_interrupted_alert
  alias: 'Commute: Alert if announcement interrupts AirPlay music'
  description: 'The morning commute announcer (script.commute_time_announcer -> script.sonos_broadcast)
    snapshots, unjoins and speaks on the Sonos players, then sonos.restore. Sonos-native
    sources (Music Assistant) resume fine, but a live AirPlay stream (x-sonos-vli)
    cannot be re-pulled by sonos.restore -- it comes back paused while the phone keeps
    advancing the playlist silently. 2026-06-15: built after AirPlay music to bathroom
    + bedroom_frame died on the 6:55 announcement and never resumed. This is a guard,
    NOT a fix -- the AirPlay limitation is not solvable from HA. It just pushes a
    heads-up so the interruption is noticed instead of discovered later as silence.
    Fires when a target speaker sits paused on an AirPlay source for 20s while the
    announcer is still running. Uses a notification tag so the 5-minute announcement
    cadence updates one notification instead of stacking. Next step if this proves
    noisy: gate on a once-per-morning input_boolean reset at wake time.

    '
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - media_player.bathroom
    - media_player.bedroom_frame
    to: paused
    for: 00:00:20
  conditions:
  - condition: state
    entity_id: script.commute_time_announcer
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: "{{ 'airplay' in (state_attr(trigger.entity_id, 'media_content_id')
      | default('') | lower)\n   or (state_attr(trigger.entity_id, 'source') | default('')
      | lower) == 'airplay' }}\n"
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: "\U0001F3B5 AirPlay music paused"
      message: The commute announcement interrupted AirPlay on {{ trigger.to_state.attributes.friendly_name
        }} and Sonos can't auto-resume it. Tap play on your phone, or use Music Assistant
        for morning music so it resumes itself.
      data:
        tag: airplay_interrupted
        push:
          interruption-level: active
- id: '1782125200879'
  alias: Sonos Wake Alarm — in_bed Fallback
  description: 'Safety net for the Sonos Wake Alarm, which only proceeds if input_boolean.in_bed
    is on at trigger time. in_bed is normally set by a phone Shortcuts/companion-app
    automation when Soundcore earbuds connect; if the phone misses (e.g. Low Power
    Mode in the bedtime window, as on 2026-06-21 to 22), in_bed stays off and the
    alarm skips. At 03:30 on a workday morning, if in_bed is still off while Lara
    is home and not on vacation, this turns it on so the alarm runs and pushes a heads-up.
    Moved from a -25min calendar offset (~6:35am) to a fixed 03:30 clock trigger on
    2026-06-24: the old timing force-set in_bed on even when Lara had woken early
    and gone downstairs, so the alarm fired at 7am while she was already up. 03:30
    is reliably mid-sleep, so in_bed=off then genuinely means a missed phone trigger,
    and with her asleep and the lights already off it cannot wrongly trip bedroom_lights_off_motion_clear_bright_in_bed.
    The old calendar_event ''wake up'' template condition was dropped (a clock trigger
    has no calendar event); binary_sensor.workday already gates it to wake-alarm days.'
  triggers:
  - trigger: time
    at: 03:30:00
    id: wake_fallback
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - alias: Force in_bed on so the alarm runs
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.in_bed
  - alias: Tell Lara the phone trigger was missed
    action: notify.mobile_app_iphone
    data:
      title: Alarm fallback fired
      message: in_bed was still off this morning, so I set it on so your wake alarm
        runs. Your phone's earbud→in_bed trigger likely missed (check Low Power Mode
        / Shortcuts).
  mode: single
- id: living_room_lights_backstop_reassert
  alias: Living Room — Lights Backstop (Re-assert After External Off)
  description: 'Backstop so an external command can never leave the living room dark.
    2026-06-22: diagnosed an external, non-HA source turning light.living_room_lights
    off (all three Hue bulbs in the same instant, no HA automation trace, no HA user).
    Source still unconfirmed (HomeKit/Hue-bridge/Shortcuts under investigation via
    debug logging) but it recurs ~5:09pm and hit early at 1:49pm once. The Ambient
    Manager only turns the group ON on a falling lux crossing, so an external OFF
    while the room is already dark left no recovery and Lara came home to a dark room.
    This re-asserts the group ON whenever it goes off while it should be lit. GATES:
    (1) early_morning off (mirrors Ambient Manager); (2) smoothed lux below the lux_on
    helper, so it only fires when genuinely dark — this also prevents fighting the
    Ambient Manager''s own off-branches, which only fire when lux is ABOVE lux_off
    (bright); (3) the off had no HA user_id, i.e. it was external/auto, so a deliberate
    off from the HA UI is respected and NOT overridden; (4) not actively watching
    Apple TV (TCL TV on + source Apple TV), so it won''t pop the room bright mid-movie.
    Logs the off-event context (user_id/parent_id) to the logbook to aid the ongoing
    source hunt. NOT vacation-gated on purpose: matches the Ambient Manager''s deliberate
    occupied-look behavior (lights coming on while away is wanted). Pairs with the
    keep_last_sample fix in living_room_lux_smoothing.yaml (which stops the smoothed
    lux going ''unknown'' in a dark, stable room). Retire or tighten once the external
    source is found and killed. 2026-07-07: tightened condition 3 to also require
    a null parent_id after a regression the night before — a button-started shut_down_bedtime
    chain carries no user_id anywhere, so the user-only check passed and the backstop
    re-asserted the lights ON 10s after the intentional bedtime off, leaving them
    on all night. The classic phantom''s signature is null user_id AND null parent_id
    (no context chain at all); every internal HA automation/script off carries a parent_id,
    so this now excludes bedtime, leave-home, ambient-manager and restart-recovery
    offs regardless of how the chain started.'
  triggers:
  - entity_id: light.living_room_lights
    from: 'on'
    to: 'off'
    for: 00:00:10
    id: group_off
    platform: state
  conditions:
  - condition: state
    entity_id: binary_sensor.early_morning
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.living_room_illuminance_smoothed
    below: input_number.living_room_lux_on
  - condition: template
    alias: Only re-assert truly external offs — null user_id AND null parent_id (internal
      HA chains always carry a parent_id)
    value_template: '{{ trigger.to_state.context.user_id is none and trigger.to_state.context.parent_id
      is none }}'
  - condition: not
    alias: Skip while actively watching Apple TV (movie mode)
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        state: 'on'
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        attribute: source
        state: Apple TV
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_lights
    data:
      transition: 5
  - action: logbook.log
    data:
      name: LR Lights Backstop
      entity_id: light.living_room_lights
      message: Re-asserted living room lights after an external off (smoothed {{ states('sensor.living_room_illuminance_smoothed')
        }} lx). Off-event context user_id={{ trigger.to_state.context.user_id }} parent_id={{
        trigger.to_state.context.parent_id }}.
  mode: single
- id: meds_guanfacine_tv_nudge
  alias: 'Meds — Guanfacine: TV nudge until logged'
  description: 'Evening nudge to take Guanfacine (resets off daily at 4am; normally
    logged ~9-10pm, so at 8:10pm it''s usually still un-logged). At 8:10pm, if Guests
    is off and the dose isn''t logged and we''re not on vacation: HOME -> immediately
    snapshot the living-room lights, pause whatever is actively playing on the TV,
    and raise the lights to 70%. AWAY at 8:10 -> wait until Lara is home AND living-room
    presence is detected, then 10 min later run the same nudge (re-checking it isn''t
    logged yet). Then HOLD (no timeout, per Lara) until input_boolean.guanfacine_taken
    turns on, at which point: restore the lights to their exact prior state, hand
    them back to Adaptive Lighting, and resume the paused player. ''Whatever is playing''
    = Apple TV (media_player.living_room_4k_2) if playing/buffering, else TCL Roku
    (media_player.55_tcl_roku_tv) if playing, else nothing (lights-only nudge). KNOWN
    LIMITATION: Frndly is invisible to the ATV integration (sits idle, app_id '''')
    so it can''t be paused via HA — lights still brighten. mode: restart so a new
    evening''s 8:10 trigger supersedes any instance left waiting from an away night.
    Guests = input_boolean.guests (created Jun 2026). NOTE no in_bed safety-release:
    Lara explicitly chose hold-until-logged with no timeout.'
  triggers:
  - at: '20:10:00'
    id: evening_check
    platform: time
  conditions:
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.guanfacine_taken
    state: 'off'
  actions:
  - alias: If away at 8:10, wait for return + living-room presence, then settle 10
      min
    choose:
    - alias: Away path
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: person.lara_wiz
          state: home
      sequence:
      - alias: Wait until home AND living-room presence detected
        wait_template: '{{ is_state(''person.lara_wiz'', ''home'') and is_state(''binary_sensor.living_room_presence'',
          ''on'') }}'
      - alias: Settle 10 minutes after arriving in the living room
        delay: 00:10:00
  - alias: Re-gate after any waiting (logged during the wait? guests arrived? left
      again?)
    condition: state
    entity_id: input_boolean.guanfacine_taken
    state: 'off'
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - alias: Capture which player is actively playing (for pause + later resume)
    variables:
      tv_player: '{% if states(''media_player.living_room_4k_2'') in [''playing'',
        ''buffering''] %}media_player.living_room_4k_2{% elif states(''media_player.55_tcl_roku_tv'')
        == ''playing'' %}media_player.55_tcl_roku_tv{% else %}none{% endif %}'
  - alias: Snapshot the living-room lights so we can restore them exactly
    action: scene.create
    data:
      scene_id: guanfacine_nudge_restore
      snapshot_entities:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
  - alias: Pause the TV if something is actively playing
    if:
    - condition: template
      value_template: '{{ tv_player != ''none'' }}'
    then:
    - action: media_player.media_pause
      target:
        entity_id: '{{ tv_player }}'
  - alias: Brighten the living-room lights to 70%
    action: light.turn_on
    target:
      entity_id: light.living_room_lights
    data:
      brightness_pct: 70
      transition: 2
  - alias: Tell Lara why the TV paused
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F48A Guanfacine"
      message: TV paused and lights up until you log tonight's dose.
  - alias: Hold until the dose is logged (no timeout, per Lara)
    wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.guanfacine_taken
      to: 'on'
  - alias: Restore the living-room lights exactly as they were
    action: scene.turn_on
    target:
      entity_id: scene.guanfacine_nudge_restore
    data:
      transition: 2
  - alias: Hand the lights back to Adaptive Lighting
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      lights:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
      manual_control: false
  - alias: Resume the player we paused
    if:
    - condition: template
      value_template: '{{ tv_player != ''none'' }}'
    then:
    - alias: Grace period so Lara is back in the room before audio resumes
      delay: 00:00:15
    - action: media_player.media_play
      target:
        entity_id: '{{ tv_player }}'
  mode: restart
- id: living_room_tv_event_lighting_backstop
  alias: Living Room — TV Event Lighting Backstop (Arrive-Home Re-fire)
  description: 'Backstop for TV Event Reminder, which fires 15 min BEFORE a calendar.tv
    event and requires person.lara_wiz to be home. If Lara arrives home after that
    -0:15 pre-roll (e.g. 2026-07-01: home 7:56pm for an 8:00pm event, pre-roll fired
    7:45pm while she was still out and bailed on failed_conditions), the Movie scene
    never gets applied and there is no re-check. This re-fires the same lighting setup
    when she gets home while a TV event is ALREADY active. Guard: only runs while
    switch.adaptive_lighting_living_room_lights is still ON (proxy for ''TV setup
    not yet applied'') so a GPS home/not_home bounce mid-event can''t re-apply the
    scene or re-notify. Gated on calendar.tv active + in_bed off + calendar.vacation
    off. Does NOT announce over Sonos (she is presumably about to watch) and does
    NOT pause the TV, unlike the pre-roll reminder — this is purely the lighting catch-up.
    Cleanup (resume AL, re-enable the 4 nightly automations, re-arm sleep mode) is
    still handled by TV Event Over on calendar.tv event end.'
  triggers:
  - platform: state
    entity_id: person.lara_wiz
    to: home
    for:
      seconds: 20
  conditions:
  - condition: state
    entity_id: calendar.tv
    state: 'on'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - alias: Only if the TV lighting setup hasn't already been applied (AL still adapting)
    condition: state
    entity_id: switch.adaptive_lighting_living_room_lights
    state: 'on'
  actions:
  - alias: Apply the Movie scene
    action: scene.turn_on
    data:
      transition: 10
    target:
      entity_id: scene.living_room_movies_2
  - alias: Pause Adaptive Lighting so its 90s re-adapt cannot override the Movie scene
      during the event
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - alias: Stand down the nightly automations that would fight the scene (TV Event
      Over re-enables them)
    action: automation.turn_off
    data:
      stop_actions: true
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
  - alias: Let Lara know the catch-up fired
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F4FA TV Event Lighting"
      message: You got home after the 7:45 pre-roll, so I applied the Movie scene{%
        if state_attr('calendar.tv','message') %} for "{{ state_attr('calendar.tv','message')
        }}"{% endif %}.
  mode: single
- id: living_room_late_night_sleep_dim
  alias: Living Room — Late-Night Sleep Dim (v1)
  description: 'Puts the living room''s Adaptive Lighting into sleep mode at night
    so AL''s target drops to a dim warm level (~10% / 2200K) instead of the ~33% evening
    baseline. Fixes the ''lamps snap bright after a movie ends'' case: Movie Lamp
    Restore (v2) hands the End table lamp back to AL via set_manual_control:false
    and AL immediately re-applies its curve — with sleep mode on, that target is the
    dim night level, so the hand-back lands dim. ADAPTIVE TIMING: arms at 21:00 on
    work nights (input_boolean.workday_tomorrow on) and 22:00 on non-work nights,
    because Lara is often in bed before 22:00 on work nights so a fixed 22:00 arm
    was too late. GATES (arm branch only): calendar.vacation off, person.lara_wiz
    home, input_boolean.guests off — don''t force the LR dim while away or when guests
    may be using the room. Releases at 05:30 (ungated) so daytime AL always resumes.
    Order: enable sleep mode FIRST, then re-apply sleep_brightness/sleep_color_temp
    via change_switch_settings, so on-lights only ever dim (never a brighten flash)
    and the sleep values self-heal after a restart resets them to the 1%/1000K default.
    turn_on_lights:false so it never wakes dark lamps. TODO v2: single time-trigger
    means arriving home after the arm time misses that night; if the 21:00/22:00 clock
    proves too blunt, switch to an event-driven arm on evening TV-off (Apple TV playing→idle
    after a cutoff hour); reconcile with script.shut_down_bedtime. [2026-07-06] Removed
    turn_on_lights:false from the change_switch_settings call: it is not an accepted
    key on this Adaptive Lighting version, so it raised ''extra keys not allowed''
    and aborted this self-heal step every night (sleep_brightness/sleep_color_temp
    were never applied). Enabling sleep mode alone never turns on already-off lamps,
    so the no-wake-dark-lamps behavior is unchanged.'
  triggers:
  - at: '21:00:00'
    id: night_start_work
    platform: time
  - at: '22:00:00'
    id: night_start_reg
    platform: time
  - at: 05:30:00
    id: night_end
    platform: time
  conditions: []
  actions:
  - choose:
    - alias: Arm sleep-dim (21:00 work nights / 22:00 otherwise; home, no guests,
        not away)
      conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: night_start_work
          - condition: state
            entity_id: input_boolean.workday_tomorrow
            state: 'on'
        - condition: and
          conditions:
          - condition: trigger
            id: night_start_reg
          - condition: state
            entity_id: input_boolean.workday_tomorrow
            state: 'off'
      - condition: state
        entity_id: calendar.vacation
        state: 'off'
      - condition: state
        entity_id: person.lara_wiz
        state: home
      - condition: state
        entity_id: input_boolean.guests
        state: 'off'
      sequence:
      - alias: Enable AL sleep mode for the living room
        action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
      - alias: Set LR AL sleep level to ~10% warm (self-heal against restart)
        action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          sleep_brightness: 10
          sleep_color_temp: 2200
    - alias: Release sleep-dim at 05:30 (always, so daytime AL resumes)
      conditions:
      - condition: trigger
        id: night_end
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  mode: single
- id: bedroom_heat_alert_v2
  alias: Bedroom — Heat Alert (v2, Vacation-Gated + Anti-Spam)
  description: 'v2 consolidating "Bedroom temp too hot" (id 1654570339244) and "Bedroom
    too hot when Lara comes home" (id 1691671531217). Two branches: sustained warm
    (>75F for 15 min while home and awake, not at work) and arrival-home hot (>78F).
    Adds calendar.vacation gate (house style section 8) and a 3h re-alert guard via
    this automation''s own last_triggered so an oscillating temp can''t spam. Alert-only:
    no controllable bedroom AC exists yet (Kasa plug pending) - upgrade to actually
    cool when installed. Replaces the two v1 alerts (now disabled 2026-07-05). Installed
    at Lara''s request.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.temp_in_bedroom
    above: 75
    for: 00:15:00
    id: sustained_warm
  - trigger: state
    entity_id: person.lara_wiz
    to: home
    id: arrived_home
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sustained_warm
      - condition: not
        conditions:
        - condition: zone
          entity_id: person.lara_wiz
          zone: zone.work
      - condition: template
        alias: Re-alert at most once every 3h
        value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
          > 10800 }}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Bedroom warm
          message: Bedroom is {{ states('sensor.temp_in_bedroom') }}°F. Turn down
            the heat / crank the AC.
    - conditions:
      - condition: trigger
        id: arrived_home
      - condition: numeric_state
        entity_id: sensor.temp_in_bedroom
        above: 78
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Bedroom hot
          message: Welcome home — bedroom is {{ states('sensor.temp_in_bedroom') }}°F.
  mode: single
- id: '1783335318996'
  alias: 'Sonos Wake Alarm: Speaker Failsafe (v1)'
  description: 'Failsafe for the Sonos Wake Alarm. On 2026-07-06 the wake alarm ran
    perfectly per its trace but Lara slept through it: every audio step (lofi ramp
    + escalating alarm) plays through media_player.bedroom, the Music Assistant entity
    for the bedroom Sonos, and that entity had been ''unavailable'' since ~2026-07-04
    23:00 because the Music Assistant integration was stuck in setup_retry (''Failed
    to connect to music assistant server''). Both play steps use continue_on_error
    and the wait-for-playing step timed out, so the alarm produced total silence with
    no error and the trace looked normal. This is the backstop: at the wake event
    (offset 0 = the intended wake time) it checks whether media_player.bedroom is
    unavailable/unknown, and if so it (a) pushes an iPhone alert so the MA outage
    gets fixed, and (b) sounds the classic alarm directly on the native bedroom Sonos
    (media_player.bedroom_frame), escalating volume 0.40 to 0.70 every 12s until input_boolean.in_bed
    turns off, mirroring the main alarm''s stop logic. It cannot double-alarm: when
    MA is healthy the unavailable-check is false so this exits and the main alarm
    runs; only when the MA player is down (main alarm silent) does this fire. Native
    Sonos can''t play the MA lofi playlist, so the failsafe is alarm-tone-only (waking
    is the priority; the lofi wind-down is a nicety). GATES mirror the main alarm:
    time 04:30-08:00, calendar.vacation off, in_bed on, binary_sensor.workday on,
    and the calendar summary must contain ''wake up''. Phase 0 unjoins the bedroom
    Sonos so the alarm stays solo and doesn''t bleed into the bathroom Era 100 and
    disturb Johnny. URL uses homeassistant.local:8123/local/alarm-clock.mp3 to match
    the main alarm; if native Sonos ever fails to resolve mDNS, switch to the HA host
    IP. Intentional infra, don''t flag. TODO v2: also cover ''main alarm started but
    media_player.bedroom never reached playing'' to defend against non-unavailable
    MA failures (player present but announcement errors).'
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_up_time
    platform: calendar
  conditions:
  - condition: time
    after: 04:30:00
    before: 08:00:00
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: template
    value_template: '{% set s = trigger.calendar_event.summary | lower | trim %}{{
      ''wake up'' in s }}'
  - condition: state
    entity_id: media_player.bedroom
    state:
    - unavailable
    - unknown
  actions:
  - alias: Alert — MA bedroom player down, alarm on backup speaker
    action: notify.mobile_app_iphone
    data:
      title: ⚠️ Wake alarm on backup speaker
      message: Music Assistant's bedroom player was unavailable at wake time, so the
        alarm is sounding on the bedroom Sonos directly. Check Music Assistant.
  - alias: Phase 0 — Unjoin bedroom Sonos so the alarm stays out of the bathroom (Johnny)
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom_frame
    continue_on_error: true
  - alias: Phase 0 — Settle before playback
    delay: 00:00:01
  - alias: Phase 1 — Escalating classic alarm on native Sonos until out of bed
    repeat:
      until:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - alias: Raise volume each pass (0.40 to 0.70 cap)
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom_frame
        data:
          volume_level: '{{ ([0.40 + (repeat.index - 1) * 0.05, 0.70] | min) | float
            }}'
      - alias: Play alarm clip as a Sonos announcement
        action: media_player.play_media
        target:
          entity_id: media_player.bedroom_frame
        data:
          media_content_id: http://homeassistant.local:8123/local/alarm-clock.mp3
          media_content_type: music
          announce: true
        continue_on_error: true
      - delay: 00:00:12
  - alias: Phase 2 — Gentle light fade-in once up
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      transition: 300
  mode: restart
- id: '1783476373361'
  alias: Mac Samba Monitor Alert (webhook)
  description: Receives status POSTs from the Mac-side Samba share monitor (LaunchAgent
    com.ellewiz.sambamonitor) and pushes them to iPhone with a per-message iOS interruption
    level (real outages = time-sensitive so they pierce Sleep/Focus, self-heal FYIs
    = passive). Replaces the old server-side samba_smb_port watchdog, which could
    not see Mac-side Finder/mount drops. Intentional infra - do not flag.
  triggers:
  - platform: webhook
    webhook_id: mac_samba_monitor_9f3a7c2e5b8d1
    local_only: true
    allowed_methods:
    - POST
  actions:
  - data:
      title: '{{ trigger.json.title | default(''Samba share'', true) }}'
      message: '{{ trigger.json.message | default(''Samba share status change on Mac'',
        true) }}'
      data:
        push:
          interruption-level: '{{ trigger.json.level | default(''active'', true) }}'
    action: notify.mobile_app_iphone
