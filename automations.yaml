    action: climate.set_hvac_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      hvac_mode: cool
  - delay:
      seconds: 3
  - alias: Clear eco so its baked-in ~73F reference can't override the target
    action: climate.set_preset_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      preset_mode: none
  - delay:
      seconds: 3
  - alias: Park it warm
    action: climate.set_temperature
    target:
      entity_id: climate.bedroom_ac
    data:
      temperature: 78
  mode: single
- id: '1786621053491'
  alias: Living Room AC — WFH Comfort Hold 74F (v2)
  triggers:
