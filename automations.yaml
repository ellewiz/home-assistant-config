- id: '1758763117719'
  alias: Living Room — Ambient Manager (Lux On/Off)
  description: 'Turn living room ambient on when dark; off when bright (with hysteresis).
    2026-06-12: rebuilt to stop a confirmed flapping loop (light.living_room_lights
    cycled on/off 6x in ~80 min on a cloudy afternoon, empty room). Three changes:
    (1) triggers now read sensor.living_room_illuminance_smoothed — a 10-min median
    (package living_room_lux_smoothing.yaml) — instead of the raw, jittery Hue lux
    that swung 19-43 every few minutes; (2) band widened to lux_on 18 / lux_off 45
    so the lamps'' own ~15-20 lx contribution can no longer cross the off threshold
    and self-trigger; (3) the lux_above_off branch now also requires the group to
    have been ON for >25 min before it may auto-off, breaking any residual oscillation.
    Off branches still require motion off so it never turns the lights off on top
    of someone in the room. On-branch is intentionally NOT presence/vacation-gated:
    lights coming on while away is wanted (occupied look). Root cause is the lux sensor
    seeing the lamps it controls; a relocated/dedicated sensor would let the band
    tighten again later.'
  triggers:
  - id: lux_below_on
    entity_id: sensor.living_room_illuminance_smoothed
    below: input_number.living_room_lux_on
    for: 00:01:00
    platform: numeric_state
  - id: lux_above_off
    entity_id: sensor.living_room_illuminance_smoothed
    above: input_number.living_room_lux_off
    for: 00:05:00
    platform: numeric_state
  - id: early_morning_ended
    entity_id: binary_sensor.early_morning
    to: 'off'
    platform: state
  conditions:
  - condition: state
    entity_id: binary_sensor.early_morning
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lux_below_on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.living_room_lights
        data:
          transition: 5
    - conditions:
      - condition: trigger
        id: lux_above_off
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_4_motion
        state: 'off'
      - condition: template
        alias: Min on-time — don't auto-off within 25 min of turning on (anti-flap)
        value_template: '{% set e = states.light.living_room_lights %}

          {{ e is not none and (now() - e.last_changed).total_seconds() > 1500 }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room_lights
        data:
          transition: 1
    - conditions:
      - condition: trigger
        id: early_morning_ended
      - condition: numeric_state
        entity_id: sensor.living_room_illuminance_smoothed
        above: input_number.living_room_lux_off
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_4_motion
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room_lights
        data:
          transition: 1
  mode: single
- id: '1760293166291'
  alias: Office — Johnny's Light (v2, Occupancy Hold)
  description: 'v2 of "Shut off Johnny''s light". v1 waited for motion-clear with
    no debounce, so short motion blips strobed the office lamp (226+ toggles in 12
    days, mostly 7–20s on-cycles in nightly bursts). v2 holds the light until the
    office has been quiet for 10 minutes, with a 2h failsafe. Rewritten to entity
    targets instead of device_id. Not gated on calendar.vacation on purpose: Johnny
    may be home with a sitter.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_office_motion_sensor_motion
    from: 'off'
    to: 'on'
    for: 00:00:03
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_office_motion_sensor_light_level
    below: 8
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  actions:
  - alias: Phase 1 — Warm light on for Johnny
    action: light.turn_on
    target:
      entity_id: light.light
    data:
      color_temp_kelvin: 2775
      transition: 3
  - alias: Phase 2 — Hold until office quiet for 10 minutes
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.hue_office_motion_sensor_motion
      to: 'off'
      for: 00:10:00
    timeout: 02:00:00
    continue_on_timeout: true
  - alias: Phase 3 — Lights out
    action: light.turn_off
    target:
      area_id: office
    data:
      transition: 5
  mode: restart
  max_exceeded: silent
- id: '1763032936247'
  alias: Living Room — Morning Lights (v2, Lux-Gated)
  description: v2 of "Living room lights on - Morning". v1 had no lux condition, so
    after the Ambient Manager's early_morning_ended branch turned the lights off at
    8:00 (room bright by lux), the next motion re-lit them — observed 9/9 days May
    28–Jun 5 2026. Sleep-mode clear stays unconditional so Adaptive Lighting never
    gets stuck dim; the relight is gated on the room actually being dark. Lux sensor
    unavailable is treated as dark (fail-bright for a wake-up light).
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_4_motion
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: group.morning
    state: 'on'
  actions:
  - alias: Always clear Adaptive Lighting sleep mode on first morning motion
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  - alias: Relight only if the room is actually dark
    choose:
    - conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.hue_motion_sensor_4_illuminance
          below: input_number.living_room_lux_on
        - condition: template
          value_template: '{{ states(''sensor.hue_motion_sensor_4_illuminance'') in
            [''unknown'', ''unavailable''] }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.living_room_lights
        data:
          transition: 5
  mode: restart
- id: '1763519365290'
  alias: Sonos Wake Alarm
  description: '20 min before wake event: plays Lofi Sleep playlist with subliminal-start
    volume ramp (3%->20%). At wake time: classic alarm escalates every ~12s until
    in_bed turns off. Alarm sound: /config/www/alarm-clock.mp3 [2026-06-29] Top-level
    guard changed from binary_sensor.early_morning (window starts 05:30) to a dedicated
    time condition after 04:30 / before 08:00, because an earlier wake time (5:50am)
    pushed the -20min trigger onto 05:30:00 and lost a sub-second race against the
    shared early_morning sensor flipping on, so the alarm silently failed its condition.
    Dedicated guard avoids touching the 4 lighting automations that share early_morning.
    [2026-07-05] Added Phase 0 media_player.unjoin on media_player.bedroom_frame (native
    Sonos bedroom) before playback so wake audio stays solo and does not bleed into
    the grouped bathroom Era 100 and disturb Johnny; MA still plays to media_player.bedroom,
    which routes to the same now-solo speaker.'
  triggers:
  - platform: calendar
    entity_id: calendar.master_calendar
    event: start
    offset: -0:20:00
    id: wake_up_time
  conditions:
  - condition: time
    after: 04:30:00
    before: 08:00:00
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
      - condition: template
        value_template: '{% set s = trigger.calendar_event.summary | lower | trim
          %} {{ ''wake up'' in s }}

          '
      sequence:
      - alias: Phase 0 — Unjoin bedroom Sonos so wake audio stays out of the bathroom
          (Johnny)
        action: media_player.unjoin
        target:
          entity_id: media_player.bedroom_frame
        continue_on_error: true
      - alias: 'Phase 0 — Settle: let the Sonos group dissolve before playback'
        delay: 00:00:01
      - alias: Phase 1 — Set initial low volume
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.03
      - alias: Phase 1 — Play Lofi Sleep playlist shuffled
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom
        data:
          media_id: library://playlist/53
          media_type: playlist
          enqueue: replace
          radio_mode: false
        continue_on_error: true
      - wait_for_trigger:
        - trigger: state
          entity_id: media_player.bedroom
          to: playing
        timeout: 00:00:15
        continue_on_timeout: true
      - action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom
        data:
          shuffle: true
        continue_on_error: true
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.04
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.05
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.07
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.09
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.11
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.13
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.15
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.18
      - delay: 00:02:00
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.2
      - delay: 00:02:00
      - alias: Phase 2 — Skip if already out of bed
        condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      - alias: Phase 2 — Alarm escalation loop
        repeat:
          until:
          - condition: state
            entity_id: input_boolean.in_bed
            state: 'off'
          sequence:
          - action: music_assistant.play_announcement
            target:
              entity_id: media_player.bedroom
            data:
              url: http://homeassistant.local:8123/local/alarm-clock.mp3
              announce_volume: '{{ [42 + (repeat.index - 1) * 8, 100] | min | int
                }}'
              use_pre_announce: false
            continue_on_error: true
          - delay: 00:00:12
      - alias: Phase 3 — Gentle light fade-in once up
        action: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          transition: 300
    - conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - action: persistent_notification.create
        data:
          title: Alarm Skipped
          message: Skipped — you were not in bed.
    - conditions:
      - condition: state
        entity_id: binary_sensor.workday
        state: 'off'
      sequence:
      - action: persistent_notification.create
        data:
          title: Alarm Skipped
          message: Skipped — not a workday.
    - conditions:
      - condition: template
        value_template: '{% set s = trigger.calendar_event.summary | lower | trim
          %} {{ not (''wake up'' in s) }}

          '
      sequence:
      - action: persistent_notification.create
        data:
          title: Alarm Skipped
          message: Skipped — calendar event didn't include "Wake up".
  mode: single
- id: '1764645467296'
  alias: Heat the car
  description: ''
  triggers:
  - entity_id: calendar.master_calendar
    event: end
    offset: -0:13:0
    platform: calendar
  conditions:
