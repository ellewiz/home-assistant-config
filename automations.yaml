      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
        | list %}{% if dt|length > 2 %}{% set d = as_datetime(dt[2].datetime).astimezone()
        %}{% if d.date() == now().date() %}Tonight · eve{% elif d.date() == (now()+timedelta(days=1)).date()
        %}Tomorrow · {{ ''eve'' if d.weekday()<5 else ''all day'' }}{% else %}{{ d.strftime(''%a
        %-d %b'') }} · {{ ''eve'' if d.weekday()<5 else ''all day'' }}{% endif %}{%
        else %}—{% endif %}'
    action: input_text.set_value
  - target:
      entity_id: input_number.mow_forecast_score_4
    data:
      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
        | list %}{% if dt|length > 3 %}{% set p = dt[3] %}{% set wd = as_datetime(p.datetime).astimezone().date()
        %}{% set precip = p.precipitation_probability|int(0) %}{% set cond = p.condition|lower
        %}{% set temp = p.temperature|float(70) %}{% set wind = p.wind_speed|float(0)
        %}{% if ''lightning'' in cond or ''thunderstorm'' in cond or ''hail'' in cond
        or ''pouring'' in cond or precip>=75 %}{{ 0 }}{% else %}{% set r = 30 if precip<10
        else (23 if precip<25 else (14 if precip<40 else (6 if precip<60 else 2)))
        %}{% set c = 18 if cond==''sunny'' else (16 if cond==''partlycloudy'' else
        (13 if cond==''cloudy'' else (4 if ''rain'' in cond or cond==''drizzle'' else
        14))) %}{% set t = 22 if temp>=62 and temp<=85 else (16 if (temp>=55 and temp<62)
        or (temp>85 and temp<=90) else (9 if (temp>=45 and temp<55) or (temp>90 and
        temp<=95) else (3 if temp>=35 else 0))) %}{% set tf = state_attr(''sensor.kleenex_pollen_radar_ewing_trees'',''forecast'')
        or [] %}{% set gf = state_attr(''sensor.kleenex_pollen_radar_ewing_grass'',''forecast'')
        or [] %}{% set wf = state_attr(''sensor.kleenex_pollen_radar_ewing_weeds'',''forecast'')
        or [] %}{% set tvl = tf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set gvl = gf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set wvl = wf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set tv = tvl[0] if tvl|length else states(''sensor.kleenex_pollen_radar_ewing_trees'')|float(0)
        %}{% set gv = gvl[0] if gvl|length else states(''sensor.kleenex_pollen_radar_ewing_grass'')|float(0)
        %}{% set wv = wvl[0] if wvl|length else states(''sensor.kleenex_pollen_radar_ewing_weeds'')|float(0)
        %}{% set C = tv + gv + wv %}{% set pp = 0 if C<50 else (6 if C<75 else (16
        if C<120 else (28 if C<150 else (40 if C<200 else 50)))) %}{% set pp = pp
        + (8 if gv>=60 else (4 if gv>=40 else 0)) %}{% set pp = [pp,55]|min %}{% set
        wstd = 0 if wind<12 else (3 if wind<18 else 6) %}{% set wint = 0 if C<75 else
        [((([wind-8,0]|max)*(0.8 if C>=150 else 0.4))|round(0)|int),20]|min %}{% set
        af = state_attr(''sensor.air_quality_daily_forecast'',''forecast'') or []
        %}{% set avl = af|selectattr(''date'',''equalto'',wd|string)|map(attribute=''aqi'')|list
        %}{% set aq = avl[0] if avl|length else states(''sensor.air_quality_us_aqi'')|int(0)
        %}{% set aqp = 0 if aq<=50 else (4 if aq<=75 else (10 if aq<=100 else (25
        if aq<=150 else (45 if aq<=200 else 100)))) %}{{ [100,[0, r+c+t+30-pp-wstd-wint-aqp]|max]|min
        }}{% endif %}{% else %}{{ 0 }}{% endif %}'
    action: input_number.set_value
  - target:
      entity_id: input_text.mow_forecast_label_4
    data:
      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
        | list %}{% if dt|length > 3 %}{% set d = as_datetime(dt[3].datetime).astimezone()
        %}{% if d.date() == now().date() %}Tonight · eve{% elif d.date() == (now()+timedelta(days=1)).date()
        %}Tomorrow · {{ ''eve'' if d.weekday()<5 else ''all day'' }}{% else %}{{ d.strftime(''%a
        %-d %b'') }} · {{ ''eve'' if d.weekday()<5 else ''all day'' }}{% endif %}{%
        else %}—{% endif %}'
    action: input_text.set_value
  mode: single
- id: garbage_night_before_reminder
  alias: Garbage — Night-Before Reminder
  description: 'v3: Converted to the ellewiz/trash_reminder blueprint (Jun 2026).
    Garbage and Recycling both live in calendar.garbage (Garbage = weekly Wednesdays);
    the blueprint''s keyword filter restricts this instance to Garbage events only,
    leaving Recycling to its sibling instance to avoid double notifications. Logic,
    -4h offset, and calendar.vacation gate are unchanged from v2 — only the implementation
    moved into the shared blueprint.'
  use_blueprint:
    path: ellewiz/trash_reminder.yaml
    input:
      bin_calendar: calendar.garbage
      match_keyword: garbage
      lead_offset: '-4:00:00'
      alert_title: "\U0001F5D1️ Bins out tonight"
      action_phrase: put the cans out tonight
- id: garbage_recycling_night_before_reminder
  alias: Recycling — Night-Before Reminder
  description: 'v2: Converted to the ellewiz/trash_reminder blueprint (Jun 2026).
    Recycling is an every-other-Tuesday all-day event living in calendar.garbage (first
    occurrence 2026-06-09); the calendar''s rrule handles the biweekly cadence. The
    blueprint''s keyword filter restricts this instance to Recycling events only —
    its sibling (garbage_night_before_reminder) handles Garbage. Logic and gating
    unchanged from v1.'
  use_blueprint:
    path: ellewiz/trash_reminder.yaml
    input:
      bin_calendar: calendar.garbage
      match_keyword: recycling
      lead_offset: '-4:00:00'
      alert_title: ♻️ Recycling out tonight
      action_phrase: put the recycling out tonight
- id: '1780365192484'
  alias: 'Alert: Core Heartbeat (dead-man''s switch)'
  description: 'Dead-man''s switch for HA Core. Pings Healthchecks.io every 5 min
    via rest_command.core_heartbeat (defined in packages/core_heartbeat.yaml, URL
    in secrets.yaml as healthchecks_core_heartbeat_url). When Core or the whole box
    dies, the pings stop and Healthchecks alerts Lara from outside the box after ~15
    min (check Period 10m + Grace 5m). This exists because HA cannot notify about
    its own death (the 2026-06-01 SIGBUS outage sent no alert). Ungated on purpose:
    must run even during calendar.vacation, like security/fridge automations. Also
    fires once on HA start so a fresh boot pings immediately. max_exceeded:silent
    keeps the log quiet on the high-frequency time trigger.'
  triggers:
  - trigger: time_pattern
    minutes: /5
    id: heartbeat_tick
  - trigger: homeassistant
    event: start
    id: ha_started
  conditions: []
  actions:
  - action: rest_command.core_heartbeat
    alias: Ping Healthchecks.io dead-man's switch
  mode: single
  max_exceeded: silent
- id: '1780396731256'
  alias: Log - Good Night Johnny button press
  description: Durable press log for the office Lumi button. Fires on every short-press
    (same trigger as Good night Johnny), independent of the music condition. Increments
    a lifetime counter, a vacation-only counter, stamps the last-press time, and writes
    a logbook entry tagged with vacation state. Created to make 'was it pressed during
    vacation' answerable beyond recorder retention.
  triggers:
  - platform: device
    device_id: c8bb0b9a688e58d28beaf2e26ee12b21
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
  actions:
  - action: counter.increment
    target:
      entity_id: counter.good_night_johnny_presses
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.good_night_johnny_last_press
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: calendar.vacation
        state: 'on'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.good_night_johnny_presses_vacation
      - action: logbook.log
        data:
          name: Good night Johnny button
          message: pressed while vacation was ON
          entity_id: automation.good_night_johnny
    default:
    - action: logbook.log
      data:
        name: Good night Johnny button
        message: pressed (vacation off)
        entity_id: automation.good_night_johnny
  mode: queued
  max: 10
- id: '1780656091166'
  alias: 'Oura: Flag sleep note pending on data sync'
  description: 'Raises input_boolean.oura_note_pending when the Oura Ring nightly
    data syncs each morning, so the Cowork scheduled task ''oura-daily-sleep-note''
    (polls the flag every 30 min from 6am) can gate cheaply: flag off = exit in one
    call; flag on = write the iCloud Markdown sleep report then turn the flag off.
    Triggers on EITHER sleep_score OR bedtime_end changing to a valid value. 2026-07-10
    fix: bedtime_end was added because the original sleep_score-only trigger silently
    missed mornings where last night''s score equaled the prior night''s (90 == 90
    on Jul 10); an identical value is not a state change in HA, so the flag never
    rose and no report was written. bedtime_end (the wake timestamp) differs every
    night, so it fires reliably on each sync. Either trigger raising the flag is safe
    (idempotent turn_on, mode single); the task''s own file-exists and freshness guards
    prevent duplicate reports. Not gated on calendar.vacation: the note is harmless
    while away and sleep data still syncs.'
  triggers:
  - entity_id: sensor.oura_ring_sleep_score
    not_to:
    - unknown
    - unavailable
    platform: state
  - platform: state
    entity_id: sensor.oura_ring_bedtime_end
    not_to:
    - unknown
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''unknown'', ''unavailable'',
      ''none'', ''''] }}'
  actions:
  - alias: Raise the pending flag for the Cowork sleep-note task
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.oura_note_pending
  mode: single
- id: bedroom_lights_off_manager
  alias: Bedroom — Lights Off (Motion Clear / Bright / In Bed / Retry)
  description: 'Companion to ''Bedroom — Motion Lights (v2)''. Standalone turn-off
    so bedroom lights go off no matter how they were turned on (motion automation,
    in_bed wake automation''s Energize scene, Hue button/app). Created after 2026-06-04
    incident: lights came on at 06:26 via the wake automation, the motion automation''s
    lux condition failed (room already bright), and its in-run wait never armed —
    lights stayed on 16h. Branches: (1) motion clear 3 min — primary off path; (2)
    lux above bedroom_lux_off_threshold for 2 min, gated on sun above_horizon so the
    lights'' own output can''t self-trigger an off at night; (3) in_bed turns on —
    lights out for sleep. Stateless triggers survive reloads/restarts, unlike the
    old wait_for_trigger design. Note: wake-alarm light fade-in is safe — motion_clear
    needs a fresh off-transition and the bright path needs a daylight lux crossing.
    2026-06-07 retry branch added after incident #3: bedside_2 dropped off the Hue
    bridge 2s before the 07:26 turn_off, missed the command, rejoined reporting ''on''
    and stayed lit ~2.7h (motion_clear needs a fresh transition, bright needs a lux
    crossing — no recovery path). New trigger ''rejoined'': a bedside bulb returns
    from unavailable to ''on''; if motion has been clear >=3 min, re-send turn_off.
    Top-level on-condition relaxed to OR trigger.id==''rejoined'' because the group
    state can lag the member rejoin by milliseconds. Root cause is Zigbee interference
    (see ''Alert: Zigbee Flapping Watchdog''); this branch is resilience, keep it
    after the channel fix.'
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    to: 'off'
    for: 00:03:00
    id: motion_clear
    platform: state
  - entity_id: sensor.hue_motion_sensor_2_light_level
    above: input_number.bedroom_lux_off_threshold
    for: 00:02:00
    id: bright
    platform: numeric_state
  - entity_id: input_boolean.in_bed
    from: 'off'
    to: 'on'
    id: in_bed
    platform: state
  - platform: state
    entity_id:
    - light.bedside_1
    - light.bedside_2
    from: unavailable
    to: 'on'
    id: rejoined
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.bedroom_lights
      state: 'on'
    - condition: template
      value_template: '{{ trigger.id == ''rejoined'' }}'
  actions:
  - choose:
    - alias: No motion for 3 min — turn off
      conditions:
      - condition: trigger
        id: motion_clear
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Room bright in daylight — turn off
      conditions:
      - condition: trigger
        id: bright
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Got in bed — turn off
      conditions:
      - condition: trigger
        id: in_bed
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
    - alias: Bulb rejoined bridge reporting on, no motion — retry off
      conditions:
      - condition: trigger
        id: rejoined
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        state: 'off'
        for: 00:03:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
        data:
          transition: 1
  mode: single
  max_exceeded: silent
- id: '1780845090681'
  alias: 'Alert: Zigbee Flapping Watchdog'
  description: 'Counts Hue bulb unavailable-dropouts across the five individual bulbs
    (bedside_1, bedside_2, corner, end table, torchiere) into counter.zigbee_flap_events,
    reset hourly by ''Zigbee Flap Watchdog — Resets''. Pushes ONE iPhone alert per
    day (guard: input_boolean.zigbee_flap_alerted_today, reset 4am) when drops reach
    6 in an hour. Created 2026-06-07 after interference flapping (started ~Jun 5,
    bedside_2 + corner ~65 drops each/48h) made bedside_2 miss a turn_off command
    and stay lit 2.7h. Purpose: confirm whether the Hue Zigbee channel change works,
    and catch recurrence. Healthy baseline is ~0 drops/hour, so threshold 6 is generous.
    Known caveat: an HA restart can briefly mark all bulbs unavailable and add up
    to 5 counts in that hour — below threshold by design. Not gated on calendar.vacation
    (infrastructure alert). v1: if too chatty or not granular enough, v2 could track
    per-bulb counters.'
  triggers:
  - trigger: state
    entity_id:
    - light.bedside_1
    - light.bedside_2
    - light.living_room_corner
    - light.next_to_couch
    - light.torchiere
    to: unavailable
    not_from: unknown
  actions:
  - alias: Count the dropout
    action: counter.increment
    target:
      entity_id: counter.zigbee_flap_events
  - alias: Alert once per day when threshold crossed
    choose:
    - conditions:
      - condition: numeric_state
        entity_id: counter.zigbee_flap_events
        above: 5
      - condition: state
        entity_id: input_boolean.zigbee_flap_alerted_today
        state: 'off'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Zigbee Flapping
          message: '{{ states(''counter.zigbee_flap_events'') }} Hue bulb dropouts
            in the past hour (latest: {{ trigger.to_state.attributes.friendly_name
            | default(trigger.entity_id) }}). Interference is still active — bulbs
            may miss commands.'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zigbee_flap_alerted_today
  mode: queued
  max: 10
  max_exceeded: silent
- id: '1780845094126'
  alias: Zigbee Flap Watchdog — Resets
  description: 'Housekeeping for ''Alert: Zigbee Flapping Watchdog''. Hourly: resets
    counter.zigbee_flap_events so the threshold means drops-per-hour. At the 04:00
    run, also clears input_boolean.zigbee_flap_alerted_today so the watchdog can alert
    again the next day (matches the Health Tags 4am reset convention).'
  triggers:
  - minutes: 0
    platform: time_pattern
  actions:
  - alias: Hourly counter reset
    action: counter.reset
    target:
      entity_id: counter.zigbee_flap_events
  - alias: 4am — re-arm the daily alert guard
    choose:
    - conditions:
      - condition: time
        after: 03:59:30
        before: 04:59:30
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.zigbee_flap_alerted_today
  mode: single
- id: movie_lamp_observer_snapshot_log
  alias: Living Room — Movie Lamp Observer
  description: '⚠️ ARCHIVED 2026-08-08 — the Roku TV was physically removed. The ''Roku:
    {{ states(...) }}'' field in both logbook snapshot messages will just read ''unavailable''
    going forward — harmless, purely diagnostic. When a new TV is set up, swap media_player.55_tcl_roku_tv
    for its entity_id in both templates if you want that field meaningful again. Label:
    TV Replacement Pending.


    Diagnostic logging for the Movie Lamp Dimmer/Restore v2 automations (Frndly blind-spot
    validation, added 2026-06-07). Whenever either automation fires, write a logbook
    entry snapshotting the decision inputs at trigger time: ATV state + app_id, Living
    room TV plug watts, Roku source, Arc state, and lamp state/brightness. Lamp brightness
    reflects the state BEFORE the fired automation''s action completes — that''s intentional
    (we want the inputs, not the outcome). Added 2026-06-08: a /5-minute periodic_sample
    trigger that logs lamp brightness only while the lamp is on, after sunset, and
    under AL manual_control (proxy for movie-dim active) — this fills the gap where
    brightness isn''t recorded and the snapshot only samples on automation fires,
    so we can confirm the 20% dim holds steady across a Frndly evening. Same durable-logging
    pattern as the Good Night Johnny button. Remove once the v2 logic is proven out.
    | 2026-08-10: TCL TV plug renamed to Living room TV; both snapshot templates now
    read sensor.living_room_tv_current_consumption.'
  triggers:
  - event_type: automation_triggered
    event_data:
      entity_id: automation.living_room_movie_lamp_dimmer
    id: dimmer_fired
    platform: event
  - event_type: automation_triggered
    event_data:
      entity_id: automation.living_room_movie_lamp_restore
    id: restore_fired
    platform: event
  - platform: time_pattern
    minutes: /5
    id: periodic_sample
  conditions: []
  actions:
  - choose:
    - alias: Automation-fired snapshot of decision inputs
      conditions:
      - condition: template
        value_template: '{{ trigger.id in [''dimmer_fired'', ''restore_fired''] }}'
      sequence:
      - alias: Write snapshot of decision inputs to logbook
        action: logbook.log
        data:
          name: Movie Lamp Observer
          entity_id: light.next_to_couch
          message: '{{ trigger.event.data.name }} fired | ATV: {{ states(''media_player.living_room_4k_2'')
            }} (app: {{ state_attr(''media_player.living_room_4k_2'', ''app_id'')
            or ''none'' }}) | TV plug: {{ states(''sensor.living_room_tv_current_consumption'')
            }} W | Roku: {{ states(''media_player.55_tcl_roku_tv'') }}/{{ state_attr(''media_player.55_tcl_roku_tv'',
            ''source'') or ''n/a'' }} | Arc: {{ states(''media_player.living_room_arc'')
            }} | Lamp before: {{ states(''light.next_to_couch'') }}{% if is_state(''light.next_to_couch'',
            ''on'') %} @ {{ ((state_attr(''light.next_to_couch'', ''brightness'')
            or 0) / 2.55) | round }}%{% endif %}'
    - alias: Periodic brightness sample during movie-dim window
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''periodic_sample'' }}'
      - condition: state
        entity_id: light.next_to_couch
        state: 'on'
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: template
        value_template: '{{ ''light.next_to_couch'' in (state_attr(''switch.adaptive_lighting_living_room_lights'',
          ''manual_control'') or []) }}'
      sequence:
      - alias: Write periodic brightness sample to logbook
        action: logbook.log
        data:
          name: Movie Lamp Observer
          entity_id: light.next_to_couch
          message: 'Periodic dim sample | Lamp: {{ states(''light.next_to_couch'')
            }}{% if is_state(''light.next_to_couch'', ''on'') %} @ {{ ((state_attr(''light.next_to_couch'',
            ''brightness'') or 0) / 2.55) | round }}%{% endif %} | ATV: {{ states(''media_player.living_room_4k_2'')
            }} (app: {{ state_attr(''media_player.living_room_4k_2'', ''app_id'')
            or ''none'' }}) | TV plug: {{ states(''sensor.living_room_tv_current_consumption'')
            }} W | Roku: {{ states(''media_player.55_tcl_roku_tv'') }}/{{ state_attr(''media_player.55_tcl_roku_tv'',
            ''source'') or ''n/a'' }} | Arc: {{ states(''media_player.living_room_arc'')
            }}'
  mode: queued
  max: 10
- id: '1781031863269'
  alias: Living Room — Corner Lamp Dropout Logger
  description: 'Logs every time light.living_room_corner drops off the Hue bridge
    and when it recovers, to build a dropout count for deciding whether to replace
    the bulb. Context: after the ch.25 change on 2026-06-07 fixed bedside_2 / end-table
    / etc., the corner lamp is the lone remaining flapper (suspected bulb-specific
    or local interferer). Increments counter.corner_lamp_unavailable_count on each
    drop, stamps input_datetime.corner_lamp_last_unavailable / _last_recovered, and
    writes logbook entries including downtime on recovery. not_from: unknown filters
    HA-restart init noise so restarts aren''t miscounted as dropouts. TODO: if the
    count climbs over ~a week, replace the bulb and retire this logger.'
  triggers:
  - trigger: state
    entity_id: light.living_room_corner
    to: unavailable
    not_from:
    - unknown
    id: went_unavailable
  - trigger: state
    entity_id: light.living_room_corner
    from: unavailable
    not_to:
    - unknown
    - unavailable
    id: recovered
  actions:
  - choose:
    - alias: Drop — count it, stamp the time, log it
      conditions:
      - condition: trigger
        id: went_unavailable
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.corner_lamp_unavailable_count
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.corner_lamp_last_unavailable
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: logbook.log
        data:
          name: Corner Lamp
          message: 'dropped off the Hue bridge (unavailable). Drop #{{ states(''counter.corner_lamp_unavailable_count'')
            }} since logging began.'
          entity_id: light.living_room_corner
    - alias: Recovery — stamp the time, log downtime
      conditions:
      - condition: trigger
        id: recovered
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.corner_lamp_last_recovered
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: logbook.log
        data:
          name: Corner Lamp
          message: recovered to '{{ trigger.to_state.state }}' after {% set ts = state_attr('input_datetime.corner_lamp_last_unavailable','timestamp')
            %}{% if ts %}{{ ((as_timestamp(now()) - ts) / 60) | round(1) }} min{%
            else %}unknown{% endif %} of downtime.
          entity_id: light.living_room_corner
  mode: queued
  max: 10
- id: '1781291786499'
  alias: Living Room — Ambient Logger (Flap Metrics)
  description: 'Durable measurement logger for the Living Room Ambient Manager''s
    anti-flap rework (2026-06-12). On every light.living_room_lights on/off transition
    it writes a logbook entry capturing dwell time in the prior state plus the decision
    inputs at that moment: smoothed lux (sensor.living_room_illuminance_smoothed),
    raw Hue lux, living-room motion, and whether the change was auto or manual (context.user_id).
    A ''flap'' = lights going on->off after fewer than 25 min on (the behavior the
    25-min guard + smoothing + widened band are meant to kill); each flap increments
    counter.living_room_light_flaps and stamps input_datetime.living_room_light_last_flap.
    At 04:00 it logs the 24h flap tally and resets the counter, building a day-by-day
    series. not_from/not_to unknown+unavailable filters HA-restart and Zigbee-dropout
    noise. The transition branch also guards trigger.from_state is not none, because
    a light-group rebuild on reload_all can fire a state event with no prior state
    object (None, which not_from cannot catch) and that used to raise a ''None has
    no attribute last_changed'' template error. Same durable-logging pattern as the
    Corner Lamp Dropout Logger; retire once the fix is proven steady.'
  triggers:
  - id: transition
    entity_id: light.living_room_lights
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    platform: state
  - id: daily_reset
    at: 04:00:00
    platform: time
  actions:
  - choose:
    - alias: Log every transition with dwell + decision inputs
      conditions:
      - condition: trigger
        id: transition
      - condition: template
        value_template: '{{ trigger.from_state is not none and trigger.to_state is
          not none }}'
      sequence:
      - action: logbook.log
        data:
          name: LR Ambient Logger
          entity_id: light.living_room_lights
          message: now {{ trigger.to_state.state }} (was {{ trigger.from_state.state
            }} for {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()/60)|round(1)
            }} min) | smoothed {{ states('sensor.living_room_illuminance_smoothed')
            }} lx / raw {{ states('sensor.hue_motion_sensor_4_illuminance') }} lx
            | motion {{ states('binary_sensor.hue_motion_sensor_4_motion') }} | presence
            {{ states('binary_sensor.living_room_presence') }} | {{ 'manual' if trigger.to_state.context.user_id
            else 'auto' }}
      - alias: Count it as a flap if lights were on under 25 min
        choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.from_state.state == ''on'' and trigger.to_state.state
              == ''off'' and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
              < 1500 }}'
          sequence:
          - action: counter.increment
            target:
              entity_id: counter.living_room_light_flaps
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.living_room_light_last_flap
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          - action: logbook.log
            data:
              name: LR Ambient Logger
              entity_id: light.living_room_lights
              message: 'FLAP #{{ states(''counter.living_room_light_flaps'') }}: lights
                went off after only {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()/60)|round(1)
                }} min on.'
    - alias: Daily 4am — log the 24h tally, then reset
      conditions:
      - condition: trigger
        id: daily_reset
      sequence:
      - action: logbook.log
        data:
          name: LR Ambient Logger
          entity_id: counter.living_room_light_flaps
          message: 'Daily summary: {{ states(''counter.living_room_light_flaps'')
            }} short on/off flaps (under 25 min) in the last 24h.'
      - action: counter.reset
        target:
          entity_id: counter.living_room_light_flaps
  mode: queued
  max: 10
  max_exceeded: silent
- id: meds_log_dose_from_button
  alias: 'Meds: Log dose from Orb button'
  description: 'Logs a medication dose when a button on the SONOFF SNZB-01M Orb (ieee
    a4:c1:38:10:9e:56:ff:ff) is pressed. Per press it: (1) increments counter.med_*_doses
    (durable -> mirrored to sensor.med_*_doses_recorded for long-term statistics,
    read by the monthly crossfactor report as a per-med factor); (2) calls the existing
    Health Tags script.log_* which checks the input_boolean.*_taken dashboard flag
    AND writes the canonical ''Health Log'' logbook entry (so a button press behaves
    identically to tapping the Oura dashboard); (3) pushes an iPhone notification
    that opens Apple Health. Button->endpoint->med map (single press): ep1=Adderall
    (1 dot, upper-left), ep2=Lexapro (2 dots, upper-right), ep3=Guanfacine (3 dots,
    lower-left), ep4=Zepbound (4 dots, lower-right). DOUBLE-press ep1 = log Adderall
    AND Lexapro together. NOTE: Adderall/Lexapro/Guanfacine no longer set an input_datetime
    (consolidated away Jun 15 2026 as redundant with the daily flag + counter). Zepbound
    has NO Health Tags boolean/script (weekly med; daily-reset model doesn''t fit),
    so its branch logs inline and keeps input_datetime.med_zepbound_last_taken for
    a ''last taken / days since'' readout, plus the counter. WHY zha_event: ZHA has
    no quirk for this new model, no per-button entity; presses fire raw zha_event
    on SONOFF cluster 64530 (0xFC52) with clean command names; filter cluster_id 64530
    to drop on_off(6)/level(8) noise. NOT vacation-gated (meds taken while traveling;
    report drops away nights). Iron not on a button. Never reset the counters (breaks
    report deltas).'
  triggers:
  - trigger: event
    event_type: zha_event
    id: adderall
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 1
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: lexapro
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 2
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: guanfacine
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 3
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: zepbound
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 4
      cluster_id: 64530
      command: single
  - trigger: event
    event_type: zha_event
    id: adderall_lexapro_combo
    event_data:
      device_ieee: a4:c1:38:10:9e:56:ff:ff
      endpoint_id: 1
      cluster_id: 64530
      command: double
  actions:
  - alias: Increment durable counter, then check dashboard flag via Health Tags script
    choose:
    - alias: Adderall + Lexapro combo (Button 1 double-press)
      conditions:
      - condition: trigger
        id: adderall_lexapro_combo
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_adderall_doses
      - action: counter.increment
        target:
          entity_id: counter.med_lexapro_doses
      - action: script.log_adderall
      - action: script.log_lexapro
    - alias: Adderall (Button 1)
      conditions:
      - condition: trigger
        id: adderall
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_adderall_doses
      - action: script.log_adderall
    - alias: Lexapro (Button 2)
      conditions:
      - condition: trigger
        id: lexapro
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_lexapro_doses
      - action: script.log_lexapro
    - alias: Guanfacine (Button 3)
      conditions:
      - condition: trigger
        id: guanfacine
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_guanfacine_doses
      - action: script.log_guanfacine
    - alias: Zepbound (Button 4) — no Health Tags flag (weekly med), keeps last-taken
        + counter
      conditions:
      - condition: trigger
        id: zepbound
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_zepbound_doses
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.med_zepbound_last_taken
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: logbook.log
        data:
          name: Health Log
          message: Zepbound taken
          entity_id: input_datetime.med_zepbound_last_taken
  - alias: Push iPhone notification that opens Apple Health
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F48A Med logged"
      message: '{{ med_label }} logged at {{ now().strftime(''%-I:%M %p'') }}. Tap
        to open Health.'
      data:
        url: x-apple-health://
        push:
          interruption-level: active
  mode: queued
  max: 10
  variables:
    med_label: '{% set m = {''adderall'':''Adderall'',''lexapro'':''Lexapro'',''guanfacine'':''Guanfacine'',''zepbound'':''Zepbound'',''adderall_lexapro_combo'':''Adderall
      + Lexapro''} %}{{ m.get(trigger.id, ''Medication'') }}'
- id: commute_airplay_interrupted_alert
  alias: 'Commute: Alert if announcement interrupts AirPlay music'
  description: 'The morning commute announcer (script.commute_time_announcer -> script.sonos_broadcast)
    snapshots, unjoins and speaks on the Sonos players, then sonos.restore. Sonos-native
    sources (Music Assistant) resume fine, but a live AirPlay stream (x-sonos-vli)
    cannot be re-pulled by sonos.restore -- it comes back paused while the phone keeps
    advancing the playlist silently. 2026-06-15: built after AirPlay music to bathroom
    + bedroom_frame died on the 6:55 announcement and never resumed. This is a guard,
    NOT a fix -- the AirPlay limitation is not solvable from HA. It just pushes a
    heads-up so the interruption is noticed instead of discovered later as silence.
    Fires when a target speaker sits paused on an AirPlay source for 20s while the
    announcer is still running. Uses a notification tag so the 5-minute announcement
    cadence updates one notification instead of stacking. Next step if this proves
    noisy: gate on a once-per-morning input_boolean reset at wake time.

    '
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - media_player.bathroom
    - media_player.bedroom_frame
    to: paused
    for: 00:00:20
  conditions:
  - condition: state
    entity_id: script.commute_time_announcer
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: "{{ 'airplay' in ((state_attr(trigger.entity_id, 'media_content_id')
      or '') | lower)\n   or ((state_attr(trigger.entity_id, 'source') or '') | lower)
      == 'airplay' }}\n"
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: "\U0001F3B5 AirPlay music paused"
      message: The commute announcement interrupted AirPlay on {{ trigger.to_state.attributes.friendly_name
        }} and Sonos can't auto-resume it. Tap play on your phone, or use Music Assistant
        for morning music so it resumes itself.
      data:
        tag: airplay_interrupted
        push:
          interruption-level: active
- id: '1782125200879'
  alias: Sonos Wake Alarm — in_bed Fallback
  description: 'Safety net for the Sonos Wake Alarm, which only proceeds if input_boolean.in_bed
    is on at trigger time. in_bed is normally set by a phone Shortcuts/companion-app
    automation when Soundcore earbuds connect; if the phone misses (e.g. Low Power
    Mode in the bedtime window, as on 2026-06-21 to 22), in_bed stays off and the
    alarm skips. At 03:30 on a workday morning, if in_bed is still off while Lara
    is home and not on vacation, this turns it on so the alarm runs and pushes a heads-up.
    Moved from a -25min calendar offset (~6:35am) to a fixed 03:30 clock trigger on
    2026-06-24: the old timing force-set in_bed on even when Lara had woken early
    and gone downstairs, so the alarm fired at 7am while she was already up. 03:30
    is reliably mid-sleep, so in_bed=off then genuinely means a missed phone trigger,
    and with her asleep and the lights already off it cannot wrongly trip bedroom_lights_off_motion_clear_bright_in_bed.
    The old calendar_event ''wake up'' template condition was dropped (a clock trigger
    has no calendar event); binary_sensor.workday already gates it to wake-alarm days.'
  triggers:
  - trigger: time
    at: 03:30:00
    id: wake_fallback
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - alias: Force in_bed on so the alarm runs
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.in_bed
  - alias: Tell Lara the phone trigger was missed
    action: notify.mobile_app_iphone
    data:
      title: Alarm fallback fired
      message: in_bed was still off this morning, so I set it on so your wake alarm
        runs. Your phone's earbud→in_bed trigger likely missed (check Low Power Mode
        / Shortcuts).
  mode: single
- id: meds_guanfacine_tv_nudge
  alias: 'Meds — Guanfacine: TV nudge until logged'
  description: '⚠️ ARCHIVED 2026-08-08 — the Roku TV was physically removed. The tv_player
    variable''s Roku fallback (''elif media_player.55_tcl_roku_tv playing'') is inert,
    so this nudge can only detect/pause/resume Apple TV playback now — anything playing
    natively on the TV''s own apps won''t get paused or auto-resumed. Lights-only
    nudge still fires regardless. When a new TV is set up: swap media_player.55_tcl_roku_tv
    for its entity_id in the tv_player template. Label: TV Replacement Pending.


    Evening nudge to take Guanfacine (resets off daily at 4am; normally logged ~9-10pm,
    so at 8:10pm it''s usually still un-logged). At 8:10pm, if Guests is off and the
    dose isn''t logged and we''re not on vacation: HOME -> immediately snapshot the
    living-room lights, pause whatever is actively playing on the TV, and raise the
    lights to 70%. AWAY at 8:10 -> wait until Lara is home AND living-room presence
    is detected, then 10 min later run the same nudge (re-checking it isn''t logged
    yet). Then HOLD (no timeout, per Lara) until input_boolean.guanfacine_taken turns
    on, at which point: restore the lights to their exact prior state, hand them back
    to Adaptive Lighting, and resume the paused player. ''Whatever is playing'' =
    Apple TV (media_player.living_room_4k_2) if playing/buffering, else TCL Roku (media_player.55_tcl_roku_tv)
    if playing, else nothing (lights-only nudge). KNOWN LIMITATION: Frndly is invisible
    to the ATV integration (sits idle, app_id '''') so it can''t be paused via HA
    — lights still brighten. mode: restart so a new evening''s 8:10 trigger supersedes
    any instance left waiting from an away night. Guests = input_boolean.guests (created
    Jun 2026). NOTE no in_bed safety-release: Lara explicitly chose hold-until-logged
    with no timeout.'
  triggers:
  - at: '20:10:00'
    id: evening_check
    platform: time
  conditions:
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.guanfacine_taken
    state: 'off'
  actions:
  - alias: If away at 8:10, wait for return + living-room presence, then settle 10
      min
    choose:
    - alias: Away path
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: person.lara_wiz
          state: home
      sequence:
      - alias: Wait until home AND living-room presence detected
        wait_template: '{{ is_state(''person.lara_wiz'', ''home'') and is_state(''binary_sensor.living_room_presence'',
          ''on'') }}'
      - alias: Settle 10 minutes after arriving in the living room
        delay: 00:10:00
  - alias: Re-gate after any waiting (logged during the wait? guests arrived? left
      again?)
    condition: state
    entity_id: input_boolean.guanfacine_taken
    state: 'off'
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - alias: Capture which player is actively playing (for pause + later resume)
    variables:
      tv_player: '{% if states(''media_player.living_room_4k_2'') in [''playing'',
        ''buffering''] %}media_player.living_room_4k_2{% elif states(''media_player.55_tcl_roku_tv'')
        == ''playing'' %}media_player.55_tcl_roku_tv{% else %}none{% endif %}'
  - alias: Snapshot the living-room lights so we can restore them exactly
    action: scene.create
    data:
      scene_id: guanfacine_nudge_restore
      snapshot_entities:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
  - alias: Pause the TV if something is actively playing
    if:
    - condition: template
      value_template: '{{ tv_player != ''none'' }}'
    then:
    - action: media_player.media_pause
      target:
        entity_id: '{{ tv_player }}'
  - alias: Brighten the living-room lights to 70%
    action: light.turn_on
    target:
      entity_id: light.living_room_lights
    data:
      brightness_pct: 70
      transition: 2
  - alias: Tell Lara why the TV paused
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F48A Guanfacine"
      message: TV paused and lights up until you log tonight's dose.
  - alias: Hold until the dose is logged (no timeout, per Lara)
    wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.guanfacine_taken
      to: 'on'
  - alias: Restore the living-room lights exactly as they were
    action: scene.turn_on
    target:
      entity_id: scene.guanfacine_nudge_restore
    data:
      transition: 2
  - alias: Hand the lights back to Adaptive Lighting
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      lights:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
      manual_control: false
  - alias: Resume the player we paused
    if:
    - condition: template
      value_template: '{{ tv_player != ''none'' }}'
    then:
    - alias: Grace period so Lara is back in the room before audio resumes
      delay: 00:00:15
    - action: media_player.media_play
      target:
        entity_id: '{{ tv_player }}'
  mode: restart
- id: living_room_tv_event_lighting_backstop
  alias: Living Room — TV Event Lighting Backstop (Arrive-Home Re-fire)
  description: 'Backstop for TV Event Reminder, which fires 15 min BEFORE a calendar.tv
    event and requires person.lara_wiz to be home. If Lara arrives home after that
    -0:15 pre-roll (e.g. 2026-07-01: home 7:56pm for an 8:00pm event, pre-roll fired
    7:45pm while she was still out and bailed on failed_conditions), the Movie scene
    never gets applied and there is no re-check. This re-fires the same lighting setup
    when she gets home while a TV event is ALREADY active. Guard: only runs while
    switch.adaptive_lighting_living_room_lights is still ON (proxy for ''TV setup
    not yet applied'') so a GPS home/not_home bounce mid-event can''t re-apply the
    scene or re-notify. Gated on calendar.tv active + in_bed off + calendar.vacation
    off. Does NOT announce over Sonos (she is presumably about to watch) and does
    NOT pause the TV, unlike the pre-roll reminder — this is purely the lighting catch-up.
    Cleanup (resume AL, re-enable the 4 nightly automations, re-arm sleep mode) is
    still handled by TV Event Over on calendar.tv event end. 2026-07-13: arrival trigger
    filters unknown/unavailable so a tracker blip or HA restart walking unknown->home
    can''t count as an arrival.'
  triggers:
  - platform: state
    entity_id: person.lara_wiz
    to: home
    for:
      seconds: 20
    not_from:
    - unknown
    - unavailable
  conditions:
  - condition: state
    entity_id: calendar.tv
    state: 'on'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - alias: Only if the TV lighting setup hasn't already been applied (AL still adapting)
    condition: state
    entity_id: switch.adaptive_lighting_living_room_lights
    state: 'on'
  actions:
  - alias: Apply the Movie scene
    action: scene.turn_on
    data:
      transition: 10
    target:
      entity_id: scene.living_room_movies_2
  - alias: Pause Adaptive Lighting so its 90s re-adapt cannot override the Movie scene
      during the event
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - alias: Stand down the nightly automations that would fight the scene (TV Event
      Over re-enables them)
    action: automation.turn_off
    data:
      stop_actions: true
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
  - alias: Let Lara know the catch-up fired
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F4FA TV Event Lighting"
      message: You got home after the 7:45 pre-roll, so I applied the Movie scene{%
        if state_attr('calendar.tv','message') %} for "{{ state_attr('calendar.tv','message')
        }}"{% endif %}.
  mode: single
- id: living_room_late_night_sleep_dim
  alias: Living Room — Late-Night Sleep Dim (v1)
  description: 'Puts the living room''s Adaptive Lighting into sleep mode at night
    so AL''s target drops to a dim warm level (~10% / 2200K) instead of the ~33% evening
    baseline. Fixes the ''lamps snap bright after a movie ends'' case: Movie Lamp
    Restore (v2) hands the End table lamp back to AL via set_manual_control:false
    and AL immediately re-applies its curve — with sleep mode on, that target is the
    dim night level, so the hand-back lands dim. ADAPTIVE TIMING: arms at 21:00 on
    work nights (input_boolean.workday_tomorrow on) and 22:00 on non-work nights,
    because Lara is often in bed before 22:00 on work nights so a fixed 22:00 arm
    was too late. GATES (arm branch only): calendar.vacation off, person.lara_wiz
    home, input_boolean.guests off — don''t force the LR dim while away or when guests
    may be using the room. Releases at 05:30 (ungated) so daytime AL always resumes.
    Order: enable sleep mode FIRST, then re-apply sleep_brightness/sleep_color_temp
    via change_switch_settings, so on-lights only ever dim (never a brighten flash)
    and the sleep values self-heal after a restart resets them to the 1%/1000K default.
    turn_on_lights:false so it never wakes dark lamps. TODO v2: single time-trigger
    means arriving home after the arm time misses that night; if the 21:00/22:00 clock
    proves too blunt, switch to an event-driven arm on evening TV-off (Apple TV playing→idle
    after a cutoff hour); reconcile with script.shut_down_bedtime. [2026-07-06] Removed
    turn_on_lights:false from the change_switch_settings call: it is not an accepted
    key on this Adaptive Lighting version, so it raised ''extra keys not allowed''
    and aborted this self-heal step every night (sleep_brightness/sleep_color_temp
    were never applied). Enabling sleep mode alone never turns on already-off lamps,
    so the no-wake-dark-lamps behavior is unchanged.'
  triggers:
  - at: '21:00:00'
    id: night_start_work
    platform: time
  - at: '22:00:00'
    id: night_start_reg
    platform: time
  - at: 05:30:00
    id: night_end
    platform: time
  conditions: []
  actions:
  - choose:
    - alias: Arm sleep-dim (21:00 work nights / 22:00 otherwise; home, no guests,
        not away)
      conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: night_start_work
          - condition: state
            entity_id: input_boolean.workday_tomorrow
            state: 'on'
        - condition: and
          conditions:
          - condition: trigger
            id: night_start_reg
          - condition: state
            entity_id: input_boolean.workday_tomorrow
            state: 'off'
      - condition: state
        entity_id: calendar.vacation
        state: 'off'
      - condition: state
        entity_id: person.lara_wiz
        state: home
      - condition: state
        entity_id: input_boolean.guests
        state: 'off'
      sequence:
      - alias: Enable AL sleep mode for the living room
        action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
      - alias: Set LR AL sleep level to ~10% warm (self-heal against restart)
        action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          sleep_brightness: 10
          sleep_color_temp: 2200
    - alias: Release sleep-dim at 05:30 (always, so daytime AL resumes)
      conditions:
      - condition: trigger
        id: night_end
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  mode: single
- id: bedroom_heat_alert_v2
  alias: Bedroom — Heat Alert (v8, Gate Matches the 76F Daytime Hold)
  description: 'v2 consolidating "Bedroom temp too hot" (id 1654570339244) and "Bedroom
    too hot when Lara comes home" (id 1691671531217), both deleted 2026-07-13 (superseded).
    Two branches: sustained warm (>75F for 15 min while home and awake, not at work)
    and arrival-home hot (>78F). calendar.vacation gate per house style section 8.
    Anti-spam: 3h guard via input_datetime.bedroom_heat_last_alerted, stamped ONLY
    when a notification actually sends. (2026-07-13: was this.attributes.last_triggered,
    which updates on every conditions-passing run including no-op arrivals, so an
    ordinary arrival re-armed the 3h suppression and could swallow a real sustained-warm
    alert.) Arrival trigger filters unknown/unavailable so tracker blips don''t count
    as arrivals. Alert-only: no controllable bedroom AC exists yet (Kasa plug pending)
    - upgrade to actually cool when installed. Installed at Lara''s request.


    2026-08-11 (v3): climate.bedroom_ac now exists (Midea integration added). Added
    an actual cooling action to both branches alongside the existing push notification
    - forces hvac_mode cool + preset boost on climate.bedroom_ac, fulfilling the v1/v2
    TODO ("Alert-only... upgrade to actually cool when installed"). Safe against the
    AC Sweet-Spot bedtime automation: both branches here already require input_boolean.in_bed
    == off, and the sweet-spot automation only touches the AC when in_bed turns on,
    so the two can never fire at the same time.


    2026-08-11 (v4): the cooling actions are now wrapped in an availability check
    on climate.bedroom_ac, with an else-branch that logs the miss. WHY: on 2026-08-10
    the bedroom AC went unavailable at 22:38 and HA''s climate services returned WITHOUT
    error against the dead entity, so automations reported success while nothing reached
    the unit. This automation is deliberately NOT guarded at the top level like the
    other three bedroom-AC automations - the push notification must still fire when
    the room is hot and the AC is unreachable, since that is exactly when Lara most
    needs to know. Only the climate calls are conditional.


    2026-08-12 (v5, BUGFIX, found proactively after fixing the same pattern in the
    away-eco automation): both branches called climate.set_hvac_mode (cool) THEN climate.set_preset_mode
    (boost), in that order. Confirmed via the away-eco incident earlier the same day
    that calling set_hvac_mode resets preset_mode back to ''none'' as a side effect
    on this Midea integration - so ''boost'' was being silently wiped immediately
    after being set, every single time this automation cooled the room. Not as severe
    as the away-eco bug (the unit still ends up cooling in plain Cool/none, which
    is closer to full-power than a no-op), but it was never actually delivering the
    ''boost for faster recovery'' behavior the automation''s own log/alias claimed.
    Reordered both branches so set_hvac_mode runs first and set_preset_mode runs last,
    matching the fix pattern in [[project_midea_ac_integration]]. NOT yet live-fire
    tested against a real heat event post-fix - worth confirming preset_mode actually
    reads ''boost'' next time either branch triggers.


    **v5 IS NOW VERIFIED (2026-08-15 18:51).** The sustained_warm branch fired for
    real and climate.bedroom_ac read back preset_mode ''boost'' three seconds later.
    The ordering fix works end to end. That open question from 2026-08-12 is closed.


    2026-08-13: added 3-second delays between adjacent climate.* calls. These Midea
    entities garble rapid-fire sequential commands - confirmed live on climate.living_room_ac,
    where this automation family''s no-delay sequence (hvac_mode -> preset none ->
    temperature) landed at 08:00:00 and left the unit reading preset ''eco'' instead
    of the ''none'' it had just been set to, while the same three calls issued manually
    with several seconds between them all stuck correctly. Same session also confirmed
    the separate, worse ''away'' preset bug - see the away-eco automation''s v4 note.


    v7 (2026-08-13): added a condition that skips the whole automation when climate.bedroom_ac''s
    own target is 77F or higher. Introduced because the same day''s WFH warm setback
    parks the bedroom at 78F while Lara is home, which sits permanently above this
    automation''s 75F trigger - so it would have pushed a spurious ''bedroom warm''
    alert every 3h on every WFH day AND forced preset boost each time, undoing the
    setback.


    v8 (2026-08-15 evening): the v7 gate was ''target < 77'', which did NOT cover
    a deliberate 76F hold. Changed to ''target < 76''. WHY, from a real firing: at
    18:51 on 2026-08-15 this automation alerted and forced boost while the bedroom
    dial sat at a deliberate 76F - the daytime number Lara asked for. sensor.temp_in_bedroom
    crossed 75 at 18:36:16 and the 15-minute trigger fired at 18:51:16. The alert
    was pure noise: the unit''s own thermometer read 74 against a 76 target, so it
    already believed itself satisfied and ''boost'' had nothing to do. The 76F daytime
    hold is the number Lara chose (75 is unsettable on these units - see the night
    setpoint manager''s notes), so the gate must sit AT it, not one degree above.
    Alerts still fire for anything genuinely warmer than her own setting, and the
    WFH 78F and empty-house 80F setbacks stay suppressed exactly as before.


    The float(70) default is deliberate and unchanged: an unreachable unit returns
    None, defaults to 70, passes the condition, and still alerts. If we cannot tell,
    alert.


    STILL OPEN: this automation''s boost action fights whatever else owns the dial.
    ''Bedroom AC - Night Setpoint Manager (v2)'' now clears a rogue preset, but only
    inside its evening-ramp and in-bed windows, deliberately, so a genuine daytime
    boost is left alone. If boost ever proves it does not actually cool (it did not
    on 2026-08-15, because the unit thought it was satisfied), consider dropping the
    climate calls and making this notify-only. Lara was offered that on 2026-08-15
    and chose to keep the cooling action for now.'
  triggers:
  - above: 75
    entity_id: sensor.temp_in_bedroom
    for: 00:15:00
    id: sustained_warm
    trigger: numeric_state
  - entity_id: person.lara_wiz
    id: arrived_home
    not_from:
    - unknown
    - unavailable
    to: home
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - alias: Re-alert at most once every 3h (stamped only on real sends)
    condition: template
    value_template: '{{ not has_value(''input_datetime.bedroom_heat_last_alerted'')
      or (now().timestamp() - as_timestamp(states(''input_datetime.bedroom_heat_last_alerted''),
      0)) > 10800 }}'
  - alias: Skip when the bedroom is DELIBERATELY parked at or above its own daytime
      hold (76F daytime, WFH 78F, empty-house 80F). Without this, a room correctly
      sitting at its own setpoint reads as 'warm', re-alerts every 3h, and forces
      preset boost, which undoes the setting it is complaining about. v8 moved this
      from 77 to 76 after a real spurious firing at a deliberate 76F on 2026-08-15.
      float(70) default means an unreachable unit does NOT get suppressed - if we
      cannot tell, alert.
    condition: template
    value_template: '{{ (state_attr(''climate.bedroom_ac'',''temperature'') | float(70))
      < 76 }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sustained_warm
      - condition: not
        conditions:
        - condition: zone
          entity_id: person.lara_wiz
          zone: zone.work
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: Bedroom is {{ states('sensor.temp_in_bedroom') }}°F. Turn down
            the heat / crank the AC.
          title: ⚠️ Bedroom warm
      - action: input_datetime.set_datetime
        alias: Stamp anti-spam clock
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.bedroom_heat_last_alerted
      - alias: Cool it now, but only if the AC is actually reachable (v4)
        else:
        - action: logbook.log
          alias: Record that cooling could not be applied
          data:
            entity_id: climate.bedroom_ac
            message: Heat alert sent, but Bedroom AC is unreachable so no cooling
              was applied.
            name: Bedroom Heat Alert
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.bedroom_ac
            state:
            - unavailable
            - unknown
        then:
        - action: climate.set_hvac_mode
          alias: Actually cool it now (v3)
          data:
            hvac_mode: cool
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle — these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
        - action: climate.set_preset_mode
          alias: Boost preset for faster recovery (v5 - set LAST so it sticks; verified
            live 2026-08-15)
          data:
            preset_mode: boost
          target:
            entity_id: climate.bedroom_ac
    - conditions:
      - condition: trigger
        id: arrived_home
      - above: 78
        condition: numeric_state
        entity_id: sensor.temp_in_bedroom
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: Welcome home — bedroom is {{ states('sensor.temp_in_bedroom') }}°F.
          title: ⚠️ Bedroom hot
      - action: input_datetime.set_datetime
        alias: Stamp anti-spam clock
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.bedroom_heat_last_alerted
      - alias: Cool it now, but only if the AC is actually reachable (v4)
        else:
        - action: logbook.log
          alias: Record that cooling could not be applied
          data:
            entity_id: climate.bedroom_ac
            message: Heat alert sent, but Bedroom AC is unreachable so no cooling
              was applied.
            name: Bedroom Heat Alert
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.bedroom_ac
            state:
            - unavailable
            - unknown
        then:
        - action: climate.set_hvac_mode
          alias: Actually cool it now (v3)
          data:
            hvac_mode: cool
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle — these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
        - action: climate.set_preset_mode
          alias: Boost preset for faster recovery (v5 - set LAST so it sticks; verified
            live 2026-08-15)
          data:
            preset_mode: boost
          target:
            entity_id: climate.bedroom_ac
  mode: single
- id: '1783335318996'
  alias: 'Sonos Wake Alarm: Speaker Failsafe (v2)'
  description: 'Failsafe for the Sonos Wake Alarm. On 2026-07-06 the wake alarm ran
    perfectly per its trace but Lara slept through it: every audio step (lofi ramp
    + escalating alarm) plays through media_player.bedroom, the Music Assistant entity
    for the bedroom Sonos, and that entity had been ''unavailable'' since ~2026-07-04
    23:00 because the Music Assistant integration was stuck in setup_retry (''Failed
    to connect to music assistant server''). Both play steps use continue_on_error
    and the wait-for-playing step timed out, so the alarm produced total silence with
    no error and the trace looked normal. This is the backstop: at the wake event
    (offset 0 = the intended wake time) it checks whether media_player.bedroom is
    unavailable/unknown, and if so it (a) pushes an iPhone alert so the MA outage
    gets fixed, and (b) sounds the classic alarm directly on the native bedroom Sonos
    (media_player.bedroom_frame), escalating volume 0.40 to 0.70 every 12s until input_boolean.in_bed
    turns off, mirroring the main alarm''s stop logic. It cannot double-alarm: when
    MA is healthy the unavailable-check is false so this exits and the main alarm
    runs; only when the MA player is down (main alarm silent) does this fire. Native
    Sonos can''t play the MA lofi playlist, so the failsafe is alarm-tone-only (waking
    is the priority; the lofi wind-down is a nicety). GATES mirror the main alarm:
    time 04:30-08:00, calendar.vacation off, in_bed on, binary_sensor.workday on,
    and the calendar summary must contain ''wake up''. Phase 0 unjoins the bedroom
    Sonos so the alarm stays solo and doesn''t bleed into the bathroom Era 100 and
    disturb Johnny. URL uses homeassistant.local:8123/local/alarm-clock.mp3 to match
    the main alarm; if native Sonos ever fails to resolve mDNS, switch to the HA host
    IP. Intentional infra, don''t flag. TODO v2: also cover ''main alarm started but
    media_player.bedroom never reached playing'' to defend against non-unavailable
    MA failures (player present but announcement errors).


    UPDATE 2026-08-12 (v2): The old premise (checking whether media_player.bedroom,
    the Music Assistant entity, was unavailable) went stale the same day once the
    main Sonos Wake Alarm was migrated fully off Music Assistant onto native Sonos
    - that MA entity no longer has any bearing on whether the main alarm''s audio
    actually plays. Replaced the trigger condition with the TODO v2 already noted
    above: check whether media_player.bedroom_frame is NOT in state ''playing'' at
    wake time (this automation trigger fires at the same offset-0 wake moment where
    the main alarm''s Phase 1 lofi music should still be playing, right before its
    own Phase 2 begins - if it''s not playing, Phase 1 evidently failed). Also fixed
    an independent bug: the backup alarm''s own play_media call used announce:true,
    which was confirmed elsewhere this session to silently no-op on this house''s
    Sonos integration - removed the flag so the backup alarm actually produces sound
    if it fires. Alert wording updated to match the new premise.'
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_up_time
    platform: calendar
  conditions:
  - condition: time
    after: 04:30:00
    before: 08:00:00
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: template
    value_template: '{% set s = trigger.calendar_event.summary | lower | trim %}{{
      ''wake up'' in s }}'
  - alias: Bedroom Sonos wasn't playing at wake time (main alarm audio likely failed)
    condition: not
    conditions:
    - condition: state
      entity_id: media_player.bedroom_frame
      state: playing
  actions:
  - alias: Alert — MA bedroom player down, alarm on backup speaker
    action: notify.mobile_app_iphone
    data:
      title: ⚠️ Wake alarm backup fired
      message: The bedroom Sonos wasn't playing at wake time, so this backup alarm
        is sounding on media_player.bedroom_frame directly. The main Sonos Wake Alarm's
        audio chain (Phase 1 wake music) likely failed to start or stopped early —
        check it.
  - alias: Phase 0 — Unjoin bedroom Sonos so the alarm stays out of the bathroom (Johnny)
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom_frame
    continue_on_error: true
  - alias: Phase 0 — Settle before playback
    delay: 00:00:01
  - alias: Phase 1 — Escalating classic alarm on native Sonos until out of bed
    repeat:
      until:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - alias: Raise volume each pass (0.40 to 0.70 cap)
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom_frame
        data:
          volume_level: '{{ ([0.40 + (repeat.index - 1) * 0.05, 0.70] | min) | float
            }}'
      - alias: Play alarm clip as a Sonos announcement
        action: media_player.play_media
        target:
          entity_id: media_player.bedroom_frame
        data:
          media_content_id: http://homeassistant.local:8123/local/alarm-clock.mp3
          media_content_type: music
        continue_on_error: true
      - delay: 00:00:12
  - alias: Phase 2 — Gentle light fade-in once up
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      transition: 300
  mode: restart
- id: '1783476373361'
  alias: Mac Samba Monitor Alert (webhook)
  description: Receives status POSTs from the Mac-side Samba share monitor (LaunchAgent
    com.ellewiz.sambamonitor) and pushes them to iPhone with a per-message iOS interruption
    level (real outages = time-sensitive so they pierce Sleep/Focus, self-heal FYIs
    = passive). Replaces the old server-side samba_smb_port watchdog, which could
    not see Mac-side Finder/mount drops. Intentional infra - do not flag.
  triggers:
  - platform: webhook
    webhook_id: mac_samba_monitor_9f3a7c2e5b8d1
    local_only: true
    allowed_methods:
    - POST
  actions:
  - data:
      title: '{{ trigger.json.title | default(''Samba share'', true) }}'
      message: '{{ trigger.json.message | default(''Samba share status change on Mac'',
        true) }}'
      data:
        push:
          interruption-level: '{{ trigger.json.level | default(''active'', true) }}'
    action: notify.mobile_app_iphone
  mode: queued
- id: '1783880933653'
  alias: 'Location: Log vet visit on arrival'
  description: 'Logs a vet visit when the iPhone dwells in zone.vet for 1 minute:
    bumps counter.vet_visits, stamps input_datetime.vet_last_visit, writes a Pet Log
    logbook entry, and sends a passive iPhone push. Triggers on device_tracker.iphone
    (NOT person.lara_wiz - the person entity''s MacBook source pins it home, so it
    never registers away-zones; tracker state inside a zone is the zone''s friendly
    name). 3h dedupe via last_triggered so re-parking or GPS wobble doesn''t double-log.
    Intentionally NOT vacation-gated (visits are worth logging regardless). 2026-07-12:
    restored from execution trace + design notes after the YAML block was destroyed
    by an SMB stale-cache write; original id preserved.'
  triggers:
  - platform: state
    entity_id: device_tracker.iphone
    to: Vet
    for: 00:01:00
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 10800 }}'
  actions:
  - target:
      entity_id: counter.vet_visits
    action: counter.increment
  - target:
      entity_id: input_datetime.vet_last_visit
    data:
      timestamp: '{{ now().timestamp() }}'
    action: input_datetime.set_datetime
  - data:
      name: Pet Log
      message: Vet visit
      entity_id: input_datetime.vet_last_visit
    action: logbook.log
  - data:
      title: "\U0001F43E Vet visit logged"
      message: Logged at {{ now().strftime('%-I:%M %p') }}.
      data:
        push:
          interruption-level: passive
    action: notify.mobile_app_iphone
  mode: single
- id: meds_guanfacine_nudge_restore_failsafe
  alias: 'Meds — Guanfacine: Nudge Restore Failsafe'
  description: 'Stateless companion to ''Meds — Guanfacine: TV nudge until logged''.
    That automation holds indefinitely (wait_for_trigger, no timeout, per Lara) until
    the dose is logged; an automation reload or HA restart mid-hold kills the run
    and strands the living room (lights pinned at 70% under AL manual_control, TV
    paused, scene.guanfacine_nudge_restore never applied) — same failure class as
    the 2026-06-04 bedroom 16h incident. This failsafe fires on input_boolean.guanfacine_taken
    -> on and performs the restore only when the main automation is NOT mid-run (current
    == 0; if it is running, it does its own restore): re-apply the snapshot scene
    if it still exists (dynamic scenes don''t survive restart — in that case AL handback
    alone re-normalizes the lights at the next adapt cycle), then hand the lights
    back to Adaptive Lighting. Deliberately does NOT blindly resume the TV: after
    a strand there''s no record of which player was paused vs paused-by-Lara, so resume
    stays manual. Evening window gate (19:30-04:00) so an out-of-band toggle of the
    boolean can''t re-apply a stale snapshot at midday. Created 2026-07-13 (code review
    R7).'
  triggers:
  - platform: state
    entity_id: input_boolean.guanfacine_taken
    from: 'off'
    to: 'on'
  conditions:
  - condition: time
    after: '19:30:00'
    before: 04:00:00
  - condition: template
    alias: Main nudge automation not mid-run (it handles its own restore)
    value_template: '{{ state_attr(''automation.meds_guanfacine_tv_nudge_until_logged'',
      ''current'') | int(0) == 0 }}'
  actions:
  - alias: Re-apply light snapshot if it survived (skip after restart)
    if:
    - condition: template
      value_template: '{{ states(''scene.guanfacine_nudge_restore'') not in [''unknown'',
        ''unavailable''] }}'
    then:
    - action: scene.turn_on
      target:
        entity_id: scene.guanfacine_nudge_restore
      data:
        transition: 2
  - alias: Hand the lights back to Adaptive Lighting
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      lights:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
      manual_control: false
  mode: single
- id: tv_event_nightly_reconcile
  alias: TV Event — Nightly Reconcile
  description: 'Safety net for the TV-event automation set. TV Event Reminder and
    the Lighting Backstop disable four nightly automations (ambient manager, both
    TV-off automations, morning lights) with stop_actions and rely solely on TV Event
    Over''s calendar-end trigger to re-enable them. If a calendar.tv event is deleted
    mid-event, no end event fires and the four stay off indefinitely (the 23:00 weekend
    re-enable only covers non-work nights while home). This runs every day at 04:00:
    when no calendar.tv event is active, it re-enables all four and resumes the living-room
    AL switch. All actions are no-ops when everything is already on, so it''s safe
    to fire nightly. Created 2026-07-13 (code review R10).'
  triggers:
  - platform: time
    at: 04:00:00
  conditions:
  - condition: state
    entity_id: calendar.tv
    state: 'off'
  actions:
  - alias: Re-enable the nightly automation set (no-op if already on)
    action: automation.turn_on
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
  - alias: Resume living-room Adaptive Lighting (no-op if already on)
    action: switch.turn_on
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  mode: single
- id: '1784118690598'
  alias: 'Meds: Mirror dashboard dose log to counter'
  description: 'Mirrors a medication dose into the durable counter when the Oura dashboard
    flag (input_boolean.*_taken) is toggled on WITHOUT the Orb button. CONTEXT: automation.meds_log_dose_from_orb_button
    increments counter.med_*_doses inline AND calls script.log_* (which sets the flag
    + writes the canonical ''Health Log'' logbook line). But tapping the input_boolean
    directly on the dashboard only flips the flag: it never bumps the counter or writes
    Health Log. Observed Jul 14 2026: a guanfacine dose logged from the laptop set
    the flag but left counter.med_guanfacine_doses one short, so the LTS mirror sensor.med_*_doses_recorded
    (read by the crossfactor report) under-counts any non-button dose. This closes
    the gap for the 3 counter-tracked, flag-backed meds (Adderall/Lexapro/Guanfacine);
    Zepbound is excluded (weekly med, no daily flag). DEDUPE: the button path ALSO
    flips the flag off->on via script.log_*, which would trigger this automation and
    double-count. Guard: after a 3s settle delay, only increment if the matching counter
    has NOT changed in the last 30s. A button press bumps the counter within ms of
    the flag flip (counter is incremented BEFORE the flag in that automation), so
    its recent change suppresses this mirror; a manual/dashboard toggle leaves the
    counter hours stale, so it proceeds. Relies on the daily model (one off->on per
    flag per 4am-reset day) => at most one mirror per med per day. Known edge: a manual
    toggle within ~30s of an unrelated counter change (e.g. right after an HA restart
    that resets counter last_changed) could be skipped: rare, costs one count. mode
    parallel so simultaneous morning Adderall+Lexapro toggles each process. NOT vacation-gated
    (meds taken while traveling), matching the button automation. Also writes a ''Health
    Log'' logbook line so dashboard-logged doses land in the same unified history
    as button/script ones. Added Jul 15 2026.'
  triggers:
  - platform: state
    id: adderall
    entity_id: input_boolean.adderall_taken
    from: 'off'
    to: 'on'
  - platform: state
    id: lexapro
    entity_id: input_boolean.lexapro_taken
    from: 'off'
    to: 'on'
  - platform: state
    id: guanfacine
    entity_id: input_boolean.guanfacine_taken
    from: 'off'
    to: 'on'
  actions:
  - alias: Let any Orb-button counter increment land first
    delay:
      seconds: 3
  - alias: Mirror to the matching counter only if the button didn't already do it
    choose:
    - alias: Adderall
      conditions:
      - condition: trigger
        id: adderall
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.counter.med_adderall_doses.last_changed))
          > 30 }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_adderall_doses
      - action: logbook.log
        data:
          name: Health Log
          message: Adderall taken (dashboard log, counter mirrored)
          entity_id: input_boolean.adderall_taken
    - alias: Lexapro
      conditions:
      - condition: trigger
        id: lexapro
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.counter.med_lexapro_doses.last_changed))
          > 30 }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_lexapro_doses
      - action: logbook.log
        data:
          name: Health Log
          message: Lexapro taken (dashboard log, counter mirrored)
          entity_id: input_boolean.lexapro_taken
    - alias: Guanfacine
      conditions:
      - condition: trigger
        id: guanfacine
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.counter.med_guanfacine_doses.last_changed))
          > 30 }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.med_guanfacine_doses
      - action: logbook.log
        data:
          name: Health Log
          message: Guanfacine taken (dashboard log, counter mirrored)
          entity_id: input_boolean.guanfacine_taken
  mode: parallel
  max: 5
- id: '1784689256636'
  alias: Oura Sync Nudge on Wake (in_bed off)
  description: When in_bed flips off during the morning window (group.morning on),
    send a time-sensitive actionable notification to the iPhone. Tapping it opens
    the Oura app to force the overnight ring sync so the sleep report has last night's
    data. Built with Lara 2026-07-22; interruption-level time-sensitive so it surfaces
    even if Sleep Focus is still on. URL scheme oura:// is provisional pending tap
    test; fallback is shortcuts://run-shortcut.
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    platform: state
    to: 'off'
  conditions:
  - condition: state
    entity_id: group.morning
    state: 'on'
  actions:
  - action: notify.mobile_app_iphone
    data:
      data:
        actions:
        - action: URI
          title: Open Oura
          uri: oura://
        push:
          interruption-level: time-sensitive
        tag: oura_sync_nudge
        url: oura://
      message: Tap to sync last night's sleep to the report.
      title: Good morning, open Oura
  mode: single
- id: living_room_lights_off_while_in_bed
  alias: Living Room — Lights Off While In Bed (v1)
  description: 'Safety net of last resort: if input_boolean.in_bed is on and the living
    room group is still lit with nobody in the room, turn it off. Built 2026-07-28
    after THREE separate living-room burns in one week, each from a different cause,
    none of which the existing automations could recover from. (1) Night of Jul 26->27,
    ~13.8h (before 18:00 EDT Jul 26 until the 07:46 leave-home off): script.shut_down_bedtime
    never ran at all because the iPhone Shortcut on earbud connect missed, so in_bed
    was force-set at 03:30 by automation.sonos_wake_alarm_in_bed_fallback and the
    script''s LR-off step never happened. This is the structural gap - in_bed does
    NOT trigger the bedtime script, the script SETS in_bed as its step 2, so ANY other
    path that raises the flag (the 03:30 fallback, a dashboard toggle, a script that
    dies mid-run) silently skips the living-room off. (2) Jul 27 daytime, ~9.5h empty
    house, group-rollup false positive tripping the phantom backstop. (3) Night of
    Jul 27->28, ~6.7h: the bedtime script ran correctly and the backstop overrode
    its off (fixed separately in backstop v4). WHY A SWEEP AND NOT A ONE-SHOT: once
    the living room is lit after dark there is NO off-path at all - both Ambient Manager
    auto-off branches require smoothed lux ABOVE input_number.living_room_lux_off
    (57) and the room sits at ~2 lx all night, so anything that lights the group overnight
    burns until daylight or leave-home. A recurring check is the only thing that closes
    that. TIMING: the 30-minute in_bed dwell (both the trigger''s for: and the template
    condition) exists to protect script.shut_down_bedtime''s INTENTIONAL random 10-25
    minute delay between the bedroom and the living room going dark - that gap is
    deliberate occupancy realism, do not shorten this dwell below 25 minutes or this
    automation will cut it off. The time_pattern sweep then catches any relight within
    10 minutes; it is used instead of a state trigger with for: because the LR group
    flaps to unavailable (chronic light.next_to_couch, laggy light.living_room_corner)
    and every flap would restart a for: timer. OCCUPANCY: motion AND the SNZB-06P
    presence sensor must both be clear, so getting up at 2am and switching the living
    room on does not get undone under her - same principle as the Ambient Manager''s
    off branches. Guests gate mirrors Late-Night Sleep Dim: don''t kill the room a
    guest is using. Deliberately NOT vacation-gated - if in_bed is somehow on while
    she is away, off is still the right answer, and this is an energy safety net rather
    than occupancy theater. Turning off here is safe against a backstop loop twice
    over: backstop v4 now requires in_bed off, and this off carries a parent_id so
    its null/null external test also declines.'
  triggers:
  - entity_id: input_boolean.in_bed
    for: 00:30:00
    id: in_bed_settled
    to: 'on'
    trigger: state
  - id: overnight_sweep
    minutes: /10
    trigger: time_pattern
  conditions:
  - alias: Only while she is in bed
    condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - alias: in_bed on for >30 min — protects the bedtime script's intentional random
      10-25 min delay before its own LR off
    condition: template
    value_template: '{% set e = states.input_boolean.in_bed %}

      {{ e is not none and (now() - e.last_changed).total_seconds() > 1800 }}'
  - alias: Something has left the living room lit
    condition: state
    entity_id: light.living_room_lights
    state: 'on'
  - alias: No motion — never turn the lights off on top of someone
    condition: state
    entity_id: binary_sensor.hue_motion_sensor_4_motion
    state: 'off'
  - alias: No presence either (SNZB-06P) — covers sitting still on the couch
    condition: state
    entity_id: binary_sensor.living_room_presence
    state: 'off'
  - alias: Don't kill a room a guest may be using
    condition: state
    entity_id: input_boolean.guests
    state: 'off'
  actions:
  - action: light.turn_off
    alias: Turn the living room back off
    data:
      transition: 1
    target:
      entity_id: light.living_room_lights
  - action: logbook.log
    alias: Log the catch so overnight burns stay auditable
    data:
      entity_id: light.living_room_lights
      message: 'Turned the living room off — in_bed on for {{ ((now() - states.input_boolean.in_bed.last_changed).total_seconds()
        / 60) | round(0) | int }} min, room empty, smoothed {{ states(''sensor.living_room_illuminance_smoothed'')
        }} lx (trigger: {{ trigger.id }}).'
      name: LR In-Bed Safety Net
  max_exceeded: silent
  mode: single
- id: living_room_off_at_scheduled_time
  alias: Living Room — Scheduled Off (Bedtime Wind-Down) (v1)
  description: 'Fires the bedtime living-room off at the time script.shut_down_bedtime
    wrote into input_datetime.living_room_off_at. Built 2026-07-28 to replace the
    script''s in-memory `delay` step, which only existed inside the running script:
    an HA restart or a scripts reload during the 10-25 minute window silently cancelled
    it, leaving the living room lit with nothing in the logbook to say so. Moving
    the intention into a persistent datetime means the script finishes in under a
    second and there is nothing left to cancel; if HA restarts mid-window the helper
    still holds the target time and this automation still fires. THE RANDOM GAP IS
    PRESERVED - the script still draws range(10,25)|random, it just writes now() +
    that many minutes to the helper instead of sleeping. That gap is deliberate occupancy
    realism (bedroom and living room going dark at a human-looking interval), documented
    in the script and in project memory; do not make it fixed. GATES: in_bed must
    be on, so a stale helper value from a previous night cannot fire a spurious off;
    and the target must be today, so a value left over from an aborted run is ignored.
    Motion and presence are deliberately NOT checked here, unlike the In-Bed Safety
    Net - this is the intended bedtime off and should fire even if the SNZB-06P is
    still holding a stale occupancy reading from her walking through on the way to
    bed. RELATIONSHIP TO THE SAFETY NET: automation.living_room_lights_off_while_in_bed_v1
    waits 30 min after in_bed and sweeps every 10 min, so it sits strictly behind
    this one (max target here is 25 min) and catches the case where this off is missed
    or undone. Two independent layers on purpose, after three separate living-room
    burns in the week of 2026-07-22.'
  triggers:
  - at: input_datetime.living_room_off_at
    id: scheduled_off
    trigger: time
  conditions:
  - alias: Only as part of an actual bedtime run
    condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - alias: Target must be today — ignores a stale value from an aborted or previous
      run
    condition: template
    value_template: '{% set t = states(''input_datetime.living_room_off_at'') %}

      {{ t not in [''unknown'', ''unavailable''] and as_datetime(t) is not none and
      as_datetime(t).date() == now().date() }}'
  actions:
  - action: light.turn_off
    alias: Turn the living room off (the bedtime wind-down step)
    data:
      transition: 1
    target:
      entity_id: light.living_room_lights
  - action: logbook.log
    alias: Log it so the wind-down stays auditable
    data:
      entity_id: light.living_room_lights
      message: Living room off on the scheduled wind-down ({{ states('input_datetime.living_room_off_at')
        }}), {{ ((now() - states.input_boolean.in_bed.last_changed).total_seconds()
        / 60) | round(0) | int }} min after in_bed.
      name: LR Bedtime Wind-Down
  mode: single
- id: '1785368258027'
  alias: 'Sleep Report: Saved to iCloud (webhook) (v2)'
  description: 'Receives a POST from the Mac-side sleep report watcher (LaunchAgent
    com.ellewiz.sleepreportwatch) once the day''s "<date> Sleep Report.md" has landed
    in iCloud Drive/Sleep reports and its size has settled, then pushes an FYI to
    iPhone. Mirrors the Mac Samba Monitor Alert webhook pattern: the Mac has to do
    the watching because HA cannot see iCloud Drive, and the per-message iOS interruption
    level comes from trigger.json.level (default active). v2 composes the headline
    HERE from the Oura sensors instead of having the Mac parse the markdown: under
    launchd the agent can stat a file in ~/Library/Mobile Documents but macOS TCC
    blocks reading its CONTENTS, so awk failed and every push degraded to generic
    text. Same numbers, same source, no permission problem. trigger.json.message still
    wins if the Mac ever sends one. Deliberately NOT vacation-gated: reports keep
    generating while away and Lara reads them when travelling. The watcher confirms
    the file is on local disk, which is not the same as iCloud finishing the upload,
    so a tap-through seconds after the push may briefly show nothing on the phone.
    Intentional infra - do not flag. v3 idea: also alert if no report has appeared
    by the daily backstop time.'
  triggers:
  - allowed_methods:
    - POST
    local_only: true
    trigger: webhook
    webhook_id: mac_sleep_report_saved_5d1f8a3c9e70b
  actions:
  - action: notify.mobile_app_iphone
    alias: Push the report-ready FYI to iPhone, headline built from the Oura sensors
    data:
      data:
        push:
          interruption-level: '{{ trigger.json.level | default(''active'', true) }}'
      message: '{% set b = [''unknown'',''unavailable'',''none'',''''] %}{% set s
        = states(''sensor.oura_ring_sleep_score'') %}{% set d = states(''sensor.oura_ring_total_sleep_duration'')
        %}{% set e = states(''sensor.oura_ring_sleep_efficiency'') %}{% set r = states(''sensor.oura_ring_readiness_score'')
        %}{% set p = namespace(list=[]) %}{% if s | lower not in b %}{% set p.list
        = p.list + [''Sleep score '' ~ s] %}{% endif %}{% if d | lower not in b %}{%
        set h = d | float(0) %}{% set p.list = p.list + [(h | int) ~ ''h '' ~ (((h
        - (h | int)) * 60) | round(0) | int) ~ ''m asleep''] %}{% endif %}{% if e
        | lower not in b %}{% set p.list = p.list + [e ~ ''% efficiency''] %}{% endif
        %}{% if r | lower not in b %}{% set p.list = p.list + [''readiness '' ~ r]
        %}{% endif %}{{ trigger.json.message if trigger.json.message is defined and
        trigger.json.message else ((p.list | join('', '') ~ ''.'') if p.list | length
        > 0 else ''Saved to the iCloud Sleep reports folder.'') }}'
      title: '{{ trigger.json.title | default(''Sleep report ready'', true) }}'
  max: 5
  mode: queued
- id: '1785466902792'
  alias: Speakers — Stop All When I Leave Home
  description: 'Stops every Sonos in the house except the Office when Lara leaves
    zone.home.


    WHY: Before this existed, nothing turned off house speakers on departure. The
    only media shutoff lived inside ''Turn off the lights when I leave home'', and
    it targeted just media_player.bedroom_frame + media_player.bedroom. On 2026-07-30
    music started in the dining room at 07:24, she left at 07:28, and the dining room
    / living room / living room Arc played for 10h06m until she got home at 17:28
    and paused them by hand. The bedroom stop also sat behind that automation''s lux/group.morning
    condition, so on a dark-morning departure even the bedroom would not have stopped.
    Media shutoff must not be gated on a lighting condition, hence this standalone
    automation.


    SCOPE: Office (media_player.sonos_move) is deliberately EXCLUDED - that is where
    the dog music for Johnny lives, and it should survive a departure. All other Sonos
    are in scope.


    ACTION: media_stop, not media_pause, matching the behavior the bedroom branch
    had.


    GATES: calendar.vacation off per house style, so a dog/house-sitter''s music is
    not killed if Lara steps out during a vacation window.


    continue_on_error is set because a flapping or unavailable Sonos should not abort
    the stop for the remaining speakers.


    UPDATE 2026-08-12: Removed the redundant media_player.bedroom (Music Assistant)
    entry from the stop-all list now that media_player.bedroom_frame (native Sonos)
    is the only entity anything actually plays through in the bedroom.


    UPDATE 2026-08-13: Removed media_player.living_room (Music Assistant) from the
    stop-all list — the leftover the 2026-08-12 pass missed. The Music Assistant add-on
    was uninstalled 2026-08-13 and its config entry deleted, so no MA-side player
    exists any more; media_player.living_room_arc (native Sonos) is retained and is
    the living room''s real speaker.'
  triggers:
  - entity_id: person.lara_wiz
    event: leave
    zone: zone.home
    platform: zone
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - action: media_player.media_stop
    alias: Stop all in-scope Sonos (Office deliberately excluded)
    continue_on_error: true
    target:
      entity_id:
      - media_player.dining_room
      - media_player.living_room_arc
      - media_player.bedroom_frame
      - media_player.bathroom
      - media_player.basement
  mode: single
- id: living_room_late_night_off_no_bedtime
  alias: Living Room — Late-Night Off (No-Bedtime Fallback) (v1)
  description: 'Third and last living-room off-path, for the case neither of the other
    two can see: a night where input_boolean.in_bed is NEVER raised at all. Built
    2026-08-03 after the night of Aug 1->2 2026 burned ~36h (lit 06:48 EDT Saturday
    by Morning Lights v3 on motion, never turned off). Both existing layers - automation.living_room_scheduled_off_bedtime_wind_down_v1
    and automation.living_room_lights_off_while_in_bed_v1 - gate on in_bed being ON,
    so a night where the bedtime ritual is simply skipped (typical on a weekend) arms
    neither of them. The Ambient Manager''s auto-off branches need smoothed lux ABOVE
    input_number.living_room_lux_off (57) and the room sits at ~2-3 lx overnight,
    so there is no lux path after dark either, and the 03:30 in_bed fallback (automation.sonos_wake_alarm_in_bed_fallback)
    is workday-gated so it does not cover Saturday nights. WHY NOT EXTEND THE 03:30
    FALLBACK TO WEEKENDS INSTEAD: in_bed feeds packages/sleep_wake_metrics.yaml, the
    couch-doze detection and the overnight temp trajectory. Raising it on a night
    she did not actually go to bed then would corrupt the health data to fix a lighting
    problem. Keep the concerns separate. WINDOW: 02:00-05:00 local. Late enough to
    clear any real bedtime (observed range in the week of Jul 27 2026 was 22:56-00:48)
    plus script.shut_down_bedtime''s intentional random 10-25 min gap; early enough
    to finish before the 05:30 sleep-dim release and well before Morning Lights v3
    relights the room around 06:00-06:50. IN_BED MUST BE OFF: this automation deliberately
    owns ONLY the in_bed-never-set case. When in_bed is on, automation.living_room_lights_off_while_in_bed_v1
    owns it - that one has a 30-minute dwell specifically to protect the bedtime script''s
    random gap, and overlapping here would cut that gap off. OCCUPANCY: motion AND
    the SNZB-06P presence sensor must both be clear, same principle as the safety
    net. If she is up at 2am on the couch, the room stays lit. Guests gate mirrors
    Late-Night Sleep Dim. Deliberately NOT vacation-gated - if the room is lit at
    2am while she is away, off is still the right answer; this is an energy safety
    net, not occupancy theater. SWEEP NOT ONE-SHOT: time_pattern is used instead of
    a state trigger with for: because the group flaps to unavailable constantly (chronic
    light.next_to_couch, laggy light.living_room_corner) and every flap would restart
    a for: timer. BACKSTOP: automation.living_room_lights_backstop_re_assert_after_external_off
    was DELETED 2026-08-03 (0 true positives, 5 false positives, ~35h burn), so there
    is no longer anything that can re-assert this off. See /Volumes/config/lr-followups-2026-08-03.md
    for the archived YAML and the decision record.'
  triggers:
  - trigger: time_pattern
    minutes: /15
    id: late_night_sweep
  conditions:
  - alias: Late-night window only — past any real bedtime, before the morning relight
    condition: time
    after: 02:00:00
    before: 05:00:00
  - alias: Something has left the living room lit
    condition: state
    entity_id: light.living_room_lights
    state: 'on'
  - alias: in_bed OFF only — when in_bed is on the In-Bed Safety Net owns this, and
      its 30-min dwell protects the bedtime script's random gap
    condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - alias: No motion — never turn the lights off on top of someone
    condition: state
    entity_id: binary_sensor.hue_motion_sensor_4_motion
    state: 'off'
  - alias: No presence either (SNZB-06P) — covers sitting still on the couch
    condition: state
    entity_id: binary_sensor.living_room_presence
    state: 'off'
  - alias: Don't kill a room a guest may be using
    condition: state
    entity_id: input_boolean.guests
    state: 'off'
  actions:
  - alias: Turn the living room off
    action: light.turn_off
    target:
      entity_id: light.living_room_lights
    data:
      transition: 1
  - alias: Log the catch so no-bedtime burns stay auditable
    action: logbook.log
    data:
      name: LR Late-Night Fallback
      entity_id: light.living_room_lights
      message: Turned the living room off — no bedtime ritual tonight (in_bed off
        for {{ ((now() - states.input_boolean.in_bed.last_changed).total_seconds()
        / 3600) | round(1) }} h), room empty, smoothed {{ states('sensor.living_room_illuminance_smoothed')
        }} lx.
  mode: single
  max_exceeded: silent
- id: '1786035663980'
  alias: 'Guests: Calendar-Driven Toggle'
  description: 'Flips input_boolean.guests automatically from calendar.guests instead
    of relying on a manual toggle (which risks getting left on after guests leave,
    or forgotten before they arrive). Turns it on when a calendar.guests event starts,
    off when it ends. Exact start/end, no buffer, per Lara''s preference (2026-08-06).
    Downstream, input_boolean.guests still gates the same four automations it always
    has: Living Room — Lights Off While In Bed, Living Room — Late-Night Off (No-Bedtime
    Fallback), Living Room — Late-Night Sleep Dim, and Meds — Guanfacine TV Nudge
    — none of those were touched. The manual toggle on input_boolean.guests still
    works too, for ad hoc guests with no calendar event; this automation only adds
    the calendar as a second way to set it, it doesn''t replace manual control. Add/remove
    guest stays by adding events named anything to the calendar.guests calendar (event
    summary isn''t checked, presence of any event is what matters, matching how calendar.vacation
    works).'
  triggers:
  - entity_id: calendar.guests
    event: start
    id: guest_event_start
    platform: calendar
  - entity_id: calendar.guests
    event: end
    id: guest_event_end
    platform: calendar
  conditions: []
  actions:
  - choose:
    - alias: Guest event started — turn guest mode on
      conditions:
      - condition: trigger
        id: guest_event_start
      sequence:
      - action: input_boolean.turn_on
        alias: Turn on Guests
        target:
          entity_id: input_boolean.guests
      - action: logbook.log
        alias: Log the auto-arm
        data:
          entity_id: input_boolean.guests
          message: Turned on automatically — calendar.guests event started ({{ trigger.calendar_event.summary
            if trigger.calendar_event is defined else 'untitled' }}).
          name: Guests
    - alias: Guest event ended — turn guest mode off
      conditions:
      - condition: trigger
        id: guest_event_end
      sequence:
      - action: input_boolean.turn_off
        alias: Turn off Guests
        target:
          entity_id: input_boolean.guests
      - action: logbook.log
        alias: Log the auto-release
        data:
          entity_id: input_boolean.guests
          message: Turned off automatically — calendar.guests event ended ({{ trigger.calendar_event.summary
            if trigger.calendar_event is defined else 'untitled' }}).
          name: Guests
  mode: single
- id: '1786045679175'
  alias: Manual Bedroom Alarm (One-Off)
  description: 'Manual one-off alarm for days off work. Set input_datetime.manual_alarm_time
    and flip input_boolean.manual_alarm on via the iPhone dashboard card. At that
    time, isolates the bedroom Sonos (unjoins media_player.bedroom_frame so it doesn''t
    wake the bathroom speaker), then blares alarm-clock.mp3 on media_player.bedroom
    only, escalating volume every 12s. Flipping input_boolean.manual_alarm off silences
    it immediately. Auto-caps at 50 escalation cycles (~10 min) and turns itself off
    so it won''t re-fire the same time the next day if left armed. Created 2026-08-06
    for a 5am wake-up.


    UPDATE 2026-08-12: Migrated off Music Assistant (media_player.bedroom) onto native
    Sonos (media_player.bedroom_frame), mirroring the same-day fix to the main Sonos
    Wake Alarm''s Phase 2. music_assistant.play_announcement (0-100 int announce_volume)
    replaced with media_player.volume_set (0.0-1.0 float, rescaled 35,45,55...100
    -> 0.35,0.45,0.55...1.0, same progression) + plain media_player.play_media (no
    announce flag - announce:true was confirmed to silently no-op on this house''s
    Sonos integration).'
  triggers:
  - at: input_datetime.manual_alarm_time
    id: manual_alarm_time
    platform: time
  conditions:
  - condition: state
    entity_id: input_boolean.manual_alarm
    state: 'on'
  actions:
  - action: media_player.unjoin
    alias: Phase 0 — Unjoin bedroom Sonos so it plays solo
    continue_on_error: true
    target:
      entity_id: media_player.bedroom_frame
  - alias: Phase 0 — Settle before playback
    delay: 00:00:01
  - action: media_player.volume_set
    alias: Phase 1 — Punchy starting volume
    data:
      volume_level: 0.35
    target:
      entity_id: media_player.bedroom_frame
  - alias: Phase 2 — Escalating alarm loop until switched off (or 50 cycles / ~10
      min)
    repeat:
      sequence:
      - action: media_player.volume_set
        alias: Phase 2 — Set escalating alarm volume
        continue_on_error: true
        data:
          volume_level: '{{ [0.35 + (repeat.index - 1) * 0.10, 1.0] | min }}'
        target:
          entity_id: media_player.bedroom_frame
      - action: media_player.play_media
        alias: Phase 2 — Play alarm-clock.mp3
        continue_on_error: true
        data:
          media_content_id: http://homeassistant.local:8123/local/alarm-clock.mp3
          media_content_type: music
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:00:12
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.manual_alarm
          state: 'off'
        - condition: template
          value_template: '{{ repeat.index >= 50 }}'
  - action: input_boolean.turn_off
    alias: Phase 3 — Auto-disarm so it doesn't repeat tomorrow
    target:
      entity_id: input_boolean.manual_alarm
  mode: single
- id: '1786331338110'
  alias: Living Room — Air Quality Spike Alert (v1)
  description: 'Sends an iPhone notification when the AirGuard Coffee Table sensor''s
    PM2.5 (µg/m³) crosses into worse EPA air-quality bands, same tiered/anti-spam
    pattern as ''Air Quality: Unhealthy Alert (v1)'' (outdoor, Open-Meteo) and ''Pollen
    Spike Alert''. Tracks the highest tier reached today via input_number.living_room_air_quality_alert_level_reached
    (0-4) so each band only alerts once per day, even if the reading bounces around
    within it. Bands: 1=Elevated/USG (35 µg/m3), 2=Unhealthy (55), 3=Very Unhealthy
    (150), 4=Hazardous (250) — matches the EPA PM2.5 breakpoints already used for
    the outdoor AQI alert, applied to the indoor reading. Good/Moderate (below 35)
    intentionally silent to avoid noise. Vacation-gated like other personal comfort
    alerts. Startup recheck (homeassistant-start trigger + wait_template) catches
    a spike already present across a restart, since numeric_state ''above'' only fires
    on the crossing — same fix applied to the pollen and outdoor-AQI alerts after
    a wildfire smoke event was missed.'
  triggers:
  - above: 35
    entity_id: sensor.living_room_airguard_coffee_table_pm2_5
    id: usg
    trigger: numeric_state
  - above: 55
    entity_id: sensor.living_room_airguard_coffee_table_pm2_5
    id: unhealthy
    trigger: numeric_state
  - above: 150
    entity_id: sensor.living_room_airguard_coffee_table_pm2_5
    id: very_unhealthy
    trigger: numeric_state
  - above: 250
    entity_id: sensor.living_room_airguard_coffee_table_pm2_5
    id: hazardous
    trigger: numeric_state
  - event: start
    id: startup_recheck
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Wait for PM2.5 to have a real value (repopulates after a restart)
    continue_on_timeout: true
    timeout: 00:03:00
    wait_template: '{{ states(''sensor.living_room_airguard_coffee_table_pm2_5'')
      | is_number }}'
  - choose:
    - conditions:
      - above: 250
        condition: numeric_state
        entity_id: sensor.living_room_airguard_coffee_table_pm2_5
      - below: 4
        condition: numeric_state
        entity_id: input_number.living_room_air_quality_alert_level_reached
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: PM2.5 just crossed 250 µg/m³ (currently {{ states('sensor.living_room_airguard_coffee_table_pm2_5')
            }}). Close windows / consider an air purifier now.
          title: "\U0001F6A8 Living Room Air Quality: Hazardous"
      - action: input_number.set_value
        data:
          value: 4
        target:
          entity_id: input_number.living_room_air_quality_alert_level_reached
    - conditions:
      - above: 150
        condition: numeric_state
        entity_id: sensor.living_room_airguard_coffee_table_pm2_5
      - below: 3
        condition: numeric_state
        entity_id: input_number.living_room_air_quality_alert_level_reached
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: PM2.5 just crossed 150 µg/m³ (currently {{ states('sensor.living_room_airguard_coffee_table_pm2_5')
            }}).
          title: "\U0001F6A8 Living Room Air Quality: Very Unhealthy"
      - action: input_number.set_value
        data:
          value: 3
        target:
          entity_id: input_number.living_room_air_quality_alert_level_reached
    - conditions:
      - above: 55
        condition: numeric_state
        entity_id: sensor.living_room_airguard_coffee_table_pm2_5
      - below: 2
        condition: numeric_state
        entity_id: input_number.living_room_air_quality_alert_level_reached
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: PM2.5 just crossed 55 µg/m³ (currently {{ states('sensor.living_room_airguard_coffee_table_pm2_5')
            }}).
          title: '⚠️ Living Room Air Quality: Unhealthy'
      - action: input_number.set_value
        data:
          value: 2
        target:
          entity_id: input_number.living_room_air_quality_alert_level_reached
    - conditions:
      - above: 35
        condition: numeric_state
        entity_id: sensor.living_room_airguard_coffee_table_pm2_5
      - below: 1
        condition: numeric_state
        entity_id: input_number.living_room_air_quality_alert_level_reached
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: PM2.5 just crossed 35 µg/m³ (currently {{ states('sensor.living_room_airguard_coffee_table_pm2_5')
            }}). Sensitive individuals may notice.
          title: "\U0001F33F Living Room Air Quality: Elevated"
      - action: input_number.set_value
        data:
          value: 1
        target:
          entity_id: input_number.living_room_air_quality_alert_level_reached
  max_exceeded: silent
  mode: single
- id: '1786331395226'
  alias: Living Room — Air Quality Alert Level Daily Reset
  description: Resets input_number.living_room_air_quality_alert_level_reached to
    0 at midnight so the Living Room air quality spike alert starts fresh each day.
  triggers:
  - at: 00:00:00
    trigger: time
  actions:
  - action: input_number.set_value
    data:
      value: 0
    target:
      entity_id: input_number.living_room_air_quality_alert_level_reached
  mode: single
- id: '1786334541854'
  alias: Office — Heat Alert for Johnny (v1)
  description: 'Warns when the office runs hot enough to matter for Johnny. He naps
    in there during the day with the door OPEN (crate or pillow nearby, free to leave)
    and is shut in the crate overnight with the door CLOSED.


    THRESHOLD RATIONALE: the office''s measured profile (Aug 7-9 2026, recorder window)
    is a 73.2-77.7F band, peaking roughly 4:30-8:30pm and then COOLING overnight to
    ~73.4F by early morning. So the heat risk lives in the late-afternoon door-OPEN
    window, not the overnight crate window. 80F sustained for 30 min is therefore
    genuinely abnormal for this room rather than a normal summer afternoon. Caveat:
    that band is a MILD August only, so retune after a real heat wave.


    SOURCE CAVEAT: sensor.hue_office_motion_sensor_temperature is WALL-mounted and
    cannot see inside the crate at floor level. In the bedroom, a bedside sensor ran
    ~+3.6F warmer than the Hue wall sensor, so crate level may be warmer than this
    trigger implies.


    NOT vacation-gated, deliberately — same reasoning as the Johnny geofence alert.
    This is a dog-safety alert, and a false ping while a sitter has him is cheaper
    than a missed one.


    V2 PLANS: (a) retune threshold against real heat-wave data; (b) add a tiered alert-level
    tracker per the Pollen Spike Alert / input_number.*_alert_level_reached pattern;
    (c) once a floor-level sensor exists in the office, repoint this trigger at it
    and add a separate CO2 branch scoped to the overnight crate window.'
  triggers:
  - above: 80
    entity_id: sensor.hue_office_motion_sensor_temperature
    for: 00:30:00
    id: office_hot
    trigger: numeric_state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.hue_office_motion_sensor_temperature'') not
      in [''unknown'', ''unavailable'', ''none'', ''''] }}'
  actions:
  - action: notify.mobile_app_iphone
    alias: Push heat warning to iPhone
    data:
      message: Office has been above 80°F for 30 minutes (now {{ states('sensor.hue_office_motion_sensor_temperature')
        }}°F). Wall sensor reading, so crate level may be warmer.
      title: ⚠️ Office is hot — Johnny
  mode: single
- id: '1786400794867'
  alias: Laundry — Dryer Cycle Finished (v2)
  description: 'v2 (2026-08-10): added in_bed deferral. Lara sometimes starts a load
    overnight and does not want a push waking her, but does want to know the load
    is sitting there when she gets up.


    Fires when binary_sensor.laundry_dryer_running (Threshold helper on sensor.dryer_current_consumption,
    upper 20 / hysteresis 5) drops to idle for 3 minutes. The Dryer KP115 idles at
    0.0-0.3 W and a running gas dryer pulls hundreds of watts, so the threshold needs
    no tuning.


    Anti-spam guard: the run must have lasted at least 10 minutes. End-of-cycle wrinkle-guard
    tumbles re-spin the drum for well under a minute and would otherwise fire a second
    and third ''finished'' push for the same load. The 10-minute floor discards them
    without needing a tier tracker.


    Deferral: if input_boolean.in_bed is on, the push is held. The finish time is
    stamped into input_datetime.laundry_dryer_finished_at and input_boolean.laundry_done_pending_dryer
    is raised. ''Laundry — Deferred Done Notice (v1)'' delivers it when in_bed clears.
    Helper-based rather than an overnight wait_for_trigger on purpose: a wait would
    not survive an HA restart, and this one has to hold for hours.


    Replaces the LUMI vibration sensor, confirmed dead 2026-08-10.


    TODO: mirror this whole structure for the washer once 192.168.1.242 authenticates,
    then add the wet-clothes nag (never overnight - nag clock starts at wake).


    2026-08-10 FIX: the finish-time stamp used to live ONLY in the in-bed branch,
    so a cycle finishing while awake never recorded a finish time and the Laundry
    dashboard showed a stale value. Stamping is now unconditional, matching the washer
    automation. Lara caught this on the dashboard.'
  triggers:
  - entity_id: binary_sensor.laundry_dryer_running
    for: 00:03:00
    from: 'on'
    to: 'off'
    platform: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
      >= 600 }}'
  actions:
  - variables:
      run_min: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
        / 60) | round(0) }}'
  - action: input_datetime.set_datetime
    alias: Stamp the finish time - always, not just when deferring
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    target:
      entity_id: input_datetime.laundry_dryer_finished_at
  - choose:
    - alias: Awake - notify immediately
      conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - action: script.notify_lara
        data:
          message: Cycle ran {{ run_min }} min and the dryer is back to idle.
          title: "\U0001F9FA Dryer finished"
    default:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.laundry_done_pending_dryer
  mode: single
- id: '1786401912246'
  alias: Laundry — Deferred Done Notice (v2)
  description: 'v2 (2026-08-10): now covers BOTH washer and dryer. Delivers laundry
    ''finished'' notifications held back because Lara was in bed.


    Why this exists: she sometimes starts a load overnight. She does not want a push
    at 2am, but does want to know a load is sitting when she gets up. The finishing
    automations stamp their datetime helper and raise their pending flag instead of
    pushing; this one drains whichever flags are set when input_boolean.in_bed clears.
    If both are pending it sends both messages.


    Deliberately helper-based rather than a wait_for_trigger in the finishing automations,
    because a wait would be lost on an HA restart and this hold can run for hours.


    Note it does NOT clear input_datetime.laundry_washer_finished_at - that timestamp
    stays live so ''Laundry — Wet Clothes Nag'' can start its clock now that she is
    awake. Per Lara: the nag clock starts at wake, never overnight.'
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    id: woke_up
    to: 'off'
    platform: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_washer
      state: 'on'
    - condition: state
      entity_id: input_boolean.laundry_done_pending_dryer
      state: 'on'
  actions:
  - alias: Washer branch
    if:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_washer
      state: 'on'
    then:
    - action: script.notify_lara
      data:
        message: It wrapped up at {{ (state_attr('input_datetime.laundry_washer_finished_at','timestamp')
          | float(0)) | timestamp_custom('%-I:%M %p', true) }}, about {{ ((as_timestamp(now())
          - (state_attr('input_datetime.laundry_washer_finished_at','timestamp') |
          float(0))) / 3600) | round(1) }} h ago. Wet clothes are still in there.
        title: "\U0001F9FC Washer finished overnight"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.laundry_done_pending_washer
  - alias: Dryer branch
    if:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_dryer
      state: 'on'
    then:
    - action: script.notify_lara
      data:
        message: It wrapped up at {{ (state_attr('input_datetime.laundry_dryer_finished_at','timestamp')
          | float(0)) | timestamp_custom('%-I:%M %p', true) }}, about {{ ((as_timestamp(now())
          - (state_attr('input_datetime.laundry_dryer_finished_at','timestamp') |
          float(0))) / 3600) | round(1) }} h ago. Clothes are still in there.
        title: "\U0001F9FA Dryer finished overnight"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.laundry_done_pending_dryer
  mode: single
- id: '1786402948315'
  alias: Bedroom — Vanity Mirror Off When I Leave Home (v1)
  description: 'v1 (2026-08-10): the vanity mirror on switch.vanity_plug (KP303 outlet,
    Bedroom Power Strip) has no physical button, so its only off switch is cutting
    power. If Lara forgets it on when she leaves, it burns all day. This power-cycles
    the outlet on departure: off, hold 15 s, back on. The mirror ends up dark and
    the outlet is left live so it works normally when she gets home.


    VERIFIED BEHAVIOUR, do not assume: on 2026-08-10 we cut the outlet for 12 s with
    the mirror lit and it came back DARK. That is the whole basis for this design.
    If the mirror is ever replaced, RE-TEST before trusting this - a fixture that
    resumes ON at power-up would make this automation switch the mirror on at every
    departure, the exact opposite of the intent. The KP303 has NO energy metering,
    so HA cannot detect the mirror''s state and cannot catch that regression on its
    own.


    Deliberately a separate automation rather than an addition to ''Turn off the lights
    when I leave home''. That one is gated on group.morning OR living-room lux, so
    it skips dark departures - precisely when a forgotten mirror is most likely. Same
    reasoning that split ''Speakers - Stop All When I Leave Home'' out on 2026-07-30.


    Not vacation-gated on purpose. calendar.vacation mutes personal comfort automations
    for the house-sitter, but this only ever triggers on Lara''s own departure, and
    a forgotten mirror matters MORE on a long absence, not less. Same exception class
    as the fridge and power-outage alerts.'
  triggers:
  - entity_id: person.lara_wiz
    event: leave
    trigger: zone
    zone: zone.home
  conditions: []
  actions:
  - action: switch.turn_off
    alias: Cut power to the vanity outlet
    target:
      entity_id: switch.vanity_plug
  - alias: Hold long enough for the mirror to fully de-energize (tested at 12 s)
    delay:
      seconds: 15
  - action: switch.turn_on
    alias: Restore the outlet so it is live when she gets home
    target:
      entity_id: switch.vanity_plug
  mode: single
- id: '1786409326281'
  alias: Laundry — Washer Cycle Finished (v2)
  description: 'v2 (2026-08-12): fixes a v1 bug where the anti-spam duration check
    only measured the FINAL on-burst before the washer went idle, not the whole cycle.
    trigger.from_state.last_changed only reflects the start of the most recent on-segment,
    so a Quick Wash whose last pre-idle segment was short (~8m50s here) fell under
    the 10-min floor and the finished push silently never fired, even though the full
    cycle ran ~37 min. Confirmed Aug 11 2026 ~8:52pm ET - caught only because Lara
    asked why she hadn''t gotten a push. See [[project_washer_alert_missed_antispam_bug]].


    v2 tracks session start explicitly via input_datetime.laundry_washer_started_at,
    stamped on the first off->on transition of a new session (gated by input_boolean.laundry_washer_active_session
    so mid-cycle flickers don''t re-stamp it), and compares the finish time against
    THAT instead of just the last burst.


    The 5-min trigger debounce and 10-min anti-spam floor themselves are unchanged
    - still validated by the measured washer profile (peak 148.7W, longest false sub-10W
    dip only 10s; see [[project_laundry_cycle_alerts]]). The bug was in what the floor
    was measured against, not the floor value.


    Session-active helper resets on every ''finished'' trigger regardless of whether
    the anti-spam check passes, so a short blip doesn''t leave the session stuck open
    and corrupt the next real cycle''s start-time stamp.


    Always stamps input_datetime.laundry_washer_finished_at, which is what the wet-clothes
    nag keys off. If in_bed is on, the push is deferred via input_boolean.laundry_done_pending_washer
    and delivered by ''Laundry — Deferred Done Notice'' when she gets up. Helper-based
    rather than wait_for_trigger because a wait would not survive an HA restart.


    The plug reached HA by being added via its IP address, NOT via the discovery card
    - its discovery beacon falsely advertises that it requires authentication. See
    project memory before ever re-adding it.


    Known gap, not yet guarded against: if HA restarts mid-cycle and misses the off->on
    or on->off event, input_boolean.laundry_washer_active_session can be left stuck
    in the wrong state, which would delay or skew the next session''s start stamp.'
  triggers:
  - entity_id: binary_sensor.washer_running
    from: 'off'
    id: started
    platform: state
    to: 'on'
  - entity_id: binary_sensor.washer_running
    for: 00:05:00
    from: 'on'
    id: finished
    platform: state
    to: 'off'
  conditions: []
  actions:
  - choose:
    - alias: Cycle started - stamp session start once per session
      conditions:
      - condition: trigger
        id: started
      - condition: state
        entity_id: input_boolean.laundry_washer_active_session
        state: 'off'
      sequence:
      - action: input_datetime.set_datetime
        alias: Stamp session start
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.laundry_washer_started_at
      - action: input_boolean.turn_on
        alias: Mark session active
        target:
          entity_id: input_boolean.laundry_washer_active_session
    - alias: Cycle finished - evaluate total run time and notify
      conditions:
      - condition: trigger
        id: finished
      sequence:
      - variables:
          run_min: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(states(''input_datetime.laundry_washer_started_at'')))
            / 60) | round(0) }}'
      - action: input_boolean.turn_off
        alias: Session over either way - reset for next run
        target:
          entity_id: input_boolean.laundry_washer_active_session
      - if:
        - condition: state
          entity_id: calendar.vacation
          state: 'off'
        - condition: template
          value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(states(''input_datetime.laundry_washer_started_at'')))
            >= 600 }}'
        then:
        - action: input_datetime.set_datetime
          alias: Stamp the finish time - drives the wet-clothes nag
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          target:
            entity_id: input_datetime.laundry_washer_finished_at
        - action: input_datetime.set_datetime
          alias: Stamp the permanent last-run record - never blanked, this is what
            Overview should read
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          target:
            entity_id: input_datetime.laundry_washer_last_run_at
        - choose:
          - alias: Awake - notify immediately
            conditions:
            - condition: state
              entity_id: input_boolean.in_bed
              state: 'off'
            sequence:
            - action: script.notify_lara
              data:
                message: Cycle ran {{ run_min }} min. Clothes are ready to move over.
                title: "\U0001F9FC Washer finished"
          default:
          - action: input_boolean.turn_on
            alias: In bed - defer the push until she is up
            target:
              entity_id: input_boolean.laundry_done_pending_washer
  mode: single
- id: '1786409377851'
  alias: Laundry — Wet Clothes Nag (v2)
  description: 'v1 (2026-08-10): repeat reminder that a finished load is still sitting
    wet in the washer.


    Lara''s explicit ruling: NEVER nag overnight. The nag clock starts at wake, not
    at the actual finish time. That is enforced by the in_bed condition rather than
    by any time window - if a load finishes at 2am she gets one ''finished overnight''
    note from ''Laundry — Deferred Done Notice'' when she gets up, and the nag only
    begins counting from whenever she is actually awake and the clothes are still
    sitting.


    Fires every 30 min once the load has been sitting 45+ min. Repeat rather than
    single-shot because Lara asked for a repeat reminder. It stops on its own when
    ''Laundry — Wet Clothes Cleared'' blanks the timestamp, which happens the moment
    the dryer or the washer starts.


    The ''nothing has moved'' signal is the dryer not running, per the design agreed
    with Lara. Also skipped if the washer itself is running again, so restarting a
    load does not nag.


    The timestamp sentinel: input_datetime.laundry_washer_finished_at is blanked to
    1970-01-01, so the template requires ts > 1000000000 (i.e. a real date after 2001)
    before nagging. Do not compare to 0 - a 1970 local-midnight timestamp is a negative
    or non-zero offset depending on timezone.


    v2 (2026-08-12): gated on person.lara_wiz == ''home''. Lara sometimes starts a
    load before leaving and does not want a repeat nag she cannot act on while at
    work (confirmed - got pinged at work, load finished 8:31am). The recurring 30-min
    check now only fires while she is home. Added an ''arrived_home'' trigger (person.lara_wiz
    -> ''home'', any prior state) so the nag fires promptly on arrival if the load
    is still sitting and every other gate (not vacation, awake, nothing running, 45+
    min elapsed) still holds, instead of waiting up to 30 min for the next scheduled
    tick. No change to the 45-min floor or the 30-min repeat cadence themselves -
    only when they''re allowed to fire.'
  triggers:
  - minutes: /30
    platform: time_pattern
  - id: arrived_home
    platform: state
    entity_id: person.lara_wiz
    to: home
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: binary_sensor.laundry_dryer_running
    state: 'off'
  - condition: state
    entity_id: binary_sensor.washer_running
    state: 'off'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.laundry_washer_finished_at'',''timestamp'')
      | float(0) %}{{ ts > 1000000000 and (as_timestamp(now()) - ts) >= 2700 }}'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - action: script.notify_lara
    alias: Nag
    data:
      message: Finished at {{ (state_attr('input_datetime.laundry_washer_finished_at','timestamp')
        | float(0)) | timestamp_custom('%-I:%M %p', true) }}, sitting {{ ((as_timestamp(now())
        - (state_attr('input_datetime.laundry_washer_finished_at','timestamp') | float(0)))
        / 60) | round(0) }} min now.
      title: "\U0001F9FC Wet clothes still in the washer"
  max_exceeded: silent
  mode: single
- id: '1786409383726'
  alias: Laundry — Wet Clothes Cleared (v1)
  description: 'v1 (2026-08-10): stops the wet-clothes nag by blanking input_datetime.laundry_washer_finished_at
    back to the 1970 sentinel.


    The ''clothes have moved'' signal is the dryer starting. Also clears when the
    washer starts again, since a new load means the previous one is out. Both are
    inferred from the KP115 power thresholds rather than any sensor on the machines
    themselves.


    Also drops the washer pending flag, so a load that finished overnight and was
    then moved before she woke up does not produce a stale ''finished overnight''
    push.


    Sentinel is 1970-01-01 00:00:00. The nag automation tests ts > 1000000000 rather
    than ts > 0, because a 1970 local-midnight timestamp is not zero in a non-UTC
    timezone.'
  triggers:
  - entity_id: binary_sensor.laundry_dryer_running
    from: 'off'
    id: dryer_started
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.washer_running
    from: 'off'
    id: washer_restarted
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    alias: Blank the finish timestamp
    data:
      datetime: '1970-01-01 00:00:00'
    target:
      entity_id: input_datetime.laundry_washer_finished_at
  - action: input_boolean.turn_off
    alias: Drop any undelivered washer notice
    target:
      entity_id: input_boolean.laundry_done_pending_washer
  mode: single
- id: '1786413232913'
  alias: AC — Away Eco / Restore on Presence (v5)
  description: 'Energy-saving setback for both Midea AC units when nobody human is
    home, restoring to the everyday eco preset AND the exact pre-away target when
    Lara gets back. Gated on calendar.vacation == off so a dog/house-sitter during
    a real vacation window never gets a silent setback (no person.* tracker exists
    for a sitter, so a sitter-covered vacation looks identical to ''house empty'').


    v5 (2026-08-14) — TWO BUGS FIXED, both found by tracing a real day.


    BUG 1: RACE ON binary_sensor.johnny_home_alone. On 2026-08-14 at 07:36:22.233
    Lara left zone.home, this automation triggered, and the inner choose read binary_sensor.johnny_home_alone
    at 07:36:22.2446 — it still said ''off''. That template sensor flipped to ''on''
    at 07:36:22.2513, SEVEN MILLISECONDS LATER, because it depends on person.lara_wiz
    and recomputes in the same event tick that triggered this automation. Net effect:
    the automation concluded the house was empty while Johnny was standing in it,
    and parked BOTH units at 80F for the whole day. Worse, the logbook message is
    a template that evaluates ~12s later, after the sensor caught up, so it logged
    ''Johnny home alone, mild eco setback'' while the actions had actually taken the
    deep branch — the log flatly contradicted the behaviour.


    Fix: stop reading the derived sensor here entirely and read person.johnny directly.
    person.johnny does not recompute off person.lara_wiz, so it is stable across the
    trigger tick (verified: it read ''home'' continuously on 2026-08-14 apart from
    one 53-second ''unknown'' Tractive blip at 11:10 unrelated to any departure).


    Also INVERTED THE FAIL-OPEN DIRECTION. In v4 the destructive 80F path was the
    choose DEFAULT, so any ambiguity fell through to it — that is what made a 7ms
    race cost a whole day. In v5 the deep setback is the explicitly-conditioned branch
    and requires positive confirmation that person.johnny is NOT in [home, unknown,
    unavailable]; the mild eco setback is the default. If we cannot tell where the
    dog is, he gets the comfortable house.


    BUG 2: THE 80F HAD NO RESTORE PATH. v4''s arrival branch only set preset_mode
    eco and assumed eco''s baked-in ~73F reference would override the stale explicit
    target. That assumption is FALSE and was disproven the same day: the living room
    sat at target 80 under preset eco from 08:06 until Lara hand-set 75 at 14:53,
    and climate.bedroom_ac was still at 80 with the room at 77F that evening. This
    is the exact lesson already written up for the LR bedtime setback on 2026-08-11
    — a setback that writes an explicit number needs a symmetric explicit restore,
    and the restore trigger must mirror how it was armed.


    Fix: two marker helpers, input_number.bedroom_ac_pre_away_temp and input_number.lr_ac_pre_away_temp.
    0 means ''no away setback active''; non-zero holds the exact pre-away target.
    The deep branch stores each unit''s target BEFORE writing 80 (guarded on the marker
    being below 0.5, so a second departure without an intervening arrival cannot overwrite
    the real base with 80). The restore branch writes the stored value back and zeroes
    the marker. If a restore is missed because a unit was unreachable, the marker
    survives and the NEXT arrival restores it — self-healing, no stuck state.


    Restore ordering: preset eco FIRST, then set_temperature LAST, so the explicit
    number is the final word. Verified empirically on 2026-08-14 that setting temperature
    under preset eco sticks on these units (Lara set 75 under eco at 14:53 and it
    held).


    Added trigger ''unit_recovered'' (either climate entity coming back from unavailable
    while she is home), mirroring the LR morning-restore design: without it, a unit
    that is offline at the moment she walks in never gets its number back.


    mode: queued (max 3) rather than single, because unit_recovered can fire twice
    in quick succession (both units returning together) and a dropped run would strand
    a marker.


    Midea command rules observed throughout (see project memory midea-ac-integration):
    hvac_mode BEFORE preset_mode, 3s between adjacent climate calls, and never preset
    ''away'' (it is freeze protection and flips the unit to dry).


    STILL OPEN, not fixed here: binary_sensor.johnny_home_alone''s own template uses
    is_state(''person.lara_wiz'',''not_home''), so it reads false whenever she is
    in ANY named zone (Work, vet, allergist). Being fixed separately. This automation
    no longer depends on it either way.'
  triggers:
  - entity_id: person.lara_wiz
    event: leave
    id: left_home
    trigger: zone
    zone: zone.home
  - entity_id: person.lara_wiz
    id: arrived_home
    not_from:
    - unknown
    - unavailable
    to: home
    trigger: state
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    from: unavailable
    id: unit_recovered
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - alias: LEAVING HOME — pick a setback depth
      conditions:
      - condition: trigger
        id: left_home
      sequence:
      - choose:
        - alias: Deep setback ONLY on positive confirmation the dog is not home —
            v5 fail-open inversion
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: person.johnny
              state:
              - home
              - unknown
              - unavailable
          sequence:
          - alias: Bedroom — remember the pre-away target, then deep setback to cool/none/80F
            if:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.bedroom_ac
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - alias: Store the pre-away target — only if no away setback is already
                active
              if:
              - below: 0.5
                condition: numeric_state
                entity_id: input_number.bedroom_ac_pre_away_temp
              then:
              - action: input_number.set_value
                data:
                  value: '{{ state_attr(''climate.bedroom_ac'',''temperature'') |
                    float(0) }}'
                target:
                  entity_id: input_number.bedroom_ac_pre_away_temp
            - action: climate.set_hvac_mode
              data:
                hvac_mode: cool
              target:
                entity_id: climate.bedroom_ac
            - delay:
                seconds: 3
            - action: climate.set_preset_mode
              data:
                preset_mode: none
              target:
                entity_id: climate.bedroom_ac
            - delay:
                seconds: 3
            - action: climate.set_temperature
              data:
                temperature: 80
              target:
                entity_id: climate.bedroom_ac
          - alias: Living room — same deep setback
            if:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.living_room_ac
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - alias: Store the pre-away target — only if no away setback is already
                active
              if:
              - below: 0.5
                condition: numeric_state
                entity_id: input_number.lr_ac_pre_away_temp
              then:
              - action: input_number.set_value
                data:
                  value: '{{ state_attr(''climate.living_room_ac'',''temperature'')
                    | float(0) }}'
                target:
                  entity_id: input_number.lr_ac_pre_away_temp
            - action: climate.set_hvac_mode
              data:
                hvac_mode: cool
              target:
                entity_id: climate.living_room_ac
            - delay:
                seconds: 3
            - action: climate.set_preset_mode
              data:
                preset_mode: none
              target:
                entity_id: climate.living_room_ac
            - delay:
                seconds: 3
            - action: climate.set_temperature
              data:
                temperature: 80
              target:
                entity_id: climate.living_room_ac
        default:
        - alias: Johnny is home, or we cannot confirm otherwise — cancel lingering
            Dry mode FIRST (hvac_mode clobbers preset on this integration)
          if:
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: climate.set_hvac_mode
            data:
              hvac_mode: cool
            target:
              entity_id: climate.bedroom_ac
          - delay:
              seconds: 3
        - action: climate.set_preset_mode
          alias: Mild eco setback, set LAST so it sticks
          data:
            preset_mode: eco
          target:
            entity_id:
            - climate.bedroom_ac
            - climate.living_room_ac
      - action: logbook.log
        alias: Log the setback depth actually chosen — reads the SAME entity the branch
          did, so it can never disagree again
        data:
          entity_id: climate.bedroom_ac
          message: Left home — {{ 'house empty (person.johnny = ' ~ states('person.johnny')
            ~ '), deep setback to cool/none/80F' if states('person.johnny') not in
            ['home','unknown','unavailable'] else 'Johnny home or location unconfirmed
            (person.johnny = ' ~ states('person.johnny') ~ '), mild eco setback' }}.{{
            ' Bedroom AC was off or unreachable, so this applied to the living room
            only.' if states('climate.bedroom_ac') in ['off','unavailable','unknown']
            else '' }}
          name: AC Away Eco
    - alias: BACK HOME (or a unit came back online while home) — restore eco AND the
        exact pre-away target
      conditions:
      - condition: trigger
        id:
        - arrived_home
        - unit_recovered
      - condition: state
        entity_id: person.lara_wiz
        state: home
      sequence:
      - alias: Capture the markers before anything zeroes them, for the restore values
          and the log
        variables:
          br_restore: '{{ states(''input_number.bedroom_ac_pre_away_temp'') | float(0)
            }}'
          lr_restore: '{{ states(''input_number.lr_ac_pre_away_temp'') | float(0)
            }}'
      - action: climate.set_preset_mode
        alias: Restore the everyday eco preset on both units
        data:
          preset_mode: eco
        target:
          entity_id:
          - climate.bedroom_ac
          - climate.living_room_ac
      - delay:
          seconds: 3
      - alias: Bedroom — put the exact pre-away target back, then clear the marker
        if:
        - above: 0.5
          condition: numeric_state
          entity_id: input_number.bedroom_ac_pre_away_temp
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.bedroom_ac
            state:
            - 'off'
            - unavailable
            - unknown
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ br_restore }}'
          target:
            entity_id: climate.bedroom_ac
        - delay:
            seconds: 3
        - action: input_number.set_value
          data:
            value: 0
          target:
            entity_id: input_number.bedroom_ac_pre_away_temp
      - alias: Living room — put the exact pre-away target back, then clear the marker
        if:
        - above: 0.5
          condition: numeric_state
          entity_id: input_number.lr_ac_pre_away_temp
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.living_room_ac
            state:
            - 'off'
            - unavailable
            - unknown
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ lr_restore }}'
          target:
            entity_id: climate.living_room_ac
        - delay:
            seconds: 3
        - action: input_number.set_value
          data:
            value: 0
          target:
            entity_id: input_number.lr_ac_pre_away_temp
      - action: logbook.log
        alias: Log the restore, naming the numbers actually put back
        data:
          entity_id: climate.bedroom_ac
          message: 'Back home — restored eco preset.{{ '' Bedroom target back to ''
            ~ br_restore ~ ''F.'' if br_restore > 0.5 else '' Bedroom had no away
            setback to undo.'' }}{{ '' Living room target back to '' ~ lr_restore
            ~ ''F.'' if lr_restore > 0.5 else '' Living room had no away setback to
            undo.'' }}{{ '' NOTE: bedroom AC unreachable, its restore was skipped
            and the marker was kept for next time.'' if states(''climate.bedroom_ac'')
            in [''unavailable'',''unknown''] else '''' }}'
          name: AC Away Eco
  max: 3
  mode: queued
- id: '1786413800292'
  alias: Bedroom AC — Gradual Warm Before Alarm (v2, Runs During Test Blocks)
  description: 'Warms the bedroom by 3°F over the 30 minutes before wake, in three
    1°F steps 15 minutes apart, landing the final step exactly at wake time - so the
    room isn''t cold enough to make staying in bed tempting. Mirrors the Sonos Wake
    Alarm''s calendar trigger pattern (calendar.master_calendar ''wake up'' event,
    offset before start) and its same guard rails: workday, in_bed on, calendar.vacation
    off, and a ''wake up'' summary filter so other early calendar events (flights,
    appointments) don''t trigger it.


    DELIBERATELY SKIPPED during an active AC Sweet-Spot test block (input_select.ac_sweet_spot_test_block
    in Block 1/Block 2) - Lara''s call, to avoid the ramp perturbing that test''s
    morning data. Only runs when the test is ''Not testing'' or ''Done''.


    Captures the target temperature at trigger time into a variable (base_temp) rather
    than reading it fresh at each step, so a stray change mid-ramp can''t compound.
    Skips entirely if the AC is off (nothing to warm from).


    v2 (2026-08-13): REMOVED the condition requiring input_select.ac_sweet_spot_test_block
    to be ''Not testing''/''Done''. That gate meant this automation had NEVER FIRED
    ONCE since it was built on 2026-08-11 — last_triggered was null — because the
    sweet-spot test block has been active continuously the whole time. Lara did not
    know the test was running and chose to keep it AND have the warm-up work during
    it, rather than trade one against the other.


    Why this does not wreck the experiment: the ramp reads the LIVE target via base_temp,
    so during a block it warms from that block''s own target (65F for Block 1, 62F
    for Block 2) rather than from some unrelated number. More importantly it applies
    identically on every test night in every block, so it is a constant, not a variable
    — it cannot bias the BETWEEN-block comparison (65 vs 62) that the experiment actually
    measures. It does slightly soften the absolute characterisation of ''a night at
    65F'', but only across the final 30 minutes before wake, and the room lags the
    setpoint badly enough (passive warming, compressor simply stops) that actual room
    temperature barely moves in that window.


    This is a deliberate, documented departure from the original design principle
    stated in the sweet-spot automation''s description, which forces preset ''none''
    specifically to avoid overnight setpoint drift. The distinction is that drift
    was uncontrolled and varied night to night; this ramp is fixed, identical, and
    now logged. The logbook line records the active test block at fire time so the
    confound is visible in the data.


    Self-corrects: during a block, the next bedtime fire re-applies the exact block
    temperature, so the +3F does not accumulate.'
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_prep
    offset: -0:30:00
    platform: calendar
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - alias: Only 'Wake up' calendar events
    condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower | trim)
      }}'
  actions:
  - variables:
      base_temp: '{{ state_attr(''climate.bedroom_ac'', ''temperature'') | float }}'
  - action: climate.set_temperature
    alias: Step 1 of 3 — +1°F
    data:
      temperature: '{{ base_temp + 1 }}'
    target:
      entity_id: climate.bedroom_ac
  - delay: 00:15:00
  - action: climate.set_temperature
    alias: Step 2 of 3 — +2°F
    data:
      temperature: '{{ base_temp + 2 }}'
    target:
      entity_id: climate.bedroom_ac
  - delay: 00:10:00
  - action: climate.set_temperature
    alias: Step 3 of 3 — +3°F, lands at wake time
    data:
      temperature: '{{ base_temp + 3 }}'
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.bedroom_ac
      message: 'Gradual wake warm-up complete — {{ base_temp }}°F → {{ base_temp +
        3 }}°F over 30 min. Sweet-spot block at the time: {{ states(''input_select.ac_sweet_spot_test_block'')
        }}.'
      name: Bedroom AC
  mode: single
- id: '1786413806767'
  alias: Living Room AC — Bedtime Setback (Unless Guests) (v3)
  description: 'At bedtime (in_bed on), sets the living room AC to eco preset and
    relaxes its target temperature up 3°F, so it''s not working to hold a full daytime-comfort
    temperature all night in an empty room - just enough to keep it from getting too
    warm. Entirely skipped if input_boolean.guests is on, so a guest still up in the
    living room isn''t left in a warming room. Gated on calendar.vacation off per
    house style section 8.


    v2, 2026-08-11 — two fixes:


    1. WRITES THE PRE-SETBACK TARGET to input_number.lr_ac_pre_setback_temp so its
    counterpart, ''Living Room AC — Morning Restore After Bedtime Setback (v1)'',
    can put the exact original value back in the morning. Before v2 nothing ever lowered
    the target again: the only automation that restored it fired on ARRIVING HOME,
    so on any day Lara did not leave and come back, the living room sat +3°F all day.
    Observed 2026-08-11: raised at 23:42, still 78°F at 07:08.


    2. NO LONGER COMPOUNDS. v1''s description claimed capturing base_temp into a variable
    prevented repeated triggers from stacking the +3°F. It did not - the variable
    is re-read from the entity on every run, so a second in_bed on would have gone
    75 -> 78 -> 81. The real guard is the new condition that input_number.lr_ac_pre_setback_temp
    is still 0, i.e. no setback is currently active. The morning restore zeroes it,
    which is what re-arms this automation for the next night.


    Also now skips if climate.living_room_ac is unavailable, which it and its bedroom
    sibling have both been doing intermittently.


    2026-08-13: added 3-second delays between adjacent climate.* calls. These Midea
    entities garble rapid-fire sequential commands — confirmed live on climate.living_room_ac,
    where this automation family''s no-delay sequence (hvac_mode -> preset none ->
    temperature) landed at 08:00:00 and left the unit reading preset ''eco'' instead
    of the ''none'' it had just been set to, while the same three calls issued manually
    with several seconds between them all stuck correctly. Same session also confirmed
    the separate, worse ''away'' preset bug — see the away-eco automation''s v4 note.'
  triggers:
  - entity_id: input_boolean.in_bed
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - alias: Only arm if no setback is already active
    below: 0.5
    condition: numeric_state
    entity_id: input_number.lr_ac_pre_setback_temp
  actions:
  - variables:
      base_temp: '{{ state_attr(''climate.living_room_ac'', ''temperature'') | float
        }}'
  - action: input_number.set_value
    alias: Remember the pre-setback target so the morning restore can put it back
      exactly
    data:
      value: '{{ base_temp }}'
    target:
      entity_id: input_number.lr_ac_pre_setback_temp
  - action: climate.set_preset_mode
    alias: Eco preset for the overnight setback
    data:
      preset_mode: eco
    target:
      entity_id: climate.living_room_ac
  - alias: Let the unit settle — these Midea entities clobber rapid sequential commands
    delay:
      seconds: 3
  - action: climate.set_temperature
    alias: Relax target +3°F — just enough, not full daytime comfort
    data:
      temperature: '{{ base_temp + 3 }}'
    target:
      entity_id: climate.living_room_ac
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.living_room_ac
      message: Bedtime setback — eco preset, {{ base_temp }}°F → {{ base_temp + 3
        }}°F. Stored {{ base_temp }}°F for the morning restore.
      name: Living Room AC
  mode: single
- id: '1786413963544'
  alias: Bedroom AC — Dry Mode While Getting Ready (v2, Humidity-Gated)
  description: 'On waking on a workday, switches climate.bedroom_ac to hvac_mode dry
    for the getting-ready stretch, so the room does not feel muggy while showering
    and dressing. Lara''s original request.


    v2 (2026-08-15) - WHY THIS CHANGED. v1 was schedule-based with no humidity check
    and no revert of its own, relying on ''Bedroom AC - Dry Mode Auto-Revert'' at
    the 1h30m mark. Dry mode on this Midea unit IGNORES THE SETPOINT (this is the
    same mechanism behind the preset ''away'' bug - see project memory midea-away-preset-dry-mode-bug),
    so for that whole stretch nothing was governing how cold the room got. On 2026-08-14
    it ran 05:50:38 to 07:20:38 and Lara left the house at 07:36 - meaning her entire
    getting-ready window ran with the unit uncontrolled, while she was standing at
    a vanity that sits directly beside it. She reported the bedroom as freezing. This
    automation was a contributing cause.


    v2 keeps the feature but constrains it three ways, all chosen by Lara 2026-08-15:


    1. HUMIDITY GATE. Only enters dry mode when sensor.airguard_humidity is above
    input_number.bedroom_dry_mode_humidity_threshold (default 58%). Bedroom RH measured
    51.5% on 2026-08-15 morning and 56% at the end of the 2026-08-14 dry run, so this
    will fire rarely. That is the intended outcome, not a bug: if it never fires,
    mugginess was never the real problem. The threshold is a helper precisely so Lara
    can tune it without editing YAML. Caveat worth remembering: RELATIVE humidity
    rises as a room cools, so the same absolute moisture reads higher at 62F than
    at 72F - do not read a high number in a cold room as proof the air is actually
    damp.


    2. COLD-ROOM GUARD. Requires sensor.hue_motion_sensor_2_temperature (the wall
    sensor beside the AC, i.e. the vanity side, and the one Lara named as the reference
    for this part of the room) to be ABOVE 68F before entering dry mode at all. Adding
    uncontrolled cooling to an already-cold room is exactly the failure this is fixing.


    3. SELF-REVERT WITH AN EARLY BAIL-OUT. Caps the stretch at 25 minutes instead
    of leaning on the 90-minute auto-revert, and returns to cool the instant the wall
    sensor drops below 68F, whichever comes first. Lara picked 68 as the bail-out
    point - 2F under the bottom of the 70-72 band she wants held on that side of the
    room.


    ''Bedroom AC - Dry Mode Auto-Revert (v1)'' is deliberately left in place as a
    backstop, for dry mode arriving from the remote or the Midea app rather than from
    here.


    Gated on calendar.vacation off per house style section 8; skips if the AC is off,
    unavailable or unknown.


    RELATED, NOT YET BUILT: the office-morning vanity window that holds the wall sensor
    at 70-72 was deferred by Lara on 2026-08-15. When it is built, this automation''s
    revert step should hand back to it rather than simply restoring cool.'
  triggers:
  - entity_id: input_boolean.in_bed
    id: woke
    to: 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - after: 04:30:00
    before: 08:00:00
    condition: time
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - above: input_number.bedroom_dry_mode_humidity_threshold
    condition: numeric_state
    entity_id: sensor.airguard_humidity
    note: Only bother if the air is actually damp. Tunable from the dashboard rather
      than hardcoded.
  - above: 68
    condition: numeric_state
    entity_id: sensor.hue_motion_sensor_2_temperature
    note: Never add uncontrolled cooling to an already-cold room. This is the wall
      sensor on the vanity side, next to the unit.
  actions:
  - action: climate.set_hvac_mode
    alias: Dry mode for the getting-ready window
    data:
      hvac_mode: dry
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log entry, with the readings that justified it
    data:
      entity_id: climate.bedroom_ac
      message: Dry mode on for getting ready. Humidity {{ states('sensor.airguard_humidity')
        }}% (threshold {{ states('input_number.bedroom_dry_mode_humidity_threshold')
        }}%), wall {{ states('sensor.hue_motion_sensor_2_temperature') }}F.
      name: Bedroom AC
  - alias: Hold for up to 25 min, but bail the moment the vanity side gets cold
    continue_on_timeout: true
    note: Dry mode ignores the setpoint, so a sensor watch is the only real protection.
      25 min is the hard cap; the 68F crossing ends it sooner.
    timeout: 00:25:00
    wait_for_trigger:
    - below: 68
      entity_id: sensor.hue_motion_sensor_2_temperature
      trigger: numeric_state
  - action: climate.set_hvac_mode
    alias: Back to cool either way
    data:
      hvac_mode: cool
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log the exit, and say which way it ended
    data:
      entity_id: climate.bedroom_ac
      message: Dry mode off, back to cool. Ended by {{ 'the 68F bail-out' if wait.completed
        else 'the 25 minute cap' }}. Wall now {{ states('sensor.hue_motion_sensor_2_temperature')
        }}F, bedside {{ states('sensor.airguard_temperature') }}F.
      name: Bedroom AC
  mode: single
- id: '1786446832933'
  alias: Living Room AC — Morning Restore After Bedtime Setback (v1)
  description: 'Closes the loop on ''Living Room AC — Bedtime Setback (Unless Guests)
    (v2)'', which raised the living room target +3°F at bedtime and had no exit. Found
    2026-08-11: the setback fired at 23:42 and the living room was still sitting at
    78°F at 07:08 the next morning, because the only thing that ever lowered it was
    ''AC — Away Eco / Restore on Presence (v1)'', which triggers on ARRIVING HOME
    and had never fired once (last_triggered null). On any day Lara does not leave
    the house and come back, the living room stayed on the overnight setback all day.


    Restores the exact pre-setback target rather than subtracting 3°F, because a blind
    -3 drifts if anything else touched the setpoint overnight. The setback writes
    its pre-setback value into input_number.lr_ac_pre_setback_temp; this automation
    reads it back and then zeroes it. A value of 0 in that helper means ''no setback
    currently active'', which is also what re-arms tomorrow night''s setback.


    Does NOT touch the preset. The setback sets eco, and eco is the everyday steady-state
    preset on both units, so there is nothing to undo there.


    Three triggers, all funnelling to the same restore: waking (the normal path),
    a 10:00 backstop for days in_bed never clears, and unit-recovered for the case
    where climate.living_room_ac was unavailable at wake time (it was unavailable
    for hours on 2026-08-11) and the restore had to be skipped. Without that third
    trigger a long outage would leave the helper stuck above 0 and permanently disarm
    the setback.


    Gated on calendar.vacation off per house style section 8. No guests gate needed:
    if guests were on, the setback never ran, so the helper is 0 and this exits on
    its own.'
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    id: woke_up
    to: 'off'
    trigger: state
  - at: '10:00:00'
    id: backstop
    trigger: time
  - entity_id: climate.living_room_ac
    from: unavailable
    id: unit_recovered
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - above: 0
    condition: numeric_state
    entity_id: input_number.lr_ac_pre_setback_temp
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room_ac
      state:
      - 'off'
      - unavailable
      - unknown
  actions:
  - variables:
      restore_temp: '{{ states(''input_number.lr_ac_pre_setback_temp'') | float }}'
      why: '{{ trigger.id | default(''manual'') }}'
  - action: climate.set_temperature
    alias: Put the target back exactly where it was before bedtime
    data:
      temperature: '{{ restore_temp }}'
    target:
      entity_id: climate.living_room_ac
  - action: input_number.set_value
    alias: Clear the marker so tonight's setback can arm again
    data:
      value: 0
    target:
      entity_id: input_number.lr_ac_pre_setback_temp
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.living_room_ac
      message: 'Morning restore — target back to {{ restore_temp }}°F (trigger: {{
        why }}).'
      name: Living Room AC
  mode: single
- id: alert_ac_unavailable
  alias: 'Alert: AC Offline / Restored'
  description: 'Fires when either Midea climate entity goes unreachable for 15 minutes,
    and again when it comes back.


    WHY THIS EXISTS: on 2026-08-10 at 22:38 climate.bedroom_ac went unavailable (midealocal
    ''Unable to connect'', config entry stuck in setup_retry) and nothing caught it
    for ~9 hours. Worse, the AC automations kept firing at the dead entity: HA''s
    climate services return WITHOUT error against an unavailable entity, so ''AC Sweet-Spot:
    Bedroom Bedtime Set'' logged ''Applied 65F to Bedroom AC'' and overwrote input_number.ac_sweet_spot_dial_setting
    to 65 when nothing reached the unit. That silently invalidated a Block 1 sweet-spot
    test night. The existing unavailable-entity monitor has buckets for sensor/binary_sensor/light/switch/button/zha/hue/mobile_app
    but NO climate bucket, so there was no path by which this surfaced.


    Three AC automations now carry an explicit ''not unavailable/unknown'' guard so
    they skip rather than pretend (sweet-spot bedtime set, dry-mode getting-ready,
    gradual warm before alarm). Those guards make the failure SILENT - this alert
    is the other half of that trade, and the two are meant to ship together. Do not
    remove one without revisiting the other.


    NOT vacation-gated (mirrors the fridge and power-outage alerts): a dead AC matters
    more when Lara is away and Johnny is home, not less.


    Includes the restore branch deliberately - see the Power Outage / Restoration
    Alert asymmetry, where the outage fired but the recovery never did.


    15-minute ''for:'' absorbs the brief reconnect blips both units show; it is not
    tuned to anything measured. If this turns out to be chatty, raise it rather than
    deleting the automation.'
  triggers:
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    for: 00:15:00
    id: ac_offline
    to: unavailable
    trigger: state
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    from: unavailable
    id: ac_restored
    not_to:
    - unknown
    trigger: state
  actions:
  - choose:
    - alias: Unit went dark
      conditions:
      - condition: trigger
        id: ac_offline
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: '{{ trigger.to_state.attributes.friendly_name | default(''An AC'')
            }} has been unreachable for 15 min. Its automations will skip instead
            of firing at a dead entity.'
          title: ⚠️ AC offline
    - alias: Unit came back
      conditions:
      - condition: trigger
        id: ac_restored
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: '{{ trigger.to_state.attributes.friendly_name | default(''An AC'')
            }} reconnected — now {{ trigger.to_state.state }}.'
          title: ✅ AC back online
  mode: single
- id: '1786621047539'
  alias: Set WFH Today Flag from Wake-Up Calendar
  description: Reads the description field on the daily 'Wake up' event on calendar.master_calendar
    ('WFH' vs 'office') and sets input_boolean.wfh_today accordingly. Feeds the WFH-specific
    AC automations (Bedroom AC WFH Away Preset, Living Room AC WFH Comfort Hold) so
    they know whether today is a stay-home workday. Fires at the wake event's start
    time (typically 6-7am), which is before the 8am AC automations check the flag.
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_event
    platform: calendar
  conditions:
  - condition: template
    value_template: '{{ trigger.calendar_event.summary == ''Wake up'' }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''wfh'' in (trigger.calendar_event.description | default('''')
          | lower) }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wfh_today
      - action: logbook.log
        data:
          entity_id: input_boolean.wfh_today
          message: Set ON — Wake up event description says WFH.
          name: WFH Today
    - conditions:
      - condition: template
        value_template: '{{ ''office'' in (trigger.calendar_event.description | default('''')
          | lower) }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wfh_today
      - action: logbook.log
        data:
          entity_id: input_boolean.wfh_today
          message: Set OFF — Wake up event description says office.
          name: WFH Today
  mode: single
- id: '1786621049944'
  alias: Bedroom AC — WFH Warm Setback 78F (v2)
  description: 'At 8am on a WFH workday, parks climate.bedroom_ac at cool / preset
    none / 78F so it idles all day but still catches a real heat spike.


    v2 (2026-08-13, same day as v1): v1 used preset_mode ''away''. On Midea, ''away''
    is FREEZE PROTECTION, not a cooling setback. Confirmed live from history: at 08:00:00
    the set_hvac_mode ''cool'' step landed correctly (cool/eco/65), then the very
    next set_preset_mode ''away'' call knocked the unit into hvac_mode ''dry'' with
    preset ''none''. Dry mode ignores the setpoint, so it ran 7.5h and held the bedroom
    at 60F against a 65F target. v1''s own ''cancel lingering dry mode'' step worked
    and was then undone by the next line.


    v2 therefore: no preset ''away'' anywhere. Explicit preset ''none'' (NOT eco -
    eco has a baked-in ~73F reference that overrides an explicit target) plus set_temperature
    78. 78 chosen with Lara: high enough to idle, low enough that the bedtime pull-down
    to 65 isn''t a long expensive recovery. Short delays between calls because these
    Midea entities clobber rapid sequential commands.'
  triggers:
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: input_boolean.wfh_today
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  actions:
  - alias: Cancel any lingering Dry mode first
    action: climate.set_hvac_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      hvac_mode: cool
  - delay:
      seconds: 3
  - alias: Clear eco so its baked-in ~73F reference can't override the target
    action: climate.set_preset_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      preset_mode: none
  - delay:
      seconds: 3
  - alias: Park it warm
    action: climate.set_temperature
    target:
      entity_id: climate.bedroom_ac
    data:
      temperature: 78
  mode: single
- id: '1786621053491'
  alias: Living Room AC — WFH Comfort Hold 74F (v2)
  description: 'On a WFH day (input_boolean.wfh_today on), holds climate.living_room_ac
    at Cool/preset none/74F starting at 8am so it stays at Lara''s chosen comfortable-but-efficient
    balance for a full day of occupancy, rather than drifting per eco''s own baked-in
    ~73F reference (see [[project_midea_ac_integration]] eco-preset finding). Uses
    preset none + explicit set_temperature so 74F actually holds. Naturally converges
    back to the normal eco+bedtime-setback routine when the existing ''Living Room
    AC — Bedtime Setback'' automation fires on in_bed, so no separate revert step
    is needed. Follows the hvac_mode-before-preset_mode ordering rule.


    2026-08-13: added 3-second delays between adjacent climate.* calls. These Midea
    entities garble rapid-fire sequential commands — confirmed live on climate.living_room_ac,
    where this automation family''s no-delay sequence (hvac_mode -> preset none ->
    temperature) landed at 08:00:00 and left the unit reading preset ''eco'' instead
    of the ''none'' it had just been set to, while the same three calls issued manually
    with several seconds between them all stuck correctly. Same session also confirmed
    the separate, worse ''away'' preset bug — see the away-eco automation''s v4 note.'
  triggers:
  - at: 08:00:00
    platform: time
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: input_boolean.wfh_today
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room_ac
      state:
      - 'off'
      - unavailable
      - unknown
  actions:
  - action: climate.set_hvac_mode
    alias: Ensure Cool mode
    data:
      hvac_mode: cool
    target:
      entity_id: climate.living_room_ac
  - alias: Let the unit settle — these Midea entities clobber rapid sequential commands
    delay:
      seconds: 3
  - action: climate.set_preset_mode
    alias: Preset none so eco's internal ~73F reference doesn't override our target
    data:
      preset_mode: none
    target:
      entity_id: climate.living_room_ac
  - alias: Let the unit settle — these Midea entities clobber rapid sequential commands
    delay:
      seconds: 3
  - action: climate.set_temperature
    alias: Hold at Lara's chosen WFH comfort/efficiency balance
    data:
      temperature: 74
    target:
      entity_id: climate.living_room_ac
  - action: logbook.log
    data:
      entity_id: climate.living_room_ac
      message: WFH day — holding at 74F for all-day occupancy.
      name: Living Room AC
  mode: single
- id: '1786622040291'
  alias: 'Location: Log Scotch Rd Plaza Visit (Groomer vs Salon, Heuristic)'
  description: 'Donna''s Hair Studio (181 Scotch Rd) and Dog Wash Depot (185 Scotch
    Rd) geocode to essentially the same point, so a second zone/radius can''t tell
    them apart — both resolved to ~40.2745,-74.8047 via web search. Single combined
    zone.scotch_rd_plaza (radius 90m) instead, with a single choose-branched automation
    to avoid a race between two separate triggers on the same dwell event.


    Triggers on device_tracker.iphone dwelling in the zone for 1 min (mirrors [[project_location_visit_logs]]
    Vet/Allergist pattern — device_tracker.iphone not person.lara_wiz, since the person
    entity''s other trackers pin it home).


    Branch logic (Lara''s own disambiguation, confirmed against a real Tractive attribute):

    - person.johnny also reads ''Scotch Rd Plaza'' at the same time -> he''s with
    her (collar on, tagged along) -> Hair Salon visit.

    - person.johnny is elsewhere (collar off, so no GPS match) AND binary_sensor.johnny_tracker_battery_charging
    is on -> groomers don''t allow collars in, so Lara pulls it and it goes on the
    charger while he''s dropped off -> Groomer visit.

    - person.johnny elsewhere AND tracker NOT charging -> default/fallback -> solo
    Hair Salon visit (she went without him, collar just isn''t on the charger for
    some other reason).


    This is a HEURISTIC, not a certainty — the charging signal is ''odds are'', not
    guaranteed (Lara''s own words). Not yet live-tested against a real visit of either
    kind. 3h dedupe via last_triggered, shared across all three branches (one dwell
    = one visit). NOT vacation-gated, matches Vet/Allergist precedent (visits worth
    logging regardless).'
  triggers:
  - entity_id: device_tracker.iphone
    for: 00:01:00
    platform: state
    to: Scotch Rd Plaza
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 10800 }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''person.johnny'') == ''Scotch Rd Plaza'' }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.hair_salon_visits
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.hair_salon_last_visit
      - action: logbook.log
        data:
          entity_id: input_datetime.hair_salon_last_visit
          message: Hair salon visit — Johnny came along.
          name: Personal Log
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: passive
          message: Logged at {{ now().strftime('%-I:%M %p') }}. Johnny tagged along.
          title: "\U0001F487 Hair salon visit logged"
    - conditions:
      - condition: template
        value_template: '{{ states(''person.johnny'') != ''Scotch Rd Plaza'' and is_state(''binary_sensor.johnny_tracker_battery_charging'',
          ''on'') }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.groomer_visits
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.groomer_last_visit
      - action: logbook.log
        data:
          entity_id: input_datetime.groomer_last_visit
          message: 'Groomer visit (heuristic: Johnny not with you, tracker charging).'
          name: Pet Log
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: passive
          message: Logged at {{ now().strftime('%-I:%M %p') }} — Johnny not with you
            + tracker charging. Collar's at {{ states('sensor.johnny_tracker_battery')
            }}% right now. Correct me if that's wrong.
          title: "\U0001F43E Groomer visit logged (best guess)"
    default:
    - action: counter.increment
      target:
        entity_id: counter.hair_salon_visits
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.hair_salon_last_visit
    - action: logbook.log
      data:
        entity_id: input_datetime.hair_salon_last_visit
        message: Hair salon visit — solo, Johnny stayed home.
        name: Personal Log
    - action: notify.mobile_app_iphone
      data:
        data:
          push:
            interruption-level: passive
        message: Logged at {{ now().strftime('%-I:%M %p') }}. Solo trip.
        title: "\U0001F487 Hair salon visit logged"
  mode: single
- id: '1786623005090'
  alias: Johnny's Collar — 80% Charge Nudge (v1)
  description: 'Lara''s request: she usually forgets the collar''s on the charger
    until Tractive''s own ''fully charged'' push fires, but 80% is plenty for a typical
    month of use (her estimate) so she''d rather get a nudge at 80% and decide then
    whether to pull it or let it finish. Fires once per charge cycle via numeric_state''s
    cross-above semantics (only fires on the 79->80+ crossing, not every update while
    sitting above it). Gated on binary_sensor.johnny_tracker_battery_charging so it
    only fires during an actual charge session, not if the reading happens to sit
    at/above 80% while idle off the charger. Complements, doesn''t replace, the Tractive
    app''s own low-battery and full-charge alerts (Lara''s words) — this just adds
    the mid-point decision nudge the app doesn''t have. Not vacation-gated — collar
    charging is a house-maintenance thing, not presence-dependent.'
  triggers:
  - above: 79
    entity_id: sensor.johnny_tracker_battery
    platform: numeric_state
  conditions:
  - condition: state
    entity_id: binary_sensor.johnny_tracker_battery_charging
    state: 'on'
  actions:
  - action: notify.mobile_app_iphone
    data:
      data:
        push:
          interruption-level: passive
      message: Currently {{ states('sensor.johnny_tracker_battery') }}%. Should cover
        a typical month — pull it now or let it finish charging.
      title: "\U0001F50B Johnny's collar hit 80%"
  mode: single
- id: bedroom_ac_dry_mode_auto_revert_v1
  alias: Bedroom AC — Dry Mode Auto-Revert (v1)
  description: 'Backstop for the dry-mode-lingers class of bug. Built 2026-08-13 after
    the bedroom sat in dry mode 08:00-15:30 and drifted to 60F.


    Dry mode does not respect the target temperature - it just runs the compressor
    to dehumidify - so anything that leaves it on indefinitely overcools the room.
    The ''Dry Mode While Getting Ready'' automation has no revert of its own and relied
    on the leave-home automation to reset it, which never fires on a stay-home day.


    This is deliberately entity-state-triggered rather than bolted onto the getting-ready
    automation, so it also catches dry mode set by the remote, by the app, or by any
    future automation. 90 minutes is well past a getting-ready stretch.'
  triggers:
  - trigger: state
    entity_id: climate.bedroom_ac
    to: dry
    for:
      hours: 1
      minutes: 30
  conditions: []
  actions:
  - alias: Back to cool - dry mode has run long enough
    action: climate.set_hvac_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      hvac_mode: cool
  mode: single
- id: bedroom_night_setpoint_manager_v1
  alias: Bedroom AC — Night Setpoint Manager (v3)
  description: 'Single owner of climate.bedroom_ac''s dial from the evening ramp through
    to wake. Built 2026-08-15 after Lara woke into a 62F bedroom: on the night of
    2026-08-14 the dial was parked at 61F (the unit''s minimum) as a fixed overnight
    hold, and NOTHING released it, because every automation that raises the bedroom
    target is gated either on binary_sensor.workday being on or on her physically
    leaving zone.home. On a Saturday at home, all of them sat out.


    TWO PHASES, both derived from state rather than from a chain of delays, so an
    HA restart mid-night cannot strand the room at the wrong number.


    1. EVENING RAMP. From 19:00 on nights before a workday (input_boolean.workday_tomorrow
    on) or 20:00 otherwise, steps the dial down 1F every 15 minutes until it reaches
    65F. Lara asked for 19:00 on work nights specifically, ''should be less work that
    way'' - from a daytime 76 that is a ~2h45m descent, and finishing earlier means
    the compressor never has to blast. This deliberately tracks the measured pull-down
    rate (project memory ac-pulldown-rate: ~2F in the first hour, then under 0.5F/hr),
    so the dial never runs far ahead of what the room can physically do.


    2. IN-BED CLIMB. Once input_boolean.in_bed is on, holds 65F and adds 1F every
    90 minutes, capped at 68F. Lara''s words: ''65 until in_bed starts, can slowly
    climb to 68 over the evening.'' Computed as floor + (minutes since in_bed last_changed
    // 90) rather than as a sequence of delays, so it is idempotent - every 15-minute
    tick recomputes the correct number and writes only when the dial disagrees.


    v2 (2026-08-15 evening) - PRESET RESCUE BUGFIX. Found the same evening v1 shipped,
    when ''Bedroom - Heat Alert'' fired at 18:51 and set preset ''boost'' on this
    unit. In v1 the preset-clearing step sat INSIDE the ''only act if the dial needs
    to move'' branch, so a rogue preset could only ever be cleared on a tick that
    also happened to change the number. The failure that matters is not tonight''s:
    it is a heat alert firing at, say, 22:30 when the ramp has already parked the
    dial at 65. desired would equal cur, the run would stop, and preset ''boost''
    would sit there blasting the room all night with nothing to clear it. Restructured
    so the run is gated on BEING IN A WINDOW rather than on the number changing: inside
    a window it now asserts preset ''none'' first, then writes the number only if
    it actually differs. Outside both windows it still stops immediately and touches
    nothing, which is deliberate - a legitimate heat-alert boost during the day must
    be allowed to do its job.


    WHY last_triggered IS USELESS ON THIS AUTOMATION, and what to read instead. The
    15-minute time_pattern fires whether or not there is anything to do, so `last_triggered`
    always reads a few minutes ago and carries no information - unlike every other
    automation on the AC dashboard. The dial-writing branch therefore stamps input_datetime.bedroom_night_setpoint_last_change,
    which only moves when the dial ACTUALLY changed. Read that, not last_triggered.
    An input_datetime survives restarts and is untouched by unavailable blips, per
    the HA best-practices note on for:/last_changed resets.


    WHY THIS REPLACES THE SWEET-SPOT BEDTIME AUTOMATION: automation.ac_sweet_spot_bedroom_bedtime_set_v1
    was deleted 2026-08-15 with Lara''s approval. Its non-testing branch applied preset
    ''sleep'', which raises the target ~3.6F over the first two hours on the unit''s
    own internal curve - a second, uncontrollable version of this climb running at
    a different rate against the same dial. The sleep-temp experiment it served is
    already resolved (project memory bedroom-temp-sleep-pattern-check: 70 nights,
    cool-is-better NOT supported). Its 19:00/21:00 workday prime is superseded by
    this ramp, which also covers weekends - something the old one never did.


    75F IS SKIPPED DELIBERATELY. Verified live 2026-08-15: climate.set_temperature
    75 on climate.bedroom_ac reads back 73, reproducibly, twice in a row; 76 lands
    exactly. climate.living_room_ac did the same 75-to-73 thing on 2026-08-13 and
    it was written off then as a status-poll race. It is not a race - it reproduces
    on both units. The descending ramp therefore steps 76 straight to 74.


    PRESET DISCIPLINE. Forces hvac_mode cool then preset none before writing a number,
    but only when the preset is not already none, so an ordinary tick is a single
    state read and no service calls. This matters because preset ''eco'' carries a
    baked-in ~73F reference that overrides an explicit set_temperature - if away-eco
    left the unit in eco, every number written here would be silently ignored. Call
    ordering and the 3-second spacing follow the three hard rules in project memory
    midea-ac-integration.


    GATES: calendar.vacation off per house style section 8; person.lara_wiz home,
    so it neither ramps an empty house nor fights ''AC - Away Eco / Restore on Presence''
    while she is out; AC not off/unavailable/unknown; plus a native numeric_state
    floor on the target attribute, so an unreachable unit reporting None cannot be
    read as 0 and force a spurious 65.


    NOT YET BUILT - deferred by Lara 2026-08-15: the office-morning vanity window
    (Hue wall sensor held 70-72 while she does makeup right next to the unit) and
    the daytime release to 76. Until those exist, weekend daytime sits wherever this
    automation leaves it. Also still open: away-eco puts the bedroom into eco (~73F)
    on departure rather than the 76 she asked for, The heat alert''s suppression gate
    is NO LONGER open: it was raised from ''target < 77'' to ''target < 76'' as v8
    on the evening of 2026-08-15, with Lara''s approval, so a deliberate 76F daytime
    hold now suppresses it. The 18:51 firing that day happened under the old gate,
    where 76 < 77 passed. Verified across setpoints: dial 65/68/71/74 alert, dial
    76/78/80 suppressed. The float(70) default is unchanged and deliberate - an unreachable
    unit still alerts, because if we cannot tell, alert. (Description corrected 2026-08-16;
    no logic change.)


    v3 (2026-08-16) - THE in_bed SINGLE POINT OF FAILURE IS CLOSED. Found by inspection
    the morning after: on the night of 2026-08-15 (Sat) input_boolean.in_bed NEVER
    TURNED ON - verified from history, one single ''off'' state across the entire
    window - so the in-bed climb never ran. The evening ramp parked the dial at 65
    at 22:00 and it sat there for ~15 hours. The room fell from 76.3F at 20:00 to
    64.9F by 12:50 the next day. This is the SAME CLASS of failure as the 62F morning
    that prompted v1: a leg of the design that only runs if some other thing fires,
    with no path when it doesn''t. The 03:30 in_bed fallback that catches this exists
    but is WORK-NIGHT ONLY (see project memory alarm-in-bed-fallback), so Saturday
    night has no catcher at all.


    THE FIX: a VIRTUAL BEDTIME ANCHOR. When in_bed is off but the clock is past input_datetime.bedroom_virtual_bedtime
    (default 23:00, tunable without touching this template), the climb runs anyway,
    anchored to that time instead of to in_bed.last_changed. Same shape as before:
    65 at the anchor, +1F per 90 min, capped at 68, so a no-in_bed night now lands
    on 68 by 03:30 exactly as a normal night does. A real in_bed still WINS - that
    branch is tested first - so setting bedtime at 23:30 anchors on 23:30, not on
    23:00.


    ONE DELIBERATE DIFFERENCE from the in_bed branch: the virtual branch steps DOWN
    gradually rather than jumping. If the dial is still above the climb target when
    the anchor passes (e.g. the AC was switched on late at 76), it steps -1F per tick
    toward the target instead of slamming to 65. The in_bed branch jumps on purpose
    (''jump straight to 65 at bedtime''), because that is an explicit user action;
    the virtual anchor is not, so it stays gradual and keeps tracking the measured
    pull-down rate. The 75-skip still applies on the way down - verified in simulation,
    a 76 dial at 23:10 goes to 74, not 75.


    Verified by simulation across 8 cases before writing: 21:00/cur70 -> 69 (ramp
    intact), 22:45/cur65 -> 65 (holds at floor), 23:00 -> 65, 00:30 -> 66, 02:00 ->
    67, 03:30 -> 68 (capped), 23:10/cur76 -> 74 (75 skipped), 00:00/cur74 -> 73 (still
    descending, does not jump up to the climb target).


    in_window now also opens on the virtual-bedtime clock, so a virtual bedtime set
    EARLIER than the 19:00/20:00 ramp start still gets a window rather than silently
    computing a number the run then discards. phase now reports ''virtual-bedtime
    climb'' as a third value, so the logbook line says which of the three paths moved
    the dial.


    STILL TRUE IN v3: read input_datetime.bedroom_night_setpoint_last_change, NOT
    last_triggered. Note the daytime release automation added the same day (Bedroom
    AC - Daytime Release to 76) deliberately does NOT stamp that helper, so it stays
    a clean signal for THIS automation only.'
  triggers:
  - id: tick
    minutes: /15
    note: Every quarter hour. The action recomputes from scratch and no-ops when nothing
      needs changing, so a missed tick self-heals on the next one. This is also why
      last_triggered is meaningless here - see the description.
    trigger: time_pattern
  - entity_id: input_boolean.in_bed
    id: got_in_bed
    note: Jump straight to 65 at bedtime instead of waiting up to 15 minutes for the
      next tick.
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    note: Do not ramp an empty house, and do not fight away-eco while she is out.
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - above: 55
    attribute: temperature
    condition: numeric_state
    entity_id: climate.bedroom_ac
    note: 'An unreachable unit reports None for the target. numeric_state evaluates
      false on None, which is the fail-safe direction: do nothing rather than write
      a number based on a missing reading.'
  actions:
  - alias: Work out whether this automation owns the dial right now, and what the
      number should be
    note: in_bed wins over the clock, so getting into bed early ends the ramp immediately.
    variables:
      cur_temp: '{{ state_attr(''climate.bedroom_ac'',''temperature'') | float(0)
        }}'
      desired: '{% set ns = namespace(d = 0) %}{% set floor_t = 65 %}{% set ceil_t
        = 68 %}{% set cur = state_attr(''climate.bedroom_ac'',''temperature'') | float(0)
        %}{% set start_h = 19 if is_state(''input_boolean.workday_tomorrow'',''on'')
        else 20 %}{% set vb = states(''input_datetime.bedroom_virtual_bedtime'') if
        states(''input_datetime.bedroom_virtual_bedtime'') not in [''unknown'',''unavailable'']
        else ''23:00:00'' %}{% set vb_t = state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800) %}{% set now_t = now().hour * 3600 + now().minute * 60 + now().second
        %}{% if is_state(''input_boolean.in_bed'',''on'') %}{% set mins = (now() -
        states.input_boolean.in_bed.last_changed).total_seconds() / 60 %}{% set ns.d
        = [ floor_t + ((mins // 90) | int), ceil_t ] | min %}{% elif now_t >= vb_t
        or now().hour < 4 %}{% set anchor = today_at(vb) if now_t >= vb_t else today_at(vb)
        - timedelta(days=1) %}{% set mins = (now() - anchor).total_seconds() / 60
        %}{% set target = [ floor_t + ((mins // 90) | int), ceil_t ] | min %}{% set
        ns.d = ([ target, cur - 1 ] | max) if cur > target else target %}{% elif now().hour
        >= start_h %}{% set ns.d = [ floor_t, cur - 1 ] | max %}{% else %}{% set ns.d
        = cur %}{% endif %}{{ (74 if ns.d == 75 else ns.d) | round(0) | int }}'
      in_window: '{{ is_state(''input_boolean.in_bed'',''on'') or now().hour >= (19
        if is_state(''input_boolean.workday_tomorrow'',''on'') else 20) or now().hour
        < 4 or (now().hour * 3600 + now().minute * 60 + now().second) >= (state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800)) }}'
      phase: '{% if is_state(''input_boolean.in_bed'',''on'') %}in-bed climb{% elif
        (now().hour * 3600 + now().minute * 60 + now().second) >= (state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800)) or now().hour < 4 %}virtual-bedtime climb{% else %}evening ramp{%
        endif %}'
  - alias: Stop unless this automation owns the dial right now
    condition: template
    note: 'v2: the run is gated on being in a window, NOT on the number needing to
      change. Outside both windows nothing below here runs, so a daytime heat-alert
      boost is left alone to do its job.'
    value_template: '{{ in_window }}'
  - alias: Inside a window, assert preset none even if the number is already right
    if:
    - condition: not
      conditions:
      - attribute: preset_mode
        condition: state
        entity_id: climate.bedroom_ac
        state: none
    note: eco's baked-in ~73F reference and the heat alert's 'boost' both override
      or ignore an explicit number. This is the step that makes the dial trustworthy
      inside a window.
    then:
    - action: climate.set_hvac_mode
      data:
        hvac_mode: cool
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: climate.set_preset_mode
      data:
        preset_mode: none
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: logbook.log
      alias: Say so, since this is a rescue rather than routine
      data:
        entity_id: climate.bedroom_ac
        message: Cleared a preset that was not 'none' during the {{ phase }} and took
          the dial back.
        name: Night Setpoint
  - alias: Write the step, but only when the number actually differs
    if:
    - condition: template
      value_template: '{{ (desired | float(0)) != (cur_temp | float(0)) }}'
    then:
    - action: climate.set_temperature
      data:
        temperature: '{{ desired | int }}'
      target:
        entity_id: climate.bedroom_ac
    - action: input_datetime.set_datetime
      alias: Stamp the real change, since last_triggered cannot tell you this
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      target:
        entity_id: input_datetime.bedroom_night_setpoint_last_change
    - action: logbook.log
      alias: Log it so the night's shape is auditable after the fact
      data:
        entity_id: climate.bedroom_ac
        message: '{{ phase }}: {{ cur_temp | int }}F to {{ desired | int }}F. Bedside
          {{ states(''sensor.airguard_temperature'') }}F, wall {{ states(''sensor.hue_motion_sensor_2_temperature'')
          }}F.'
        name: Night Setpoint
  max_exceeded: silent
  mode: single
- id: bedroom_ac_daytime_release_76_v1
  alias: Bedroom AC — Daytime Release to 76 (v2)
  description: 'Releases the bedroom dial from its overnight setback up to 76F once
    the night is over. Built 2026-08-16 alongside Night Setpoint Manager v3, after
    the night of 2026-08-15 left the dial at 65 and NOTHING raised it: the night manager
    is deliberately out of window between 04:00 and the 19:00/20:00 ramp, so it stops
    immediately and touches nothing, and no other automation owns the bedroom dial
    during the day. Verified consequence: bedside 64.9F and wall 63.1F at 12:50 on
    a Sunday, with the unit still actively cooling. This is deferred item 2 from project
    memory bedroom-ac-night-rules (''daytime release to 76''), which became unblocked
    when heat alert v8 moved its suppression gate from ''target < 77'' to ''target
    < 76''.


    WHY 76 AND NOT 75: Lara''s rule is ''weekend / day off: on getting up, rise to
    about 75 at the bed'' and ''office day, after she leaves: rise to 75-76 at the
    bed''. 75 is UNSETTABLE on both Midea units - writing 75 reads back 73, reproducibly,
    verified twice on 2026-08-15 - so ''about 75'' translates to 76 everywhere in
    this config. A dial of 76 in cool mode already IS ''let it rise, then cool mildly
    above 76'', so no extra logic is needed beyond the number.


    TWO TRIGGERS, AND WHY EACH EXISTS.


    1. got_up - input_boolean.in_bed going on->off. This is the clean ''she is up''
    signal and it covers the weekend rule directly. It is gated on binary_sensor.workday
    being OFF. That gate is deliberate and load-bearing: on a WORK day she does not
    want 76 at wake, she wants the wall sensor held at 70-72 while she does her makeup
    at the vanity, which ''sits right next to the air conditioner''. That office-morning
    vanity window is still NOT BUILT (deferred item 1). Until it exists, a workday
    morning between wake and 09:00 sits wherever the night left it - that is a known
    gap, not an oversight, and building the vanity window is what closes it.


    2. backstop - a plain 09:00 time trigger with no workday gate. This is the leg
    that would have caught the 2026-08-15 failure. It covers BOTH the workday case
    (she has left by ~07:36, so 76 is exactly right) AND any night where in_bed was
    never set at all, in which case got_up can never fire because there is no on->off
    transition to fire on. A fix that depended on in_bed would have reproduced the
    very bug it was written for.


    IT ONLY RAISES, NEVER LOWERS. The dial is written only when it currently reads
    BELOW 76. If Lara has deliberately set 78, this leaves 78 alone. Silently overriding
    a hand-set number is the worse failure here - she demonstrably sets the dial by
    hand, and the 18:51 incident on 2026-08-15 is on record as a manual 76 tripping
    a deferred automation fix. KNOWN CONSEQUENCE of that choice: if away-eco''s restore-on-presence
    leaves the bedroom high (its deep branch goes to 80) this will not pull it back
    down. That is deferred item 4 - remove the bedroom legs from away-eco - and is
    tracked there rather than papered over here.


    DELIBERATELY DOES NOT STAMP input_datetime.bedroom_night_setpoint_last_change.
    That helper is documented as THE diagnostic for the night manager, whose 15-minute
    tick makes last_triggered meaningless. If this automation stamped it too, that
    signal would stop meaning ''the night manager moved the dial''. This automation
    fires only on real events, never on a tick, so its OWN last_triggered is meaningful
    - read that instead.


    PRESET DISCIPLINE per the four hard rules in project memory midea-ac-integration:
    hvac_mode cool, then preset none, then the number, with 3s spacing, and only when
    the preset is not already none so an ordinary run makes no service calls. This
    matters because preset ''eco'' carries a baked-in ~73F reference that silently
    overrides an explicit set_temperature, and ''away'' is freeze protection that
    flips the unit to dry mode where the setpoint is ignored entirely.


    v2 (2026-08-16, same afternoon) - THE VANITY WINDOW NOW EXISTS, so two things
    in the v1 text above are out of date and are corrected here rather than deleted,
    because the reasoning still explains the shape.


    1. Deferred item 1 is BUILT: automation.bedroom_ac_office_morning_vanity_window_v1,
    alias v2. The v1 note that a workday morning ''sits wherever the night left it''
    and calls that ''a known gap'' is no longer true - that gap is closed. The workday
    gate on got_up stays exactly as it was, and is now load-bearing for a live automation
    instead of a planned one.


    2. NEW CONDITION: input_boolean.bedroom_vanity_window must be off. Narrow but
    real conflict it prevents - if she is still home at 09:00 on a workday with the
    vanity window open, the backstop would fire, find the dial below 76, and overwrite
    the vanity target mid-window. The vanity window writes 76 itself when it closes,
    so nothing is stranded by deferring to it.


    Also worth recording: the vanity window is measured, not assumed. Two office mornings
    of history showed the at-the-vanity stretch is only 14-22 minutes and sits AFTER
    a twelve-minute shower gap, which is why that automation opens on first morning
    motion rather than at the vanity itself.'
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    id: got_up
    note: She got up. Weekend/day-off path only - the workday gate lives in the conditions,
      because on a work morning the vanity window (not yet built) should own the dial
      until she leaves.
    to: 'off'
    trigger: state
  - at: 09:00:00
    id: backstop
    note: Catches BOTH a workday after she has left AND any night where in_bed was
      never set, in which case got_up can never fire. This is the leg that would have
      caught the 2026-08-15 failure.
    trigger: time
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.bedroom_vanity_window
    state: 'off'
    note: The vanity window owns the dial while it is open. Without this the 09:00
      backstop would overwrite the vanity target with 76 on a morning she is still
      home.
  - condition: state
    entity_id: person.lara_wiz
    note: Do not fight away-eco while she is out; it owns the dial then.
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
    note: Never resurrect a unit that was switched off on purpose.
  - above: 55
    attribute: temperature
    condition: numeric_state
    entity_id: climate.bedroom_ac
    note: 'An unreachable unit reports None for the target. numeric_state evaluates
      false on None, which is the fail-safe direction: do nothing rather than act
      on a missing reading.'
  actions:
  - alias: Decide whether this trigger is allowed to release the dial
    condition: or
    conditions:
    - condition: trigger
      id: backstop
    - condition: and
      conditions:
      - condition: trigger
        id: got_up
      - condition: state
        entity_id: binary_sensor.workday
        note: Work mornings are the vanity window's territory (70-72 at the wall),
          not this automation's.
        state: 'off'
  - alias: Stop unless the dial is actually below 76, so a hand-set higher number
      is never overridden
    attribute: temperature
    below: 76
    condition: numeric_state
    entity_id: climate.bedroom_ac
  - alias: Clear any preset that would make the number meaningless
    if:
    - condition: not
      conditions:
      - attribute: preset_mode
        condition: state
        entity_id: climate.bedroom_ac
        state: none
    then:
    - action: climate.set_hvac_mode
      data:
        hvac_mode: cool
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: climate.set_preset_mode
      data:
        preset_mode: none
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
  - action: climate.set_temperature
    alias: Release the dial to 76
    data:
      temperature: 76
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log it so the day's shape is auditable alongside the night manager's entries
    data:
      entity_id: climate.bedroom_ac
      message: 'Daytime release ({{ trigger.id }}): dial to 76F. Bedside {{ states(''sensor.airguard_temperature'')
        }}F, wall {{ states(''sensor.hue_motion_sensor_2_temperature'') }}F.'
      name: Daytime Release
  mode: single
- id: bedroom_ac_office_morning_vanity_window_v1
  alias: Bedroom AC — Office Morning Vanity Window (v2)
  description: 'Holds the bedroom warm enough for Lara to get ready at the vanity,
    which sits right next to the AC unit. Built 2026-08-16, closing deferred item
    1 from project memory bedroom-ac-night-rules. Her rule: office day, out of bed
    until she leaves, wall sensor 70-72, and she does not want to get frozen out.
    This is THE reasoned exception to feedback room-sensors-are-truth-ac-is-a-dial:
    the reference here is sensor.hue_motion_sensor_2_temperature, the Hue WALL sensor,
    because it is closest to the vanity and the unit. Do not correct it back to the
    bedside AirGuard.


    WHY IT OPENS ON FIRST MOTION, NOT AT THE VANITY. Measured from history 2026-08-16
    across two office mornings. Aug 14: motion 07:07-07:10, then TWELVE MINUTES silent
    (she is in the shower), then dense 07:22-07:32, departed 07:36. Aug 12: sporadic
    from 06:01, shower gap 06:28-06:48, dense from 06:58, departed 07:20. The at-the-vanity
    stretch is only 14-22 minutes. Against the measured pull-down rate (project memory
    ac-pulldown-rate: ~2F in hour one, so ~0.5F in fifteen minutes) the room cannot
    be moved into range once she is standing there. The originally-agreed closed loop
    (wall >72 for 10 min -> -1, wall <70 for 10 min -> +1) would manage one or two
    steps before she left and never converge. So it opens on FIRST morning motion,
    buying the whole shower as lead time. The loop was right for a long window and
    wrong for this one.


    NO WFH BRANCH, DELIBERATELY. input_boolean.wfh_today is useless for morning gating:
    on 2026-08-13 it did not turn on until 07:37:47, long after that morning''s motion
    ended at 07:06. Instead the SIGNAL discriminates the day. On that WFH day motion
    ran 07:00:23-07:06:03 and then stopped entirely until 11:00, so the 30-minute
    no-motion close fires at ~07:36 and hands straight back to 76. On an office day
    motion keeps recurring until she leaves. Lara confirmed 2026-08-16 that WFH mornings
    are much lower-key. This is why there is no day-type flag anywhere in here.


    THE DIAL NUMBER IS A GUESS AND IS MEANT TO BE CALIBRATED. input_number.bedroom_vanity_dial_target
    starts at 73. Reasoning: at steady state the wall reads about 2F below the dial
    (observed 2026-08-16: dial 65, wall 63.1), so 73 should land the wall near 71,
    mid-band. But that offset is NOT constant, which is exactly why the original design
    wanted a loop. Every run logs the wall and bedside readings to the logbook. Read
    those over a week and move the helper; do not edit this automation.


    HANDOFF. On close it writes 76 itself so the room is never stranded at the vanity
    number. The Daytime Release automation is gated off this window flag so the two
    cannot fight. The Night Setpoint Manager is already out of window in the morning
    and needs no change.


    PRESET DISCIPLINE per project memory midea-ac-integration: hvac_mode cool, then
    preset none, then the number, 3s apart, and only when the preset is not already
    none.


    v2 (2026-08-16, minutes after v1, never ran) - SELF-CLOSING BUG, caught in review
    before a single fire. In v1 the CLOSE branch''s only condition was ''window flag
    is on''. Trace it: first motion opens the window and sets the flag. The NEXT motion
    event re-triggers, fails the OPEN branch because that branch requires the flag
    to be OFF, falls through to CLOSE, whose condition is now satisfied - and closes
    the window immediately. The window would have survived roughly one motion event,
    then slammed shut and written 76, every single morning. v2 adds an explicit trigger-id
    condition so only departed / went_quiet / backstop can close it. Also added max_exceeded:
    silent, because motion is a high-frequency trigger and mode single would otherwise
    log a warning on every overlapping fire.


    WATCH THIS WHEN THE NEW PRESENCE SENSOR GOES IN. Lara reported 2026-08-16 that
    she has a bedroom presence sensor not yet added, bought because the lights were
    switching off while she sat still in the chair - PIR does not see a person who
    is not moving. That failure mode applies directly to the went_quiet leg here:
    thirty minutes is generous enough that sitting at the vanity should not trip it,
    but a quiet morning could close the window early. When the presence sensor is
    added, went_quiet should switch from ''motion off for 30 min'' to ''presence clear
    for N min'', which is both faster and more truthful. Until then the 30-minute
    figure is deliberately conservative for exactly this reason.'
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    id: first_motion
    note: First bedroom motion of the morning opens the window. Deliberately the EARLY
      edge, so the shower becomes lead time.
    to: 'on'
    trigger: state
  - entity_id: person.lara_wiz
    from: home
    id: departed
    note: She left for the office. Primary close.
    trigger: state
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    for:
      minutes: 30
    id: went_quiet
    note: Thirty minutes of stillness. This is the leg that closes a WFH morning,
      where motion stops after a few minutes and never resumes.
    to: 'off'
    trigger: state
  - at: 09:30:00
    id: backstop
    note: Hard ceiling so the window can never hold the room at the vanity number
      all day.
    trigger: time
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - alias: OPEN the window on first morning motion
      conditions:
      - condition: trigger
        id: first_motion
      - condition: state
        entity_id: input_boolean.bedroom_vanity_window
        state: 'off'
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
      - condition: state
        entity_id: person.lara_wiz
        state: home
      - after: 05:00:00
        before: 09:00:00
        condition: time
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.bedroom_ac
          state:
          - 'off'
          - unavailable
          - unknown
      - above: 55
        attribute: temperature
        condition: numeric_state
        entity_id: climate.bedroom_ac
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_vanity_window
      - alias: Clear any preset that would make the number meaningless
        if:
        - condition: not
          conditions:
          - attribute: preset_mode
            condition: state
            entity_id: climate.bedroom_ac
            state: none
        then:
        - action: climate.set_hvac_mode
          data:
            hvac_mode: cool
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle, these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
        - action: climate.set_preset_mode
          data:
            preset_mode: none
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle, these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
      - action: climate.set_temperature
        alias: Set the vanity target, skipping the unsettable 75
        data:
          temperature: '{% set t = states(''input_number.bedroom_vanity_dial_target'')
            | int(73) %}{{ 74 if t == 75 else t }}'
        target:
          entity_id: climate.bedroom_ac
      - action: logbook.log
        alias: Log the opening reading so the dial target can be calibrated later
        data:
          entity_id: climate.bedroom_ac
          message: Vanity window OPEN. Dial to {{ states('input_number.bedroom_vanity_dial_target')
            | int(73) }}F. Wall {{ states('sensor.hue_motion_sensor_2_temperature')
            }}F, bedside {{ states('sensor.airguard_temperature') }}F.
          name: Vanity Window
    - alias: CLOSE the window and hand back to the daytime 76
      conditions:
      - condition: trigger
        id:
        - departed
        - went_quiet
        - backstop
        note: LOAD-BEARING. Without this, every motion event after the window opened
          would fall past the OPEN branch (which requires the flag off) into this
          one and close the window instantly.
      - condition: state
        entity_id: input_boolean.bedroom_vanity_window
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_vanity_window
      - action: logbook.log
        alias: Log the closing reading, the one that says whether the target was right
        data:
          entity_id: climate.bedroom_ac
          message: Vanity window CLOSED ({{ trigger.id }}). Wall {{ states('sensor.hue_motion_sensor_2_temperature')
            }}F, bedside {{ states('sensor.airguard_temperature') }}F, dial was {{
            state_attr('climate.bedroom_ac','temperature') }}F. Target band is wall
            70-72.
          name: Vanity Window
      - alias: Hand off to 76 so the room is never stranded at the vanity number
        if:
        - condition: and
          conditions:
          - condition: state
            entity_id: person.lara_wiz
            state: home
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state:
              - 'off'
              - unavailable
              - unknown
          - attribute: temperature
            below: 76
            condition: numeric_state
            entity_id: climate.bedroom_ac
        then:
        - action: climate.set_temperature
          data:
            temperature: 76
          target:
            entity_id: climate.bedroom_ac
  mode: single
  max_exceeded: silent
- id: living_room_energize_morning_trial
  alias: Living Room — Energize Morning Trial (v1)
  description: 'TRIAL, added 2026-08-17 at Lara''s request: "Let''s try Energize in
    the morning the next couple days." Scoped to 06:00-10:00 ONLY. Delete this one
    automation to revert completely; nothing else was changed.


    WHY: measured 2026-08-17 06:35, the living room ran 100% brightness at 2,409K,
    warmer than a household incandescent. Brightness was never the problem, colour
    was. Adaptive Lighting pins colour at min_color_temp (2000K) while the sun is
    below the horizon then interpolates toward max_color_temp scaled by sun position,
    PEAKING AT SOLAR NOON (~13:05). So it does not cross 4,000K until roughly 08:30.
    AL''s curve is symmetric around solar noon and structurally cannot deliver an
    energising 6am.


    VALUES: these are Hue''s Energize recipe, MEASURED off the bulbs on 2026-08-17
    19:28 while the scene was live, not taken from a spec sheet. Per-lamp readings
    were torchiere 6535K (its ceiling), end table 6410K, corner 6410K, all at brightness
    255. 6410 is used for the group; the torchiere lands 125K cooler than its own
    maximum, which is not visible.


    WHY NOT scene.turn_on: Energize exists in the Hue app only as a SLOT INSIDE the
    "Natural light" smart scene, not as a saved Living Room scene. Home Assistant
    can only see saved room scenes, so no scene.living_room_energize entity exists.
    Confirmed by a full Hue config-entry reload on 2026-08-17, after which the LR
    still exposed only Blood moon, Nighttime, Nightlight, Movies and Golden hours.
    If Lara later saves Energize as its own Living Room scene, swap the two light.turn_on
    calls for scene.turn_on and drop the kelvin literals.


    WHY AL IS SWITCHED OFF FOR THE WINDOW: a Hue scene recall is executed BY THE BRIDGE,
    and this AL switch runs detect_non_ha_changes false while take_over_control only
    watches Home Assistant''s own light.turn_on calls, so AL never notices a bridge-side
    change and never sets manual_control. It does not pause, it silently overwrites
    at its next 90s interval. Verified twice on 2026-08-17: a Golden hours recall
    was fully reclaimed within 100 seconds with manual_control still empty, and an
    Energize recall at 19:22 had been dragged from 6,451K back toward AL''s 2,455K
    target within about five minutes. Switching AL off is therefore mandatory, not
    tidiness. This automation uses light.turn_on rather than a bridge-side recall,
    which WOULD pin manual_control, but that is moot because AL is off for the whole
    window.


    SAFETY: the 10:00 restore branch is deliberately UNGATED so Adaptive Lighting
    can never be left switched off for the rest of the day. The homeassistant-start
    branch is a backstop for the case where HA is down at 10:00 and misses that trigger;
    without it a restart at 09:00 would leave AL off indefinitely.


    PRESENCE: the relight branch requires person.lara_wiz home, per house rule that
    comfort lighting keys off human presence. On an away morning the Ambient Manager''s
    away-dim (brightness_pct 20, occupied look) is left alone rather than being blasted
    to full.


    TODO once the trial ends: either promote this into the wider Hue-scene plan (Energize
    / Concentrate / Read / Relax / Rest scheduled by HA, AL removed from all three
    bulbs) or delete it and retune AL''s six currently-null sun anchors instead. See
    project memory lr-adaptive-lighting-replacement-scoping.'
  triggers:
  - at: 06:00:00
    id: window_open
    trigger: time
  - entity_id: light.living_room_lights
    from: 'off'
    id: lights_on
    to: 'on'
    trigger: state
  - at: '10:00:00'
    id: window_close
    trigger: time
  - event: start
    id: ha_start
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    - alias: '06:00 — open the window: take Adaptive Lighting out of the way, then
        apply Energize if the lamps are already on'
      conditions:
      - condition: trigger
        id: window_open
      sequence:
      - action: switch.turn_off
        alias: AL must be OFF or it overwrites Energize within 90 seconds
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
      - if:
        - condition: state
          entity_id: light.living_room_lights
          state: 'on'
        - condition: state
          entity_id: person.lara_wiz
          state: home
        then:
        - action: light.turn_on
          data:
            brightness: 255
            color_temp_kelvin: 6410
            transition: 5
          target:
            entity_id: light.living_room_lights
    - alias: Lamps came on inside the window — apply Energize
      conditions:
      - condition: trigger
        id: lights_on
      - after: 06:00:00
        before: '10:00:00'
        condition: time
      - condition: state
        entity_id: person.lara_wiz
        state: home
      sequence:
      - alias: Let the bulbs finish reporting their turn-on state first
        delay:
          seconds: 2
      - action: light.turn_on
        data:
          brightness: 255
          color_temp_kelvin: 6410
          transition: 5
        target:
          entity_id: light.living_room_lights
    - alias: 10:00 — close the window and hand the lamps back to Adaptive Lighting
        (UNGATED on purpose)
      conditions:
      - condition: trigger
        id: window_close
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
    - alias: Backstop — if HA restarted and it is now outside the window, make sure
        AL is back on
      conditions:
      - condition: trigger
        id: ha_start
      - condition: not
        conditions:
        - after: 06:00:00
          before: '10:00:00'
          condition: time
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
  max: 10
  max_exceeded: silent
  mode: queued
- id: living_room_al_handback_failsafe
  alias: Living Room — AL Handback Failsafe (Energize Trial, v1)
  description: 'SAFETY NET for the Energize Morning Trial, added 2026-08-18 after
    that trial''s first morning failed. The trial switches switch.adaptive_lighting_living_room_lights
    OFF at 06:00 and relies on its own 10:00 window_close branch to switch it back
    ON. That restore branch has never been observed firing. If it silently fails,
    Adaptive Lighting stays off for the rest of the day, which breaks the 21:00/22:00
    late-night sleep dim, the TV/movie lighting stack, and every bare light.turn_on
    that depends on AL''s intercept to supply brightness and colour. Measured 2026-08-18:
    with AL off, a bare turn_on left the lamps at 10% / 2200K, the values the bulbs
    were still holding from the previous night''s sleep dim.


    BEHAVIOUR: at 10:02, two minutes after the trial''s own restore should have run,
    if AL is still off this REPAIRS it and then sends one push saying so. SILENT ON
    SUCCESS by Lara''s explicit choice on 2026-08-18: she is at the office and wants
    a failure ping only, not a confirmation.


    calendar.tv GATE: a TV calendar event legitimately pauses AL ("TV Event Reminder"
    turns it off 15 minutes ahead), and repairing AL mid-event would fight the Movie
    scene. So this does nothing while calendar.tv is on.


    DELETE THIS when the Energize trial is promoted or reverted; it has no purpose
    outside that trial. See project memory lr-energize-morning-trial.'
  triggers:
  - at: '10:02:00'
    trigger: time
  conditions:
  - condition: state
    entity_id: switch.adaptive_lighting_living_room_lights
    state: 'off'
  - condition: state
    entity_id: calendar.tv
    state: 'off'
  actions:
  - alias: Repair first, so the house is correct even if the push is missed
    action: switch.turn_on
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - action: notify.mobile_app_iphone
    data:
      title: ⚠️ AL handback failed
      message: Adaptive Lighting was still OFF at 10:02, so the Energize trial's 10:00
        restore did not run. I switched AL back on for you. Worth checking the trial's
        traces when you get a minute.
  mode: single
- id: bedroom_air_quality_spike_alert
  alias: Bedroom — Air Quality Spike Alert (v1)
  description: 'Mirror of ''Living Room — Air Quality Spike Alert (v1)'' applied to
    the bedside AirGuard (sensor.airguard_pm2_5 — this is the unit referred to as
    ''the Sonoff''). Built 2026-08-17 after a sweep found the living room had a tiered
    PM2.5 alert and the bedroom, with the same sensor class, had none, despite being
    the room she sleeps 7-8h a night in. Same EPA breakpoints and the same anti-spam
    tier tracker as the LR and outdoor alerts: 1=Elevated/USG (35), 2=Unhealthy (55),
    3=Very Unhealthy (150), 4=Hazardous (250), tracked in input_number.bedroom_air_quality_alert_level_reached
    so each band only alerts once per day even if the reading bounces inside it. Good/Moderate
    below 35 stays silent to avoid noise. Observed range in the 12 days to 2026-08-17
    was a daily max of 1-48 ug/m3 with a single tier-1 crossing (Aug 17, 48) and one
    near-miss (Aug 10, 31), so expect this to be quiet - that is the point, it is
    a smoke/wildfire/cooking-drift alarm, not a dashboard. Startup recheck included
    for the same reason as the LR alert: numeric_state ''above'' only fires on the
    crossing, so a spike already present across a restart would be missed. Vacation-gated
    like the other personal comfort alerts. Companion daily reset: automation.bedroom_air_quality_alert_level_daily_reset.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 35
    id: usg
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 55
    id: unhealthy
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 150
    id: very_unhealthy
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 250
    id: hazardous
  - trigger: homeassistant
    event: start
    id: startup_recheck
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Wait for PM2.5 to have a real value (repopulates after a restart)
    wait_template: '{{ states(''sensor.airguard_pm2_5'') | is_number }}'
    timeout: 00:03:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 250
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 4
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Bedroom Air Quality: Hazardous"
          message: Bedside PM2.5 just crossed 250 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}). Do not sleep in here without filtration.
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 4
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 150
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 3
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Bedroom Air Quality: Very Unhealthy"
          message: Bedside PM2.5 just crossed 150 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}).
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 3
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 55
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 2
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: '⚠️ Bedroom Air Quality: Unhealthy'
          message: Bedside PM2.5 just crossed 55 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}).
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 2
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 35
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 1
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Bedroom Air Quality: Elevated"
          message: Bedside PM2.5 just crossed 35 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}). Sensitive individuals may notice.
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 1
  mode: single
  max_exceeded: silent
- id: bedroom_air_quality_alert_level_daily_reset
  alias: Bedroom — Air Quality Alert Level Daily Reset
  description: 'Resets input_number.bedroom_air_quality_alert_level_reached to 0 at
    midnight so ''Bedroom — Air Quality Spike Alert (v1)'' starts fresh each day.
    Companion to that alert, mirroring the existing Living Room pair (automation.living_room_air_quality_alert_level_daily_reset)
    and the Pollen Alert Level daily reset. Deliberately not vacation-gated: the tier
    tracker must reset every day regardless of where she is, otherwise a spike reached
    while away would suppress alerts on the day she gets back.'
  triggers:
  - trigger: time
    at: 00:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_air_quality_alert_level_reached
    data:
