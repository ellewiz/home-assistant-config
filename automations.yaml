- id: '1637113982141'
  alias: Update in_bed when motion is detected
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    from: 'off'
    to: 'on'
    id: motion
    platform: state
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: group.morning
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.in_bed
      - action: scene.turn_on
        metadata: {}
        target:
          entity_id: scene.bedroom_energize
        data:
          transition: 3
      - if:
        - condition: state
          entity_id: media_player.bedroom_frame
          state: playing
        then:
        - action: media_player.media_stop
          target:
            entity_id: media_player.bedroom_frame
      - delay:
          seconds: 4
      - if:
        - condition: numeric_state
          entity_id: sensor.hue_motion_sensor_2_light_level
          below: input_number.bedroom_lux_on_threshold
        - condition: not
          conditions:
          - condition: state
            entity_id: timer.bedroom_light_timer
            state: active
        then:
        - action: scene.turn_on
          data:
            transition: 5
          target:
            entity_id: scene.bedroom_energize
  mode: restart
- id: '1639287271338'
  alias: Bedroom — Motion Lights (v3, Nightlight After 10pm)
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_2_motion
    from: 'off'
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_2_light_level
    below: input_number.bedroom_lux_on_threshold
  - alias: Stand down when the wake path owns this motion event
    condition: not
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      - condition: state
        entity_id: group.morning
        state: 'on'
    note: 'Exact complement of the conditions on ''Update in_bed when motion is detected'',
      which shares this trigger and applies scene.bedroom_energize. Cannot affect
      the 22:00-05:30 nightlight branch: group.morning is 05:30-12:00, so the two
      windows never overlap.'
  actions:
  - choose:
    - alias: Late night (22:00–05:30) — dim red nightlight
      conditions:
      - condition: time
        after: '22:00:00'
        before: 05:30:00
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: 10
          transition: 2
    default:
    - alias: Daytime/evening — normal Natural Light scene
      action: scene.turn_on
      target:
        entity_id: scene.bedroom_natural_light_2
      data:
        transition: 2
  mode: single
  max_exceeded: silent
