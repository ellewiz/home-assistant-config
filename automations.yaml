- id: '1777031240153'
  alias: Pollen Spike Alert
  triggers:
  - platform: state
    entity_id:
    - sensor.kleenex_pollen_radar_ewing_trees_level
    - sensor.kleenex_pollen_radar_ewing_grass_level
    - sensor.kleenex_pollen_radar_ewing_weeds_level
    id: level_rose
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 75
    id: index_moderate
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 150
    id: index_high
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 200
    id: index_very_high
  - platform: homeassistant
    event: start
    id: pollen_startup
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Wait for the pollen index to have a real value (repopulates after a restart)
    wait_template: '{{ states(''sensor.total_pollen_index'') | int(-1) >= 0 }}'
    timeout: 00:03:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 200
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 3
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Pollen Very High"
          message: Total pollen index just crossed 200 (currently {{ states('sensor.total_pollen_index')
            }} idx). High allergy risk — medication strongly recommended.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 3
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 150
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 2
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Pollen High
          message: Total pollen index just crossed 150 (currently {{ states('sensor.total_pollen_index')
            }} idx). You likely need allergy medication today.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 2
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 75
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 1
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Moderate"
          message: Total pollen index just crossed 75 (currently {{ states('sensor.total_pollen_index')
            }} idx). Sensitive individuals may want to take medication.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 1
    - conditions:
      - condition: template
        value_template: '{% if trigger.id != ''level_rose'' or trigger.from_state
          is not defined or trigger.from_state is none or trigger.to_state is none
          %}

          false

          {% else %}

          {% set levels = {''none'': 0, ''low'': 1, ''moderate'': 2, ''high'': 3,
          ''very high'': 4, ''very_high'': 4} %}

          {% set old = trigger.from_state.state | lower %}

          {% set new = trigger.to_state.state | lower %}

          {{ old not in [''unknown'', ''unavailable''] and new not in [''unknown'',
          ''unavailable''] and levels.get(new, 0) > levels.get(old, 0) }}

          {% endif %}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Rising"
          message: '{% set type_map = {''sensor.kleenex_pollen_radar_ewing_trees_level'':
            ''Trees'', ''sensor.kleenex_pollen_radar_ewing_grass_level'': ''Grass'',
            ''sensor.kleenex_pollen_radar_ewing_weeds_level'': ''Weeds''} %}{{ type_map.get(trigger.entity_id,
            ''Pollen'') }} just jumped to {{ trigger.to_state.state | title }} (was
            {{ trigger.from_state.state | title }}). Consider taking your allergy
            medication.'
  mode: single
  max_exceeded: silent
- id: '1777633648574'
  alias: Power Outage / Restoration Alert
  triggers:
  - entity_id: sensor.bedroom_power
    for: 00:02:00
    id: hue_unavailable
    platform: state
    to: unavailable
  - entity_id: sensor.bedroom_power
    from: unavailable
    id: hue_restored
    platform: state
  - entity_id: sensor.fibaro_wall_plug_for_fridge_electric_consumption_w
    from: unavailable
    id: fridge_surge
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hue_unavailable
      sequence:
      - action: input_datetime.set_datetime
        alias: Stamp the outage so fridge_surge can tell a real outage from a Z-Wave
          restart
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.last_power_outage_detected
      - action: notify.mobile_app_iphone
        data:
          message: Power appears to be out. Hue Bridge went offline at {{ now().strftime('%I:%M
            %p') }}.
          title: ⚡ Power Outage Detected
    - conditions:
      - condition: trigger
        id: hue_restored
      - condition: template
        value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
          | float(0) >= 120 }}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: Hue Bridge back online at {{ now().strftime('%I:%M %p') }} after
            ~{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
            / 60) | round(0) }} min offline. Power/network looks restored.
          title: ✅ Power / Network Restored
    - conditions:
      - condition: trigger
        id: fridge_surge
      - alias: Gate 1 - the dropout must have lasted 2+ min, matching hue_restored
        condition: template
        value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
          | float(0) >= 120 }}'
      - alias: Gate 2 - the Hue proxy must have seen an outage in the last 60 min
          (a Z-Wave-only restart leaves this stale)
        condition: template
        value_template: '{% set t = states(''input_datetime.last_power_outage_detected'')
          %}{{ t not in [''unknown'',''unavailable'',''''] and (as_timestamp(now())
          - as_timestamp(t, 0)) | float(99999) < 3600 }}'
      sequence:
      - alias: Let the reading settle - first value back can be standby draw before
          the compressor starts
        delay: 00:00:20
      - action: notify.mobile_app_iphone
        data:
          message: '{% set w = states(''sensor.fibaro_wall_plug_for_fridge_electric_consumption_w'')
            | float(0) %}Power restored. Fridge is drawing {{ w }}W{% if w > 89 %},
            above its ~89W normal max - it is running hard and may take 60-90 min
            to recover temp.{% else %}, within its normal range.{% endif %}'
          title: "\U0001F50C Power Restored — Fridge Back Online"
  max: 10
  mode: parallel
- id: '1777680078909'
  alias: 'Alert: HA Unexpected Restart'
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: ⚠️ Home Assistant restarted
      message: HA came back up at {{ now().strftime('%-I:%M %p') }} on {{ now().strftime('%A,
        %B %-d') }}. Check logs if this was unexpected.
  mode: single
- id: '1777933269637'
  alias: 'Commute: Set target arrival from calendar'
  triggers:
  - entity_id: input_boolean.in_bed
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.workday_tomorrow
    state: 'on'
  actions:
  - variables:
      _target_date: '{{ (now() if now().hour < 8 else now() + timedelta(days=1)).strftime(''%Y-%m-%d'')
        }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.master_calendar
    data:
      start_date_time: '{{ _target_date }}T00:00:00'
      end_date_time: '{{ _target_date }}T23:59:59'
    response_variable: cal_response
  - variables:
      has_office_event: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(found=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx %}{% set ns.found = true %}{% endif
        %}{% endfor %}{{ ns.found }}'
      is_late_shift: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(late=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx and ''late shift'' in (s ~ '' '' ~
        ctx) %}{% set ns.late = true %}{% endif %}{% endfor %}{{ ns.late }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ has_office_event | trim | lower == ''true'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_late_shift | trim | lower == ''true'' }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.commute_target_arrival
            data:
              time: 09:20:00
        default:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.commute_target_arrival
          data:
            time: 07:50:00
  mode: single
- id: '1777933283116'
  alias: 'Commute: Morning announcer with Waze (v2)'
  triggers:
  - platform: calendar
    entity_id: calendar.master_calendar
    event: end
    offset: '-1:0:0'
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower) and
      ''office'' in (((trigger.calendar_event.location | default('''')) ~ '' '' ~
      (trigger.calendar_event.description | default(''''))) | lower) }}'
  actions:
  - variables:
      leave_by_ts: '{% set lb = states(''sensor.commute_leave_by'') %}{% if lb not
        in [''unknown'', ''unavailable''] %}{{ as_timestamp(today_at(lb)) }}{% else
        %}{{ as_timestamp(trigger.calendar_event.end) }}{% endif %}'
  - action: script.commute_time_announcer
    data:
      until_ts: '{{ leave_by_ts }}'
      person_entity: person.lara_wiz
      players:
      - media_player.living_room_arc
      - media_player.basement
      - media_player.bedroom_frame
      - media_player.bathroom
  mode: single
- id: '1777940949832'
  alias: "\U0001F985 Eagles Score - Flash Green"
  triggers:
  - platform: state
    entity_id: sensor.philadelphia_eagles
    attribute: team_score
  conditions:
  - condition: state
    entity_id: sensor.philadelphia_eagles
    state: IN
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'', ''unavailable''] and trigger.to_state.attributes.team_score
      | int(0) > trigger.from_state.attributes.team_score | int(0) }}'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - alias: Flash living room Kelly Green (snapshot + restore via shared script)
    action: script.alert_light_flash
    data:
      targets: light.living_room_lights
      rgb_color:
      - 76
      - 187
      - 23
      pulses: 5
  - alias: Resume Adaptive Lighting after snapshot restore
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      manual_control: false
  mode: single
  max_exceeded: silent
- id: '1778432571562'
  alias: Pollen Alert Level — Daily Reset
  triggers:
  - platform: time
    at: 00:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.pollen_alert_level_reached
    data:
      value: 0
  mode: single
- id: '1778498005512'
  alias: Update Rain Forecast 24h
  triggers:
  - platform: time_pattern
    minutes: '5'
  - platform: homeassistant
    event: start
  actions:
  - target:
      entity_id: weather.kttn_daynight
    data:
      type: hourly
    response_variable: wx_forecast
    action: weather.get_forecasts
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wx_forecast[''weather.kttn_daynight''][''forecast''][:24]
          | selectattr(''condition'', ''in'', [''lightning'', ''lightning-rainy'',
          ''rainy'', ''pouring'', ''hail'', ''snowy-rainy'']) | list | count > 0 or
          wx_forecast[''weather.kttn_daynight''][''forecast''][:24] | selectattr(''precipitation_probability'',
          ''defined'') | selectattr(''precipitation_probability'', ''>'', 50) | list
          | count > 0 }}'
      sequence:
      - target:
          entity_id: input_boolean.rain_forecast_24h
        action: input_boolean.turn_on
    default:
    - target:
        entity_id: input_boolean.rain_forecast_24h
      action: input_boolean.turn_off
  mode: single
