      state: 'on'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  mode: single
- id: '1758080771334'
  alias: Johnny — Did a Runner (v2, Not-Together Ping)
  description: 'Pings the iPhone when Johnny''s Tractive tracker leaves zone.home
    AND he is not in the same zone as Lara — i.e. they are NOT together (he got out
    on his own, or left while she''s home or at work). Stays silent when they leave
    together (a walk, a trip to a saved zone) because both person entities land in
    the same zone. A 45s settle delay before the together-check absorbs GPS lag: when
    they leave together, Johnny''s tracker can flip to not_home a few seconds before
    Lara''s phone does. v1 pinged only when Lara was AWAY and did a Sonos-only announce
    when she was home, which was backwards — it never phone-alerted the scary escape-while-home
    case. NOT gated on calendar.vacation on purpose: this is a safety alert that must
    fire even while away (dog-sitter scenarios). Compares person.johnny (sourced solely
    from device_tracker.johnny_tracker) against person.lara_wiz. To also announce
    on Sonos, add that branch back.'
  triggers:
  - device_id: a21a864f6f38a47a687299e25164bde0
    domain: device_tracker
    entity_id: 2a32586b5b10e1e8ba2a43acdc640276
    type: leaves
    zone: zone.home
    platform: device
  conditions: []
  actions:
  - alias: Let presence settle in case we left together
    delay: 00:00:45
  - alias: Only continue if Johnny and I are NOT in the same zone
    condition: template
    value_template: "{{ states('person.johnny') not in ['unknown', 'unavailable']\n
      \  and states('person.johnny') != states('person.lara_wiz') }}"
  - alias: Ping iPhone — Johnny is out without me
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F6A8 Johnny's out without you"
      message: Johnny left home and isn't with you — he's {{ states('person.johnny')
        }}, you're {{ states('person.lara_wiz') }}.
  mode: single
