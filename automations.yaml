- id: '1758078170419'
  alias: TV Event Reminder
  description: 'Announce 15 minutes before an event on the watch party calendar starts
    2026-06-28: also turns OFF switch.adaptive_lighting_living_room_lights when the
    Movie scene is set, so the 90s AL re-adapt cannot override the scene mid-event.
    Paired with TV Event Over, which turns AL back on at event end.'
  triggers:
  - entity_id: calendar.tv
    event: start
    offset: -0:15:0
    platform: calendar
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - variables:
      event_title: '{{ trigger.calendar_event.summary }}'
      msg: '"{{ event_title }}" will begin in 15 minutes.'
  - action: scene.turn_on
    data:
      transition: 10
    target:
      entity_id: scene.living_room_movies_2
  - alias: Pause Adaptive Lighting so its re-adapt interval cannot override the Movie
      scene during the event
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - action: script.sonos_broadcast
    data:
      restore: true
      ungroup: true
      players:
      - media_player.living_room_arc
      - media_player.bedroom_frame
      message: '{{ msg }}'
      volume: 0.69
  - action: automation.turn_off
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
    data:
      stop_actions: true
  - if:
    - condition: device
      device_id: 0a28965692f7fead801299fd184f7f4e
      domain: media_player
      entity_id: b3ed2dece24ac28191b7c48a42d83134
      type: is_playing
    then:
    - action: media_player.media_pause
      metadata: {}
      data: {}
      target:
        entity_id: media_player.living_room_4k_2
  mode: single
- id: '1758078528885'
  alias: TV Event Over
  description: 'Shut down TV when the TV event ends, then re-enable nightly automations
    2026-06-28: re-enables switch.adaptive_lighting_living_room_lights (paused by
    TV Event Reminder during the Movie scene) before re-arming sleep mode.'
  triggers:
