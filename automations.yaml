- id: '1786400794867'
  alias: Laundry — Dryer Cycle Finished (v2)
  triggers:
  - entity_id: binary_sensor.laundry_dryer_running
    for: 00:03:00
    from: 'on'
    to: 'off'
    platform: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
      >= 600 }}'
  actions:
  - variables:
      run_min: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
        / 60) | round(0) }}'
  - action: input_datetime.set_datetime
    alias: Stamp the finish time - always, not just when deferring
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    target:
      entity_id: input_datetime.laundry_dryer_finished_at
  - choose:
    - alias: Awake - notify immediately
      conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - action: script.notify_lara
        data:
          message: Cycle ran {{ run_min }} min and the dryer is back to idle.
          title: "\U0001F9FA Dryer finished"
    default:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.laundry_done_pending_dryer
  mode: single
- id: '1786401912246'
  alias: Laundry — Deferred Done Notice (v2)
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    id: woke_up
    to: 'off'
    platform: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_washer
      state: 'on'
    - condition: state
      entity_id: input_boolean.laundry_done_pending_dryer
      state: 'on'
  actions:
  - alias: Washer branch
    if:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_washer
      state: 'on'
    then:
    - action: script.notify_lara
      data:
        message: It wrapped up at {{ (state_attr('input_datetime.laundry_washer_finished_at','timestamp')
          | float(0)) | timestamp_custom('%-I:%M %p', true) }}, about {{ ((as_timestamp(now())
          - (state_attr('input_datetime.laundry_washer_finished_at','timestamp') |
          float(0))) / 3600) | round(1) }} h ago. Wet clothes are still in there.
        title: "\U0001F9FC Washer finished overnight"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.laundry_done_pending_washer
  - alias: Dryer branch
    if:
    - condition: state
      entity_id: input_boolean.laundry_done_pending_dryer
      state: 'on'
    then:
    - action: script.notify_lara
      data:
        message: It wrapped up at {{ (state_attr('input_datetime.laundry_dryer_finished_at','timestamp')
          | float(0)) | timestamp_custom('%-I:%M %p', true) }}, about {{ ((as_timestamp(now())
          - (state_attr('input_datetime.laundry_dryer_finished_at','timestamp') |
          float(0))) / 3600) | round(1) }} h ago. Clothes are still in there.
        title: "\U0001F9FA Dryer finished overnight"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.laundry_done_pending_dryer
  mode: single
- id: '1786402948315'
  alias: Bedroom — Vanity Mirror Off When I Leave Home (v1)
  triggers:
  - entity_id: person.lara_wiz
    event: leave
    trigger: zone
    zone: zone.home
  conditions: []
  actions:
  - action: switch.turn_off
    alias: Cut power to the vanity outlet
    target:
      entity_id: switch.vanity_plug
  - alias: Hold long enough for the mirror to fully de-energize (tested at 12 s)
    delay:
      seconds: 15
  - action: switch.turn_on
    alias: Restore the outlet so it is live when she gets home
    target:
      entity_id: switch.vanity_plug
  mode: single
- id: '1786409326281'
  alias: Laundry — Washer Cycle Finished (v3)
  triggers:
  - entity_id: binary_sensor.washer_running
    from: 'off'
    id: started
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.washer_running
    from:
    - unknown
    - unavailable
    id: recovered_running
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.washer_running
    for: 00:05:00
    from: 'on'
    id: finished
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: Cycle started - stamp session start once per session
      conditions:
      - condition: trigger
        id: started
      - condition: state
        entity_id: input_boolean.laundry_washer_active_session
        state: 'off'
      sequence:
      - action: input_datetime.set_datetime
        alias: Stamp session start
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.laundry_washer_started_at
      - action: input_boolean.turn_on
        alias: Mark session active
        target:
          entity_id: input_boolean.laundry_washer_active_session
    - alias: HA restarted mid-cycle - re-open the session flag, do NOT re-stamp the
        start time
      conditions:
      - condition: trigger
        id: recovered_running
      sequence:
      - action: input_boolean.turn_on
        alias: Washer was already running when HA came back - session is still open
        target:
          entity_id: input_boolean.laundry_washer_active_session
    - alias: Cycle finished - evaluate total run time and notify
      conditions:
      - condition: trigger
        id: finished
      sequence:
      - variables:
          run_min: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(states(''input_datetime.laundry_washer_started_at'')))
            / 60) | round(0) }}'
      - action: input_boolean.turn_off
        alias: Session over either way - reset for next run
        target:
          entity_id: input_boolean.laundry_washer_active_session
      - if:
        - condition: state
          entity_id: calendar.vacation
          state: 'off'
        - condition: template
          value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(states(''input_datetime.laundry_washer_started_at'')))
            >= 600 }}'
        then:
        - action: input_datetime.set_datetime
          alias: Stamp the finish time - drives the wet-clothes nag
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          target:
            entity_id: input_datetime.laundry_washer_finished_at
        - action: input_datetime.set_datetime
          alias: Stamp the permanent last-run record - never blanked, this is what
            Overview should read
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          target:
            entity_id: input_datetime.laundry_washer_last_run_at
        - choose:
          - alias: Awake - notify immediately
            conditions:
            - condition: state
              entity_id: input_boolean.in_bed
              state: 'off'
            sequence:
            - action: script.notify_lara
              data:
                message: Cycle ran {{ run_min }} min. Clothes are ready to move over.
                title: "\U0001F9FC Washer finished"
          default:
          - action: input_boolean.turn_on
            alias: In bed - defer the push until she is up
            target:
              entity_id: input_boolean.laundry_done_pending_washer
  mode: single
- id: '1786409377851'
  alias: Laundry — Wet Clothes Nag (v2)
  triggers:
  - minutes: /30
    platform: time_pattern
  - id: arrived_home
    platform: state
    entity_id: person.lara_wiz
    to: home
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: binary_sensor.laundry_dryer_running
    state: 'off'
  - condition: state
    entity_id: binary_sensor.washer_running
    state: 'off'
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.laundry_washer_finished_at'',''timestamp'')
      | float(0) %}{{ ts > 1000000000 and (as_timestamp(now()) - ts) >= 2700 }}'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - action: script.notify_lara
    alias: Nag
    data:
      message: Finished at {{ (state_attr('input_datetime.laundry_washer_finished_at','timestamp')
        | float(0)) | timestamp_custom('%-I:%M %p', true) }}, sitting {{ ((as_timestamp(now())
        - (state_attr('input_datetime.laundry_washer_finished_at','timestamp') | float(0)))
        / 60) | round(0) }} min now.
      title: "\U0001F9FC Wet clothes still in the washer"
  max_exceeded: silent
  mode: single
- id: '1786409383726'
  alias: Laundry — Wet Clothes Cleared (v1)
  triggers:
  - entity_id: binary_sensor.laundry_dryer_running
    from: 'off'
    id: dryer_started
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.washer_running
    from: 'off'
    id: washer_restarted
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    alias: Blank the finish timestamp
    data:
      datetime: '1970-01-01 00:00:00'
    target:
      entity_id: input_datetime.laundry_washer_finished_at
  - action: input_boolean.turn_off
    alias: Drop any undelivered washer notice
    target:
      entity_id: input_boolean.laundry_done_pending_washer
  mode: single
- id: '1786413232913'
  alias: AC — Away Eco / Restore on Presence (v5)
  triggers:
  - entity_id: person.lara_wiz
    event: leave
    id: left_home
    trigger: zone
    zone: zone.home
  - entity_id: person.lara_wiz
    id: arrived_home
    not_from:
    - unknown
    - unavailable
    to: home
    trigger: state
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    from: unavailable
    id: unit_recovered
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - alias: LEAVING HOME — pick a setback depth
      conditions:
      - condition: trigger
        id: left_home
      sequence:
      - choose:
        - alias: Deep setback ONLY on positive confirmation the dog is not home —
            v5 fail-open inversion
          conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: person.johnny
              state:
              - home
              - unknown
              - unavailable
          sequence:
          - alias: Bedroom — remember the pre-away target, then deep setback to cool/none/80F
            if:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.bedroom_ac
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - alias: Store the pre-away target — only if no away setback is already
                active
              if:
              - below: 0.5
                condition: numeric_state
                entity_id: input_number.bedroom_ac_pre_away_temp
              then:
              - action: input_number.set_value
                data:
                  value: '{{ state_attr(''climate.bedroom_ac'',''temperature'') |
                    float(0) }}'
                target:
                  entity_id: input_number.bedroom_ac_pre_away_temp
            - action: climate.set_hvac_mode
              data:
                hvac_mode: cool
              target:
                entity_id: climate.bedroom_ac
            - delay:
                seconds: 3
            - action: climate.set_preset_mode
              data:
                preset_mode: none
              target:
                entity_id: climate.bedroom_ac
            - delay:
                seconds: 3
            - action: climate.set_temperature
              data:
                temperature: 80
              target:
                entity_id: climate.bedroom_ac
          - alias: Living room — same deep setback
            if:
            - condition: not
              conditions:
              - condition: state
                entity_id: climate.living_room_ac
                state:
                - 'off'
                - unavailable
                - unknown
            then:
            - alias: Store the pre-away target — only if no away setback is already
                active
              if:
              - below: 0.5
                condition: numeric_state
                entity_id: input_number.lr_ac_pre_away_temp
              then:
              - action: input_number.set_value
                data:
                  value: '{{ state_attr(''climate.living_room_ac'',''temperature'')
                    | float(0) }}'
                target:
                  entity_id: input_number.lr_ac_pre_away_temp
            - action: climate.set_hvac_mode
              data:
                hvac_mode: cool
              target:
                entity_id: climate.living_room_ac
            - delay:
                seconds: 3
            - action: climate.set_preset_mode
              data:
                preset_mode: none
              target:
                entity_id: climate.living_room_ac
            - delay:
                seconds: 3
            - action: climate.set_temperature
              data:
                temperature: 80
              target:
                entity_id: climate.living_room_ac
        default:
        - alias: Johnny is home, or we cannot confirm otherwise — cancel lingering
            Dry mode FIRST (hvac_mode clobbers preset on this integration)
          if:
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state:
              - 'off'
              - unavailable
              - unknown
          then:
          - action: climate.set_hvac_mode
            data:
              hvac_mode: cool
            target:
              entity_id: climate.bedroom_ac
          - delay:
              seconds: 3
        - action: climate.set_preset_mode
          alias: Mild eco setback, set LAST so it sticks
          data:
            preset_mode: eco
          target:
            entity_id:
            - climate.bedroom_ac
            - climate.living_room_ac
      - action: logbook.log
        alias: Log the setback depth actually chosen — reads the SAME entity the branch
          did, so it can never disagree again
        data:
          entity_id: climate.bedroom_ac
          message: Left home — {{ 'house empty (person.johnny = ' ~ states('person.johnny')
            ~ '), deep setback to cool/none/80F' if states('person.johnny') not in
            ['home','unknown','unavailable'] else 'Johnny home or location unconfirmed
            (person.johnny = ' ~ states('person.johnny') ~ '), mild eco setback' }}.{{
            ' Bedroom AC was off or unreachable, so this applied to the living room
            only.' if states('climate.bedroom_ac') in ['off','unavailable','unknown']
            else '' }}
          name: AC Away Eco
    - alias: BACK HOME (or a unit came back online while home) — restore eco AND the
        exact pre-away target
      conditions:
      - condition: trigger
        id:
        - arrived_home
        - unit_recovered
      - condition: state
        entity_id: person.lara_wiz
        state: home
      sequence:
      - alias: Capture the markers before anything zeroes them, for the restore values
          and the log
        variables:
          br_restore: '{{ states(''input_number.bedroom_ac_pre_away_temp'') | float(0)
            }}'
          lr_restore: '{{ states(''input_number.lr_ac_pre_away_temp'') | float(0)
            }}'
      - action: climate.set_preset_mode
        alias: Restore the everyday eco preset on both units
        data:
          preset_mode: eco
        target:
          entity_id:
          - climate.bedroom_ac
          - climate.living_room_ac
      - delay:
          seconds: 3
      - alias: Bedroom — put the exact pre-away target back, then clear the marker
        if:
        - above: 0.5
          condition: numeric_state
          entity_id: input_number.bedroom_ac_pre_away_temp
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.bedroom_ac
            state:
            - 'off'
            - unavailable
            - unknown
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ br_restore }}'
          target:
            entity_id: climate.bedroom_ac
        - delay:
            seconds: 3
        - action: input_number.set_value
          data:
            value: 0
          target:
            entity_id: input_number.bedroom_ac_pre_away_temp
      - alias: Living room — put the exact pre-away target back, then clear the marker
        if:
        - above: 0.5
          condition: numeric_state
          entity_id: input_number.lr_ac_pre_away_temp
        - condition: not
          conditions:
          - condition: state
            entity_id: climate.living_room_ac
            state:
            - 'off'
            - unavailable
            - unknown
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ lr_restore }}'
          target:
            entity_id: climate.living_room_ac
        - delay:
            seconds: 3
        - action: input_number.set_value
          data:
            value: 0
          target:
            entity_id: input_number.lr_ac_pre_away_temp
      - action: logbook.log
        alias: Log the restore, naming the numbers actually put back
        data:
          entity_id: climate.bedroom_ac
          message: 'Back home — restored eco preset.{{ '' Bedroom target back to ''
            ~ br_restore ~ ''F.'' if br_restore > 0.5 else '' Bedroom had no away
            setback to undo.'' }}{{ '' Living room target back to '' ~ lr_restore
            ~ ''F.'' if lr_restore > 0.5 else '' Living room had no away setback to
            undo.'' }}{{ '' NOTE: bedroom AC unreachable, its restore was skipped
            and the marker was kept for next time.'' if states(''climate.bedroom_ac'')
            in [''unavailable'',''unknown''] else '''' }}'
          name: AC Away Eco
  max: 3
  mode: queued
- id: '1786413800292'
  alias: Bedroom AC — Gradual Warm Before Alarm (v3, Coordinated With Night Setpoint
    Manager)
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_prep
    offset: -0:30:00
    trigger: calendar
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - alias: Only 'Wake up' calendar events
    condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower | trim)
      }}'
  actions:
  - variables:
      base_temp: '{{ state_attr(''climate.bedroom_ac'', ''temperature'') | float }}'
  - action: input_boolean.turn_on
    alias: 'Claim the dial: block Night Setpoint Manager for the duration of the ramp'
    target:
      entity_id: input_boolean.bedroom_wake_warm_up_active
  - action: climate.set_temperature
    alias: Step 1 of 3 — +1°F
    data:
      temperature: '{{ base_temp + 1 }}'
    target:
      entity_id: climate.bedroom_ac
  - delay: 00:15:00
  - action: climate.set_temperature
    alias: Step 2 of 3 — +2°F
    data:
      temperature: '{{ base_temp + 2 }}'
    target:
      entity_id: climate.bedroom_ac
  - delay: 00:10:00
  - action: climate.set_temperature
    alias: Step 3 of 3 — +3°F, lands at wake time
    data:
      temperature: '{{ base_temp + 3 }}'
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.bedroom_ac
      message: 'Gradual wake warm-up complete — {{ base_temp }}°F → {{ base_temp +
        3 }}°F over 30 min. Sweet-spot block at the time: {{ states(''input_select.ac_sweet_spot_test_block'')
        }}.'
      name: Bedroom AC
  - action: input_boolean.turn_off
    alias: Release the dial back to Night Setpoint Manager
    target:
      entity_id: input_boolean.bedroom_wake_warm_up_active
  mode: single
- id: '1786413806767'
  alias: Living Room AC — Bedtime Setback (Unless Guests) (v4)
  triggers:
  - entity_id: input_boolean.in_bed
    for: 00:00:05
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - alias: Only arm if no setback is already active
    below: 0.5
    condition: numeric_state
    entity_id: input_number.lr_ac_pre_setback_temp
  actions:
  - variables:
      base_temp: '{{ state_attr(''climate.living_room_ac'', ''temperature'') | float
        }}'
  - action: input_number.set_value
    alias: Remember the pre-setback target so the morning restore can put it back
      exactly
    data:
      value: '{{ base_temp }}'
    target:
      entity_id: input_number.lr_ac_pre_setback_temp
  - action: climate.set_preset_mode
    alias: Eco preset for the overnight setback
    data:
      preset_mode: eco
    target:
      entity_id: climate.living_room_ac
  - alias: Let the unit settle — these Midea entities clobber rapid sequential commands
    delay:
      seconds: 3
  - action: climate.set_temperature
    alias: Relax target +3°F — just enough, not full daytime comfort
    data:
      temperature: '{{ base_temp + 3 }}'
    target:
      entity_id: climate.living_room_ac
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.living_room_ac
      message: Bedtime setback — eco preset, {{ base_temp }}°F → {{ base_temp + 3
        }}°F. Stored {{ base_temp }}°F for the morning restore.
      name: Living Room AC
  mode: single
- id: '1786413963544'
  alias: Bedroom AC — Dry Mode While Getting Ready (v3, Hands Back to Vanity Window)
  triggers:
  - entity_id: input_boolean.in_bed
    id: woke
    to: 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - after: 04:30:00
    before: 08:00:00
    condition: time
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - above: input_number.bedroom_dry_mode_humidity_threshold
    condition: numeric_state
    entity_id: sensor.airguard_humidity
    note: Only bother if the air is actually damp. Tunable from the dashboard rather
      than hardcoded.
  - above: 68
    condition: numeric_state
    entity_id: sensor.hue_motion_sensor_2_temperature
    note: Never add uncontrolled cooling to an already-cold room. This is the wall
      sensor on the vanity side, next to the unit.
  actions:
  - action: climate.set_hvac_mode
    alias: Dry mode for the getting-ready window
    data:
      hvac_mode: dry
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log entry, with the readings that justified it
    data:
      entity_id: climate.bedroom_ac
      message: Dry mode on for getting ready. Humidity {{ states('sensor.airguard_humidity')
        }}% (threshold {{ states('input_number.bedroom_dry_mode_humidity_threshold')
        }}%), wall {{ states('sensor.hue_motion_sensor_2_temperature') }}F.
      name: Bedroom AC
  - alias: Hold for up to 25 min, but bail the moment the vanity side gets cold
    continue_on_timeout: true
    note: Dry mode ignores the setpoint, so a sensor watch is the only real protection.
      25 min is the hard cap; the 68F crossing ends it sooner.
    timeout: 00:25:00
    wait_for_trigger:
    - below: 68
      entity_id: sensor.hue_motion_sensor_2_temperature
      trigger: numeric_state
  - action: climate.set_hvac_mode
    alias: Back to cool either way
    data:
      hvac_mode: cool
    target:
      entity_id: climate.bedroom_ac
  - alias: Hand back to the vanity window's target, if it is still open
    note: Dry mode ignores the setpoint entirely while active, so whatever the vanity
      window set before this automation took over never held. On exit, if the window
      is still open, explicitly restate its target instead of leaving the number wherever
      it happened to sit - this is the handoff this automation's own v2 description
      said should exist once the vanity window was built.
    if:
    - condition: state
      entity_id: input_boolean.bedroom_vanity_window
      state: 'on'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.bedroom_ac
        state:
        - 'off'
        - unavailable
        - unknown
    then:
    - action: climate.set_temperature
      alias: Restate the vanity dial target, skipping the unsettable 75
      data:
        temperature: '{% set t = states(''input_number.bedroom_vanity_dial_target'')
          | int(73) %}{{ 74 if t == 75 else t }}'
      target:
        entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log the exit, and say which way it ended
    data:
      entity_id: climate.bedroom_ac
      message: Dry mode off, back to cool. Ended by {{ 'the 68F bail-out' if wait.completed
        else 'the 25 minute cap' }}. Wall now {{ states('sensor.hue_motion_sensor_2_temperature')
        }}F, bedside {{ states('sensor.airguard_temperature') }}F.
      name: Bedroom AC
  mode: single
- id: '1786446832933'
  alias: Living Room AC — Morning Restore After Bedtime Setback (v2)
  triggers:
  - entity_id: input_boolean.in_bed
    for: 00:00:05
    from: 'on'
    id: woke_up
    to: 'off'
    trigger: state
  - at: '10:00:00'
    id: backstop
    trigger: time
  - entity_id: climate.living_room_ac
    from: unavailable
    id: unit_recovered
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - above: 0
    condition: numeric_state
    entity_id: input_number.lr_ac_pre_setback_temp
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.living_room_ac
      state:
      - 'off'
      - unavailable
      - unknown
  actions:
  - variables:
      restore_temp: '{{ states(''input_number.lr_ac_pre_setback_temp'') | float }}'
      why: '{{ trigger.id | default(''manual'') }}'
  - action: climate.set_temperature
    alias: Put the target back exactly where it was before bedtime
    data:
      temperature: '{{ restore_temp }}'
    target:
      entity_id: climate.living_room_ac
  - action: input_number.set_value
    alias: Clear the marker so tonight's setback can arm again
    data:
      value: 0
    target:
      entity_id: input_number.lr_ac_pre_setback_temp
  - action: logbook.log
    alias: Log it
    data:
      entity_id: climate.living_room_ac
      message: 'Morning restore — target back to {{ restore_temp }}°F (trigger: {{
        why }}).'
      name: Living Room AC
  mode: single
- id: alert_ac_unavailable
  alias: 'Alert: AC Offline / Restored'
  triggers:
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    for: 00:15:00
    id: ac_offline
    to: unavailable
    trigger: state
  - entity_id:
    - climate.bedroom_ac
    - climate.living_room_ac
    from: unavailable
    id: ac_restored
    not_to:
    - unknown
    trigger: state
  actions:
  - choose:
    - alias: Unit went dark
      conditions:
      - condition: trigger
        id: ac_offline
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: '{{ trigger.to_state.attributes.friendly_name | default(''An AC'')
            }} has been unreachable for 15 min. Its automations will skip instead
            of firing at a dead entity.'
          title: ⚠️ AC offline
    - alias: Unit came back
      conditions:
      - condition: trigger
        id: ac_restored
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: '{{ trigger.to_state.attributes.friendly_name | default(''An AC'')
            }} reconnected — now {{ trigger.to_state.state }}.'
          title: ✅ AC back online
  mode: single
- id: '1786621047539'
  alias: Set WFH Today Flag from Wake-Up Calendar (v2)
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_event
    trigger: calendar
  conditions:
  - condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | default('''')
      | lower | trim) }}'
    alias: Any wake event, however it is retitled - matches the test the other five
      consumers of this event already use
  actions:
  - choose:
    - alias: WFH - tested first so a hand-edit beats the script's prepopulated 'office'
      conditions:
      - condition: template
        value_template: '{{ ''wfh'' in (trigger.calendar_event.description | default('''')
          | lower) }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wfh_today
      - action: logbook.log
        data:
          entity_id: input_boolean.wfh_today
          message: Set ON — "{{ trigger.calendar_event.summary }}" description says
            WFH.
          name: WFH Today
    - alias: Office
      conditions:
      - condition: template
        value_template: '{{ ''office'' in (trigger.calendar_event.description | default('''')
          | lower) }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wfh_today
      - action: logbook.log
        data:
          entity_id: input_boolean.wfh_today
          message: Set OFF — "{{ trigger.calendar_event.summary }}" description says
            office.
          name: WFH Today
    default:
    - alias: Description matched neither word - say so instead of silently keeping
        yesterday's value
      action: notify.mobile_app_iphone
      data:
        title: ⚠️ WFH flag not set
        message: Today's wake event "{{ trigger.calendar_event.summary }}" has a description
          of "{{ trigger.calendar_event.description | default('') | trim or '(blank)'
          }}", which says neither WFH nor office. The flag stays OFF, so the house
          will treat today as an office day. Edit the calendar entry if that is wrong.
    - action: logbook.log
      data:
        entity_id: input_boolean.wfh_today
        message: NOT SET — "{{ trigger.calendar_event.summary }}" description "{{
          trigger.calendar_event.description | default('') | trim or '(blank)' }}"
          matched neither WFH nor office. Flag left at its 4am default of OFF.
        name: WFH Today
  mode: single
- id: '1786621049944'
  alias: Bedroom AC — WFH Warm Setback 78F (v3)
  triggers:
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: state
    entity_id: binary_sensor.workday
    state: 'on'
  - condition: state
    entity_id: input_boolean.wfh_today
    state: 'on'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - condition: state
    entity_id: input_boolean.bedroom_vanity_window
    state: 'off'
    note: The vanity window owns the bedroom dial while it is open. Without this,
      08:00 on a WFH day overwrites the vanity target with 78, and the window's close
      leg (which only writes 76 when the dial is below 76) can never undo it. Mirrors
      the same guard on Bedroom AC - Daytime Release to 76 (v2).
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
