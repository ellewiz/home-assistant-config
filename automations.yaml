        %}{% set temp = p.temperature|float(70) %}{% set wind = p.wind_speed|float(0)
        %}{% if ''lightning'' in cond or ''thunderstorm'' in cond or ''hail'' in cond
        or ''pouring'' in cond or precip>=75 %}{{ 0 }}{% else %}{% set r = 30 if precip<10
        else (23 if precip<25 else (14 if precip<40 else (6 if precip<60 else 2)))
