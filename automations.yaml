- id: '1637113982141'
  alias: Update in_bed when motion is detected
  description: ''
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    from: 'off'
    to: 'on'
    id: motion
    platform: state
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'on'
  - condition: state
    entity_id: group.morning
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.in_bed
      - action: scene.turn_on
        metadata: {}
        target:
          entity_id: scene.bedroom_energize
        data:
          transition: 3
      - if:
        - condition: state
          entity_id: media_player.bedroom
          state: playing
        then:
        - action: media_player.media_stop
          target:
            entity_id: media_player.bedroom
      - delay:
          seconds: 4
      - if:
        - condition: numeric_state
          entity_id: sensor.hue_motion_sensor_2_light_level
          below: input_number.bedroom_lux_on_threshold
        - condition: not
          conditions:
          - condition: state
            entity_id: timer.bedroom_light_timer
            state: active
        then:
        - action: scene.turn_on
          data:
            transition: 5
          target:
            entity_id: scene.bedroom_energize
  mode: restart
- id: '1639287271338'
  alias: Bedroom — Motion Lights (v2, Nightlight After 10pm)
  description: 'v2: Turns on bedroom lights on motion when dark (lux below bedroom_lux_on_threshold).
    Between 22:00 and 05:30 uses a dim red nightlight (10%, won''t disrupt sleep)
    instead of the full Natural Light scene; 05:30 hands off to early-morning/wake
    logic. Turn-OFF logic moved to companion automation ''Bedroom — Lights Off (Motion
    Clear / Bright / In Bed)'' so it works regardless of how the lights were turned
    on — the old in-run wait_for_trigger missed lights turned on by the in_bed wake
    automation, buttons, or the Hue app (root cause of the 16h lights-on incident
    on 2026-06-04). No Nightlight scene exists in HA; if one is created later, swap
    the red light.turn_on for it.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_2_motion
    from: 'off'
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_2_light_level
    below: input_number.bedroom_lux_on_threshold
  actions:
  - choose:
    - alias: Late night (22:00–05:30) — dim red nightlight
      conditions:
      - condition: time
        after: '22:00:00'
        before: 05:30:00
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: 10
          transition: 2
    default:
    - alias: Daytime/evening — normal Natural Light scene
      action: scene.turn_on
      target:
        entity_id: scene.bedroom_natural_light_2
      data:
        transition: 2
  mode: single
  max_exceeded: silent
