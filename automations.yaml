- id: '1758763117719'
  alias: Living Room — Ambient Manager (Lux On/Off) (v3)
  description: 'Turn living room ambient on when dark; off when bright (with hysteresis).
    2026-06-12: rebuilt to stop a confirmed flapping loop (light.living_room_lights
    cycled on/off 6x in ~80 min on a cloudy afternoon, empty room). Three changes:
    (1) triggers now read sensor.living_room_illuminance_smoothed — a 10-min median
    (package living_room_lux_smoothing.yaml) — instead of the raw, jittery Hue lux
    that swung 19-43 every few minutes; (2) band widened to lux_on 18 / lux_off 45
    so the lamps'' own ~15-20 lx contribution can no longer cross the off threshold
    and self-trigger; (3) the lux_above_off branch now also requires the group to
    have been ON for >25 min before it may auto-off, breaking any residual oscillation.
    Off branches still require motion off so it never turns the lights off on top
    of someone in the room. On-branch is intentionally NOT presence/vacation-gated:
    lights coming on while away is wanted (occupied look). Root cause is the lux sensor
    seeing the lamps it controls; a relocated/dedicated sensor would let the band
    tighten again later. 2026-07-13: two convergence fixes after the room stayed dark
    following a 5:15pm arrival. Root cause: the day''s only below-lux_on crossing
    (7:42am) landed inside the early_morning gate and was swallowed, and numeric_state
    never re-fires without a re-cross. (a) New presence_arrived trigger + branch:
    turn on when living_room_presence goes on while lux is below lux_on and the group
    is off; gated on in_bed off so a bedtime off cannot be re-lit by lingering or
    dog presence. (b) New early_morning_ended dark branch: at window end, if lux is
    below lux_on and the group is off, turn on (mirror of the existing bright auto-off),
    restoring the occupied look on workday mornings. Style pass same day: presence
    branch additionally gated on person.lara_wiz home (house rule: dog motion must
    never drive human-comfort lighting); arrival purpose unaffected since arrival
    means she is home, and occupied-look while away stays served by the lux_below_on
    trigger. 2026-07-27 (v2): AWAY-DIM. The on-branches were full brightness regardless
    of occupancy, so a dark-enough afternoon (winter sunset, snow, storm) put all
    three bulbs to full in an empty house until lux climbed back over lux_off - which
    on a short December day never happens before bedtime. Rather than presence-gating
    the decision (which would kill the occupied look the on-branch exists for), brightness
    is now presence-aware: person.lara_wiz home = normal Adaptive Lighting brightness,
    away = brightness_pct 20. Same occupied look from the street, roughly 80 percent
    less energy, and the room is never pitch dark on arrival. Applies to both auto-on
    branches (lux_below_on and early_morning_ended-dark). The explicit brightness_pct
    deliberately PINS AL manual_control while away (autoreset is 0) so AL cannot re-adapt
    the dim back up; the new person_arrived_home branch clears that pin via set_manual_control
    false and relights at normal brightness if the room is still dark. That new branch
    is needed because the existing presence_arrived branch requires the group to be
    OFF, so it would never fire when she walks in on away-dim lamps that are already
    on. The top-level early_morning gate now carries an exemption for the person_arrived_home
    trigger, so arriving home inside the early-morning window still clears the away-dim
    pin; without it the lamps could stay pinned dim (a later bare turn_on would just
    relight them at their pinned level). Note the pin is deliberately NOT cleared
    on the ordinary home on-branches: light.next_to_couch is pinned to 20 percent
    by the Movie Lamp Dimmer during TV, and a blanket clear there would brighten the
    end table lamp mid-movie. A bare turn_on leaves manual_control alone, which is
    why the home branch uses one. 2026-08-17 (v3): LATE-NIGHT GUARD on the presence_arrived
    branch. Overnight Aug 15->16 the no-bedtime fallback (automation.living_room_late_night_off_no_bedtime_fallback_v1)
    turned the room off 8 times between 02:00 and 04:15 and this branch relit it within
    ~30s every time; the same fight ran overnight Aug 7->8 (3x), Aug 8->9 (1x) and
    Aug 12->13 (3x) - 15 catches across 4 overnights for an automation designed to
    fire once per night. It then ran again overnight Aug 18->19 (4x: 02:00, 02:15,
    02:45, 03:15), the fifth overnight, hours before this guard landed - running total
    19 catches across 5 overnights. NOTE ON DATES: every catch falls in the 02:00-05:00
    window, so each one belongs to the overnight that ENDS on the logged date, not
    the evening that starts it. Cause: the SNZB-06P carries a 120s clear delay, so
    binary_sensor.living_room_presence drops to off while she is sitting still on
    the couch; the fallback''s /15 sweep lands in one of those holes, sees an empty
    room and turns off; she moves, presence returns, and this branch''s conditions
    (lux below lux_on - the room sits at 2-3 lx overnight - group off, person home,
    in_bed off) were all satisfied, so it relit. The fallback owns 02:00-05:00 and
    presence must not override it there. ONLY this branch is gated: lux_below_on still
    provides the occupied look at any hour, and person_arrived_home must still be
    able to clear the away-dim pin whenever she walks in. Motion-driven relight is
    unaffected - the fallback carries its own motion condition and will not turn off
    on top of someone moving - and Morning Lights v4 still owns the 05:00+ relight.
    Accepted trade: a still, awake 3am couch session now goes dark once instead of
    cycling.'
  triggers:
  - id: lux_below_on
    entity_id: sensor.living_room_illuminance_smoothed
    below: input_number.living_room_lux_on
    for: 00:01:00
    trigger: numeric_state
  - id: lux_above_off
    entity_id: sensor.living_room_illuminance_smoothed
    above: input_number.living_room_lux_off
    for: 00:05:00
    trigger: numeric_state
  - id: early_morning_ended
    entity_id: binary_sensor.early_morning
    to: 'off'
    trigger: state
  - id: presence_arrived
    entity_id: binary_sensor.living_room_presence
    to: 'on'
    trigger: state
  - id: person_arrived_home
    entity_id: person.lara_wiz
    to: home
    trigger: state
  conditions:
  - condition: template
    alias: Early-morning gate — exempt the arrived-home branch so the away-dim pin
      always gets cleared
    value_template: '{{ is_state(''binary_sensor.early_morning'', ''off'') or (trigger
      is defined and trigger.id == ''person_arrived_home'') }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lux_below_on
      sequence:
      - alias: Brightness depends on whether anyone is home
        choose:
        - alias: Home — normal Adaptive Lighting brightness
          conditions:
          - condition: state
            entity_id: person.lara_wiz
            state: home
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.living_room_lights
            data:
              transition: 5
        default:
        - alias: Away — occupied look at low brightness (pins AL manual_control until
            arrival)
          action: light.turn_on
          target:
            entity_id: light.living_room_lights
          data:
            brightness_pct: 20
            transition: 5
    - conditions:
      - condition: trigger
        id: lux_above_off
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_4_motion
        state: 'off'
      - condition: template
        alias: Min on-time — don't auto-off within 25 min of turning on (anti-flap)
        value_template: '{% set e = states.light.living_room_lights %}

          {{ e is not none and (now() - e.last_changed).total_seconds() > 1500 }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room_lights
        data:
          transition: 1
    - conditions:
      - condition: trigger
        id: early_morning_ended
      - condition: numeric_state
        entity_id: sensor.living_room_illuminance_smoothed
        above: input_number.living_room_lux_off
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_4_motion
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room_lights
        data:
          transition: 1
    - conditions:
      - condition: trigger
        id: presence_arrived
      - alias: Not inside the Late-Night Off window (02:00-05:00) — the no-bedtime
          fallback owns that window; see the 2026-08-17 v3 note in the description
        condition: not
        conditions:
        - condition: time
          after: 02:00:00
          before: 05:00:00
      - condition: numeric_state
        entity_id: sensor.living_room_illuminance_smoothed
        below: input_number.living_room_lux_on
      - condition: state
        entity_id: light.living_room_lights
        state: 'off'
      - condition: state
        entity_id: person.lara_wiz
        state: home
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.living_room_lights
        data:
          transition: 5
    - conditions:
      - condition: trigger
        id: early_morning_ended
      - condition: numeric_state
        entity_id: sensor.living_room_illuminance_smoothed
        below: input_number.living_room_lux_on
      - condition: state
        entity_id: light.living_room_lights
        state: 'off'
      sequence:
      - alias: Brightness depends on whether anyone is home
        choose:
        - alias: Home — normal Adaptive Lighting brightness
          conditions:
          - condition: state
            entity_id: person.lara_wiz
            state: home
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.living_room_lights
            data:
              transition: 5
        default:
        - alias: Away — occupied look at low brightness (pins AL manual_control until
            arrival)
          action: light.turn_on
          target:
            entity_id: light.living_room_lights
          data:
            brightness_pct: 20
            transition: 5
    - alias: Arrived home — clear any away-dim pin and return to normal brightness
      conditions:
      - condition: trigger
        id: person_arrived_home
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - alias: Hand the group back to Adaptive Lighting (clears the away-dim pin)
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          lights:
          - light.living_room_corner
          - light.torchiere
          - light.next_to_couch
          manual_control: false
      - alias: Relight at normal brightness if the room is still dark
        if:
        - condition: numeric_state
          entity_id: sensor.living_room_illuminance_smoothed
          below: input_number.living_room_lux_on
        then:
        - action: light.turn_on
          target:
            entity_id: light.living_room_lights
          data:
            transition: 5
  mode: single
- id: '1760293166291'
  alias: Office — Johnny's Light (v2, Occupancy Hold)
  description: 'v2 of "Shut off Johnny''s light". v1 waited for motion-clear with
    no debounce, so short motion blips strobed the office lamp (226+ toggles in 12
    days, mostly 7–20s on-cycles in nightly bursts). v2 holds the light until the
    office has been quiet for 10 minutes, with a 2h failsafe. Rewritten to entity
    targets instead of device_id. Not gated on calendar.vacation on purpose: Johnny
    may be home with a sitter.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_office_motion_sensor_motion
    from: 'off'
    to: 'on'
    for: 00:00:03
  conditions:
  - condition: numeric_state
    entity_id: sensor.hue_office_motion_sensor_light_level
    below: 8
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  actions:
  - alias: Phase 1 — Warm light on for Johnny
    action: light.turn_on
    target:
      entity_id: light.light
    data:
      color_temp_kelvin: 2775
      transition: 3
  - alias: Phase 2 — Hold until office quiet for 10 minutes
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.hue_office_motion_sensor_motion
      to: 'off'
      for: 00:10:00
    timeout: 02:00:00
    continue_on_timeout: true
  - alias: Phase 3 — Lights out
    action: light.turn_off
    target:
      area_id: office
    data:
      transition: 5
  mode: restart
  max_exceeded: silent
- id: '1763032936247'
  alias: Living Room — Morning Lights (v4, Lux + Presence + Already-On Guard)
  description: 'v2 of "Living room lights on - Morning". v1 had no lux condition,
    so after the Ambient Manager''s early_morning_ended branch turned the lights off
    at 8:00 (room bright by lux), the next motion re-lit them — observed 9/9 days
    May 28–Jun 5 2026. Sleep-mode clear stays unconditional so Adaptive Lighting never
    gets stuck dim; the relight is gated on the room actually being dark. Lux sensor
    unavailable is treated as dark (fail-bright for a wake-up light).


    2026-07-23 (v3): relight branch now also requires binary_sensor.johnny_home_alone
    to be off, so Johnny''s motion after Lara leaves no longer re-lights the empty
    living room (observed that day: her 07:37 leave-home off was undone 24s later
    by his motion and the LR burned ~9.7h in an empty house). Implements the house
    rule that dog motion must not drive human-comfort lighting. Gate is on the relight
    branch only; the Adaptive Lighting sleep-mode clear stays unconditional. Caveat:
    johnny_home_alone keys on person.lara_wiz being not_home, which is still fed by
    the MacBook and iPad trackers (they pin it home), so the plan is to reduce person.lara_wiz
    to the iPhone tracker only, making this gate reliable on every away-day rather
    than only when the Mac is asleep.


    2026-08-14: the caveat in the paragraph above is now RESOLVED, and it was worse
    than described. person.lara_wiz was already reduced to the iPhone tracker, but
    binary_sensor.johnny_home_alone''s template still used is_state(''person.lara_wiz'',''not_home'')
    — a literal state string. Any NAMED zone (Work, vet, allergist) is not that string,
    so the sensor read ''off'' the entire time she was at the office, and this relight
    gate was silently open on every workday. Confirmed on 2026-08-14, where the sensor
    flipped off at 08:05, 10:52 and 12:08 purely because her phone touched zone.work.
    Helper template changed to ''not is_state(person.lara_wiz, home)'', which is true
    for not_home AND every named zone. No change to this automation''s own config;
    the gate simply works now. Found while tracing a separate 7ms race in AC — Away
    Eco / Restore on Presence (v5).


    2026-08-17 (v4): ADDED AN ALREADY-ON GUARD to the relight branch. The branch had
    no condition that light.living_room_lights was off, so it fired light.turn_on
    on EVERY motion off->on even when the lamps were already lit. Traced Fri 2026-08-14:
    motion fired 06:14:59.763 and both lamps dropped together 1.01s later at 06:15:00.776
    and .778 (2ms apart = one service call to the group); the LR motion sensor then
    bounced 20+ times between 06:14:59 and 06:23, and because mode is restart every
    bounce re-ran this automation, each run restarting Adaptive Lighting''s 45s re-ramp.
    Net effect: the lamps visibly breathed for about 8 minutes during her actual morning.
    RULED OUT while tracing: not a relight (the group was continuously on from 06:02:58
    to 07:36:23) and not sleep mode (off at 05:30, stayed off). Reference implementation
    for the guard is Ambient Manager''s presence_arrived branch, which correctly requires
    state off. Action[0] (the Adaptive Lighting sleep-mode clear) DELIBERATELY stays
    unconditional and outside the guard, so the wake-up path is unaffected: on morning
    motion AL sleep mode is still cleared and AL re-adapts already-on lamps up from
    10 percent. STILL UNEXPLAINED, do not treat as solved: the dip landed on exactly
    10 percent, which is precisely AL''s sleep_brightness, and the record cannot account
    for that coincidence.'
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_4_motion
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: group.morning
    state: 'on'
  actions:
  - alias: Always clear Adaptive Lighting sleep mode on first morning motion
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  - alias: Relight only if the room is actually dark
    choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.johnny_home_alone
        state: 'off'
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.hue_motion_sensor_4_illuminance
          below: input_number.living_room_lux_on
        - condition: template
          value_template: '{{ states(''sensor.hue_motion_sensor_4_illuminance'') in
            [''unknown'', ''unavailable''] }}'
      - condition: state
        entity_id: light.living_room_lights
        state: 'off'
        alias: Only relight if the group is actually OFF (anti re-fire guard, added
          v4)
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.living_room_lights
        data:
          transition: 5
  mode: restart
- id: '1763519365290'
  alias: Sonos Wake Alarm
  description: '20 min before wake event: plays Lofi Sleep playlist with subliminal-start
    volume ramp (3%->20%). At wake time: classic alarm escalates every ~12s until
    in_bed turns off. Alarm sound: /config/www/alarm-clock.mp3 [2026-06-29] Top-level
    guard changed from binary_sensor.early_morning (window starts 05:30) to a dedicated
    time condition after 04:30 / before 08:00, because an earlier wake time (5:50am)
    pushed the -20min trigger onto 05:30:00 and lost a sub-second race against the
    shared early_morning sensor flipping on, so the alarm silently failed its condition.
    Dedicated guard avoids touching the 4 lighting automations that share early_morning.
    [2026-07-05] Added Phase 0 media_player.unjoin on media_player.bedroom_frame (native
    Sonos bedroom) before playback so wake audio stays solo and does not bleed into
    the grouped bathroom Era 100 and disturb Johnny; MA still plays to media_player.bedroom,
    which routes to the same now-solo speaker. [2026-07-13] ''Wake up'' summary check
    hoisted to top-level conditions and the no-wake-event fallback branch deleted:
    any other early calendar event (appointment, flight) in the 04:30-08:00 window
    used to fall through to it and create a spurious ''Alarm Skipped'' notification.
    [2026-08-11] media_id swapped from library://playlist/53 to library://playlist/100.
    The Apple Music provider (instance apple_music--RVs6ewM4) was re-added or re-authenticated
    at some point, which gave it a new instance id and made Music Assistant re-import
    the whole library as fresh items: 32 of 68 playlist names now appear twice, old
    copies at library ids ~3-68 and new copies at ~78-111. Playlist 53 is an orphan
    whose provider mapping points at the dead old instance, so play_media returned
    ''No playable items found'' on both Aug 10 and Aug 11. Because that step is continue_on_error,
    the full 20-minute volume ramp ran against silence and the trace looked normal.
    Playlist 100 is the live copy of the same playlist. [2026-08-11] Also added a
    Phase 1 alert that fires when wait.completed is false, so a playlist that never
    reaches playing pushes to iPhone instead of failing silently. This covers the
    case the Speaker Failsafe (v1) automation lists as its TODO v2: MA player present
    and not unavailable, but playback never actually starts. If the library is ever
    re-imported again, re-check this media_id before assuming the wake music works.
    [2026-08-12] Phase 1 moved OFF Music Assistant entirely, after MA''s Apple Music
    bridge broke again (library id 100 also started throwing ''No playable items found'',
    survived an add-on restart, root cause never resolved) and Lara decided MA wasn''t
    worth keeping given she barely uses it as a player. Phase 1 now uses media_player.play_media
    with a native Sonos Favorite (media_content_type: favorite_item_id) on media_player.bedroom_frame,
    instead of music_assistant.play_media on media_player.bedroom. Two favorites exist:
    Lofi Sleep (FV:2/57, default) and Halloween lofi (FV:2/58). A new step calls calendar.get_events
    on calendar.master_calendar for today''s date range; if any event summary contains
    ''halloween'' (case-insensitive), the Halloween favorite plays instead. All Phase
    1 volume-ramp, shuffle_set, and wait_for_trigger steps were retargeted from media_player.bedroom
    to media_player.bedroom_frame to match. Phase 2 (the escalating alarm-clock.mp3
    via music_assistant.play_announcement) is UNCHANGED and still targets media_player.bedroom
    on Music Assistant deliberately — that''s the safety-critical wake mechanism,
    proven reliable twice (Aug 10, Aug 12), and this change did not touch it. If Lara
    later removes Music Assistant entirely, Phase 2 will need its own migration (native
    Sonos has no direct play_announcement-with-escalating-volume equivalent; would
    need TTS/URL playback via a script similar to sonos_broadcast). [2026-08-12 later]
    Phase 2 also moved OFF Music Assistant, completing the full removal. music_assistant.play_announcement
    (which supported an atomic announce_volume + non-destructive duck/resume) has
    no native-Sonos equivalent — tested media_player.play_media with announce:true
    on media_player.bedroom_frame first and it silently no-op''d (no state change,
    no error, Sonos integration doesn''t implement the announce kwarg). Plain media_player.play_media
    (no announce flag) DOES work, confirmed live twice via ha_get_history state transitions
    (idle->playing->idle, ~1.8s matching the clip''s real length) — it just fully
    replaces the queue rather than ducking/restoring, which is fine here since nothing
    needs to resume after the alarm. Loop now does volume_set (0.42->1.00 in 0.08
    steps, same ramp as before rescaled from the old 0-100 announce_volume to native
    0.0-1.0) then play_media, both continue_on_error, both on media_player.bedroom_frame.
    Verified the ramp math via ha_eval_template before shipping. Music Assistant no
    longer has ANY role in this automation.'
  triggers:
  - entity_id: calendar.master_calendar
    event: start
    id: wake_up_time
    offset: -0:20:00
    platform: calendar
  conditions:
  - after: 04:30:00
    before: 08:00:00
    condition: time
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - alias: Only 'Wake up' events (hoisted from branch 1, 2026-07-13)
    condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower | trim)
      }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
      sequence:
      - action: media_player.unjoin
        alias: Phase 0 — Unjoin bedroom Sonos so wake audio stays out of the bathroom
          (Johnny)
        continue_on_error: true
        target:
          entity_id: media_player.bedroom_frame
      - alias: 'Phase 0 — Settle: let the Sonos group dissolve before playback'
        delay: 00:00:01
      - action: calendar.get_events
        alias: Phase 1 — Check whether a Halloween event is active today
        continue_on_error: true
        data:
          end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%dT00:00:00'')
            }}'
          start_date_time: '{{ now().strftime(''%Y-%m-%dT00:00:00'') }}'
        response_variable: today_cal_events
        target:
          entity_id: calendar.master_calendar
      - alias: Phase 1 — Set halloween_active from today's calendar events
        variables:
          halloween_active: '{{ (today_cal_events | default({})).get(''calendar.master_calendar'',
            {}).get(''events'', []) | selectattr(''summary'', ''defined'') | map(attribute=''summary'')
            | select(''search'', ''(?i)halloween'') | list | length > 0 }}'
        continue_on_error: true
      - action: media_player.volume_set
        alias: Phase 1 — Set initial low volume
        data:
          volume_level: 0.03
        target:
          entity_id: media_player.bedroom_frame
      - action: media_player.play_media
        alias: Phase 1 — Play Lofi Sleep (or Halloween) Sonos favorite
        continue_on_error: true
        data:
          media_content_id: '{{ ''FV:2/58'' if (halloween_active | default(false))
            else ''FV:2/57'' }}'
          media_content_type: favorite_item_id
        target:
          entity_id: media_player.bedroom_frame
      - continue_on_timeout: true
        timeout: 00:00:15
        wait_for_trigger:
        - entity_id: media_player.bedroom_frame
          to: playing
          trigger: state
      - alias: Phase 1 — Alert if the wake playlist never started
        if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: notify.mobile_app_iphone
          data:
            message: The wake music (Sonos Favorite) did not reach playing on the
              bedroom speaker within 15s, so the volume ramp is running against silence.
              The alarm at wake time will still sound. Check the Lofi Sleep / Halloween
              lofi favorite on the Bedroom Sonos.
            title: ⚠️ Wake lofi never started
      - action: media_player.shuffle_set
        continue_on_error: true
        data:
          shuffle: true
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.04
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.05
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.07
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.09
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.11
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.13
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.15
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.18
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - action: media_player.volume_set
        data:
          volume_level: 0.2
        target:
          entity_id: media_player.bedroom_frame
      - delay: 00:02:00
      - alias: Phase 2 — Skip if already out of bed
        condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      - alias: Phase 2 — Alarm escalation loop
        repeat:
          sequence:
          - action: media_player.volume_set
            alias: Phase 2 — Set escalating alarm volume
            continue_on_error: true
            data:
              volume_level: '{{ [0.42 + (repeat.index - 1) * 0.08, 1.0] | min }}'
            target:
              entity_id: media_player.bedroom_frame
          - action: media_player.play_media
            alias: Phase 2 — Play alarm-clock.mp3
            continue_on_error: true
            data:
              media_content_id: http://homeassistant.local:8123/local/alarm-clock.mp3
              media_content_type: music
            target:
              entity_id: media_player.bedroom_frame
          - delay: 00:00:12
          until:
          - condition: state
            entity_id: input_boolean.in_bed
            state: 'off'
      - action: light.turn_on
        alias: Phase 3 — Gentle light fade-in once up
        data:
          transition: 300
        target:
          entity_id: light.bedroom
    - conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'off'
      sequence:
      - action: persistent_notification.create
        data:
          message: Skipped — you were not in bed.
          title: Alarm Skipped
    - conditions:
      - condition: state
        entity_id: binary_sensor.workday
        state: 'off'
      sequence:
      - action: persistent_notification.create
        data:
          message: Skipped — not a workday.
          title: Alarm Skipped
  mode: single
- id: '1764645467296'
  alias: Heat the car
  description: 'Year-round pre-conditioning nudge. Trigger UNCHANGED: 13 min before
    an ''office'' calendar event ends, gated on binary_sensor.workday(on) + person.lara_wiz(home).
    Fires when outdoor weather is notable in EITHER direction: OR(sensor.kttn_temperature
    below 45F [cold], sensor.kttn_temperature above 80F [hot], sensor.kttn_dew_point
    above 65F [muggy]). Cold branch restored 2026-07-24 per Lara so the nudge is useful
    in winter AND summer. Dew point (not RH) for the muggy branch because this runs
    in the morning when RH peaks. Two actions, both kept: (1) Sonos broadcast, neutral
    wording ''It''s time to turn on the car!''; (2) actionable iPhone notification
    (notify.mobile_app_iphone, time-sensitive, tag heat_the_car_precool). TAP TARGET:
    mychevrolet:// was tap-tested 2026-07-24 and FAILED (opened Home Assistant, not
    the app), so myChevrolet does not register that URL scheme. Switched to a Siri
    Shortcut: shortcuts://run-shortcut?name=Start%20Car. Lara must create an iOS Shortcut
    named exactly ''Start Car'' (Open App: myChevrolet, or a myChevrolet Remote Start
    action to actually fire it). Pending her building the Shortcut + a re-test. Chevy
    exposes no remote-start API.


    [2026-08-12] Sonos broadcast player list swapped off Music Assistant entities:
    media_player.bedroom -> media_player.bedroom_frame. living_room_arc and bathroom
    were already native, untouched. Part of removing Music Assistant from the house
    entirely (see [[project_wake_alarm_playlist53_failure]]). This also closes a latent
    bug: sonos.snapshot/sonos.restore inside scripts/sonos_broadcast.yaml are Sonos-platform-only
    services that silently no-op on non-Sonos entities, so the resume-after-announcement
    protection this script was built for ([[project_sonos_broadcast_snapshot_order]])
    never actually covered bedroom before this fix.


    [2026-08-18] Player list is now bedroom_frame + living_room_arc + bathroom, three
    genuine Sonos, all three getting real snapshot/restore protection. A fourth entry
    was removed after the daily sweep found it was not a Sonos device at all, despite
    the 2026-08-12 note above claiming the whole list had been moved to native Sonos.
    script.sonos_broadcast runs ungroup: true and calls media_player.unjoin; a non-Sonos
    player does not support that action, so the script errored at step 3 and, because
    this automation is mode: single with no continue_on_error, the whole automation
    aborted at action 1 and the iPhone push at action 2 never fired either. Both halves
    of the nudge were silently dead from 2026-08-12 until 2026-08-18. RULE: only entities
    on the Sonos platform belong in this players list. Verify the platform before
    adding one; do not trust an entity name. NOTE: scripts/sonos_broadcast.yaml already
    carried a 2026-06-14 comment stating HomePod support was removed — that comment
    was correct and was simply not read before the 2026-08-12 edit.


    [2026-08-18b] Added continue_on_error: true to the broadcast call. The push at
    action 2 is the load-bearing half of this nudge (it carries the Start Car shortcut);
    a speaker fault must never again take it down with it. Mirrors script.commute_time_announcer,
    which has always done this.'
  triggers:
  - entity_id: calendar.master_calendar
    event: end
    offset: -0:13:0
    trigger: calendar
  conditions:
  - condition: template
    value_template: "{{ \n  'office' in (trigger.calendar_event.description | default('')
      | lower)\n}}\n"
  - condition: state
    entity_id: binary_sensor.workday
    state:
    - 'on'
  - condition: state
    entity_id: person.lara_wiz
    state:
    - home
  - condition: or
    conditions:
    - below: 45
      condition: numeric_state
      entity_id: sensor.kttn_temperature
    - above: 80
      condition: numeric_state
      entity_id: sensor.kttn_temperature
    - above: 65
      condition: numeric_state
      entity_id: sensor.kttn_dew_point
  actions:
  - action: script.sonos_broadcast
    continue_on_error: true
    note: continue_on_error so a bad speaker cannot abort the run and kill the iPhone
      push below. Only Sonos-platform entities belong in players.
    data:
      message: It's time to turn on the car!
      players:
      - media_player.bedroom_frame
      - media_player.living_room_arc
      - media_player.bathroom
      restore: true
      ungroup: true
      volume: 0.7
    metadata: {}
  - action: notify.mobile_app_iphone
    note: 'The load-bearing half of this nudge: carries the Start Car shortcut tap
      target.'
    data:
      data:
        actions:
        - action: URI
          title: Start the car
          uri: shortcuts://run-shortcut?name=Start%20Car
        push:
          interruption-level: time-sensitive
        tag: heat_the_car_precool
        url: shortcuts://run-shortcut?name=Start%20Car
      message: It's {{ states('sensor.kttn_temperature') | float(0) | round }}°F out{%
        if states('sensor.kttn_dew_point') | float(0) > 65 %}, dew point {{ states('sensor.kttn_dew_point')
        | float(0) | round }}°F{% endif %}. Tap to open myChevrolet and start it.
      title: "\U0001F697 Turn on the car"
  mode: single
- id: '1765403683258'
  alias: Living Room — Movie Lamp Dimmer (v2)
  description: '⚠️ ARCHIVED 2026-08-08 — the Roku TV was physically removed. media_player.55_tcl_roku_tv
    now resolves to nothing, so the ''Blind-app fingerprint'' branch (which checked
    the Roku''s reported HDMI source to catch Frndly/home-screen on the ATV) is inert.
    The ''ATV actively playing'' and general sunset branches still work fine on Apple
    TV alone. When a new TV is set up: swap media_player.55_tcl_roku_tv for its entity_id
    (or drop the branch if the new TV can''t report HDMI source). Label: TV Replacement
    Pending.


    Dim the end-table lamp when the Apple TV is in use after sunset. v2 (2026-06-07):
    added Frndly support. Frndly publishes no now-playing metadata to tvOS, so while
    it plays the ATV entity sits at state ''idle'' with app_id '''' (verified live;
    all other apps — Tubi, Infuse, HBO Max, Shudder, WNBA, VidHub — report normally).
    Fingerprint for ''ATV in use by an HA-blind app'': TCL TV on + TV source ''Apple
    TV'' + ATV idle with empty app_id. The ATV home screen matches the same fingerprint
    and is indistinguishable, so browsing the home screen after sunset also dims —
    accepted tradeoff (hybrid design, chosen over session-based). The app_id attribute
    trigger covers entering Frndly/home screen without a state-value change (e.g.
    exit Tubi menu → home → Frndly). Companion automation ''Living Room — Movie Lamp
    Restore (v2)'' skips restoring while the fingerprint holds, so the lamp won''t
    pop bright mid-Frndly.'
  triggers:
  - entity_id:
    - media_player.living_room_4k_2
    to:
    - playing
    - buffering
    - paused
    id: atv_active
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    to: idle
    id: atv_blind
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    attribute: app_id
    to: ''
    id: atv_blind_attr
    platform: state
  - event: sunset
    offset: 00:01:00
    id: sunset
    platform: sun
  conditions:
  - condition: sun
    after: sunset
  - condition: state
    entity_id: light.next_to_couch
    state: 'on'
  actions:
  - choose:
    - alias: ATV actively playing (any app HA can see)
      conditions:
      - condition: trigger
        id: atv_active
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
    - alias: Blind-app fingerprint (Frndly / home screen)
      conditions:
      - condition: trigger
        id:
        - atv_blind
        - atv_blind_attr
      - condition: state
        entity_id: media_player.living_room_4k_2
        state: idle
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        state: 'on'
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        attribute: source
        state: Apple TV
      - condition: template
        value_template: '{{ (state_attr(''media_player.living_room_4k_2'', ''app_id'')
          or '''') == '''' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
    - alias: Sunset while already watching
      conditions:
      - condition: trigger
        id: sunset
      - condition: or
        conditions:
        - condition: state
          entity_id: media_player.living_room_4k_2
          state:
          - playing
          - buffering
          - paused
        - condition: and
          conditions:
          - condition: state
            entity_id: media_player.living_room_4k_2
            state: idle
          - condition: state
            entity_id: media_player.55_tcl_roku_tv
            state: 'on'
          - condition: state
            entity_id: media_player.55_tcl_roku_tv
            attribute: source
            state: Apple TV
          - condition: template
            value_template: '{{ (state_attr(''media_player.living_room_4k_2'', ''app_id'')
              or '''') == '''' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
  mode: restart
  trace:
    stored_traces: 25
- id: '1765403998807'
  alias: Living Room — Movie Lamp Restore (v2)
  description: '⚠️ ARCHIVED 2026-08-08 — the Roku TV was physically removed. media_player.55_tcl_roku_tv
    now resolves to nothing, so the safety check in the ''Idle outside the Frndly/home-screen
    blind spot'' branch (states(''media_player.55_tcl_roku_tv'') != ''on'') is now
    ALWAYS true — meaning every ATV idle restores the lamp, including true Frndly
    blind-spot cases (the protection this branch existed for is currently not applied).
    Not a new bug from this edit: it''s been behaving this way since the Roku went
    unavailable. When a new TV is set up: swap media_player.55_tcl_roku_tv for its
    entity_id to restore the blind-spot protection. Label: TV Replacement Pending.


    When the Apple TV stops after sunset, hand the end-table lamp back to Adaptive
    Lighting. v1 history: used adaptive_lighting.apply, which pushed adapted values
    once but left manual_control set (autoreset is 0), so the lamp froze for the rest
    of the night. set_manual_control: false clears the flag and AL re-adapts immediately
    and keeps adapting. v2 (2026-06-07): ''idle'' no longer always restores, because
    Frndly is invisible to the ATV integration (entity sits idle with app_id ''''
    while Frndly plays — verified live). On idle we restore only when the new state
    still carries an app_id (sitting in a visible app''s menu, movie over) or the
    TCL TV is off / not on the Apple TV input. ATV ''off'' always restores. Counterpart
    of ''Living Room — Movie Lamp Dimmer (v2)'', which dims on the same blind-app
    fingerprint.'
  triggers:
  - entity_id:
    - media_player.living_room_4k_2
    to: idle
    id: atv_idle
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    to: 'off'
    id: atv_off
    platform: state
  conditions:
  - condition: sun
    after: sunset
  actions:
  - choose:
    - alias: ATV off — always restore
      conditions:
      - condition: trigger
        id: atv_off
      sequence:
      - alias: Hand the lamp back to Adaptive Lighting (clears manual_control)
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          lights:
          - light.next_to_couch
          manual_control: false
    - alias: Idle outside the Frndly/home-screen blind spot
      conditions:
      - condition: trigger
        id: atv_idle
      - condition: template
        value_template: '{{ (trigger.to_state.attributes.get(''app_id'') or '''')
          != '''' or states(''media_player.55_tcl_roku_tv'') != ''on'' or (state_attr(''media_player.55_tcl_roku_tv'',
          ''source'') or '''') != ''Apple TV'' }}'
      sequence:
      - alias: Hand the lamp back to Adaptive Lighting (clears manual_control)
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          lights:
          - light.next_to_couch
          manual_control: false
  mode: single
  trace:
    stored_traces: 25
- id: '1777031240153'
  alias: Pollen Spike Alert
  description: 'Sends an iPhone notification when pollen conditions worsen. Uses a
    daily tier tracker (input_number.pollen_alert_level_reached, 0-3) so alerts only
    fire when crossing into a HIGHER tier than already reached today — prevents re-alerts
    from unavailable/unknown blips and prevents lower re-alerts after a peak. Level
    sensors filter out unavailable/unknown transitions at the trigger level, and the
    levels map uses ''moderate'' (not ''medium'') to match actual sensor states. 2026-07-19:
    level_rose branch template now short-circuits (renders false) unless the trigger
    is level_rose with a real from_state/to_state; previously the pollen_startup (homeassistant
    start) trigger fell through branches 1-3 into this template every restart and
    threw UndefinedError on trigger.from_state.'
  triggers:
  - platform: state
    entity_id:
    - sensor.kleenex_pollen_radar_ewing_trees_level
    - sensor.kleenex_pollen_radar_ewing_grass_level
    - sensor.kleenex_pollen_radar_ewing_weeds_level
    id: level_rose
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 75
    id: index_moderate
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 150
    id: index_high
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 200
    id: index_very_high
  - platform: homeassistant
    event: start
    id: pollen_startup
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Wait for the pollen index to have a real value (repopulates after a restart)
    wait_template: '{{ states(''sensor.total_pollen_index'') | int(-1) >= 0 }}'
    timeout: 00:03:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 200
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 3
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Pollen Very High"
          message: Total pollen index just crossed 200 (currently {{ states('sensor.total_pollen_index')
            }} idx). High allergy risk — medication strongly recommended.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 3
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 150
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 2
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Pollen High
          message: Total pollen index just crossed 150 (currently {{ states('sensor.total_pollen_index')
            }} idx). You likely need allergy medication today.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 2
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 75
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 1
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Moderate"
          message: Total pollen index just crossed 75 (currently {{ states('sensor.total_pollen_index')
            }} idx). Sensitive individuals may want to take medication.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 1
    - conditions:
      - condition: template
        value_template: '{% if trigger.id != ''level_rose'' or trigger.from_state
          is not defined or trigger.from_state is none or trigger.to_state is none
          %}

          false

          {% else %}

          {% set levels = {''none'': 0, ''low'': 1, ''moderate'': 2, ''high'': 3,
          ''very high'': 4, ''very_high'': 4} %}

          {% set old = trigger.from_state.state | lower %}

          {% set new = trigger.to_state.state | lower %}

          {{ old not in [''unknown'', ''unavailable''] and new not in [''unknown'',
          ''unavailable''] and levels.get(new, 0) > levels.get(old, 0) }}

          {% endif %}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Rising"
          message: '{% set type_map = {''sensor.kleenex_pollen_radar_ewing_trees_level'':
            ''Trees'', ''sensor.kleenex_pollen_radar_ewing_grass_level'': ''Grass'',
            ''sensor.kleenex_pollen_radar_ewing_weeds_level'': ''Weeds''} %}{{ type_map.get(trigger.entity_id,
            ''Pollen'') }} just jumped to {{ trigger.to_state.state | title }} (was
            {{ trigger.from_state.state | title }}). Consider taking your allergy
            medication.'
  mode: single
  max_exceeded: silent
- id: '1777633648574'
  alias: Power Outage / Restoration Alert
  description: 'v1.3 (2026-08-11). Detects whole-home power loss via Hue Bridge unavailable
    for 2+ min (filters normal brief drops). Two restoration paths: (a) hue_restored
    fires an all-clear when sensor.bedroom_power returns from unavailable after a
    2+ min outage, duration-gated to match the outage trigger so brief Hue blips do
    not emit a spurious ''restored''; added after the 2026-07-07 network-gear outage
    tripped the outage alert with no all-clear because the Z-Wave fridge never dropped.
    (b) fridge_surge fires a bonus notice when the Fibaro fridge plug returns from
    unavailable. Coverage split: outage + hue_restored ride the NETWORK-dependent
    Hue proxy; fridge_surge rides the network-INDEPENDENT Z-Wave fridge. When a voltage
    sensor is added, rewrite to v2 with brownout/sag detection. [2026-08-11 v1.2]
    FIXED a false-positive: fridge_surge had NO duration gate and NO condition beyond
    its trigger id, so ANY event that made the Z-Wave entities go unavailable and
    come back fired a ''Power Restored - Fridge Surge'' push. That includes Z-Wave
    JS add-on updates, HA restarts and ordinary Z-Wave dropouts, not just real power
    loss. Confirmed firing falsely on 2026-08-10T23:34:26Z (trace a3ce40cadc4e11afa3898fc5693e250f):
    unavailable -> 78.7W, and the message read ''spiked to 78.7W (normal max ~89W)'',
    which is self-refuting since 78.7 is BELOW the normal max. The v1.1 note claiming
    fridge_surge is ''true whole-home power loss only'' was simply wrong. Two gates
    added: (1) the unavailable stretch must have lasted >= 120s, matching hue_restored;
    (2) the Hue proxy must ALSO have recorded an outage within the last 60 minutes,
    via input_datetime.last_power_outage_detected which the hue_unavailable branch
    now stamps. Gate 2 is the load-bearing one, because during a Z-Wave-only restart
    the Hue bridge never drops and the stamp stays stale. A TIMESTAMP was chosen over
    an input_boolean flag deliberately: it self-expires after 60 min, so there is
    no lingering-flag state to clear and no race between hue_restored clearing a flag
    and fridge_surge reading it. The v1.2 gates were LIVE-FIRE VERIFIED by the Z-Wave
    JS 1.7.0 install at 2026-08-11T15:44:17Z (trace f21122e127ed29c65c9e60a54bff0a6b):
    unavailable -> 75.3, trigger-id condition true, duration gate false, no notification
    sent. [2026-08-11 v1.2] DELIBERATELY NOT gated on wattage. A ''> 89W'' condition
    was drafted and rejected: on a real restoration the plug''s FIRST reported value
    can be standby draw before the compressor spins up, so a wattage gate risks a
    false NEGATIVE on the one event this alert exists for. Instead the branch waits
    20s for the reading to settle and the message adapts - it only claims the fridge
    is running hard when the draw actually exceeds the ~89W normal max. [2026-08-11
    v1.2] mode changed single -> parallel: on a real restoration hue_restored and
    fridge_surge fire within milliseconds of each other, and under mode single the
    second one was silently dropped. The branches are independent notifications with
    no shared mutable state, so parallel is safe here. [2026-08-11 v1.3] All three
    branches switched from notify.notify to notify.mobile_app_iphone. notify.notify
    is NOT an alias for the phone: there is no notify: block in configuration.yaml,
    so it is the service mobile_app auto-registers, and it FANS OUT to every registered
    mobile_app device. This automation was the only user of it in the house, so every
    outage alert was buzzing the iPhone, the MacBook and the iPad at once. It was
    also the path that surfaced the duplicate iPad registration: the 2026-08-10 19:34:26
    false fridge push fanned out and its delivery to the dead ''Lara''s iPad mini''
    entry threw ''Error sending notification'' one second later, which is how that
    stale registration was found and removed. Phone-only is the house convention per
    reference_iphone_notify_service. If a future outage ever needs multi-device redundancy,
    add the extra targets EXPLICITLY rather than reverting to notify.notify, so the
    fan-out is visible in the config.'
  triggers:
  - entity_id: sensor.bedroom_power
    for: 00:02:00
    id: hue_unavailable
    platform: state
    to: unavailable
  - entity_id: sensor.bedroom_power
    from: unavailable
    id: hue_restored
    platform: state
  - entity_id: sensor.fibaro_wall_plug_for_fridge_electric_consumption_w
    from: unavailable
    id: fridge_surge
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hue_unavailable
      sequence:
      - action: input_datetime.set_datetime
        alias: Stamp the outage so fridge_surge can tell a real outage from a Z-Wave
          restart
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.last_power_outage_detected
      - action: notify.mobile_app_iphone
        data:
          message: Power appears to be out. Hue Bridge went offline at {{ now().strftime('%I:%M
            %p') }}.
          title: ⚡ Power Outage Detected
    - conditions:
      - condition: trigger
        id: hue_restored
      - condition: template
        value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
          | float(0) >= 120 }}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: Hue Bridge back online at {{ now().strftime('%I:%M %p') }} after
            ~{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
            / 60) | round(0) }} min offline. Power/network looks restored.
          title: ✅ Power / Network Restored
    - conditions:
      - condition: trigger
        id: fridge_surge
      - alias: Gate 1 - the dropout must have lasted 2+ min, matching hue_restored
        condition: template
        value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
          | float(0) >= 120 }}'
      - alias: Gate 2 - the Hue proxy must have seen an outage in the last 60 min
          (a Z-Wave-only restart leaves this stale)
        condition: template
        value_template: '{% set t = states(''input_datetime.last_power_outage_detected'')
          %}{{ t not in [''unknown'',''unavailable'',''''] and (as_timestamp(now())
          - as_timestamp(t, 0)) | float(99999) < 3600 }}'
      sequence:
      - alias: Let the reading settle - first value back can be standby draw before
          the compressor starts
        delay: 00:00:20
      - action: notify.mobile_app_iphone
        data:
          message: '{% set w = states(''sensor.fibaro_wall_plug_for_fridge_electric_consumption_w'')
            | float(0) %}Power restored. Fridge is drawing {{ w }}W{% if w > 89 %},
