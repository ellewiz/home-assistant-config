- id: '1765403683258'
  alias: Living Room — Movie Lamp Dimmer (v2)
  description: 'Dim the end-table lamp when the Apple TV is in use after sunset. v2
    (2026-06-07): added Frndly support. Frndly publishes no now-playing metadata to
    tvOS, so while it plays the ATV entity sits at state ''idle'' with app_id ''''
    (verified live; all other apps — Tubi, Infuse, HBO Max, Shudder, WNBA, VidHub
    — report normally). Fingerprint for ''ATV in use by an HA-blind app'': TCL TV
    on + TV source ''Apple TV'' + ATV idle with empty app_id. The ATV home screen
    matches the same fingerprint and is indistinguishable, so browsing the home screen
    after sunset also dims — accepted tradeoff (hybrid design, chosen over session-based).
    The app_id attribute trigger covers entering Frndly/home screen without a state-value
    change (e.g. exit Tubi menu → home → Frndly). Companion automation ''Living Room
    — Movie Lamp Restore (v2)'' skips restoring while the fingerprint holds, so the
    lamp won''t pop bright mid-Frndly.'
  triggers:
  - entity_id:
    - media_player.living_room_4k_2
    to:
    - playing
    - buffering
    - paused
    id: atv_active
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    to: idle
    id: atv_blind
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    attribute: app_id
    to: ''
    id: atv_blind_attr
    platform: state
  - event: sunset
    offset: 00:01:00
    id: sunset
    platform: sun
  conditions:
  - condition: sun
    after: sunset
  - condition: state
    entity_id: light.next_to_couch
    state: 'on'
  actions:
  - choose:
    - alias: ATV actively playing (any app HA can see)
      conditions:
      - condition: trigger
        id: atv_active
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
    - alias: Blind-app fingerprint (Frndly / home screen)
      conditions:
      - condition: trigger
        id:
        - atv_blind
        - atv_blind_attr
      - condition: state
        entity_id: media_player.living_room_4k_2
        state: idle
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        state: 'on'
      - condition: state
        entity_id: media_player.55_tcl_roku_tv
        attribute: source
        state: Apple TV
      - condition: template
        value_template: '{{ (state_attr(''media_player.living_room_4k_2'', ''app_id'')
          or '''') == '''' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
    - alias: Sunset while already watching
      conditions:
      - condition: trigger
        id: sunset
      - condition: or
        conditions:
        - condition: state
          entity_id: media_player.living_room_4k_2
          state:
          - playing
          - buffering
          - paused
        - condition: and
          conditions:
          - condition: state
            entity_id: media_player.living_room_4k_2
            state: idle
          - condition: state
            entity_id: media_player.55_tcl_roku_tv
            state: 'on'
          - condition: state
            entity_id: media_player.55_tcl_roku_tv
            attribute: source
            state: Apple TV
          - condition: template
            value_template: '{{ (state_attr(''media_player.living_room_4k_2'', ''app_id'')
              or '''') == '''' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.next_to_couch
        data:
          brightness_pct: 20
          transition: 2
  mode: restart
  trace:
    stored_traces: 25
- id: '1765403998807'
  alias: Living Room — Movie Lamp Restore (v2)
  description: 'When the Apple TV stops after sunset, hand the end-table lamp back
    to Adaptive Lighting. v1 history: used adaptive_lighting.apply, which pushed adapted
    values once but left manual_control set (autoreset is 0), so the lamp froze for
    the rest of the night. set_manual_control: false clears the flag and AL re-adapts
    immediately and keeps adapting. v2 (2026-06-07): ''idle'' no longer always restores,
    because Frndly is invisible to the ATV integration (entity sits idle with app_id
    '''' while Frndly plays — verified live). On idle we restore only when the new
    state still carries an app_id (sitting in a visible app''s menu, movie over) or
    the TCL TV is off / not on the Apple TV input. ATV ''off'' always restores. Counterpart
    of ''Living Room — Movie Lamp Dimmer (v2)'', which dims on the same blind-app
    fingerprint.'
  triggers:
  - entity_id:
    - media_player.living_room_4k_2
    to: idle
    id: atv_idle
    platform: state
  - entity_id:
    - media_player.living_room_4k_2
    to: 'off'
    id: atv_off
    platform: state
  conditions:
  - condition: sun
    after: sunset
  actions:
  - choose:
    - alias: ATV off — always restore
      conditions:
      - condition: trigger
        id: atv_off
      sequence:
      - alias: Hand the lamp back to Adaptive Lighting (clears manual_control)
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          lights:
          - light.next_to_couch
          manual_control: false
    - alias: Idle outside the Frndly/home-screen blind spot
      conditions:
      - condition: trigger
        id: atv_idle
      - condition: template
        value_template: '{{ (trigger.to_state.attributes.get(''app_id'') or '''')
          != '''' or states(''media_player.55_tcl_roku_tv'') != ''on'' or (state_attr(''media_player.55_tcl_roku_tv'',
          ''source'') or '''') != ''Apple TV'' }}'
      sequence:
      - alias: Hand the lamp back to Adaptive Lighting (clears manual_control)
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room_lights
          lights:
          - light.next_to_couch
          manual_control: false
  mode: single
  trace:
    stored_traces: 25
- id: '1777031240153'
  alias: Pollen Spike Alert
  description: Sends an iPhone notification when pollen conditions worsen. Uses a
    daily tier tracker (input_number.pollen_alert_level_reached, 0-3) so alerts only
    fire when crossing into a HIGHER tier than already reached today — prevents re-alerts
    from unavailable/unknown blips and prevents lower re-alerts after a peak. Level
    sensors filter out unavailable/unknown transitions at the trigger level, and the
    levels map uses 'moderate' (not 'medium') to match actual sensor states.
  triggers:
  - platform: state
    entity_id:
    - sensor.kleenex_pollen_radar_ewing_trees_level
    - sensor.kleenex_pollen_radar_ewing_grass_level
    - sensor.kleenex_pollen_radar_ewing_weeds_level
    id: level_rose
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 75
    id: index_moderate
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 150
    id: index_high
  - platform: numeric_state
    entity_id: sensor.total_pollen_index
    above: 200
    id: index_very_high
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 200
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 3
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Pollen Very High"
          message: Total pollen index just crossed 200 (currently {{ states('sensor.total_pollen_index')
            }} idx). High allergy risk — medication strongly recommended.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 3
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 150
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 2
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: ⚠️ Pollen High
          message: Total pollen index just crossed 150 (currently {{ states('sensor.total_pollen_index')
            }} idx). You likely need allergy medication today.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 2
    - conditions:
      - condition: numeric_state
        entity_id: sensor.total_pollen_index
        above: 75
      - condition: numeric_state
        entity_id: input_number.pollen_alert_level_reached
        below: 1
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Moderate"
          message: Total pollen index just crossed 75 (currently {{ states('sensor.total_pollen_index')
            }} idx). Sensitive individuals may want to take medication.
      - action: input_number.set_value
        target:
          entity_id: input_number.pollen_alert_level_reached
        data:
          value: 1
    - conditions:
      - condition: template
        value_template: '{% set levels = {''none'': 0, ''low'': 1, ''moderate'': 2,
          ''high'': 3, ''very high'': 4, ''very_high'': 4} %}

          {% set old = trigger.from_state.state | lower %}

          {% set new = trigger.to_state.state | lower %}

          {{ trigger.id == ''level_rose'' and old not in [''unknown'', ''unavailable'']
          and new not in [''unknown'', ''unavailable''] and levels.get(new, 0) > levels.get(old,
          0) }}'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Pollen Rising"
          message: '{% set type_map = {''sensor.kleenex_pollen_radar_ewing_trees_level'':
            ''Trees'', ''sensor.kleenex_pollen_radar_ewing_grass_level'': ''Grass'',
            ''sensor.kleenex_pollen_radar_ewing_weeds_level'': ''Weeds''} %}{{ type_map.get(trigger.entity_id,
            ''Pollen'') }} just jumped to {{ trigger.to_state.state | title }} (was
            {{ trigger.from_state.state | title }}). Consider taking your allergy
            medication.'
  mode: single
  max_exceeded: silent
- id: '1777633648574'
  alias: Power Outage / Restoration Alert
  description: 'v1.1 (2026-07-07): Detects whole-home power loss via Hue Bridge unavailable
    for 2+ min (filters normal brief drops). Two restoration paths: (a) hue_restored
    fires an all-clear when sensor.bedroom_power returns from unavailable after a
    2+ min outage, duration-gated to match the outage trigger so brief Hue blips do
    not emit a spurious ''restored''; added after the 2026-07-07 network-gear outage
    tripped the outage alert with no all-clear because the Z-Wave fridge never dropped.
    (b) fridge_surge fires a bonus surge notice when the Fibaro fridge plug returns
    from unavailable (true whole-home power loss only). Coverage split: outage + hue_restored
    ride the NETWORK-dependent Hue proxy; fridge_surge rides the network-INDEPENDENT
    Z-Wave fridge. When a voltage sensor is added, rewrite to v2 with brownout/sag
    detection.'
  triggers:
  - platform: state
    entity_id: sensor.bedroom_power
    to: unavailable
    id: hue_unavailable
    for: 00:02:00
  - platform: state
    entity_id: sensor.bedroom_power
    from: unavailable
    id: hue_restored
  - platform: state
    entity_id: sensor.fibaro_wall_plug_for_fridge_electric_consumption_w
    from: unavailable
    id: fridge_surge
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hue_unavailable
      sequence:
      - data:
          title: ⚡ Power Outage Detected
          message: Power appears to be out. Hue Bridge went offline at {{ now().strftime('%I:%M
            %p') }}.
        action: notify.notify
    - conditions:
      - condition: trigger
        id: hue_restored
      - condition: template
        value_template: '{{ (as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
          | float(0) >= 120 }}'
      sequence:
      - data:
          title: ✅ Power / Network Restored
          message: Hue Bridge back online at {{ now().strftime('%I:%M %p') }} after
            ~{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
            / 60) | round(0) }} min offline. Power/network looks restored.
        action: notify.notify
    - conditions:
      - condition: trigger
        id: fridge_surge
      sequence:
      - data:
          title: "\U0001F50C Power Restored — Fridge Surge"
          message: Power restored. Fridge spiked to {{ states('sensor.fibaro_wall_plug_for_fridge_electric_consumption_w')
            }}W (normal max ~89W). It may run hard for 60–90 min to recover temp.
        action: notify.notify
  mode: single
- id: '1777680078909'
  alias: 'Alert: HA Unexpected Restart'
  description: Sends a phone notification whenever Home Assistant starts up, so unexpected
    crashes are immediately visible.
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: ⚠️ Home Assistant restarted
      message: HA came back up at {{ now().strftime('%-I:%M %p') }} on {{ now().strftime('%A,
        %B %-d') }}. Check logs if this was unexpected.
  mode: single
- id: '1777933269637'
  alias: 'Commute: Set target arrival from calendar'
  description: 'When in_bed turns on and workday_tomorrow is on, read calendar.master_calendar
    for tomorrow''s ''Wake up'' event. Office (description/location contains ''office'')
    + late shift (summary/description contains ''late shift'') -> commute_target_arrival
    09:20. Office regular -> 07:50. No-op if no office wake-up event (helper keeps
    last value). 2026-06-09: source switched from calendar.workday_calendar to master_calendar;
    workday_calendar only held bare all-day ''Workday'' entries with no office/late-shift
    detail, so detection always failed and target_arrival sat stale at 07:50 -- on
    late-shift days the announcer started after the stale 7:20 leave_by had already
    passed and never announced.'
  triggers:
  - platform: state
    entity_id: input_boolean.in_bed
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.workday_tomorrow
    state: 'on'
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.master_calendar
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}T00:00:00'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}T23:59:59'
    response_variable: cal_response
  - variables:
      has_office_event: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(found=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx %}{% set ns.found = true %}{% endif
        %}{% endfor %}{{ ns.found }}'
      is_late_shift: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(late=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx and ''late shift'' in (s ~ '' '' ~
        ctx) %}{% set ns.late = true %}{% endif %}{% endfor %}{{ ns.late }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ has_office_event | trim | lower == ''true'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_late_shift | trim | lower == ''true'' }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.commute_target_arrival
            data:
              time: 09:20:00
        default:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.commute_target_arrival
          data:
            time: 07:50:00
  mode: single
- id: '1777933283116'
  alias: 'Commute: Morning announcer with Waze (v2)'
  description: 'Office mornings only. Calendar trigger 1h before wake-up event end
    (checks event summary + description). Passes sensor.commute_leave_by so the script
    counts down to actual departure. 2026-06-02: sole announcer (old Work Leave Time
    Announcer disabled). 2026-06-05: bathroom Sonos Era 100 (media_player.bathroom)
    added to players, replacing the HomePod for shower-window coverage. 2026-06-14:
    HomePod support fully removed from the announcer chain (pyatv RAOP TTS never worked
    on Python 3.14 — miniaudio failed-to-init-decoder, cloud + Piper both tested).
    2026-06-16: replaced the person.lara_wiz==home gate with calendar.vacation==off.
    The home gate suppressed the announcer during a short morning dog walk (Lara not_home
    06:09-06:31, calendar trigger fired 06:25, mode single so it never re-fired on
    return). Vacation calendar is the intended away-suppression gate per house style
    section 8. 2026-07-07: swapped media_player.dining_room for media_player.basement
    (new basement Era 100) in the announcer players list per Lara.'
  triggers:
  - platform: calendar
    entity_id: calendar.master_calendar
    event: end
    offset: '-1:0:0'
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower) and
      ''office'' in ((trigger.calendar_event.location | default('''')) ~ '' '' ~ (trigger.calendar_event.description
      | default('''')) | lower) }}'
  actions:
  - variables:
      leave_by_ts: '{% set lb = states(''sensor.commute_leave_by'') %}{% if lb not
        in [''unknown'', ''unavailable''] %}{{ as_timestamp(today_at(lb)) }}{% else
        %}{{ as_timestamp(trigger.calendar_event.end) }}{% endif %}'
  - action: script.commute_time_announcer
    data:
      until_ts: '{{ leave_by_ts }}'
      person_entity: person.lara_wiz
      players:
      - media_player.living_room_arc
      - media_player.basement
      - media_player.bedroom_frame
      - media_player.bathroom
  mode: single
- id: '1777940949832'
  alias: "\U0001F985 Eagles Score - Flash Green"
  description: Flash living room lights Kelly Green (#4CBB17) whenever the Eagles
    score, but only when home. Triggered by team_score attribute increase on the Team
    Tracker sensor.
  triggers:
  - platform: state
    entity_id: sensor.philadelphia_eagles
    attribute: team_score
  conditions:
  - condition: state
    entity_id: sensor.philadelphia_eagles
    state: IN
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state.attributes.team_score
      | int(0) > trigger.from_state.attributes.team_score | int(0) }}'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - alias: Flash living room Kelly Green (snapshot + restore via shared script)
    action: script.alert_light_flash
    data:
      targets: light.living_room_lights
      rgb_color:
      - 76
      - 187
      - 23
      pulses: 5
  - alias: Resume Adaptive Lighting after snapshot restore
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      manual_control: false
  mode: single
- id: '1778432571562'
  alias: Pollen Alert Level — Daily Reset
  description: Resets input_number.pollen_alert_level_reached to 0 at midnight so
    the pollen spike alert starts fresh each day.
  triggers:
  - platform: time
    at: 00:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.pollen_alert_level_reached
    data:
      value: 0
  mode: single
- id: '1778498005512'
  alias: Update Rain Forecast 24h
  description: 'Hourly: checks NWS hourly forecast and sets rain_forecast_24h if rain/storms
    expected in next 24 hours'
  triggers:
  - platform: time_pattern
    minutes: '5'
  - platform: homeassistant
    event: start
  actions:
  - target:
      entity_id: weather.kttn_daynight
    data:
      type: hourly
    response_variable: wx_forecast
    action: weather.get_forecasts
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wx_forecast[''weather.kttn_daynight''][''forecast''][:24]
          | selectattr(''condition'', ''in'', [''lightning'', ''lightning-rainy'',
          ''rainy'', ''pouring'', ''hail'', ''snowy-rainy'']) | list | count > 0 or
          wx_forecast[''weather.kttn_daynight''][''forecast''][:24] | selectattr(''precipitation_probability'',
          ''defined'') | selectattr(''precipitation_probability'', ''>'', 50) | list
          | count > 0 }}'
      sequence:
      - target:
          entity_id: input_boolean.rain_forecast_24h
        action: input_boolean.turn_on
    default:
    - target:
        entity_id: input_boolean.rain_forecast_24h
      action: input_boolean.turn_off
  mode: single
- id: '1778537326845'
  alias: Update Mow Forecast Scores
  description: 'Every 3 hours: fetches NWS twice-daily forecast, scores next 4 daytime
    mowing windows, stores results in helpers for the dashboard. Pollen is taken from
    each pollen sensor''s per-day FORECAST (tree+grass+weeds ppm) aligned by date
    (falls back to current reading for today), so big day-to-day pollen sweeps are
    captured. Pollen penalty is magnitude-based (strong but non-vetoing, capped -55)
    with an extra surcharge for grass since mowing aerosolizes it. Wind alone is a
    minor penalty; wind combined with elevated pollen compounds (interaction term).'
  triggers:
  - platform: time_pattern
    hours: /3
  - platform: homeassistant
    event: start
  actions:
  - target:
      entity_id: weather.kttn_daynight
    data:
      type: twice_daily
    response_variable: wx
    action: weather.get_forecasts
  - target:
      entity_id: input_number.mow_forecast_score_1
    data:
      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
        | list %}{% if dt|length > 0 %}{% set p = dt[0] %}{% set wd = as_datetime(p.datetime).astimezone().date()
        %}{% set precip = p.precipitation_probability|int(0) %}{% set cond = p.condition|lower
        %}{% set temp = p.temperature|float(70) %}{% set wind = p.wind_speed|float(0)
        %}{% if ''lightning'' in cond or ''thunderstorm'' in cond or ''hail'' in cond
        or ''pouring'' in cond or precip>=75 %}{{ 0 }}{% else %}{% set r = 30 if precip<10
        else (23 if precip<25 else (14 if precip<40 else (6 if precip<60 else 2)))
        %}{% set c = 18 if cond==''sunny'' else (16 if cond==''partlycloudy'' else
        (13 if cond==''cloudy'' else (4 if ''rain'' in cond or cond==''drizzle'' else
        14))) %}{% set t = 22 if temp>=62 and temp<=85 else (16 if (temp>=55 and temp<62)
        or (temp>85 and temp<=90) else (9 if (temp>=45 and temp<55) or (temp>90 and
        temp<=95) else (3 if temp>=35 else 0))) %}{% set tf = state_attr(''sensor.kleenex_pollen_radar_ewing_trees'',''forecast'')
        or [] %}{% set gf = state_attr(''sensor.kleenex_pollen_radar_ewing_grass'',''forecast'')
        or [] %}{% set wf = state_attr(''sensor.kleenex_pollen_radar_ewing_weeds'',''forecast'')
        or [] %}{% set tvl = tf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set gvl = gf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set wvl = wf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set tv = tvl[0] if tvl|length else states(''sensor.kleenex_pollen_radar_ewing_trees'')|float(0)
        %}{% set gv = gvl[0] if gvl|length else states(''sensor.kleenex_pollen_radar_ewing_grass'')|float(0)
        %}{% set wv = wvl[0] if wvl|length else states(''sensor.kleenex_pollen_radar_ewing_weeds'')|float(0)
        %}{% set C = tv + gv + wv %}{% set pp = 0 if C<50 else (6 if C<75 else (16
        if C<120 else (28 if C<150 else (40 if C<200 else 50)))) %}{% set pp = pp
        + (8 if gv>=60 else (4 if gv>=40 else 0)) %}{% set pp = [pp,55]|min %}{% set
        wstd = 0 if wind<12 else (3 if wind<18 else 6) %}{% set wint = 0 if C<75 else
        [((([wind-8,0]|max)*(0.8 if C>=150 else 0.4))|round(0)|int),20]|min %}{{ [100,[0,
        r+c+t+30-pp-wstd-wint]|max]|min }}{% endif %}{% else %}{{ 0 }}{% endif %}'
