- id: '1758078170419'
  alias: TV Event Reminder
  description: 'Announce 15 minutes before an event on the watch party calendar starts
    2026-06-28: also turns OFF switch.adaptive_lighting_living_room_lights when the
    Movie scene is set, so the 90s AL re-adapt cannot override the scene mid-event.
    Paired with TV Event Over, which turns AL back on at event end.'
  triggers:
  - entity_id: calendar.tv
    event: start
    offset: -0:15:0
    platform: calendar
  conditions:
  - condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - variables:
      event_title: '{{ trigger.calendar_event.summary }}'
      msg: '"{{ event_title }}" will begin in 15 minutes.'
  - action: scene.turn_on
    data:
      transition: 10
    target:
      entity_id: scene.living_room_movies_2
  - alias: Pause Adaptive Lighting so its re-adapt interval cannot override the Movie
      scene during the event
    action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - action: script.sonos_broadcast
    data:
      restore: true
      ungroup: true
      players:
      - media_player.living_room_arc
      - media_player.bedroom_frame
      message: '{{ msg }}'
      volume: 0.69
  - action: automation.turn_off
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
    data:
      stop_actions: true
  - if:
    - condition: device
      device_id: 0a28965692f7fead801299fd184f7f4e
      domain: media_player
      entity_id: b3ed2dece24ac28191b7c48a42d83134
      type: is_playing
    then:
    - action: media_player.media_pause
      metadata: {}
      data: {}
      target:
        entity_id: media_player.living_room_4k_2
  mode: single
- id: '1758078528885'
  alias: TV Event Over
  description: 'Shut down TV when the TV event ends, then re-enable nightly automations
    2026-06-28: re-enables switch.adaptive_lighting_living_room_lights (paused by
    TV Event Reminder during the Movie scene) before re-arming sleep mode. 2026-07-13:
    goodnight sonos_say wrapped in a calendar.vacation gate so it doesn''t play to
    an empty house / the sitter; the re-enable + AL housekeeping deliberately stays
    unconditional. Companion: ''TV Event — Nightly Reconcile'' catches the stranded-off
    case where a calendar.tv event is deleted mid-event and this end trigger never
    fires.'
  triggers:
  - entity_id: calendar.tv
    event: end
    platform: calendar
  actions:
  - alias: 'Goodnight announcement — only when someone''s home to hear it (2026-07-13:
      vacation gate; housekeeping below stays unconditional)'
    if:
    - condition: state
      entity_id: calendar.vacation
      state: 'off'
    then:
    - action: script.sonos_say
      data:
        restore: true
        ungroup: true
        player: media_player.living_room_arc
        message: Show's over. Good night!
        volume: 0.65
  - action: script.graceful_tv_exit
  - alias: Resume Adaptive Lighting now that the event is over
    action: switch.turn_on
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - action: automation.turn_on
    target:
      entity_id:
      - automation.living_room_ambient_manager
      - automation.tv_off_regular_night
      - automation.tv_off_weekends_and_time_off
      - automation.living_room_lights_on_morning
  - if:
    - condition: state
      entity_id: input_boolean.workday_tomorrow
      state: 'on'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.adaptive_lighting_sleep_mode_living_room_lights
  mode: single
- id: '1758080771334'
  alias: Johnny — Did a Runner (v2, Not-Together Ping)
  description: 'Pings the iPhone when Johnny''s Tractive tracker leaves zone.home
    AND he is not in the same zone as Lara — i.e. they are NOT together (he got out
    on his own, or left while she''s home or at work). Stays silent when they leave
    together (a walk, a trip to a saved zone) because both person entities land in
    the same zone. A 45s settle delay before the together-check absorbs GPS lag: when
    they leave together, Johnny''s tracker can flip to not_home a few seconds before
    Lara''s phone does. v1 pinged only when Lara was AWAY and did a Sonos-only announce
    when she was home, which was backwards — it never phone-alerted the scary escape-while-home
    case. NOT gated on calendar.vacation on purpose: this is a safety alert that must
    fire even while away (dog-sitter scenarios). Compares person.johnny (sourced solely
    from device_tracker.johnny_tracker) against person.lara_wiz. To also announce
    on Sonos, add that branch back.'
  triggers:
  - device_id: a21a864f6f38a47a687299e25164bde0
    domain: device_tracker
    entity_id: 2a32586b5b10e1e8ba2a43acdc640276
    type: leaves
    zone: zone.home
    platform: device
  conditions: []
  actions:
  - alias: Let presence settle in case we left together
    delay: 00:00:45
  - alias: Only continue if Johnny and I are NOT in the same zone
    condition: template
    value_template: "{{ states('person.johnny') not in ['unknown', 'unavailable']\n
      \  and states('person.johnny') != states('person.lara_wiz') }}"
  - alias: Ping iPhone — Johnny is out without me
    action: notify.mobile_app_iphone
    data:
      title: "\U0001F6A8 Johnny's out without you"
      message: Johnny left home and isn't with you — he's {{ states('person.johnny')
        }}, you're {{ states('person.lara_wiz') }}.
  mode: single
