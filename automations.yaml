- id: '1777680078909'
  alias: 'Alert: HA Unexpected Restart'
  description: Sends a phone notification whenever Home Assistant starts up, so unexpected
    crashes are immediately visible.
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: ⚠️ Home Assistant restarted
      message: HA came back up at {{ now().strftime('%-I:%M %p') }} on {{ now().strftime('%A,
        %B %-d') }}. Check logs if this was unexpected.
  mode: single
- id: '1777933269637'
  alias: 'Commute: Set target arrival from calendar'
  description: 'When in_bed turns on and workday_tomorrow is on, read calendar.master_calendar
    for the WAKE-UP DAY''s ''Wake up'' event. Office (description/location contains
    ''office'') + late shift (summary/description contains ''late shift'') -> commute_target_arrival
    09:20. Office regular -> 07:50. No-op if no office wake-up event (helper keeps
    last value). 2026-06-09: source switched from calendar.workday_calendar to master_calendar;
    workday_calendar only held bare all-day ''Workday'' entries with no office/late-shift
    detail, so detection always failed and target_arrival sat stale at 07:50 -- on
    late-shift days the announcer started after the stale 7:20 leave_by had already
    passed and never announced.


    [2026-08-19] OFF-BY-ONE DAY FIXED. The calendar window was hardcoded to now()
    + 1 day, which is only correct when in_bed flips BEFORE midnight. On 2026-08-19
    in_bed was never set Tuesday evening; the 03:30 fallback turned it on at 03:30:00.31
    and this automation fired 0.24s later at 03:30:00.55. At 03:30 Wednesday, now()+1day
    resolved to THURSDAY, so it read Thursday''s ''Wake up late shift'' event and
    set 09:20 on a normal Wednesday. leave_by went 07:21 -> 08:51, the announcer''s
    60-minute enrichment window opened at 07:51, and Lara left around 07:20 -- so
    she got the 5-minute time announcements with no commute time at all, all morning.
    FIX: _target_date picks TODAY when this fires before 08:00 and TOMORROW otherwise,
    so both the normal bedtime path (22:00 -> tomorrow) and the 03:30 fallback path
    (03:30 -> today) resolve to the day she is actually about to wake up for. Verified
    against live calendar data before saving: both paths returned 2026-08-20 for Thursday''s
    late shift.


    KNOWN REMAINING HOLE, not fixed here: the workday_tomorrow condition above is
    still literally about TOMORROW. On a Friday 03:30-fallback night that helper reads
    Saturday, so it is off and this automation skips entirely, leaving commute_target_arrival
    stale from Thursday. Same off-by-one class as the bug above, different entity.
    Fixing it means making the gate day-aware or dropping it (has_office_event already
    no-ops when the target day has no office event), which is a gating-semantics change
    and was left for Lara to decide.'
  triggers:
  - entity_id: input_boolean.in_bed
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.workday_tomorrow
    state: 'on'
  actions:
  - variables:
      _target_date: '{{ (now() if now().hour < 8 else now() + timedelta(days=1)).strftime(''%Y-%m-%d'')
        }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.master_calendar
    data:
      start_date_time: '{{ _target_date }}T00:00:00'
      end_date_time: '{{ _target_date }}T23:59:59'
    response_variable: cal_response
  - variables:
      has_office_event: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(found=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx %}{% set ns.found = true %}{% endif
        %}{% endfor %}{{ ns.found }}'
      is_late_shift: '{% set events = cal_response[''calendar.master_calendar''][''events'']
        | default([]) %}{% set ns = namespace(late=false) %}{% for e in events %}{%
        set s = (e.summary | default('''')) | lower %}{% set ctx = ((e.location |
        default('''')) ~ '' '' ~ (e.description | default(''''))) | lower %}{% if
        ''wake up'' in s and ''office'' in ctx and ''late shift'' in (s ~ '' '' ~
        ctx) %}{% set ns.late = true %}{% endif %}{% endfor %}{{ ns.late }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ has_office_event | trim | lower == ''true'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_late_shift | trim | lower == ''true'' }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.commute_target_arrival
            data:
              time: 09:20:00
        default:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.commute_target_arrival
          data:
            time: 07:50:00
  mode: single
- id: '1777933283116'
  alias: 'Commute: Morning announcer with Waze (v2)'
  description: 'Office mornings only. Calendar trigger 1h before wake-up event end
    (checks event summary + description). Passes sensor.commute_leave_by so the script
    counts down to actual departure. 2026-06-02: sole announcer (old Work Leave Time
    Announcer disabled). 2026-06-05: bathroom Sonos Era 100 (media_player.bathroom)
    added to players, replacing the HomePod for shower-window coverage. 2026-06-14:
    HomePod support fully removed from the announcer chain (pyatv RAOP TTS never worked
    on Python 3.14 — miniaudio failed-to-init-decoder, cloud + Piper both tested).
    2026-06-16: replaced the person.lara_wiz==home gate with calendar.vacation==off.
    The home gate suppressed the announcer during a short morning dog walk (Lara not_home
    06:09-06:31, calendar trigger fired 06:25, mode single so it never re-fired on
    return). Vacation calendar is the intended away-suppression gate per house style
    section 8. 2026-07-07: swapped media_player.dining_room for media_player.basement
    (new basement Era 100) in the announcer players list per Lara.'
  triggers:
  - platform: calendar
    entity_id: calendar.master_calendar
    event: end
    offset: '-1:0:0'
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: template
    value_template: '{{ ''wake up'' in (trigger.calendar_event.summary | lower) and
      ''office'' in (((trigger.calendar_event.location | default('''')) ~ '' '' ~
      (trigger.calendar_event.description | default(''''))) | lower) }}'
  actions:
  - variables:
      leave_by_ts: '{% set lb = states(''sensor.commute_leave_by'') %}{% if lb not
        in [''unknown'', ''unavailable''] %}{{ as_timestamp(today_at(lb)) }}{% else
        %}{{ as_timestamp(trigger.calendar_event.end) }}{% endif %}'
  - action: script.commute_time_announcer
    data:
      until_ts: '{{ leave_by_ts }}'
      person_entity: person.lara_wiz
      players:
      - media_player.living_room_arc
      - media_player.basement
      - media_player.bedroom_frame
      - media_player.bathroom
  mode: single
- id: '1777940949832'
  alias: "\U0001F985 Eagles Score - Flash Green"
  description: 'Flash living room lights Kelly Green (#4CBB17) whenever the Eagles
    score, but only when home. Triggered by team_score attribute increase on the Team
    Tracker sensor. 2026-07-13: score-increase template also rejects recovery from
    unknown/unavailable (a mid-game sensor blip used to read as empty->score = spurious
    flash), and max_exceeded: silent so a TD+PAT re-trigger during the 5-pulse flash
    doesn''t warn in the log.'
  triggers:
  - platform: state
    entity_id: sensor.philadelphia_eagles
    attribute: team_score
  conditions:
  - condition: state
    entity_id: sensor.philadelphia_eagles
    state: IN
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'', ''unavailable''] and trigger.to_state.attributes.team_score
      | int(0) > trigger.from_state.attributes.team_score | int(0) }}'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  actions:
  - alias: Flash living room Kelly Green (snapshot + restore via shared script)
    action: script.alert_light_flash
    data:
      targets: light.living_room_lights
      rgb_color:
      - 76
      - 187
      - 23
      pulses: 5
  - alias: Resume Adaptive Lighting after snapshot restore
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      manual_control: false
  mode: single
  max_exceeded: silent
- id: '1778432571562'
  alias: Pollen Alert Level — Daily Reset
  description: Resets input_number.pollen_alert_level_reached to 0 at midnight so
    the pollen spike alert starts fresh each day.
  triggers:
  - platform: time
    at: 00:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.pollen_alert_level_reached
    data:
      value: 0
  mode: single
- id: '1778498005512'
  alias: Update Rain Forecast 24h
  description: 'Hourly: checks NWS hourly forecast and sets rain_forecast_24h if rain/storms
    expected in next 24 hours'
  triggers:
  - platform: time_pattern
    minutes: '5'
  - platform: homeassistant
    event: start
  actions:
  - target:
      entity_id: weather.kttn_daynight
    data:
      type: hourly
    response_variable: wx_forecast
    action: weather.get_forecasts
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wx_forecast[''weather.kttn_daynight''][''forecast''][:24]
          | selectattr(''condition'', ''in'', [''lightning'', ''lightning-rainy'',
          ''rainy'', ''pouring'', ''hail'', ''snowy-rainy'']) | list | count > 0 or
          wx_forecast[''weather.kttn_daynight''][''forecast''][:24] | selectattr(''precipitation_probability'',
          ''defined'') | selectattr(''precipitation_probability'', ''>'', 50) | list
          | count > 0 }}'
      sequence:
      - target:
          entity_id: input_boolean.rain_forecast_24h
        action: input_boolean.turn_on
    default:
    - target:
        entity_id: input_boolean.rain_forecast_24h
      action: input_boolean.turn_off
  mode: single
- id: '1778537326845'
  alias: Update Mow Forecast Scores
  description: 'Every 3 hours: fetches NWS twice-daily forecast, scores next 4 daytime
    mowing windows, stores results in helpers for the dashboard. Pollen is taken from
    each pollen sensor''s per-day FORECAST (tree+grass+weeds ppm) aligned by date
    (falls back to current reading for today), so big day-to-day pollen sweeps are
    captured. Pollen penalty is magnitude-based (strong but non-vetoing, capped -55)
    with an extra surcharge for grass since mowing aerosolizes it. Wind alone is a
    minor penalty; wind combined with elevated pollen compounds (interaction term).
    Air quality adds a per-day penalty from sensor.air_quality_daily_forecast (Open-Meteo
    US AQI daytime-peak forecast, aligned by date, current-reading fallback for today):
    none at or below 50, ramping through Moderate/USG/Unhealthy, and effectively vetoing
    to 0 at Very Unhealthy (201+) since mowing is heavy outdoor exertion that also
    aerosolizes particulates.'
  triggers:
  - platform: time_pattern
    hours: /3
  - platform: homeassistant
    event: start
  actions:
  - target:
      entity_id: weather.kttn_daynight
    data:
      type: twice_daily
    response_variable: wx
    action: weather.get_forecasts
  - target:
      entity_id: input_number.mow_forecast_score_1
    data:
      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
        | list %}{% if dt|length > 0 %}{% set p = dt[0] %}{% set wd = as_datetime(p.datetime).astimezone().date()
        %}{% set precip = p.precipitation_probability|int(0) %}{% set cond = p.condition|lower
        %}{% set temp = p.temperature|float(70) %}{% set wind = p.wind_speed|float(0)
        %}{% if ''lightning'' in cond or ''thunderstorm'' in cond or ''hail'' in cond
        or ''pouring'' in cond or precip>=75 %}{{ 0 }}{% else %}{% set r = 30 if precip<10
        else (23 if precip<25 else (14 if precip<40 else (6 if precip<60 else 2)))
        %}{% set c = 18 if cond==''sunny'' else (16 if cond==''partlycloudy'' else
        (13 if cond==''cloudy'' else (4 if ''rain'' in cond or cond==''drizzle'' else
        14))) %}{% set t = 22 if temp>=62 and temp<=85 else (16 if (temp>=55 and temp<62)
        or (temp>85 and temp<=90) else (9 if (temp>=45 and temp<55) or (temp>90 and
        temp<=95) else (3 if temp>=35 else 0))) %}{% set tf = state_attr(''sensor.kleenex_pollen_radar_ewing_trees'',''forecast'')
        or [] %}{% set gf = state_attr(''sensor.kleenex_pollen_radar_ewing_grass'',''forecast'')
        or [] %}{% set wf = state_attr(''sensor.kleenex_pollen_radar_ewing_weeds'',''forecast'')
        or [] %}{% set tvl = tf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set gvl = gf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set wvl = wf | selectattr(''date'',''equalto'',wd) | map(attribute=''value'')
        | list %}{% set tv = tvl[0] if tvl|length else states(''sensor.kleenex_pollen_radar_ewing_trees'')|float(0)
        %}{% set gv = gvl[0] if gvl|length else states(''sensor.kleenex_pollen_radar_ewing_grass'')|float(0)
        %}{% set wv = wvl[0] if wvl|length else states(''sensor.kleenex_pollen_radar_ewing_weeds'')|float(0)
        %}{% set C = tv + gv + wv %}{% set pp = 0 if C<50 else (6 if C<75 else (16
        if C<120 else (28 if C<150 else (40 if C<200 else 50)))) %}{% set pp = pp
        + (8 if gv>=60 else (4 if gv>=40 else 0)) %}{% set pp = [pp,55]|min %}{% set
        wstd = 0 if wind<12 else (3 if wind<18 else 6) %}{% set wint = 0 if C<75 else
        [((([wind-8,0]|max)*(0.8 if C>=150 else 0.4))|round(0)|int),20]|min %}{% set
        af = state_attr(''sensor.air_quality_daily_forecast'',''forecast'') or []
        %}{% set avl = af|selectattr(''date'',''equalto'',wd|string)|map(attribute=''aqi'')|list
        %}{% set aq = avl[0] if avl|length else states(''sensor.air_quality_us_aqi'')|int(0)
        %}{% set aqp = 0 if aq<=50 else (4 if aq<=75 else (10 if aq<=100 else (25
        if aq<=150 else (45 if aq<=200 else 100)))) %}{{ [100,[0, r+c+t+30-pp-wstd-wint-aqp]|max]|min
        }}{% endif %}{% else %}{{ 0 }}{% endif %}'
    action: input_number.set_value
  - target:
      entity_id: input_text.mow_forecast_label_1_2
    data:
      value: '{% set dt = wx[''weather.kttn_daynight''][''forecast''] | selectattr(''is_daytime'',''eq'',true)
