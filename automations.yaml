- id: '1786622040291'
  alias: 'Location: Log Scotch Rd Plaza Visit (Groomer vs Salon, Heuristic)'
  triggers:
  - entity_id: device_tracker.iphone
    for: 00:01:00
    platform: state
    to: Scotch Rd Plaza
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 10800 }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''person.johnny'') == ''Scotch Rd Plaza'' }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.hair_salon_visits
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.hair_salon_last_visit
      - action: logbook.log
        data:
          entity_id: input_datetime.hair_salon_last_visit
          message: Hair salon visit — Johnny came along.
          name: Personal Log
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: passive
          message: Logged at {{ now().strftime('%-I:%M %p') }}. Johnny tagged along.
          title: "\U0001F487 Hair salon visit logged"
    - conditions:
      - condition: template
        value_template: '{{ states(''person.johnny'') != ''Scotch Rd Plaza'' and is_state(''binary_sensor.johnny_tracker_battery_charging'',
          ''on'') }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.groomer_visits
      - action: input_datetime.set_datetime
        data:
          timestamp: '{{ now().timestamp() }}'
        target:
          entity_id: input_datetime.groomer_last_visit
      - action: logbook.log
        data:
          entity_id: input_datetime.groomer_last_visit
          message: 'Groomer visit (heuristic: Johnny not with you, tracker charging).'
          name: Pet Log
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: passive
          message: Logged at {{ now().strftime('%-I:%M %p') }} — Johnny not with you
            + tracker charging. Collar's at {{ states('sensor.johnny_tracker_battery')
            }}% right now. Correct me if that's wrong.
          title: "\U0001F43E Groomer visit logged (best guess)"
    default:
    - action: counter.increment
      target:
        entity_id: counter.hair_salon_visits
    - action: input_datetime.set_datetime
      data:
        timestamp: '{{ now().timestamp() }}'
      target:
        entity_id: input_datetime.hair_salon_last_visit
    - action: logbook.log
      data:
        entity_id: input_datetime.hair_salon_last_visit
        message: Hair salon visit — solo, Johnny stayed home.
        name: Personal Log
    - action: notify.mobile_app_iphone
      data:
        data:
          push:
            interruption-level: passive
        message: Logged at {{ now().strftime('%-I:%M %p') }}. Solo trip.
        title: "\U0001F487 Hair salon visit logged"
  mode: single
- id: '1786623005090'
  alias: Johnny's Collar — 80% Charge Nudge (v1)
  triggers:
  - above: 79
    entity_id: sensor.johnny_tracker_battery
    platform: numeric_state
  conditions:
  - condition: state
    entity_id: binary_sensor.johnny_tracker_battery_charging
    state: 'on'
  actions:
  - action: notify.mobile_app_iphone
    data:
      data:
        push:
          interruption-level: passive
      message: Currently {{ states('sensor.johnny_tracker_battery') }}%. Should cover
        a typical month — pull it now or let it finish charging.
      title: "\U0001F50B Johnny's collar hit 80%"
  mode: single
- id: bedroom_ac_dry_mode_auto_revert_v1
  alias: Bedroom AC — Dry Mode Auto-Revert (v1)
  triggers:
  - trigger: state
    entity_id: climate.bedroom_ac
    to: dry
    for:
      hours: 1
      minutes: 30
  conditions: []
  actions:
  - alias: Back to cool - dry mode has run long enough
    action: climate.set_hvac_mode
    target:
      entity_id: climate.bedroom_ac
    data:
      hvac_mode: cool
  mode: single
- id: bedroom_night_setpoint_manager_v1
  alias: Bedroom AC — Night Setpoint Manager (v4, Yields to Wake Warm-Up)
  triggers:
  - id: tick
    minutes: /15
    note: Every quarter hour. The action recomputes from scratch and no-ops when nothing
      needs changing, so a missed tick self-heals on the next one. This is also why
      last_triggered is meaningless here - see the description.
    trigger: time_pattern
  - entity_id: input_boolean.in_bed
    id: got_in_bed
    note: Jump straight to 65 at bedtime instead of waiting up to 15 minutes for the
      next tick.
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    note: Do not ramp an empty house, and do not fight away-eco while she is out.
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
  - above: 55
    attribute: temperature
    condition: numeric_state
    entity_id: climate.bedroom_ac
    note: 'An unreachable unit reports None for the target. numeric_state evaluates
      false on None, which is the fail-safe direction: do nothing rather than write
      a number based on a missing reading.'
  - condition: or
    note: 'Defer to Gradual Warm Before Alarm''s 25-30 min pre-wake ramp instead of
      clawing it back to the in-bed-climb cap on the next tick. The 40-min leg is
      a stale-flag escape hatch: that automation''s own hard ceiling is 25 minutes,
      so if it ever dies mid-run, this resumes ownership on its own rather than staying
      locked out.'
    conditions:
    - condition: state
      entity_id: input_boolean.bedroom_wake_warm_up_active
      state: 'off'
    - condition: state
      entity_id: input_boolean.bedroom_wake_warm_up_active
      state: 'on'
      for: 00:40:00
  actions:
  - alias: Work out whether this automation owns the dial right now, and what the
      number should be
    note: in_bed wins over the clock, so getting into bed early ends the ramp immediately.
    variables:
      cur_temp: '{{ state_attr(''climate.bedroom_ac'',''temperature'') | float(0)
        }}'
      desired: '{% set ns = namespace(d = 0) %}{% set floor_t = 65 %}{% set ceil_t
        = 68 %}{% set cur = state_attr(''climate.bedroom_ac'',''temperature'') | float(0)
        %}{% set start_h = 19 if is_state(''input_boolean.workday_tomorrow'',''on'')
        else 20 %}{% set vb = states(''input_datetime.bedroom_virtual_bedtime'') if
        states(''input_datetime.bedroom_virtual_bedtime'') not in [''unknown'',''unavailable'']
        else ''23:00:00'' %}{% set vb_t = state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800) %}{% set now_t = now().hour * 3600 + now().minute * 60 + now().second
        %}{% if is_state(''input_boolean.in_bed'',''on'') %}{% set mins = (now() -
        states.input_boolean.in_bed.last_changed).total_seconds() / 60 %}{% set ns.d
        = [ floor_t + ((mins // 90) | int), ceil_t ] | min %}{% elif now_t >= vb_t
        or now().hour < 4 %}{% set anchor = today_at(vb) if now_t >= vb_t else today_at(vb)
        - timedelta(days=1) %}{% set mins = (now() - anchor).total_seconds() / 60
        %}{% set target = [ floor_t + ((mins // 90) | int), ceil_t ] | min %}{% set
        ns.d = ([ target, cur - 1 ] | max) if cur > target else target %}{% elif now().hour
        >= start_h %}{% set ns.d = [ floor_t, cur - 1 ] | max %}{% else %}{% set ns.d
        = cur %}{% endif %}{{ (74 if ns.d == 75 else ns.d) | round(0) | int }}'
      in_window: '{{ is_state(''input_boolean.in_bed'',''on'') or now().hour >= (19
        if is_state(''input_boolean.workday_tomorrow'',''on'') else 20) or now().hour
        < 4 or (now().hour * 3600 + now().minute * 60 + now().second) >= (state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800)) }}'
      phase: '{% if is_state(''input_boolean.in_bed'',''on'') %}in-bed climb{% elif
        (now().hour * 3600 + now().minute * 60 + now().second) >= (state_attr(''input_datetime.bedroom_virtual_bedtime'',''timestamp'')
        | int(82800)) or now().hour < 4 %}virtual-bedtime climb{% else %}evening ramp{%
        endif %}'
  - alias: Stop unless this automation owns the dial right now
    condition: template
    note: 'v2: the run is gated on being in a window, NOT on the number needing to
      change. Outside both windows nothing below here runs, so a daytime heat-alert
      boost is left alone to do its job.'
    value_template: '{{ in_window }}'
  - alias: Inside a window, assert preset none even if the number is already right
    if:
    - condition: not
      conditions:
      - attribute: preset_mode
        condition: state
        entity_id: climate.bedroom_ac
        state: none
    note: eco's baked-in ~73F reference and the heat alert's 'boost' both override
      or ignore an explicit number. This is the step that makes the dial trustworthy
      inside a window.
    then:
    - action: climate.set_hvac_mode
      data:
        hvac_mode: cool
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: climate.set_preset_mode
      data:
        preset_mode: none
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: logbook.log
      alias: Say so, since this is a rescue rather than routine
      data:
        entity_id: climate.bedroom_ac
        message: Cleared a preset that was not 'none' during the {{ phase }} and took
          the dial back.
        name: Night Setpoint
  - alias: Write the step, but only when the number actually differs
    if:
    - condition: template
      value_template: '{{ (desired | float(0)) != (cur_temp | float(0)) }}'
    then:
    - action: climate.set_temperature
      data:
        temperature: '{{ desired | int }}'
      target:
        entity_id: climate.bedroom_ac
    - action: input_datetime.set_datetime
      alias: Stamp the real change, since last_triggered cannot tell you this
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      target:
        entity_id: input_datetime.bedroom_night_setpoint_last_change
    - action: logbook.log
      alias: Log it so the night's shape is auditable after the fact
      data:
        entity_id: climate.bedroom_ac
        message: '{{ phase }}: {{ cur_temp | int }}F to {{ desired | int }}F. Bedside
          {{ states(''sensor.airguard_temperature'') }}F, wall {{ states(''sensor.hue_motion_sensor_2_temperature'')
          }}F.'
        name: Night Setpoint
  max_exceeded: silent
  mode: single
- id: bedroom_ac_daytime_release_76_v1
  alias: Bedroom AC — Daytime Release to 76 (v2)
  triggers:
  - entity_id: input_boolean.in_bed
    from: 'on'
    id: got_up
    note: She got up. Weekend/day-off path only - the workday gate lives in the conditions,
      because on a work morning the vanity window (not yet built) should own the dial
      until she leaves.
    to: 'off'
    trigger: state
  - at: 09:00:00
    id: backstop
    note: Catches BOTH a workday after she has left AND any night where in_bed was
      never set, in which case got_up can never fire. This is the leg that would have
      caught the 2026-08-15 failure.
    trigger: time
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: input_boolean.bedroom_vanity_window
    state: 'off'
    note: The vanity window owns the dial while it is open. Without this the 09:00
      backstop would overwrite the vanity target with 76 on a morning she is still
      home.
  - condition: state
    entity_id: person.lara_wiz
    note: Do not fight away-eco while she is out; it owns the dial then.
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.bedroom_ac
      state:
      - 'off'
      - unavailable
      - unknown
    note: Never resurrect a unit that was switched off on purpose.
  - above: 55
    attribute: temperature
    condition: numeric_state
    entity_id: climate.bedroom_ac
    note: 'An unreachable unit reports None for the target. numeric_state evaluates
      false on None, which is the fail-safe direction: do nothing rather than act
      on a missing reading.'
  actions:
  - alias: Decide whether this trigger is allowed to release the dial
    condition: or
    conditions:
    - condition: trigger
      id: backstop
    - condition: and
      conditions:
      - condition: trigger
        id: got_up
      - condition: state
        entity_id: binary_sensor.workday
        note: Work mornings are the vanity window's territory (70-72 at the wall),
          not this automation's.
        state: 'off'
  - alias: Stop unless the dial is actually below 76, so a hand-set higher number
      is never overridden
    attribute: temperature
    below: 76
    condition: numeric_state
    entity_id: climate.bedroom_ac
  - alias: Clear any preset that would make the number meaningless
    if:
    - condition: not
      conditions:
      - attribute: preset_mode
        condition: state
        entity_id: climate.bedroom_ac
        state: none
    then:
    - action: climate.set_hvac_mode
      data:
        hvac_mode: cool
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
    - action: climate.set_preset_mode
      data:
        preset_mode: none
      target:
        entity_id: climate.bedroom_ac
    - alias: Let the unit settle, these Midea entities clobber rapid sequential commands
      delay:
        seconds: 3
  - action: climate.set_temperature
    alias: Release the dial to 76
    data:
      temperature: 76
    target:
      entity_id: climate.bedroom_ac
  - action: logbook.log
    alias: Log it so the day's shape is auditable alongside the night manager's entries
    data:
      entity_id: climate.bedroom_ac
      message: 'Daytime release ({{ trigger.id }}): dial to 76F. Bedside {{ states(''sensor.airguard_temperature'')
        }}F, wall {{ states(''sensor.hue_motion_sensor_2_temperature'') }}F.'
      name: Daytime Release
  mode: single
- id: bedroom_ac_office_morning_vanity_window_v1
  alias: Bedroom AC — Office Morning Vanity Window (v2)
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    id: first_motion
    note: First bedroom motion of the morning opens the window. Deliberately the EARLY
      edge, so the shower becomes lead time.
    to: 'on'
    trigger: state
  - entity_id: person.lara_wiz
    from: home
    id: departed
    note: She left for the office. Primary close.
    trigger: state
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    for:
      minutes: 30
    id: went_quiet
    note: Thirty minutes of stillness. This is the leg that closes a WFH morning,
      where motion stops after a few minutes and never resumes.
    to: 'off'
    trigger: state
  - at: 09:30:00
    id: backstop
    note: Hard ceiling so the window can never hold the room at the vanity number
      all day.
    trigger: time
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - choose:
    - alias: OPEN the window on first morning motion
      conditions:
      - condition: trigger
        id: first_motion
      - condition: state
        entity_id: input_boolean.bedroom_vanity_window
        state: 'off'
      - condition: state
        entity_id: binary_sensor.workday
        state: 'on'
      - condition: state
        entity_id: person.lara_wiz
        state: home
      - after: 05:00:00
        before: 09:00:00
        condition: time
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.bedroom_ac
          state:
          - 'off'
          - unavailable
          - unknown
      - above: 55
        attribute: temperature
        condition: numeric_state
        entity_id: climate.bedroom_ac
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_vanity_window
      - alias: Clear any preset that would make the number meaningless
        if:
        - condition: not
          conditions:
          - attribute: preset_mode
            condition: state
            entity_id: climate.bedroom_ac
            state: none
        then:
        - action: climate.set_hvac_mode
          data:
            hvac_mode: cool
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle, these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
        - action: climate.set_preset_mode
          data:
            preset_mode: none
          target:
            entity_id: climate.bedroom_ac
        - alias: Let the unit settle, these Midea entities clobber rapid sequential
            commands
          delay:
            seconds: 3
      - action: climate.set_temperature
        alias: Set the vanity target, skipping the unsettable 75
        data:
          temperature: '{% set t = states(''input_number.bedroom_vanity_dial_target'')
            | int(73) %}{{ 74 if t == 75 else t }}'
        target:
          entity_id: climate.bedroom_ac
      - action: logbook.log
        alias: Log the opening reading so the dial target can be calibrated later
        data:
          entity_id: climate.bedroom_ac
          message: Vanity window OPEN. Dial to {{ states('input_number.bedroom_vanity_dial_target')
            | int(73) }}F. Wall {{ states('sensor.hue_motion_sensor_2_temperature')
            }}F, bedside {{ states('sensor.airguard_temperature') }}F.
          name: Vanity Window
    - alias: CLOSE the window and hand back to the daytime 76
      conditions:
      - condition: trigger
        id:
        - departed
        - went_quiet
        - backstop
        note: LOAD-BEARING. Without this, every motion event after the window opened
          would fall past the OPEN branch (which requires the flag off) into this
          one and close the window instantly.
      - condition: state
        entity_id: input_boolean.bedroom_vanity_window
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_vanity_window
      - action: logbook.log
        alias: Log the closing reading, the one that says whether the target was right
        data:
          entity_id: climate.bedroom_ac
          message: Vanity window CLOSED ({{ trigger.id }}). Wall {{ states('sensor.hue_motion_sensor_2_temperature')
            }}F, bedside {{ states('sensor.airguard_temperature') }}F, dial was {{
            state_attr('climate.bedroom_ac','temperature') }}F. Target band is wall
            70-72.
          name: Vanity Window
      - alias: Hand off to 76 so the room is never stranded at the vanity number
        if:
        - condition: and
          conditions:
          - condition: state
            entity_id: person.lara_wiz
            state: home
          - condition: not
            conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state:
              - 'off'
              - unavailable
              - unknown
          - attribute: temperature
            below: 76
            condition: numeric_state
            entity_id: climate.bedroom_ac
        then:
        - action: climate.set_temperature
          data:
            temperature: 76
          target:
            entity_id: climate.bedroom_ac
  mode: single
  max_exceeded: silent
- id: living_room_energize_morning_trial
  alias: Living Room — Energize Morning Trial (v2)
  triggers:
  - at: 06:00:00
    id: window_open
    trigger: time
  - entity_id: light.living_room_lights
    from: 'off'
    id: lights_on
    to: 'on'
    trigger: state
  - at: '10:00:00'
    id: window_close
    trigger: time
  - event: start
    id: ha_start
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    - alias: '06:00 — open the window: take Adaptive Lighting out of the way, then
        apply Energize if the lamps are already on'
      conditions:
      - condition: trigger
        id: window_open
      sequence:
      - action: switch.turn_off
        alias: AL must be OFF or it overwrites Energize within 90 seconds
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
      - if:
        - condition: state
          entity_id: light.living_room_lights
          state: 'on'
        - condition: state
          entity_id: person.lara_wiz
          state: home
        then:
        - action: light.turn_on
          data:
            brightness: 255
            color_temp_kelvin: 6410
            transition: 5
          target:
            entity_id: light.living_room_lights
    - alias: Lamps came on inside the window — apply Energize
      conditions:
      - condition: trigger
        id: lights_on
      - after: 06:00:00
        before: '10:00:00'
        condition: time
      - condition: state
        entity_id: person.lara_wiz
        state: home
      sequence:
      - alias: Let the bulbs finish reporting their turn-on state first
        delay:
          seconds: 2
      - action: light.turn_on
        data:
          brightness: 255
          color_temp_kelvin: 6410
          transition: 5
        target:
          entity_id: light.living_room_lights
    - alias: 10:00 — close the window, hand the lamps back to Adaptive Lighting, and
        re-assert the away-dim (UNGATED on purpose)
      conditions:
      - condition: trigger
        id: window_close
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
      - alias: Let Adaptive Lighting finish its initial adaptation before overriding,
          so the override registers as manual control instead of racing it
        delay:
          seconds: 10
      - alias: Re-assert the away-dim, because Ambient Manager set brightness_pct
          20 while AL was switched off and so pinned nothing; setting it again now
          that AL is on does pin manual_control, and person_arrived_home clears that
          pin
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: person.lara_wiz
            state: home
        - condition: state
          entity_id: light.living_room_lights
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.living_room_lights
          data:
            brightness_pct: 20
            transition: 5
    - alias: Backstop — if HA restarted and it is now outside the window, make sure
        AL is back on
      conditions:
      - condition: trigger
        id: ha_start
      - condition: not
        conditions:
        - after: 06:00:00
          before: '10:00:00'
          condition: time
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_living_room_lights
  max: 10
  max_exceeded: silent
  mode: queued
- id: living_room_al_handback_failsafe
  alias: Living Room — AL Handback Failsafe (Energize Trial, v1)
  triggers:
  - at: '10:02:00'
    trigger: time
  conditions:
  - condition: state
    entity_id: switch.adaptive_lighting_living_room_lights
    state: 'off'
  - condition: state
    entity_id: calendar.tv
    state: 'off'
  actions:
  - alias: Repair first, so the house is correct even if the push is missed
    action: switch.turn_on
    target:
      entity_id: switch.adaptive_lighting_living_room_lights
  - action: notify.mobile_app_iphone
    data:
      title: ⚠️ AL handback failed
      message: Adaptive Lighting was still OFF at 10:02, so the Energize trial's 10:00
        restore did not run. I switched AL back on for you. Worth checking the trial's
        traces when you get a minute.
  mode: single
- id: bedroom_air_quality_spike_alert
  alias: Bedroom — Air Quality Spike Alert (v1)
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 35
    id: usg
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 55
    id: unhealthy
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 150
    id: very_unhealthy
  - trigger: numeric_state
    entity_id: sensor.airguard_pm2_5
    above: 250
    id: hazardous
  - trigger: homeassistant
    event: start
    id: startup_recheck
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Wait for PM2.5 to have a real value (repopulates after a restart)
    wait_template: '{{ states(''sensor.airguard_pm2_5'') | is_number }}'
    timeout: 00:03:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 250
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 4
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Bedroom Air Quality: Hazardous"
          message: Bedside PM2.5 just crossed 250 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}). Do not sleep in here without filtration.
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 4
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 150
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 3
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F6A8 Bedroom Air Quality: Very Unhealthy"
          message: Bedside PM2.5 just crossed 150 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}).
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 3
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 55
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 2
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: '⚠️ Bedroom Air Quality: Unhealthy'
          message: Bedside PM2.5 just crossed 55 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}).
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 2
    - conditions:
      - condition: numeric_state
        entity_id: sensor.airguard_pm2_5
        above: 35
      - condition: numeric_state
        entity_id: input_number.bedroom_air_quality_alert_level_reached
        below: 1
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: "\U0001F33F Bedroom Air Quality: Elevated"
          message: Bedside PM2.5 just crossed 35 µg/m³ (currently {{ states('sensor.airguard_pm2_5')
            }}). Sensitive individuals may notice.
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_air_quality_alert_level_reached
        data:
          value: 1
  mode: single
  max_exceeded: silent
- id: bedroom_air_quality_alert_level_daily_reset
  alias: Bedroom — Air Quality Alert Level Daily Reset
  triggers:
  - trigger: time
    at: 00:00:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_air_quality_alert_level_reached
    data:
      value: 0
  mode: single
- id: '1787433958411'
  alias: 'Presence: Stamp first departure of the day'
  triggers:
  - entity_id: person.lara_wiz
    from: home
    not_to:
    - unknown
    - unavailable
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set ts = state_attr(''input_datetime.presence_first_departure_today'',''timestamp'')
      %}{{ ts is none or ts <= today_at().timestamp() }}'
  actions:
  - action: input_datetime.set_datetime
    alias: Stamp the first departure timestamp
    data:
      timestamp: '{{ now().timestamp() }}'
    target:
      entity_id: input_datetime.presence_first_departure_today
  mode: single
- id: '1787433972366'
  alias: 'Presence: Stamp last arrival home'
  triggers:
  - entity_id: person.lara_wiz
    not_from:
    - unknown
    - unavailable
    to: home
    trigger: state
  actions:
  - action: input_datetime.set_datetime
    alias: Stamp the arrival timestamp, overwriting any earlier one today
    data:
      timestamp: '{{ now().timestamp() }}'
    target:
      entity_id: input_datetime.presence_last_arrival_today
  mode: single
- id: '1787464850803'
  alias: 'Sleep: Arm the bed window (dose log, or 20:10 fallback)'
  triggers:
  - entity_id: input_boolean.guanfacine_taken
    id: dose_logged
    note: The preferred anchor - real dose time.
    to: 'on'
    trigger: state
  - at: '20:10:00'
    id: fallback_clock
    note: Backstop for the night she takes it but never presses the button.
    trigger: time
  conditions:
  - alias: Arm on the dose log, or at 20:10 only if it is still unlogged
    condition: or
    conditions:
    - condition: trigger
      id: dose_logged
    - condition: and
      conditions:
      - condition: trigger
        id: fallback_clock
      - condition: state
        entity_id: input_boolean.guanfacine_taken
        state: 'off'
  actions:
  - action: input_datetime.set_datetime
    alias: Stamp the bed window 75 minutes out
    data:
      datetime: '{{ (now() + timedelta(minutes=75)).strftime(''%Y-%m-%d %H:%M:%S'')
        }}'
    target:
      entity_id: input_datetime.bed_window_at
  - action: logbook.log
    alias: Record WHICH path armed it, so the record is countable later
    data:
      entity_id: input_datetime.bed_window_at
      message: Bed window armed via {{ 'dose log' if trigger.id == 'dose_logged' else
        '20:10 fallback (dose not logged)' }}, opens {{ (now() + timedelta(minutes=75)).strftime('%H:%M')
        }}
      name: Sleep Log
  mode: single
- id: '1787464878651'
  alias: 'Sleep: Bed-window nudge (v2, Fri/Sat hard)'
  triggers:
  - at: input_datetime.bed_window_at
    id: bed_window_open
    trigger: time
  conditions:
  - alias: 'The whole point: only nudge if she is not already in bed'
    condition: state
    entity_id: input_boolean.in_bed
    state: 'off'
  - condition: state
    entity_id: input_boolean.guests
    state: 'off'
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  - condition: state
    entity_id: person.lara_wiz
    state: home
  - after: '20:30:00'
    alias: Safety net against an odd fire after a restart
    before: 01:30:00
    condition: time
  actions:
  - action: scene.create
    alias: Snapshot the living-room lamps so we can restore them exactly
    data:
      scene_id: bed_window_nudge_restore
      snapshot_entities:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
  - alias: Tier the nudge by which EVENING it is
    choose:
    - alias: HARD TIER - Fri or Sat evening, where 59 percent of couch nights live
      conditions:
      - condition: template
        value_template: '{{ (now() - timedelta(hours=6)).strftime(''%a'') | lower
          in [''fri'', ''sat''] }}'
      sequence:
      - variables:
          tv_was_playing: '{{ states(''media_player.living_room_4k_2'') in [''playing'',
            ''buffering''] }}'
        alias: Capture whether the TV was actually playing, BEFORE we pause it
      - alias: Pause the Apple TV if something is actually playing
        if:
        - condition: state
          entity_id: media_player.living_room_4k_2
          state:
          - playing
          - buffering
        then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.living_room_4k_2
      - action: light.turn_on
        alias: Undo the couch-dim
        data:
          brightness_pct: 70
          transition: 2
        target:
          entity_id: light.living_room_lights
      - action: notify.mobile_app_iphone
        data:
          message: '{{ ''Lights up, TV paused.'' if tv_was_playing else ''Lights up.''
            }} Friday and Saturday are where this actually goes wrong. Releases in
            30 min.'
          title: Bed window
      - alias: Hold 30 min for in_bed, then release rather than nag forever
        continue_on_timeout: true
        timeout: 00:30:00
        wait_for_trigger:
        - entity_id: input_boolean.in_bed
          to: 'on'
          trigger: state
    default:
    - action: light.turn_on
      alias: SOFT TIER - Sun through Thu. Lights and a push only, no TV pause.
      data:
        brightness_pct: 70
        transition: 2
      target:
        entity_id: light.living_room_lights
    - action: notify.mobile_app_iphone
      data:
        message: Lights up. Bed beats the couch from here. Releases in 20 min.
        title: Bed window
    - alias: Shorter hold on a midweek evening
      continue_on_timeout: true
      timeout: 00:20:00
      wait_for_trigger:
      - entity_id: input_boolean.in_bed
        to: 'on'
        trigger: state
  - action: scene.turn_on
    alias: Restore the lamps exactly as they were
    data:
      transition: 2
    target:
      entity_id: scene.bed_window_nudge_restore
  - action: adaptive_lighting.set_manual_control
    alias: Hand the lamps back to Adaptive Lighting
    data:
      entity_id: switch.adaptive_lighting_living_room_lights
      lights:
      - light.living_room_corner
      - light.torchiere
      - light.next_to_couch
      manual_control: false
  - alias: Branch on whether she actually went to bed
    choose:
    - alias: 'She went to bed: log it, leave the TV paused, she is not in the room'
      conditions:
      - condition: state
        entity_id: input_boolean.in_bed
        state: 'on'
      sequence:
      - action: logbook.log
        data:
          entity_id: input_boolean.in_bed
          message: 'Bed-window nudge: went to bed during the hold'
          name: Sleep Log
    default:
    - action: logbook.log
      data:
        entity_id: input_boolean.in_bed
        message: 'Bed-window nudge: released on timeout, still up'
        name: Sleep Log
    - alias: Resume only if WE paused it - the soft tier never does
      if:
      - condition: state
        entity_id: media_player.living_room_4k_2
        state: paused
      then:
      - alias: Grace period so she is back in the room before audio resumes
        delay: 00:00:15
      - action: media_player.media_play
        target:
          entity_id: media_player.living_room_4k_2
  mode: single
- id: wfh_today_daily_reset_4am
  alias: WFH Today — Daily Reset at 4am
  triggers:
  - trigger: time
    at: 04:00:00
    id: daily_reset
  conditions: []
  actions:
  - alias: Clear the flag, and log it only when it was actually left on, so a stuck
      flag stays visible
    if:
    - condition: state
      entity_id: input_boolean.wfh_today
      state: 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.wfh_today
    - action: logbook.log
      data:
        name: WFH Today
        entity_id: input_boolean.wfh_today
        message: Reset to OFF for the new day. It was left ON overnight, which is
          expected after a WFH day or a weekend. This morning's Wake up event will
          set it again if today is WFH.
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.wfh_today
      note: Already off. Asserting it is a no-op and keeps the end state unconditional.
  mode: single
- id: alert_ting_hazard
  alias: 'Alert: Ting Fire Hazard / Frozen Pipe (v3)'
  triggers:
  - entity_id: binary_sensor.710b782e7_fire_hazard
    for: 00:00:30
    from: 'off'
    id: fire
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.710b782e7_electrical_fire_hazard
    for: 00:00:30
    from: 'off'
    id: electrical
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.710b782e7_unverified_fire_hazard
    for: 00:00:30
    from: 'off'
    id: unverified
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.710b782e7_frozen_pipe_risk
    for: 00:05:00
    from: 'off'
    id: frozen_pipe
    to: 'on'
    trigger: state
  - entity_id:
    - binary_sensor.710b782e7_fire_hazard
    - binary_sensor.710b782e7_electrical_fire_hazard
    - binary_sensor.710b782e7_unverified_fire_hazard
    for: 00:00:30
    from: 'on'
    id: fire_cleared
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.710b782e7_frozen_pipe_risk
    for: 00:05:00
    from: 'on'
    id: frozen_pipe_cleared
    to: 'off'
    trigger: state
  actions:
  - choose:
    - alias: Confirmed fire hazard - critical, breaks through Do Not Disturb
      conditions:
      - condition: trigger
        id: fire
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              sound:
                critical: 1
                name: default
                volume: 1
            tag: ting_fire_hazard
          message: 'Ting detected a fire hazard. {{ states(''sensor.710b782e7_hazard_message'')
            }} (status: {{ states(''sensor.710b782e7_hazard_status'') }})'
          title: "\U0001F6A8 TING: FIRE HAZARD"
      - alias: Speak it on every available Sonos - NOT gated on in_bed, this one has
          to wake her
        action: script.sonos_broadcast
        data:
          players: '{{ integration_entities(''sonos'') | select(''match'',''media_player'')
            | reject(''is_state'',''unavailable'') | reject(''is_state'',''unknown'')
            | list }}'
          volume: 0.85
          restore: true
          ungroup: true
          message: Attention. Ting has detected a fire hazard. Repeat. Ting has detected
            a fire hazard. Check the Ting app now.
    - alias: Confirmed electrical fire hazard - critical, breaks through Do Not Disturb
      conditions:
      - condition: trigger
        id: electrical
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              sound:
                critical: 1
                name: default
                volume: 1
            tag: ting_electrical_fire_hazard
          message: 'Ting detected an electrical fire hazard. {{ states(''sensor.710b782e7_electrical_fire_hazard_message'')
            }} (status: {{ states(''sensor.710b782e7_electrical_fire_hazard_status'')
            }}, level {{ states(''sensor.710b782e7_electrical_fire_hazard_level'')
            }})'
          title: "\U0001F6A8 TING: ELECTRICAL FIRE HAZARD"
      - alias: Speak it on every available Sonos - NOT gated on in_bed, this one has
          to wake her
        action: script.sonos_broadcast
        data:
          players: '{{ integration_entities(''sonos'') | select(''match'',''media_player'')
            | reject(''is_state'',''unavailable'') | reject(''is_state'',''unknown'')
            | list }}'
          volume: 0.85
          restore: true
          ungroup: true
          message: Attention. Ting has detected an electrical fire hazard. Repeat.
            An electrical fire hazard. Check the Ting app now.
    - alias: Unverified fire hazard - time-sensitive, NOT critical; titled UNVERIFIED
        so it is distinguishable at a glance
      conditions:
      - condition: trigger
        id: unverified
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: time-sensitive
            tag: ting_unverified_fire_hazard
          message: 'Ting detected possible arcing, not yet confirmed by review. {{
            states(''sensor.710b782e7_unverified_fire_hazard_message'') }} (status:
            {{ states(''sensor.710b782e7_unverified_fire_hazard_status'') }})'
          title: '⚠️ TING: UNVERIFIED fire hazard'
    - alias: Frozen pipe risk - normal push, deliberately not critical
      conditions:
      - condition: trigger
        id: frozen_pipe
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_frozen_pipe
          message: Ting flagged a frozen pipe risk. {{ states('sensor.710b782e7_hazard_message')
            }}
          title: "\U0001F9CA Ting: frozen pipe risk"
    - alias: Any fire hazard cleared - normal push so the alert is closed out, not
        left hanging
      conditions:
      - condition: trigger
        id: fire_cleared
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_hazard_cleared
          message: '{{ trigger.to_state.attributes.friendly_name }} went back to clear.
            Current status: {{ states(''sensor.710b782e7_hazard_message'') }}'
          title: '✅ Ting: hazard cleared'
    - alias: Frozen pipe risk cleared
      conditions:
      - condition: trigger
        id: frozen_pipe_cleared
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_frozen_pipe
          message: Frozen pipe risk went back to clear.
          title: '✅ Ting: frozen pipe risk cleared'
  max: 10
  mode: queued
- id: '1787609008125'
  alias: 'Commute: Resume announcer after restart'
  triggers:
  - event: start
    id: ha_started
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - alias: Let the router, the Sonos, the calendar and the commute sensors finish
      coming back
    delay:
      minutes: 2
  - alias: Resume only if a run was actually in flight, departure has not passed,
      and the script really is down
    if:
    - alias: The parent announcer fired today, so a run WAS in flight
      condition: template
      value_template: '{% set lt = state_attr(''automation.commute_morning_announcer_with_waze_v2'',
        ''last_triggered'') %}{{ lt is not none and as_local(lt).date() == now().date()
        }}'
    - alias: leave_by is a real value, not a restore artefact
      condition: not
      conditions:
      - condition: state
        entity_id: sensor.commute_leave_by
        state:
        - unknown
        - unavailable
    - alias: Departure has not already passed
      condition: template
      value_template: '{{ now() < today_at(states(''sensor.commute_leave_by'')) }}'
    - alias: The script is genuinely down, not still running
      condition: state
      entity_id: script.commute_time_announcer
      state: 'off'
    then:
    - action: script.commute_time_announcer
      alias: Restart the countdown against today's leave_by on the same four speakers
        as the parent
      data:
        person_entity: person.lara_wiz
        players:
        - media_player.living_room_arc
        - media_player.basement
        - media_player.bedroom_frame
        - media_player.bathroom
        until_ts: '{{ as_timestamp(today_at(states(''sensor.commute_leave_by'')))
          }}'
    - action: notify.mobile_app_iphone
      alias: Tell Lara it was resumed, so the silent stretch before it is explainable
      data:
        data:
          push:
            interruption-level: active
          tag: commute_announcer_resumed
        message: Home Assistant restarted mid-morning and killed the countdown. Restarted
          it against {{ states('sensor.commute_leave_by') }}.
        title: "\U0001F501 Commute announcer resumed"
  mode: single
- id: alert_ting_voltage
  alias: 'Alert: Ting Voltage Anomaly (v4, corroborated)'
  triggers:
  - above: 132
    entity_id: sensor.710b782e7_current_voltage
    id: surge
    trigger: numeric_state
  - above: 128
    below: 132
    entity_id: sensor.710b782e7_current_voltage
    for: 00:02:00
    id: high
    trigger: numeric_state
  - above: 108
    below: 114
    entity_id: sensor.710b782e7_current_voltage
    for: 00:02:00
    id: sag
    trigger: numeric_state
  - above: 40
    below: 108
    entity_id: sensor.710b782e7_current_voltage
    for: 00:00:10
    id: severe_sag
    trigger: numeric_state
  - above: 116
    below: 127
    entity_id: sensor.710b782e7_current_voltage
    for: 00:05:00
    id: cleared
    trigger: numeric_state
  actions:
  - choose:
    - alias: Surge - instant, no debounce, NOT corroborated because plugs cannot see
        transients
      conditions:
      - condition: trigger
        id: surge
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ting_voltage_excursion_active
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: time-sensitive
            tag: ting_voltage_excursion
          message: '{{ trigger.to_state.state | float(0) | round(1) }} V on the panel.
            Rolling high {{ states(''sensor.710b782e7_voltage_high'') }} V. Check
            anything sensitive that was plugged in.'
          title: '⚡ TING: VOLTAGE SURGE'
      - alias: Speak it on every available Sonos - but not if she is in bed
        if:
        - condition: state
          entity_id: input_boolean.in_bed
          state: 'off'
        then:
        - action: script.sonos_broadcast
          data:
            message: Attention. A power surge has been detected. The panel is reading
              {{ trigger.to_state.state | float(0) | round(0) }} volts. Check anything
              sensitive that was plugged in.
            players: '{{ integration_entities(''sonos'') | select(''match'',''media_player'')
              | reject(''is_state'',''unavailable'') | reject(''is_state'',''unknown'')
              | list }}'
            restore: true
            ungroup: true
            volume: 0.7
    - alias: Severe sag - 10 s. Push always fires; the Sonos needs two plugs to agree.
      conditions:
      - condition: trigger
        id: severe_sag
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ting_voltage_excursion_active
      - alias: Count plugs independently seeing a plausible brownout
        variables:
          agree_low: '{% set ns = namespace(n=0) %}{% for p in plugs %}{% set v =
            states(p) | float(0) %}{% if v > 60 and v < 108 %}{% set ns.n = ns.n +
            1 %}{% endif %}{% endfor %}{{ ns.n }}'
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: time-sensitive
            tag: ting_voltage_excursion
          message: '{{ trigger.to_state.state | float(0) | round(1) }} V. {{ agree_low
            }} of 5 plug meters agree. Motors and compressors are at risk at this
            level — the ACs and the fridge are the ones that care.'
          title: '⚡ TING: BROWNOUT'
      - alias: Speak it only if she is up AND two plugs corroborate
        if:
        - condition: state
          entity_id: input_boolean.in_bed
          state: 'off'
        - condition: template
          value_template: '{{ agree_low | int(0) >= 2 }}'
        then:
        - action: script.sonos_broadcast
          data:
            message: Attention. A brownout has been detected. The panel is reading
              {{ trigger.to_state.state | float(0) | round(0) }} volts. The air conditioners
              and the fridge are the ones at risk.
            players: '{{ integration_entities(''sonos'') | select(''match'',''media_player'')
              | reject(''is_state'',''unavailable'') | reject(''is_state'',''unknown'')
              | list }}'
            restore: true
            ungroup: true
            volume: 0.7
    - alias: 'Sustained high - 2 min. CORROBORATED: at least one plug must also read
        high.'
      conditions:
      - condition: trigger
        id: high
      - alias: At least one plug above its own observed ceiling
        condition: template
        value_template: '{% set ns = namespace(n=0) %}{% for p in plugs %}{% if states(p)
          | float(0) > 124.5 %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}{{
          ns.n >= 1 }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ting_voltage_excursion_active
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_voltage_excursion
          message: '{{ trigger.to_state.state | float(0) | round(1) }} V, sustained
            over 2 minutes, and the plug meters agree. Normal here runs about 120
            to 125 V depending where it is measured.'
          title: '⚠️ Ting: voltage running high'
    - alias: 'Sustained sag - 2 min. CORROBORATED: at least one plug must also read
        low.'
      conditions:
      - condition: trigger
        id: sag
      - alias: At least one plug plausibly low - above 100 so a reconnect artifact
          at 0 cannot fake it
        condition: template
        value_template: '{% set ns = namespace(n=0) %}{% for p in plugs %}{% set v
          = states(p) | float(0) %}{% if v > 100 and v < 114 %}{% set ns.n = ns.n
          + 1 %}{% endif %}{% endfor %}{{ ns.n >= 1 }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ting_voltage_excursion_active
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_voltage_excursion
          message: '{{ trigger.to_state.state | float(0) | round(1) }} V, sustained
            over 2 minutes, and the plug meters agree. Normal here runs about 120
            to 125 V depending where it is measured.'
          title: '⚠️ Ting: voltage running low'
    - alias: Back to normal - only if an excursion was actually reported, so a restart
        cannot fake it
      conditions:
      - condition: trigger
        id: cleared
      - condition: state
        entity_id: input_boolean.ting_voltage_excursion_active
        state: 'on'
      sequence:
      - action: notify.mobile_app_iphone
        data:
          data:
            push:
              interruption-level: active
            tag: ting_voltage_excursion
          message: Steady at {{ trigger.to_state.state | float(0) | round(1) }} V
            for 5 minutes.
          title: '✅ Ting: voltage back to normal'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ting_voltage_excursion_active
  max: 10
  mode: queued
  variables:
    plugs:
    - sensor.living_room_ac_voltage
    - sensor.my_ac_voltage
    - sensor.living_room_tv_voltage
    - sensor.washer_voltage
    - sensor.dryer_voltage
- id: '1788137532987'
  alias: 'Sleep: Update & Notify Window Score'
  triggers:
  - hours: /3
    id: periodic
    trigger: time_pattern
  - event: start
    id: startup
    trigger: homeassistant
  - at: '20:30:00'
    id: evening_notify
    trigger: time
  conditions:
  - condition: state
    entity_id: calendar.vacation
    state: 'off'
  actions:
  - action: weather.get_forecasts
    data:
      type: hourly
    response_variable: wx
    target:
      entity_id: weather.kttn_daynight
  - action: input_number.set_value
    data:
      value: '{% set entries = wx[''weather.kttn_daynight''][''forecast''] %}{% set
        today = now().date() %}{% set tomorrow = (now() + timedelta(days=1)).date()
        %}{% set ns = namespace(night=[], storm=false) %}{% for p in entries %}{%
        set pdt = as_datetime(p.datetime).astimezone() %}{% if (pdt.date() == today
        and pdt.hour >= 21) or (pdt.date() == tomorrow and pdt.hour <= 6) %}{% set
        ns.night = ns.night + [p] %}{% set c = p.condition | lower %}{% if ''lightning''
        in c or ''pouring'' in c or ''hail'' in c %}{% set ns.storm = true %}{% endif
        %}{% endif %}{% endfor %}{% if ns.night | length == 0 %}{{ 0 }}{% else %}{%
        set precips = ns.night | map(attribute=''precipitation_probability'') | list
        %}{% set max_precip = precips | max %}{% set storm = ns.storm or max_precip
        >= 70 %}{% if storm %}{{ 0 }}{% else %}{% set temps = ns.night | map(attribute=''temperature'')
        | list %}{% set dews = ns.night | map(attribute=''dew_point'') | list %}{%
        set winds = ns.night | map(attribute=''wind_speed'') | list %}{% set low =
        temps | min %}{% set max_dew = dews | max %}{% set max_wind = winds | max
        %}{% set r = 30 if max_precip<10 else (22 if max_precip<25 else (14 if max_precip<40
        else (6 if max_precip<60 else 2))) %}{% set t = 25 if (low>=55 and low<=68)
        else (18 if ((low>=50 and low<55) or (low>68 and low<=72)) else (10 if ((low>=45
        and low<50) or (low>72 and low<=78)) else 3)) %}{% set d = 20 if max_dew<55
        else (15 if max_dew<60 else (9 if max_dew<65 else (3 if max_dew<70 else 0)))
        %}{% set w = 10 if max_wind<=10 else (6 if max_wind<=15 else (2 if max_wind<=20
        else 0)) %}{% set setpoint = state_attr(''climate.bedroom_ac'',''temperature'')
        | float(72) %}{% set diffpts = 15 if low<=setpoint-5 else (10 if low<=setpoint-2
        else (4 if low<=setpoint+2 else 0)) %}{% set g_avail = states(''sensor.google_pollen_weed'')
        not in [''unknown'',''unavailable'',''none''] %}{% if g_avail %}{% set gw
        = states(''sensor.google_pollen_weed'')|float(0) %}{% set gt = states(''sensor.google_pollen_tree'')|float(0)
        %}{% set gg = states(''sensor.google_pollen_grass'')|float(0) %}{% set worst
        = [gw, gt, gg] | max %}{% set pp = 0 if worst<2 else (10 if worst<3 else (22
        if worst<4 else 35)) %}{% set rag = states(''sensor.google_pollen_ragweed'')|float(0)
        %}{% set rag_season = state_attr(''sensor.google_pollen_ragweed'',''in_season'')
        %}{% set pp = pp + (8 if (rag>=4 and rag_season) else 0) %}{% set pp = [pp,
        35] | min %}{% else %}{% set weeds_lvl = states(''sensor.kleenex_pollen_radar_ewing_weeds_level'')
        | lower %}{% set idx = states(''sensor.total_pollen_index'') | float(0) %}{%
        set pp = 0 if idx<75 else (10 if idx<150 else (22 if idx<200 else 35)) %}{%
        set pp = pp + (8 if weeds_lvl in [''high'',''very-high'',''very high''] else
        0) %}{% set pp = [pp, 35] | min %}{% endif %}{% set af = state_attr(''sensor.air_quality_daily_forecast'',''forecast'')
        or [] %}{% set avl = af | selectattr(''date'',''equalto'', tomorrow|string)
        | map(attribute=''aqi'') | list %}{% set aq = avl[0] if avl|length else states(''sensor.air_quality_us_aqi'')|float(0)
        %}{% set aqp = 0 if aq<=50 else (4 if aq<=75 else (10 if aq<=100 else (20
        if aq<=150 else 30))) %}{{ [100, [0, r+t+d+w+diffpts-pp-aqp] | max] | min
        }}{% endif %}{% endif %}'
    target:
      entity_id: input_number.window_score
  - action: input_text.set_value
    data:
      value: '{% set entries = wx[''weather.kttn_daynight''][''forecast''] %}{% set
        today = now().date() %}{% set tomorrow = (now() + timedelta(days=1)).date()
        %}{% set ns = namespace(night=[], storm=false) %}{% for p in entries %}{%
        set pdt = as_datetime(p.datetime).astimezone() %}{% if (pdt.date() == today
        and pdt.hour >= 21) or (pdt.date() == tomorrow and pdt.hour <= 6) %}{% set
        ns.night = ns.night + [p] %}{% set c = p.condition | lower %}{% if ''lightning''
        in c or ''pouring'' in c or ''hail'' in c %}{% set ns.storm = true %}{% endif
        %}{% endif %}{% endfor %}{% if ns.night | length == 0 %}No overnight forecast
        yet — check back closer to bedtime.{% else %}{% set precips = ns.night | map(attribute=''precipitation_probability'')
        | list %}{% set max_precip = precips | max %}{% set storm = ns.storm or max_precip
        >= 70 %}{% if storm %}Storms or heavy rain expected overnight ({{ max_precip
        }}% chance) — keep them closed.{% else %}{% set temps = ns.night | map(attribute=''temperature'')
        | list %}{% set dews = ns.night | map(attribute=''dew_point'') | list %}{%
        set winds = ns.night | map(attribute=''wind_speed'') | list %}{% set low =
        temps | min %}{% set max_dew = dews | max %}{% set max_wind = winds | max
        %}{% set setpoint = state_attr(''climate.bedroom_ac'',''temperature'') | float(72)
        %}{% set diff = setpoint - low %}{% set g_avail = states(''sensor.google_pollen_weed'')
        not in [''unknown'',''unavailable'',''none''] %}{% if g_avail %}{% set gw
        = states(''sensor.google_pollen_weed'')|float(0) %}{% set gt = states(''sensor.google_pollen_tree'')|float(0)
        %}{% set gg = states(''sensor.google_pollen_grass'')|float(0) %}{% set worst
        = [gw, gt, gg] | max %}{% set worst_cat = ''Very High'' if worst>=5 else (''High''
        if worst>=4 else (''Moderate'' if worst>=3 else (''Low'' if worst>=2 else
        ''Very Low''))) %}{% set dom = states(''sensor.google_pollen_dominant_species'')
        %}{% set dom_val = state_attr(''sensor.google_pollen_dominant_species'',''value'')|default(0)|int(0)
        %}{% set pollen_phrase = ''Pollen '' ~ worst_cat ~ '' (top: '' ~ dom ~ ''
        UPI '' ~ dom_val ~ '')'' %}{% else %}{% set weeds_lvl = states(''sensor.kleenex_pollen_radar_ewing_weeds_level'')
        | title %}{% set idx = states(''sensor.total_pollen_index'') | float(0) %}{%
        set pollen_phrase = ''Ragweed '' ~ weeds_lvl ~ '' (pollen idx '' ~ (idx|round(0)|int)
        ~ '')'' %}{% endif %}{% set af = state_attr(''sensor.air_quality_daily_forecast'',''forecast'')
        or [] %}{% set avl = af | selectattr(''date'',''equalto'', tomorrow|string)
        | map(attribute=''aqi'') | list %}{% set aq = avl[0] if avl|length else states(''sensor.air_quality_us_aqi'')|float(0)
        %}{% if diff > 0 %}Low {{ low }}°F ({{ diff|round(0)|int }}° below your AC
        setpoint), dew point {{ max_dew }}, rain {{ max_precip }}%, wind {{ max_wind
        }}mph. {{ pollen_phrase }}, AQI {{ aq|round(0)|int }}.{% else %}Low {{ low
        }}°F (actually {{ (-diff)|round(0)|int }}° above your AC setpoint — little
        cooling benefit), dew point {{ max_dew }}, rain {{ max_precip }}%, wind {{
        max_wind }}mph. {{ pollen_phrase }}, AQI {{ aq|round(0)|int }}.{% endif %}{%
        endif %}{% endif %}'
    target:
      entity_id: input_text.window_score_reason
  - choose:
    - conditions:
      - condition: trigger
        id:
        - evening_notify
      sequence:
      - action: notify.mobile_app_iphone
        data:
          message: '{{ states(''input_text.window_score_reason'') }}'
          title: "{% set s = states('input_number.window_score')|float(0)|round(0)|int
            %}\U0001FA9F Window Score: {{ s }} — {{ 'Great night' if s>=75 else ('Good
            night' if s>=55 else ('Marginal' if s>=35 else 'Skip it')) }}"
  max_exceeded: silent
  mode: single
